<meta name="viewport" content="width=1280"><title>预约管理 · 佑小邦运营后台</title><link rel="stylesheet" href="admin-shell.css"><style>
body{margin:0;background:#F5F5F5;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
.layout{display:flex;min-height:100vh;min-width:0}
.main{margin-left:220px;flex:1;min-width:0;max-width:calc(100vw - 220px);overflow:hidden}
.topbar{height:60px;background:#fff;border-bottom:1px solid #CFF5ED;display:flex;align-items:center;padding:0 28px;gap:16px;box-shadow:0 1px 8px rgba(0,0,0,0.1)}
.crumb{display:flex;gap:7px;color:#9AA7BA;font-size:13px;font-weight:600}
.crumb .current{color:#172033}
.top-actions{margin-left:auto;display:flex;gap:12px;align-items:center}
.top-date{font-size:12px;color:#9AA7BA;font-weight:600}
.page{min-width:0;padding:24px 28px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.page-title{font-size:22px;font-weight:700}
.page-sub{font-size:13px;color:#9AA7BA;margin-top:4px}

/* stat cards — consistent with admin-order-stats.css */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid #CFF5ED;border-radius:12px;padding:16px 18px;box-shadow:0 2px 16px rgba(0,0,0,0.1)}
.stat-label{font-size:11px;color:#9AA7BA;font-weight:600;margin-bottom:6px;letter-spacing:.3px}
.stat-value{font-size:28px;font-weight:700;color:#172033;font-family:-apple-system,"SF Mono",Consolas,monospace}
.stat-sub{font-size:11px;color:#9AA7BA;margin-top:4px;font-weight:600}
.stat.total .stat-value{color:#1CD8B7}
.stat.pending .stat-value{color:#DC2626}
.stat.processing .stat-value{color:#D97706}
.stat.done .stat-value{color:#16A34A}

/* tabs for status filter — same as orders */
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{height:34px;padding:0 14px;border:1px solid #CFF5ED;border-radius:12px;background:#fff;color:#657087;font:700 12px inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tab .num{background:rgba(0,0,0,0.1);color:#1CD8B7;padding:1px 7px;border-radius:12px;font-size:11px;font-weight:600}
.tab.active{background:#1CD8B7;border-color:#1CD8B7;color:#fff}
.tab.active .num{background:rgba(255,255,255,.25);color:#fff}

/* filter bar — same as orders */
.filter{background:#fff;border:1px solid #CFF5ED;border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:12px;margin-bottom:16px;box-shadow:0 2px 16px rgba(0,0,0,0.1)}
.filter label{font-size:12px;color:#9AA7BA;font-weight:600}
.select,.search{height:36px;border:1px solid #CFF5ED;border-radius:12px;padding:0 11px;color:#657087;background:#fff;font:600 12px inherit}
.search{width:220px}
.filter .result{margin-left:auto;color:#9AA7BA;font-size:12px;font-weight:600}
.filter .result strong{color:#1CD8B7;font-size:16px}

/* table — same as orders */
.table-wrap{width:100%;max-width:100%;background:#fff;border:1px solid #CFF5ED;border-radius:12px;box-shadow:0 2px 16px rgba(0,0,0,0.1);overflow-x:auto;overflow-y:hidden}
.table{width:100%;border-collapse:collapse}
.table th{height:44px;background:#F3FDFA;color:#9AA7BA;font-size:11px;text-align:left;padding:0 18px;font-weight:600;letter-spacing:.3px}
.table td{height:72px;padding:14px 18px;border-top:1px solid #E4FAF4;font-size:12px;color:#657087;font-weight:600;vertical-align:top}
.table tr:first-child td{border-top:none}

.name-cell .main{font-weight:600;color:#172033;font-size:13px;white-space:nowrap}
.name-cell .sub{font-size:11px;color:#9AA7BA;margin-top:3px}
.phone-cell{font-weight:600;color:#172033;font-family:-apple-system,"SF Mono",Consolas,monospace;font-size:13px}
.source-tag{display:inline-flex;padding:4px 10px;border-radius:12px;font-size:11px;font-weight:600}
.source-tag.banner{background:#DDF7F1;color:#1CD8B7}
.source-tag.catalog{background:#FEF3C7;color:#D97706}
.source-tag.other{background:#E4FAF4;color:#657087}
.time-cell{color:#172033;font-weight:600;font-size:13px}
.time-cell .sub{display:block;color:#9AA7BA;font-size:11px;font-weight:600;margin-top:3px}
.tag{display:inline-flex;padding:5px 10px;border-radius:12px;font-size:11px;font-weight:600;align-items:center;gap:4px;cursor:pointer;user-select:none}
.tag .dot{width:6px;height:6px;border-radius:12px;flex-shrink:0}
.tag.pending{background:#FEE2E2;color:#DC2626}
.tag.pending .dot{background:#DC2626}
.tag.processing{background:#FEF3C7;color:#D97706}
.tag.processing .dot{background:#F59E0B}
.tag.done{background:#DCFCE7;color:#16A34A}
.tag.done .dot{background:#16A34A}
.note-cell{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.5}
.note-cell.empty{color:#9AA7BA;font-style:italic}
.op{display:flex;gap:10px}
.op button{border:0;background:none;color:#1CD8B7;font:700 12px inherit;cursor:pointer;padding:0;white-space:nowrap}
.op .danger{color:#DC2626}

/* empty */
.empty{padding:60px 20px;text-align:center;color:#9AA7BA}
.empty .e-icon{font-size:48px;margin-bottom:10px;opacity:.5}
.empty .e-title{font-size:14px;font-weight:600;color:#657087;margin-bottom:4px}
.empty .e-sub{font-size:12px}

/* pagination */
.pg{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-top:1px solid #E4FAF4}
.pg-info{font-size:12px;color:#9AA7BA;font-weight:600}
.pg-ctrl{display:flex;gap:4px}
.pg-ctrl button{min-width:32px;height:32px;border:1px solid #CFF5ED;background:#fff;border-radius:12px;font-size:12px;font-weight:600;color:#657087;cursor:pointer;padding:0 8px}
.pg-ctrl button:hover:not(:disabled){background:#DDF7F1}
.pg-ctrl button.active{background:#1CD8B7;color:#fff;border-color:#1CD8B7}
.pg-ctrl button:disabled{opacity:.4;cursor:not-allowed}

/* sms notify card */
.sms-card{margin:0 0 20px;display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:12px;background:linear-gradient(135deg,#F5F5F5 0%,#C9F4EA 100%);border:1px solid #BFDBFE;cursor:pointer;transition:transform .15s}
.sms-card:hover{transform:translateY(-2px)}
.sms-icon{width:46px;height:46px;border-radius:12px;background:#1CD8B7;display:grid;place-items:center;flex-shrink:0;color:#fff}
.sms-icon svg{width:22px;height:22px}
.sms-info{flex:1}
.sms-info .sms-title{font-size:15px;font-weight:700;color:#172033}
.sms-info .sms-desc{font-size:12px;color:#657087;margin-top:4px;line-height:1.5}
.sms-ctl{display:flex;align-items:center;gap:10px;flex-shrink:0}
.sms-count{font-size:12px;color:#1CD8B7;font-weight:600;background:#fff;border-radius:12px;padding:4px 12px;border:1px solid #BFDBFE}
.sms-switch{position:relative;width:46px;height:26px;cursor:pointer}
.sms-switch input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;z-index:1}
.sms-switch .track{position:absolute;inset:0;background:#CBD5E1;border-radius:12px;transition:background .2s}
.sms-switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:12px;transition:transform .2s;box-shadow:0 2px 5px rgba(0,0,0,.15)}
.sms-switch input:checked ~ .track{background:#1CD8B7}
.sms-switch input:checked ~ .knob{transform:translateX(20px)}

/* sms receiver list in modal */
.sms-receiver{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #D9F6EE;border-radius:12px;background:#FAFCFF;margin-bottom:8px}
.sms-receiver .name{font-weight:600;font-size:13px;color:#172033;min-width:60px}
.sms-receiver .phone{font-size:12px;color:#657087;font-family:monospace;flex:1}
.sms-receiver .del{border:0;background:none;color:#DC2626;font-size:18px;cursor:pointer;width:28px;height:28px;border-radius:12px;flex:none;line-height:1}
.sms-receiver .del:hover{background:#FEE2E2}
.sms-add{display:flex;gap:8px;margin-top:10px}
.sms-add input{flex:1;height:38px;border:1px solid #CFF5ED;border-radius:12px;padding:0 12px;font-size:13px;color:#172033;outline:none;font-family:inherit}
.sms-add input:focus{border-color:#1CD8B7;box-shadow:0 0 0 3px rgba(0,0,0,0.1)}
.sms-add .btn{white-space:nowrap}

/* custom confirm / toast */
.cfm-mask{position:fixed;inset:0;background:rgba(20,33,65,.4);display:none;align-items:center;justify-content:center;z-index:300}
.cfm-mask.show{display:flex}
.cfm{background:#fff;border-radius:12px;width:340px;padding:24px;box-shadow:0 20px 50px rgba(20,33,65,.18);text-align:center}
.cfm-msg{font-size:14px;color:#172033;font-weight:600;line-height:1.6;margin-bottom:20px}
.cfm-btns{display:flex;gap:10px;justify-content:center}
.cfm-btns .btn{min-width:90px}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(26,24,40,.92);color:#fff;font-size:13px;font-weight:600;padding:10px 22px;border-radius:12px;z-index:400;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}

/* modal — clean design */
.modal-mask{position:fixed;inset:0;background:rgba(20,33,65,.45);display:none;align-items:center;justify-content:center;z-index:200}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:12px;width:460px;box-shadow:0 24px 60px rgba(20,33,65,.2);animation:modalIn .2s ease;overflow:hidden}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0}
.modal-title{font-size:17px;font-weight:700;color:#172033}
.modal-close{border:none;background:none;font-size:22px;color:#9AA7BA;cursor:pointer;width:32px;height:32px;border-radius:12px;line-height:1}
.modal-close:hover{background:#F0F4FA}
.modal-body{padding:18px 24px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid #E4FAF4;background:#FAFCFF}
.btn{height:38px;padding:0 18px;border-radius:12px;border:1px solid #CFF5ED;background:#fff;font-size:13px;font-weight:600;color:#657087;cursor:pointer;font-family:inherit}
.btn:hover{background:#F0F4FA}
.btn-primary{background:#1CD8B7;color:#fff;border-color:#1CD8B7}
.btn-primary:hover{background:#1A3DB0}

/* inline info row */
	.info-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;padding:14px;background:#F3FDFA;border-radius:12px;border:1px solid #E4FAF4}
	.info-row .info-item .k{font-size:11px;color:#9AA7BA;font-weight:600;margin-bottom:3px}
	.info-row .info-item .v{font-size:13px;color:#172033;font-weight:600}

.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;color:#657087;font-weight:600;margin-bottom:6px}
.form-row select,.form-row textarea{width:100%;border:1px solid #CFF5ED;border-radius:12px;padding:10px 12px;font-size:13px;color:#172033;outline:none;background:#fff;font-family:inherit;box-sizing:border-box}
.form-row select:focus,.form-row textarea:focus{border-color:#1CD8B7;box-shadow:0 0 0 3px rgba(0,0,0,0.1)}
.form-row textarea{resize:vertical;min-height:90px;line-height:1.6}
</style><script defer src="admin-sidebar.js"></script><link rel="stylesheet" href="modal-scroll.css">  <link rel="stylesheet" href="visual-theme.css" />

<body data-surface="admin" data-page="admin-bookings"><div class="layout">
  <aside class="sidebar"><div class="brand"><div class="brand-title">佑小邦</div><div class="brand-sub">运营管理后台</div></div></aside>
  <main class="main">
    <header class="topbar">
      <div class="crumb"><span>业务管理</span><span>›</span><span class="current">预约管理</span></div>
      <div class="top-actions">
        <span class="top-date" id="topDate"></span>
        <div class="top-av">管</div>
      </div>
    </header>
    <section class="page">
      <div class="page-head">
        <div>
          <h1 class="page-title">预约管理</h1>
          <p class="page-sub">跟进用户通过一键预约提交的咨询需求，及时处理</p>
        </div>
        <div class="op">
          <button class="btn" onclick="seedDemoData()">生成演示数据</button>
          <button class="btn btn-primary" onclick="exportCSV()">导出 CSV</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat total"><div class="stat-label">预约总数</div><div class="stat-value" id="statTotal">0</div><div class="stat-sub">累计收到的全部预约</div></div>
        <div class="stat pending"><div class="stat-label">未跟进</div><div class="stat-value" id="statPending">0</div><div class="stat-sub">需尽快联系</div></div>
        <div class="stat processing"><div class="stat-label">处理中</div><div class="stat-value" id="statProcessing">0</div><div class="stat-sub">正在跟进处理</div></div>
        <div class="stat done"><div class="stat-label">已完成</div><div class="stat-value" id="statDone">0</div><div class="stat-sub">服务已交付</div></div>
      </div>

      <div class="sms-card" onclick="openSmsManager()">
        <div class="sms-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg></div>
        <div class="sms-info">
          <div class="sms-title">短信通知</div>
          <div class="sms-desc">有人提交预约时，自动向以下号码发送通知短信</div>
        </div>
        <div class="sms-ctl" onclick="event.stopPropagation()">
          <span class="sms-count" id="smsCount">0 人</span>
          <div class="sms-switch"><input type="checkbox" id="smsEnabled" onchange="toggleSms()"><span class="track"></span><span class="knob"></span></div>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-status="all" onclick="filterStatus(this)">全部 <span class="num" id="chipAll">0</span></button>
        <button class="tab" data-status="pending" onclick="filterStatus(this)">未跟进 <span class="num" id="chipPending">0</span></button>
        <button class="tab" data-status="processing" onclick="filterStatus(this)">处理中 <span class="num" id="chipProcessing">0</span></button>
        <button class="tab" data-status="done" onclick="filterStatus(this)">已完成 <span class="num" id="chipDone">0</span></button>
      </div>

      <div class="filter">
        <label>来源</label>
        <select class="select" id="sourceFilter" onchange="render()">
          <option value="all">全部</option>
          <option value="banner">一键预约</option>
          <option value="catalog">服务卡片</option>
          <option value="other">其他</option>
        </select>
        <input class="search" id="searchInput" placeholder="搜索姓名或手机号" oninput="onSearch(this.value)">
        <span class="result">共 <strong id="count">0</strong> 条</span>
      </div>

      <div class="table-wrap">
        <table class="table">
          <thead><tr>
            <th>预约人</th>
            <th>手机号码</th>
            <th>来源</th>
            <th>预约时间</th>
            <th>跟进情况</th>
            <th>备注</th>
            <th>操作</th>
          </tr></thead>

        </table>

          <div class="pg-ctrl" id="pgCtrl"></div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="modal-mask" id="editModal" onclick="if(event.target===this)closeModal()">
  <div class="modal">

<div class="modal-mask" id="smsModal" onclick="if(event.target===this)closeSmsManager()">

<script>
var STORAGE_KEY='akb_bookings';
var PAGE_SIZE=10;
var currentFilter={status:'all',source:'all',search:''};
var editingId='';
var currentPage=1;

/* ── 自定义确认弹窗 / Toast ── */
var _cfmCb=null;
function showConfirm(msg,cb){ return window.AKBUI.confirm(msg).then(function(ok){if(ok&&typeof cb==='function')cb();return ok;}); }
function cfmConfirm(){document.getElementById('cfmMask').classList.remove('show');if(_cfmCb)_cfmCb();_cfmCb=null;}
function cfmCancel(){document.getElementById('cfmMask').classList.remove('show');_cfmCb=null;}
function showToast(msg){ return window.AKBUI.toast(msg,2200); }

function load(){try{var v=JSON.parse(localStorage.getItem(STORAGE_KEY));if(Array.isArray(v))return v;}catch(e){}return [];}
function save(list){localStorage.setItem(STORAGE_KEY,JSON.stringify(list));}

function fmtTime(ts){var d=new Date(ts),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function srcLabel(s){return s==='banner'?'一键预约':s==='catalog'?'服务卡片':'其他';}
function stLabel(s){return s==='pending'?'未跟进':s==='processing'?'处理中':'已完成';}

function buildDemoData(){
  var names=['王女士','李先生','张阿姨','刘大爷','陈小姐','赵叔叔','孙奶奶','周女士','吴先生','郑阿姨','黄先生','杨女士'];
  var phones=['138****2468','139****8572','186****3016','133****6420','177****9183','158****5509','136****7234','159****8890','182****4456','155****3322'];
  var sources=['banner','catalog','banner','banner','catalog','banner','other','banner','catalog','banner','banner','banner'];
  var statuses=['pending','pending','processing','processing','processing','done','done','pending','processing','done','pending','processing'];
  var notes=['','','已联系，明天上午上门评估','家属要求安排有ICU经验的护理员','患者术后恢复期，需要24小时陪护','已完成服务，家属反馈满意','','多次未接通，需继续跟进','已报价，家属正在考虑中','已转单给护理员李桂芳','紧急需求，今天下午就要到岗','确认住院陪护，3天'];
  var now=Date.now(),demo=[];
  for(var i=0;i<12;i++){var daysAgo=Math.floor(Math.random()*14);demo.push({id:'BK'+String(now-i).slice(-8),name:names[i],phone:phones[i%phones.length],source:sources[i],status:statuses[i],note:notes[i],createdAt:now-daysAgo*86400000-Math.floor(Math.random()*3600000),updatedAt:now-Math.floor(Math.random()*86400000)});}
  return demo;
}
function seedDemoData(){
  var existing=load();
  if(existing.length>0){showConfirm('生成示例数据将覆盖当前预约记录，覆盖后无法恢复。是否继续？',function(){save(buildDemoData());render();});return;}
  save(buildDemoData());render();
}

function getFiltered(){
  var list=load(),f=currentFilter;
  return list.filter(function(b){
    if(f.status!=='all'&&b.status!==f.status)return false;
    if(f.source!=='all'&&b.source!==f.source)return false;
    if(f.search){var q=f.search.toLowerCase();if((b.name||'').toLowerCase().indexOf(q)===-1&&(b.phone||'').toLowerCase().indexOf(q)===-1)return false;}
    return true;
  }).sort(function(a,b){return b.createdAt-a.createdAt;});
}

function updateStats(){
  var list=load();
  var p=list.filter(function(b){return b.status==='pending';}).length;
  var pr=list.filter(function(b){return b.status==='processing';}).length;
  var d=list.filter(function(b){return b.status==='done';}).length;
  document.getElementById('statTotal').textContent=list.length;
  document.getElementById('statPending').textContent=p;
  document.getElementById('statProcessing').textContent=pr;
  document.getElementById('statDone').textContent=d;
  document.getElementById('chipAll').textContent=list.length;
  document.getElementById('chipPending').textContent=p;
  document.getElementById('chipProcessing').textContent=pr;
  document.getElementById('chipDone').textContent=d;
}

function render(){
  updateStats();
  var all=getFiltered();
  document.getElementById('count').textContent=all.length;
  var tbody=document.getElementById('bookingTable'),empty=document.getElementById('emptyState');
  if(all.length===0){tbody.innerHTML='';empty.style.display='';document.getElementById('pgInfo').textContent='共 0 条';document.getElementById('pgCtrl').innerHTML='';return;}
  empty.style.display='none';
  var totalPages=Math.max(1,Math.ceil(all.length/PAGE_SIZE));
  if(currentPage>totalPages)currentPage=totalPages;
  var start=(currentPage-1)*PAGE_SIZE,pageData=all.slice(start,start+PAGE_SIZE);
  tbody.innerHTML=pageData.map(function(b){
    var srcCls=b.source==='banner'?'banner':b.source==='catalog'?'catalog':'other';
    var hiddenPhone=b.phone&&b.phone.length>=7?b.phone.slice(0,3)+'****'+b.phone.slice(-4):b.phone;
    var date=new Date(b.createdAt),p=function(n){return String(n).padStart(2,'0');};
    var dateStr=p(date.getMonth()+1)+'/'+p(date.getDate());
    return '<tr>'+
      '<td class="name-cell"><div class="main">'+(b.name||'未填写')+'</div><div class="sub">'+b.id+'</div></td>'+
      '<td class="phone-cell">'+hiddenPhone+'</td>'+
      '<td><span class="source-tag '+srcCls+'">'+srcLabel(b.source)+'</span></td>'+
      '<td class="time-cell">'+dateStr+'<span class="sub">'+p(date.getHours())+':'+p(date.getMinutes())+' 提交</span></td>'+
      '<td><span class="tag '+b.status+'" onclick="openEdit(\''+b.id+'\')"><span class="dot"></span>'+stLabel(b.status)+'</span></td>'+
      '<td class="note-cell '+(b.note?'':'empty')+'">'+(b.note||'暂无备注')+'</td>'+
      '<td><div class="op">'+
        '<button onclick="openEdit(\''+b.id+'\')">跟进</button>'+
        '<button class="danger" onclick="deleteBooking(\''+b.id+'\')">删除</button>'+
      '</div></td></tr>';
  }).join('');
  document.getElementById('pgInfo').textContent='共 '+all.length+' 条 · 第 '+currentPage+'/'+totalPages+' 页';
  var ctrl='<button '+(currentPage===1?'disabled':'')+' onclick="gotoPage('+(currentPage-1)+')">‹</button>';
  for(var p2=1;p2<=totalPages;p2++){if(p2===1||p2===totalPages||Math.abs(p2-currentPage)<=1)ctrl+='<button class="'+(p2===currentPage?'active':'')+'" onclick="gotoPage('+p2+')">'+p2+'</button>';else if(p2===currentPage-2||p2===currentPage+2)ctrl+='<button disabled>…</button>';}
  ctrl+='<button '+(currentPage===totalPages?'disabled':'')+' onclick="gotoPage('+(currentPage+1)+')">›</button>';
  document.getElementById('pgCtrl').innerHTML=ctrl;
}
function gotoPage(n){currentPage=n;render();}
function filterStatus(el){
  document.querySelectorAll('#tabs .tab').forEach(function(c){c.classList.remove('active');});
  el.classList.add('active');
  currentFilter.status=el.dataset.status;currentPage=1;render();
}
function onSearch(v){currentFilter.search=v.trim();currentPage=1;render();}

function openEdit(id){
  var b=load().find(function(x){return x.id===id;});if(!b)return;
  editingId=id;
  document.getElementById('editName').textContent=b.name||'—';
  document.getElementById('editPhone').textContent=b.phone||'—';
  document.getElementById('editTime').textContent=fmtTime(b.createdAt);
  document.getElementById('editStatus').value=b.status;
  document.getElementById('editNote').value=b.note||'';
  document.getElementById('editModal').classList.add('show');
}
function closeModal(){document.getElementById('editModal').classList.remove('show');editingId='';}
function saveBooking(){
  if(!editingId)return;
  var list=load(),b=list.find(function(x){return x.id===editingId;});if(!b)return;
  b.status=document.getElementById('editStatus').value;
  b.note=document.getElementById('editNote').value.trim();
  b.updatedAt=Date.now();
  save(list);closeModal();render();
}
function deleteBooking(id){
  showConfirm('确定删除此预约？',function(){
    save(load().filter(function(x){return x.id!==id;}));render();
  });
}
function exportCSV(){
  var list=load();if(!list.length){showToast('暂无数据');return;}
  var rows=[['预约ID','姓名','手机号','来源','跟进状态','备注','创建时间','更新时间']];
  list.forEach(function(b){rows.push([b.id,b.name||'',b.phone||'',srcLabel(b.source),stLabel(b.status),(b.note||'').replace(/[\r\n,]/g,' '),fmtTime(b.createdAt),fmtTime(b.updatedAt||b.createdAt)]);});
  var csv='\uFEFF'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='预约管理_'+fmtTime(Date.now()).replace(/[:\s-]/g,'').slice(0,14)+'.csv';a.click();
}

/* ── 短信通知管理 ── */
var SMS_KEY='akb_sms_notify';
function loadSms(){try{var v=JSON.parse(localStorage.getItem(SMS_KEY));if(v&&typeof v==='object')return v;}catch(e){}return {enabled:true,receivers:[]};}
function saveSms(v){localStorage.setItem(SMS_KEY,JSON.stringify(v));}
function renderSms(){
  var s=loadSms();
  document.getElementById('smsEnabled').checked=!!s.enabled;
  document.getElementById('smsCount').textContent=s.receivers.length+' 人';
  var list=document.getElementById('smsReceiverList');
  if(!s.receivers.length){list.innerHTML='<div style="padding:20px;text-align:center;color:#9AA7BA;font-size:13px">暂无收信人，请在下方添加</div>';return;}
  list.innerHTML=s.receivers.map(function(r,i){
    return '<div class="sms-receiver"><span class="name">'+r.name+'</span><span class="phone">'+r.phone+'</span><button class="del" onclick="delSmsReceiver('+i+')" title="删除">×</button></div>';
  }).join('');
}
function toggleSms(){
  var s=loadSms();s.enabled=!s.enabled;saveSms(s);renderSms();
}
function addSmsReceiver(){
  var nameEl=document.getElementById('smsNewName'),phoneEl=document.getElementById('smsNewPhone');
  var name=nameEl.value.trim(),phone=phoneEl.value.trim();
  if(!name){nameEl.focus();return;}
  if(!phone||!/^1\d{10}$/.test(phone)){phoneEl.focus();phoneEl.style.borderColor='#DC2626';setTimeout(function(){phoneEl.style.borderColor='';},1500);return;}
  var s=loadSms();
  if(s.receivers.some(function(r){return r.phone===phone;})){showToast('该手机号已存在');phoneEl.focus();return;}
  s.receivers.push({name:name,phone:phone});
  saveSms(s);
  nameEl.value='';phoneEl.value='';nameEl.focus();
  renderSms();
}
function delSmsReceiver(i){
  var s=loadSms();
  showConfirm('确定删除「'+s.receivers[i].name+'」吗？',function(){
    s.receivers.splice(i,1);saveSms(s);renderSms();
  });
}
function openSmsManager(){
  renderSms();
  document.getElementById('smsModal').classList.add('show');
  setTimeout(function(){document.getElementById('smsNewName').focus();},150);
}
function closeSmsManager(){document.getElementById('smsModal').classList.remove('show');}

/* 供其他页面调用：有新预约时触发短信 */
window.sendSmsNotify=function(booking){
  var s=loadSms();
  if(!s.enabled||!s.receivers.length)return;
  var msg='【佑小邦】新预约提醒：'+booking.name+' '+booking.phone+' 于'+fmtTime(booking.createdAt||Date.now())+'提交了预约（来源：'+srcLabel(booking.source)+'）。';
  s.receivers.forEach(function(r){
    console.log('[短信通知] → '+r.name+'('+r.phone+'): '+msg);
    /* 实际项目中此处调用短信网关API */
  });
  return s.receivers.length;
};

(function(){var d=new Date(),w=['日','一','二','三','四','五','六'];document.getElementById('topDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+w[d.getDay()];})();
if(load().length===0)save(buildDemoData());
renderSms();
render();
</script></body></html>

<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/>
<script src="common-ui.js"></script><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/><title>新增服务地址 · 佑小邦</title>
<style>
.phone{position:relative}
:root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--red:#EF4444;--sh:0 2px 16px rgba(0,0,0,0.1)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text)}.frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg)}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:42px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}.status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;background:linear-gradient(135deg,#1CD8B7,#0FA98C)}.status-bar span{font-size:12px;font-weight:700;color:#fff}.nav{height:58px;display:flex;align-items:center;justify-content:center;background:#fff;border-bottom:1px solid var(--border);position:relative}.nav h1{font-size:18px;font-weight:900}.back{position:absolute;left:16px;width:34px;height:34px;border:0;background:var(--purple-light);border-radius:11px;color:var(--purple);display:grid;place-items:center;cursor:pointer}.back svg{width:18px;height:18px}.scroll{flex:1;overflow:auto;padding:16px 14px 100px}.form-card{background:#fff;border-radius:20px;padding:16px;box-shadow:var(--sh)}.field{margin-bottom:16px}.field:last-child{margin-bottom:0}.field label{display:block;font-size:12px;color:var(--text2);font-weight:800;margin-bottom:8px}.input,.textarea{width:100%;border:1px solid var(--border);background:#FAF9FC;border-radius:12px;padding:12px 13px;color:var(--text);font:500 14px inherit;outline:none}.input:focus,.textarea:focus{border-color:#7FE9D4;box-shadow:0 0 0 3px rgba(0,0,0,0.1)}.textarea{min-height:84px;resize:none}.labels{display:flex;gap:8px}.label-pill{padding:8px 15px;border-radius:10px;background:#F5F2FA;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer}.label-pill.sel{background:var(--purple-light);color:var(--purple);box-shadow:inset 0 0 0 1px #9FEDE0}.switch-row{display:flex;align-items:center;justify-content:space-between;padding-top:2px}.switch-row span{font-size:13px;color:var(--text2);font-weight:700}.switch{width:44px;height:26px;border:0;border-radius:20px;background:#E8E5EF;padding:3px;cursor:pointer}.switch i{display:block;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.16);transition:transform .18s}.switch.on{background:var(--purple)}.switch.on i{transform:translateX(18px)}.actions{position:absolute;bottom:20px;left:14px;right:14px;display:flex;gap:10px}.actions button{height:46px;border-radius:15px;font:800 14px inherit;cursor:pointer}.save{flex:1;border:0;color:#fff;background:linear-gradient(135deg,#3FE0C3,#0FA98C);box-shadow:0 8px 20px rgba(0,0,0,0.1)}.delete{width:100px;border:1px solid #F4CACA;color:var(--red);background:#fff}.hidden{display:none}
</style></head><body><div class="frame"><div class="phone"><div class="status-bar"><span>9:41</span><span>▮▮▮　▰</span></div><header class="nav"><button class="back" onclick="back()" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1 id="title">新增服务地址</h1></header><main class="scroll"><section class="form-card"><div class="field"><label>服务地址类型</label><div class="labels"><button class="label-pill sel" id="homeType" type="button" onclick="setAddressType('home')">家</button><button class="label-pill" id="hospitalType" type="button" onclick="setAddressType('hospital')">医院</button></div></div><div id="addrContactFields"></div><div class="field"><label for="region">省市区</label><input id="region" class="input" placeholder="请选择省市区"/></div><div class="field"><label for="detail">详细地址</label><textarea id="detail" class="textarea" placeholder="如道路、门牌号、楼栋号、单元室等"></textarea></div><div class="switch-row"><span>设为默认地址</span><button class="switch" id="defaultSwitch" onclick="toggleDefault()"><i></i></button></div></section></main><div class="actions"><button class="delete hidden" id="deleteBtn" onclick="removeCurrent()">删除</button><button class="save" onclick="saveAddress()">保存地址</button></div></div></div>
<script>
const KEY='ankebang_saved_addresses',defaults=[{id:1,detail:'北京市朝阳区望京街道 88 号 2 单元 1602',region:'北京市 朝阳区',contact:'张女士',phone:'138****2468',isDefault:true,addressType:'home'},{id:2,detail:'北京市朝阳区建国路 66 号 北京协和医院东院区',region:'北京市 东城区',contact:'张女士',phone:'138****2468',isDefault:false,addressType:'hospital'}],params=new URLSearchParams(location.search),returnTo=params.get('return')||'addresses',service=params.get('service')||'',visitService=params.get('visitService')||'',editId=params.get('id');let isDefault=false,addressType=params.get('type')==='hospital'?'hospital':'home';
function data(){try{const v=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(v))return defaults.slice();const list=v.map(a=>({...a,addressType:a.addressType||'home'}));if(!list.some(a=>a.addressType==='hospital'))list.push(defaults[1]);return list}catch(e){return defaults.slice()}}function saveData(v){localStorage.setItem(KEY,JSON.stringify(v))}function back(){if(returnTo==='mall'){location.href='mall.html';return}location.href=returnTo==='care'?'hospital-care.html?service='+encodeURIComponent(service)+(visitService?'&visitService='+encodeURIComponent(visitService):''):'addresses.html'}function toggleDefault(){isDefault=!isDefault;document.getElementById('defaultSwitch').classList.toggle('on',isDefault)}function goBack(){back()}function setAddressType(type){addressType=type;document.getElementById('homeType').classList.toggle('sel',type==='home');document.getElementById('hospitalType').classList.toggle('sel',type==='hospital')}
function init(){setAddressType(addressType);if(editId){const a=data().find(x=>String(x.id)===String(editId));if(a){const raw=a.contact||'';document.getElementById('title').textContent='编辑服务地址';document.getElementById('deleteBtn').classList.remove('hidden');document.getElementById('contact').value=(a.phone?raw:(raw.split('·')[0]||raw)).trim();document.getElementById('phone').value=(a.phone||raw.split('·')[1]||'').trim();document.getElementById('region').value=a.region||'';document.getElementById('detail').value=a.detail||'';isDefault=!!a.isDefault;addressType=a.addressType||'home';setAddressType(addressType);document.getElementById('defaultSwitch').classList.toggle('on',isDefault)}}}
function saveAddress(){const contact=document.getElementById('contact').value.trim(),phone=document.getElementById('phone').value.trim(),region=document.getElementById('region').value.trim(),detail=document.getElementById('detail').value.trim();if(!contact||!phone||!detail){alert('请完整填写联系人、电话和详细地址');return}let list=data();if(editId){const a=list.find(x=>String(x.id)===String(editId));if(a)Object.assign(a,{contact,phone,region,detail,isDefault,addressType})}else list.push({id:Date.now(),contact,phone,region,detail,isDefault:isDefault||!list.some(x=>x.isDefault),addressType});if(isDefault)list.forEach(x=>{if(String(x.id)!==String(editId))x.isDefault=false});saveData(list);back()}
async function removeCurrent(){if(!editId||!await showConfirm('确认删除该地址？'))return;let list=data().filter(x=>String(x.id)!==String(editId));if(list.length&&!list.some(x=>x.isDefault))list[0].isDefault=true;saveData(list);back()}if(window.AKBContact)AKBContact.render(document.getElementById('addrContactFields'),{nameId:'contact',phoneId:'phone',nameLabel:'联系人',namePlaceholder:'请输入联系人姓名',phoneLabel:'联系电话',phonePlaceholder:'请输入手机号'});init();
</script></body></html>

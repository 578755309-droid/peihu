<!doctype html>
<html lang="zh-CN">
<head>
  <script src="vendor/vue.global.prod.js"></script>
  <script src="ui/icons.js"></script>
  <script src="ui/vue-ui.js"></script>
  <script src="common-ui.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>资讯详情 · 佑小邦</title>
  <script src="consult-data.js"></script>
  <style>
    :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--sh:0 2px 16px rgba(0,0,0,0.1)}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}button{font:inherit}.frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg);position:relative}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;background:#fff}.status-bar span{font-size:13px;font-weight:600}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:12px}
    .nav{height:58px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}.nav h1{font-size:18px;font-weight:700}.back{position:absolute;left:16px;width:34px;height:34px;border:0;background:var(--purple-light);border-radius:12px;color:var(--purple);display:grid;place-items:center;cursor:pointer}.back svg{width:18px;height:18px}
    .scroll{flex:1;overflow:auto;padding:14px 14px 30px}.scroll::-webkit-scrollbar{display:none}
    .cover{width:100%;aspect-ratio:3/2;border-radius:12px;object-fit:cover;display:block;background:var(--purple-light);box-shadow:var(--sh)}
    .cover-ph{display:grid;place-items:center;color:var(--purple);font-size:13px;font-weight:600}
    .paper{background:#fff;border-radius:12px;box-shadow:var(--sh);margin-top:12px;padding:18px 16px}
    .p-name{display:inline-block;padding:3px 9px;border-radius:12px;background:var(--purple-light);color:var(--purple);font-size:11px;font-weight:600}
    .p-title{font-size:19px;font-weight:700;line-height:1.45;margin-top:10px}
    .p-sub{font-size:14px;color:var(--text2);margin-top:7px;line-height:1.5}
    .p-meta{margin-top:10px;padding-bottom:12px;border-bottom:1px dashed var(--border);font-size:12px;color:var(--text3);font-weight:600;display:flex;justify-content:space-between}
    .p-body{margin-top:12px;font-size:14px;line-height:1.85;color:var(--text2)}
    .p-body h2{font-size:17px;color:var(--text);margin:14px 0 7px}.p-body h3{font-size:15px;color:var(--text);margin:12px 0 6px}
    .p-body p{margin:7px 0}.p-body ul,.p-body ol{padding-left:20px;margin:7px 0}
    .p-body img{max-width:100%;border-radius:12px;margin:8px 0;display:block}
    .p-body blockquote{border-left:3px solid var(--purple);margin:9px 0;padding:6px 12px;background:var(--purple-bg);border-radius:12px;color:var(--text2)}
    .p-link{margin-top:12px;padding:14px;border:1.5px dashed #C9BCE3;border-radius:12px;background:var(--purple-bg);font-size:13px;color:var(--text2);line-height:1.7;word-break:break-all}.p-link b{color:var(--purple)}
    .open-btn{width:100%;margin-top:14px;height:44px;border:0;border-radius:12px;background:var(--purple);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
    .empty{padding:80px 20px;text-align:center;color:var(--text3);font-size:14px;line-height:1.8}
  </style>
  <link rel="stylesheet" href="visual-theme.css" />
  <link rel="stylesheet" href="ui/vue-ui.css" />
</head>
<body data-surface="mobile" data-page="consult-detail">
<div class="frame"><div class="phone">
  <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#1A1828"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#1A1828"/><rect x="9" y=".5" width="3" height="11.5" rx="1" fill="#1A1828"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#1A1828" opacity=".35"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="#1A1828" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="#1A1828"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#1A1828"/></svg></div></div>
  <header class="nav"><button class="back" onclick="history.length>1?history.back():location.href='consult-list.html'" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>资讯详情</h1></header>
  <main class="scroll" id="body"></main>
</div></div>
<script>
(function () {
  var body = document.getElementById('body');
  var id = new URLSearchParams(location.search).get('id') || '';
  var item = window.AKBConsult.getById(id);
  if (!item || !item.enabled) { body.innerHTML = '<div class="empty">资讯不存在或已下线</div>'; return; }
  var esc = window.AKBConsult.esc;
  var cover = item.cover
    ? '<img class="cover" src="' + item.cover + '" alt="">'
    : '<div class="cover cover-ph">封面 240×160</div>';
  var content = item.mode === 'link'
    ? '<div class="p-link">该资讯为公众号文章，点击下方按钮在微信中查看：<br><b>' + esc(item.link) + '</b></div><button class="open-btn" onclick="window.open(\'' + esc(item.link) + '\',\'_blank\')">打开公众号文章</button>'
    : '<div class="p-body">' + (item.content || '<span style="color:var(--text3)">（暂无正文）</span>') + '</div>';
  body.innerHTML = cover
    + '<section class="paper"><span class="p-name">' + esc(item.name) + '</span>'
    + '<div class="p-title">' + esc(item.title) + '</div>'
    + (item.sub ? '<div class="p-sub">' + esc(item.sub) + '</div>' : '')
    + '<div class="p-meta"><span>佑小邦平台</span><span>' + window.AKBConsult.relTime(item.updatedAt) + '</span></div>'
    + content + '</section>';
})();
</script>
</body>
</html>

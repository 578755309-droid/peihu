<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="vendor/vue.global.prod.js"></script>
  <script src="ui/icons.js"></script>
  <script src="ui/vue-ui.js"></script>
  <script src="common-ui.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>按次预约 · 佑小邦</title>
<style>
  :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#22A06B;--sh:0 2px 16px rgba(0,0,0,0.1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}
  button{font:inherit}
  .frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}
  .phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg);position:relative}
  @media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
  .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;background:#fff;font-size:13px;font-weight:600}
  .nav{height:58px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}
  .nav h1{font-size:18px;font-weight:700}
  .back{position:absolute;left:16px;width:34px;height:34px;border:0;background:var(--purple-light);border-radius:12px;color:var(--purple);display:grid;place-items:center;cursor:pointer;font-size:18px}
  .scroll{flex:1;overflow:auto;padding:14px 14px 30px}
  .scroll::-webkit-scrollbar{display:none}
  .card{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
  .card-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center}
  .card-title .right{margin-left:auto;font-size:13px;color:var(--purple);font-weight:600}
  .order-line{font-size:14px;color:var(--text2);line-height:1.6}
  .patient-box{background:#F7F8FC;border-radius:12px;padding:13px 14px;position:relative}
  .patient-name{font-size:17px;font-weight:700}
  .patient-meta{font-size:13px;color:var(--text2);margin-left:8px;font-weight:600}
  .patient-sub{font-size:13px;color:var(--text2);margin-top:6px;line-height:1.5}
  .lock-tag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:600;color:var(--text3);background:#EDEBF3;padding:3px 8px;border-radius:12px}
  .session{border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;margin-bottom:10px;background:#fff}
  .session-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .session-no{font-size:14px;font-weight:700;color:var(--purple)}
  .session-patient{flex:1;min-width:0;font-size:12px;color:var(--text2);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .session-edit{border:0;background:var(--purple-light);color:var(--purple);font-size:13px;font-weight:600;padding:6px 12px;border-radius:12px;cursor:pointer}
  .session-row{display:flex;gap:7px;font-size:14px;color:var(--text2);line-height:1.6;align-items:flex-start}
  .session-row b{color:var(--text);font-weight:600}
  .session-ico{flex:0 0 15px;color:var(--text3);font-size:13px;line-height:1.7}
  .add-btn{width:100%;height:46px;border:1.5px dashed var(--purple);border-radius:12px;background:var(--purple-bg);color:var(--purple);font-size:14px;font-weight:600;cursor:pointer}
  .note{margin-top:12px;padding:10px 12px;background:var(--purple-bg);border-radius:12px;font-size:13px;color:var(--text2);line-height:1.55}
  /* 底部弹层 */
  .sheet-mask{position:absolute;inset:0;z-index:20;background:rgba(25,15,45,.48);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-mask.show{opacity:1;pointer-events:auto}
  .sheet{width:100%;max-height:82%;overflow:auto;background:#fff;border-radius:12px;padding:20px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(20px);transition:transform .2s}
  .sheet-mask.show .sheet{transform:none}
  .sheet::-webkit-scrollbar{display:none}
  .sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .sheet-title{font-size:17px;font-weight:700}
  .sheet-close{width:32px;height:32px;border:0;border-radius:12px;background:var(--purple-light);color:var(--text2);font-size:19px;cursor:pointer}
  .sheet-tip{font-size:13px;color:var(--text3);margin-bottom:14px}
  .field-label{display:block;font-size:14px;font-weight:600;color:var(--text);margin:14px 0 8px}
  .field-input{width:100%;height:46px;border:1.5px solid var(--border);border-radius:12px;padding:0 12px;font:600 14px inherit;color:var(--text);background:#fff}
  .slot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .slot-btn{height:44px;border:1.5px solid var(--border);border-radius:12px;background:var(--purple-bg);color:var(--text2);font:700 13px inherit;cursor:pointer}
  .slot-btn.sel{border-color:var(--purple);background:var(--purple);color:#fff}
  .addr-opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
  .addr-opt.sel{border-color:var(--purple);background:var(--purple-bg)}
  .addr-radio{flex:0 0 18px;width:18px;height:18px;border-radius:12px;border:1.5px solid var(--text3);margin-top:2px;position:relative}
  .addr-opt.sel .addr-radio{border-color:var(--purple)}
  .addr-opt.sel .addr-radio:after{content:'';position:absolute;inset:3px;border-radius:12px;background:var(--purple)}
  .addr-detail{font-size:14px;font-weight:600;color:var(--text);line-height:1.45}
  .addr-contact{font-size:12px;color:var(--text3);margin-top:3px}
  .sheet-confirm{width:100%;height:46px;margin-top:16px;border:0;border-radius:12px;background:var(--purple);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .empty{padding:60px 20px;text-align:center;color:var(--text3);font-size:14px}
  /* 页内提示（替代 alert，避免内嵌预览中弹窗卡死） */
  .toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%) translateY(10px);z-index:40;background:rgba(26,24,40,.92);color:#fff;font-size:14px;font-weight:600;padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
  <link rel="stylesheet" href="visual-theme.css" />
  <link rel="stylesheet" href="ui/vue-ui.css" />
</head>
<body data-surface="mobile" data-page="bath-booking">
<div class="frame"><div class="phone">
  <div class="status-bar"><span>9:41</span><span>●●●</span></div>
  <header class="nav"><button class="back" onclick="history.length>1?history.back():location.href='orders.html'" aria-label="返回">‹</button><h1>按次预约</h1></header>
  <main class="scroll" id="main"></main>
  <div class="sheet-mask" id="sheetMask" onclick="if(event.target===this)closeSheet()">
    <section class="sheet">
      <div class="sheet-hd"><div class="sheet-title" id="sheetTitle">预约服务</div><button class="sheet-close" type="button" onclick="closeSheet()">×</button></div>
      <div class="sheet-tip">服务对象已自动带入，无需重复填写；可选择本次助浴的时间与地址</div>
      <span class="field-label">服务日期</span>
      <input class="field-input" id="sheetDate" type="date" />
      <span class="field-label">服务时段</span>
      <div class="slot-grid" id="sheetSlots"></div>
      <span class="field-label">助浴地址</span>
      <div id="sheetAddrs"></div>
      <button class="sheet-confirm" type="button" onclick="confirmSheet()">确认预约</button>
    </section>
  </div>
  <div class="toast" id="toast"></div>
</div></div>
<script>
  var TIME_SLOTS=['09:00-11:00','14:00-16:00'];
  var TOTAL=10;
  var no=new URLSearchParams(location.search).get('no')||'';
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  /* ── 订单读取：优先本地下单记录，其次演示订单 ── */
  var DEMO={
    'AKB-2026-041501':{id:'AKB-2026-041501',type:'上门助浴',project:'上门助浴服务 · 10次套餐',person:'张爷爷｜68岁｜男',condition:'骨折术后恢复期 · 需协助完成安全沐浴',address:'西安市雁塔区雁南一路 88号 2单元 1602',contact:'张爷爷',phone:'138****2468',
      sessions:[
        {seq:1,date:'2026-10-16',time:'09:00-11:00',addressDetail:'西安市雁塔区雁南一路 88号 2单元 1602',contact:'张爷爷',phone:'138****2468'},
        {seq:2,date:'2026-10-18',time:'09:00-11:00',addressDetail:'西安市雁塔区雁南一路 88号 2单元 1602',contact:'张爷爷',phone:'138****2468'},
        {seq:3,date:'2026-10-20',time:'14:00-16:00',addressDetail:'西安市高新区科技路 36号',contact:'张爷爷',phone:'138****2468'}
      ]}
  };
  var order=null,orderFromLocal=false;
  try{
    var saved=JSON.parse(localStorage.getItem('ankebang_service_orders')||'[]');
    if(Array.isArray(saved)){var hit=saved.find(function(o){return o.id===no;});if(hit){order=hit;orderFromLocal=true;}}
  }catch(e){}
  if(!order&&DEMO[no])order=JSON.parse(JSON.stringify(DEMO[no]));
  /* 兜底：no 丢失或查不到时，用最新含 sessions 的本地订单，否则演示订单 */
  if(!order){
    try{
      var saved=JSON.parse(localStorage.getItem('ankebang_service_orders')||'[]');
      if(Array.isArray(saved)){
        var candidates=saved.filter(function(o){return o.sessions&&o.sessions.length;}).sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});
        if(candidates.length){order=candidates[0];orderFromLocal=true;no=order.id;}
      }
    }catch(e){}
  }
  if(!order){var keys=Object.keys(DEMO);if(keys.length){order=JSON.parse(JSON.stringify(DEMO[keys[0]]));no=keys[0];}}
  /* 预约覆盖记录（演示订单的修改也走这里） */
  var overrides={};
  try{overrides=JSON.parse(localStorage.getItem('akb_bath_sessions')||'{}')||{};}catch(e){}
  if(order&&overrides[no])order.sessions=overrides[no];
  /* ── 服务对象（自动带入，不可修改） ── */
  function patientInfo(){
    var parts=(order.person||'').split('｜');
    return {name:parts[0]||'服务对象',age:parts[1]||'',gender:parts[2]||'',condition:order.condition||''};
  }
  /* ── 地址（与下单页同一数据源，仅取家庭地址） ── */
  function getAddresses(){
    var fallback=[{id:1,detail:'北京市朝阳区望京街道 88 号 2 单元 1602',contact:'张女士',phone:'138****2468',addressType:'home'}];
    try{
      var list=JSON.parse(localStorage.getItem('ankebang_saved_addresses'));
      if(!Array.isArray(list)||!list.length)return fallback;
      var homes=list.filter(function(a){return (a.addressType||'home')==='home';});
      return homes.length?homes:fallback;
    }catch(e){return fallback;}
  }
  var sessions=order?(order.sessions||[]):[];
  var editIndex=-1,selDate='',selTime=TIME_SLOTS[0],selAddrIdx=0;
  var todayStr=(function(){var d=new Date();var p=function(n){return (n<10?'0':'')+n};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());})();
  var toastTimer=null;
  function toast(msg){ return window.AKBUI.toast(msg,2200); }
  function patientChip(){var p=patientInfo();return esc(p.name+(p.gender?' · '+p.gender:'')+(p.age?' · '+p.age:''));}
  function render(){
    var main=document.getElementById('main');
    if(!order){main.innerHTML='<div class="empty">未找到订单<br><br><button class="add-btn" onclick="location.href=\'orders.html\'">返回订单列表</button></div>';return;}
    var p=patientInfo();
    var html='<div class="card"><div class="card-title">'+esc(order.project||'上门助浴服务')+'<span class="right">'+sessions.length+'/'+TOTAL+' 次</span></div><div class="order-line">订单号 '+esc(order.id)+'<br>10 次套餐 · 八折优惠 · 按次预约服务时间与地点</div></div>';
    html+='<div class="card"><div class="card-title">服务对象</div><div class="patient-box"><span class="lock-tag">自动带入 · 不可修改</span><span class="patient-name">'+esc(p.name)+'</span><span class="patient-meta">'+esc((p.gender?p.gender+' · ':'')+p.age)+'</span>'+(p.condition?'<div class="patient-sub">'+esc(p.condition)+'</div>':'')+'</div></div>';
    html+='<div class="card"><div class="card-title">预约记录<span class="right">未预约次数随时可约</span></div>';
    sessions.forEach(function(s,i){
      html+='<div class="session"><div class="session-hd"><span class="session-no">第'+s.seq+'次</span><span class="session-patient">'+patientChip()+'</span><button class="session-edit" type="button" onclick="openSheet('+i+')">修改</button></div>'+
        '<div class="session-row"><span class="session-ico">时</span><span><b>'+esc(s.date)+'</b> '+esc(s.time||'')+'</span></div>'+
        '<div class="session-row"><span class="session-ico">地</span><span>'+esc(s.addressDetail)+'</span></div></div>';
    });
    if(sessions.length<TOTAL)html+='<button class="add-btn" type="button" onclick="openSheet(-1)">＋ 预约第 '+(sessions.length+1)+' 次</button>';
    html+='<div class="note">每次服务的服务对象与订单一致（自动带入，不可修改）；助浴地址与服务时间可按次调整。</div></div>';
    main.innerHTML=html;
  }
  function openSheet(idx){
    editIndex=idx;
    var addrs=getAddresses();
    if(idx>=0){
      var s=sessions[idx];
      selDate=s.date;selTime=s.time||TIME_SLOTS[0];
      selAddrIdx=Math.max(0,addrs.findIndex(function(a){return a.detail===s.addressDetail;}));
      document.getElementById('sheetTitle').textContent='修改第 '+s.seq+' 次预约';
    }else{
      selDate='';selTime=TIME_SLOTS[0];
      selAddrIdx=Math.max(0,addrs.findIndex(function(a){return a.detail===order.address;}));
      document.getElementById('sheetTitle').textContent='预约第 '+(sessions.length+1)+' 次服务';
    }
    var dateEl=document.getElementById('sheetDate');
    dateEl.min=todayStr;dateEl.value=selDate;
    document.getElementById('sheetSlots').innerHTML=TIME_SLOTS.map(function(t){return '<button type="button" class="slot-btn'+(t===selTime?' sel':'')+'" onclick="pickTime(this,\''+t+'\')">'+t+'</button>';}).join('');
    document.getElementById('sheetAddrs').innerHTML=addrs.map(function(a,i){return '<div class="addr-opt'+(i===selAddrIdx?' sel':'')+'" onclick="pickAddr('+i+')"><span class="addr-radio"></span><div><div class="addr-detail">'+esc(a.detail)+'</div><div class="addr-contact">'+esc(a.contact||'')+' '+esc(a.phone||'')+'</div></div></div>';}).join('');
    document.getElementById('sheetMask').classList.add('show');
  }
  function closeSheet(){document.getElementById('sheetMask').classList.remove('show');}
  function pickTime(el,t){selTime=t;document.querySelectorAll('#sheetSlots .slot-btn').forEach(function(b){b.classList.toggle('sel',b===el);});}
  function pickAddr(i){selAddrIdx=i;document.querySelectorAll('#sheetAddrs .addr-opt').forEach(function(el,j){el.classList.toggle('sel',j===i);});}
  function confirmSheet(){
    var date=document.getElementById('sheetDate').value;
    if(!date){toast('请选择服务日期');return;}
    if(date<todayStr){toast('服务日期不能早于今天');return;}
    var addr=getAddresses()[selAddrIdx]||{};
    var entry={date:date,time:selTime,addressDetail:addr.detail||'',contact:addr.contact||patientInfo().name,phone:addr.phone||''};
    if(editIndex>=0){sessions[editIndex]=Object.assign({},sessions[editIndex],entry);}
    else{sessions.push(Object.assign({seq:sessions.length+1},entry));}
    save();closeSheet();render();toast(editIndex>=0?'已修改预约':'预约成功');
  }
  function save(){
    sessions.forEach(function(s,i){s.seq=i+1;});
    order.sessions=sessions;
    order.sessionSummary='已预约 '+sessions.length+'/'+TOTAL+' 次'+(sessions[0]?' · 下次 '+sessions[0].date:'');
    try{
      if(orderFromLocal){
        var list=JSON.parse(localStorage.getItem('ankebang_service_orders')||'[]');
        var idx=list.findIndex(function(o){return o.id===order.id;});
        if(idx>=0){list[idx]=order;localStorage.setItem('ankebang_service_orders',JSON.stringify(list));}
      }else{
        overrides[no]=sessions;
        localStorage.setItem('akb_bath_sessions',JSON.stringify(overrides));
      }
    }catch(e){}
  }
  render();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script src="common-ui.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>意见与反馈 · 佑小邦</title>
<style>
:root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg:#F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--red:#EF4444;--green:#22C55E;--sh:0 2px 16px rgba(0,0,0,0.1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}
.frame{display:flex;justify-content:center;min-height:100vh;background:#F5F5F5}
.phone{width:100%;max-width:430px;display:flex;flex-direction:column;background:var(--purple-bg);min-height:100vh}
@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1),0 2px 8px rgba(0,0,0,.06)}}
.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll-area::-webkit-scrollbar{display:none}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.back{width:32px;height:32px;border:0;background:var(--purple-bg);border-radius:12px;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.back svg{width:18px;height:18px}
.topbar-title{font-size:16px;font-weight:600}
.fb-tabs{display:flex;background:#fff;padding:0 16px;border-bottom:1px solid var(--border)}
.fb-tab{flex:1;text-align:center;padding:13px 0;font-size:14px;font-weight:600;color:var(--text2);border-bottom:2px solid transparent;cursor:pointer}
.fb-tab.act{color:var(--purple);border-bottom-color:var(--purple)}
.fb-tab-sub{display:block;font-size:11px;font-weight:600;color:var(--text3);margin-top:2px}
.fb-tab.act .fb-tab-sub{color:var(--purple-dark)}
.card{background:var(--card);margin:12px 16px;border-radius:12px;padding:16px;box-shadow:var(--sh)}
.field{margin-bottom:16px}
.field:last-child{margin-bottom:0}
.field-label{font-size:14px;font-weight:600;margin-bottom:8px}
.field-label .req{color:var(--red);margin-left:2px}
.field-label .opt{font-size:12px;font-weight:600;color:var(--text3);margin-left:6px}
.field select,.field input[type=text],.field input[type=tel],.field textarea{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:11px 12px;font:600 13px inherit;color:var(--text);background:#FAFAFC;outline:none}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--purple);background:#fff}
.field textarea{min-height:96px;resize:vertical;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:12px;border:1.5px solid var(--border);background:#FAFAFC;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer}
.chip.act{border-color:var(--purple);background:var(--purple-light);color:var(--purple-dark)}
.upload-row{display:flex;gap:10px;flex-wrap:wrap}
.upload-btn{width:72px;height:72px;border:1.5px dashed var(--border);border-radius:12px;background:#FAFAFC;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text3);font-size:11px;font-weight:600;cursor:pointer}
.upload-btn svg{width:20px;height:20px}
.upload-thumb{width:72px;height:72px;border-radius:12px;object-fit:cover;border:1px solid var(--border)}
.submit-btn{width:100%;height:48px;border:0;border-radius:12px;background:var(--purple);color:#fff;font:800 15px inherit;cursor:pointer;margin:4px 16px 0;width:calc(100% - 32px)}
.submit-btn:active{background:var(--purple-dark)}
.sec-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin:18px 16px 4px}
.sec-title::before{content:"";width:4px;height:14px;border-radius:12px;background:var(--purple)}
.rec-item{background:#fff;border-radius:12px;padding:14px;margin:10px 16px;box-shadow:var(--sh)}
.rec-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rec-tag{padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600}
.rec-tag.biz{background:#DBEAFE;color:#2563EB}
.rec-tag.sys{background:#FEF3C7;color:#D97706}
.rec-state{margin-left:auto;font-size:12px;font-weight:600}
.rec-state.wait{color:#D97706}
.rec-state.done{color:var(--green)}
.rec-desc{font-size:14px;font-weight:600;color:var(--text);line-height:1.6}
.rec-meta{margin-top:6px;font-size:12px;color:var(--text3);font-weight:600}
.rec-reply{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--purple-light);font-size:13px;line-height:1.6;color:var(--text2)}
.rec-reply b{color:var(--purple-dark)}
.rec-empty{text-align:center;color:var(--text3);font-size:13px;font-weight:600;padding:24px 0 30px}
</style>
  <link rel="stylesheet" href="visual-theme.css" />
</head>
<body data-surface="mobile" data-page="feedback">
<div class="frame"><div class="phone">
  <div class="topbar">
    <button class="back" onclick="location.href='profile.html'"><svg viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="#1A1828" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="topbar-title">意见与反馈</div>
  </div>
  <div class="fb-tabs">
    <div class="fb-tab act" data-cat="业务问题" onclick="switchTab(this)">业务问题<span class="fb-tab-sub">服务质量 / 订单 / 退款</span></div>
    <div class="fb-tab" data-cat="系统问题" onclick="switchTab(this)">系统问题<span class="fb-tab-sub">页面 / 功能 / 支付异常</span></div>
  </div>
  <div class="scroll-area">
    <!-- 业务问题表单 -->
    <div class="card" id="bizForm">
      <div class="field">
        <div class="field-label">关联订单<span class="opt">选填，便于快速定位</span></div>
        <select id="bizOrder"><option value="">不关联订单</option></select>
      </div>
      <div class="field">
        <div class="field-label">问题类型<span class="req">*</span></div>
        <div class="chips" id="bizTypes"></div>
      </div>
      <div class="field">
        <div class="field-label">问题描述<span class="req">*</span></div>
        <textarea id="bizDesc" placeholder="请详细描述您遇到的问题，例如服务时间、涉及人员、具体经过等"></textarea>
      </div>
      <div class="field">
        <div class="field-label">上传图片<span class="opt">最多 3 张</span></div>
        <div class="upload-row" id="bizPhotos"></div>
        <input type="file" accept="image/*" id="bizFile" style="display:none">
      </div>
      <div class="field">
        <div class="field-label">联系方式<span class="req">*</span></div>
        <input type="tel" id="bizContact" placeholder="请输入手机号，便于客服与您联系" maxlength="11">
      </div>
      <button class="submit-btn" onclick="submitFeedback('业务问题')">提交反馈</button>
    </div>
    <!-- 系统问题表单 -->
    <div class="card" id="sysForm" style="display:none">
      <div class="field">
        <div class="field-label">问题类型<span class="req">*</span></div>
        <div class="chips" id="sysTypes"></div>
      </div>
      <div class="field">
        <div class="field-label">发生页面<span class="opt">选填</span></div>
        <input type="text" id="sysPage" placeholder="例如：首页 / 商城 / 订单详情页">
      </div>
      <div class="field">
        <div class="field-label">问题描述<span class="req">*</span></div>
        <textarea id="sysDesc" placeholder="请描述异常现象、操作步骤，便于技术团队复现定位"></textarea>
      </div>
      <div class="field">
        <div class="field-label">上传图片<span class="opt">最多 3 张，截图有助于定位问题</span></div>
        <div class="upload-row" id="sysPhotos"></div>
        <input type="file" accept="image/*" id="sysFile" style="display:none">
      </div>
      <div class="field">
        <div class="field-label">联系方式<span class="req">*</span></div>
        <input type="tel" id="sysContact" placeholder="请输入手机号，便于客服与您联系" maxlength="11">
      </div>
      <button class="submit-btn" onclick="submitFeedback('系统问题')">提交反馈</button>
    </div>
    <!-- 我的反馈记录 -->
    <div class="sec-title">我的反馈记录</div>
    <div id="recList"></div>
  </div>
</div></div>
<script>
(function(){
  var BIZ_TYPES=['服务态度','服务质量','费用争议','预约改期','退款问题','其他'];
  var SYS_TYPES=['页面无法打开','功能异常','支付失败','卡顿 / 闪退','显示错乱','其他'];
  var photoStore={业务问题:[],系统问题:[]};
  var pickedType={业务问题:'',系统问题:''};

  function renderChips(id,cat,types){
    document.getElementById(id).innerHTML=types.map(function(t,i){
      return '<span class="chip'+(i===0?' act':'')+'" onclick="pickType(this,\''+cat+'\')">'+t+'</span>';
    }).join('');
    pickedType[cat]=types[0];
  }
  window.pickType=function(el,cat){
    el.parentElement.querySelectorAll('.chip').forEach(function(c){c.classList.remove('act');});
    el.classList.add('act');
    pickedType[cat]=el.textContent;
  };
  renderChips('bizTypes','业务问题',BIZ_TYPES);
  renderChips('sysTypes','系统问题',SYS_TYPES);

  window.switchTab=function(el){
    document.querySelectorAll('.fb-tab').forEach(function(t){t.classList.remove('act');});
    el.classList.add('act');
    var cat=el.dataset.cat;
    document.getElementById('bizForm').style.display=cat==='业务问题'?'':'none';
    document.getElementById('sysForm').style.display=cat==='系统问题'?'':'none';
  };

  /* 关联订单下拉：合并服务订单与商城订单 */
  function fillOrders(){
    var opts='<option value="">不关联订单</option>';
    try{
      var svc=JSON.parse(localStorage.getItem('ankebang_service_orders')||'[]');
      svc.forEach(function(o){opts+='<option value="'+o.id+'">服务订单 '+(o.id||'')+' · '+(o.project||o.type||'')+'</option>';});
    }catch(e){}
    try{
      var mall=JSON.parse(localStorage.getItem('ankebang_mall_orders')||'[]');
      mall.forEach(function(o){opts+='<option value="'+(o.id||o.no||'')+'">商城订单 '+(o.id||o.no||'')+' · '+(o.product||o.item||'')+'</option>';});
    }catch(e){}
    document.getElementById('bizOrder').innerHTML=opts;
  }
  fillOrders();

  /* 图片上传 */
  function bindUpload(rowId,fileId,cat){
    var row=document.getElementById(rowId);
    var file=document.getElementById(fileId);
    function draw(){
      row.innerHTML=photoStore[cat].map(function(src,i){
        return '<img class="upload-thumb" src="'+src+'" onclick="removePhoto(\''+cat+'\','+i+')" title="点击移除">';
      }).join('')+(photoStore[cat].length<3?'<div class="upload-btn" id="'+fileId+'-btn"><svg viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="#AEACC0" stroke-width="1.8" stroke-linecap="round"/></svg>添加图片</div>':'');
      var btn=document.getElementById(fileId+'-btn');
      if(btn)btn.onclick=function(){file.click();};
    }
    file.onchange=function(){
      var f=file.files[0];
      if(!f)return;
      var reader=new FileReader();
      reader.onload=function(ev){
        photoStore[cat].push(ev.target.result);
        draw();
      };
      reader.readAsDataURL(f);
      file.value='';
    };
    draw();
    window['redraw_'+cat]=draw;
  }
  window.removePhoto=function(cat,i){
    photoStore[cat].splice(i,1);
    window['redraw_'+cat]();
  };
  bindUpload('bizPhotos','bizFile','业务问题');
  bindUpload('sysPhotos','sysFile','系统问题');

  function loadFeedbacks(){
    try{var list=JSON.parse(localStorage.getItem('ankebang_feedbacks')||'[]');return Array.isArray(list)?list:[];}catch(e){return[];}
  }
  function saveFeedbacks(list){localStorage.setItem('ankebang_feedbacks',JSON.stringify(list));}

  window.submitFeedback=function(cat){
    var isBiz=cat==='业务问题';
    var desc=document.getElementById(isBiz?'bizDesc':'sysDesc').value.trim();
    var contact=document.getElementById(isBiz?'bizContact':'sysContact').value.trim();
    if(!desc){showToast('请填写问题描述');return;}
    if(!contact){showToast('请填写联系方式');return;}
    if(!/^1\d{10}$/.test(contact)){showToast('请输入正确的 11 位手机号');return;}
    var now=new Date();
    var id='FB'+now.getFullYear()+('0'+(now.getMonth()+1)).slice(-2)+('0'+now.getDate()).slice(-2)+'-'+String(now.getTime()).slice(-4);
    var item={
      id:id,
      category:cat,
      type:pickedType[cat],
      orderNo:isBiz?document.getElementById('bizOrder').value:'',
      page:isBiz?'':document.getElementById('sysPage').value.trim(),
      desc:desc,
      photos:photoStore[cat].slice(),
      contact:contact,
      createdAt:now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2)+' '+('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2),
      status:'待处理',
      reply:'',
      repliedAt:''
    };
    var list=loadFeedbacks();
    list.unshift(item);
    saveFeedbacks(list);
    document.getElementById(isBiz?'bizDesc':'sysDesc').value='';
    if(!isBiz)document.getElementById('sysPage').value='';
    document.getElementById(isBiz?'bizContact':'sysContact').value='';
    photoStore[cat]=[];
    window['redraw_'+cat]();
    showToast('提交成功，客服将在 24 小时内处理');
    renderRecords();
  };

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function renderRecords(){
    var list=loadFeedbacks();
    var box=document.getElementById('recList');
    if(!list.length){box.innerHTML='<div class="rec-empty">暂无反馈记录</div>';return;}
    box.innerHTML=list.map(function(f){
      return '<div class="rec-item">'
        +'<div class="rec-head"><span class="rec-tag '+(f.category==='业务问题'?'biz':'sys')+'">'+esc(f.category)+'</span>'
        +'<span style="font-size:13px;font-weight:600">'+esc(f.type)+'</span>'
        +'<span class="rec-state '+(f.status==='待处理'?'wait':'done')+'">'+esc(f.status)+'</span></div>'
        +'<div class="rec-desc">'+esc(f.desc)+'</div>'
        +(f.orderNo?'<div class="rec-meta">关联订单：'+esc(f.orderNo)+'</div>':'')
        +(f.page?'<div class="rec-meta">发生页面：'+esc(f.page)+'</div>':'')
        +'<div class="rec-meta">'+esc(f.id)+' · '+esc(f.createdAt)+'</div>'
        +(f.reply?'<div class="rec-reply"><b>官方回复'+(f.repliedAt?' · '+esc(f.repliedAt):'')+'：</b>'+esc(f.reply)+'</div>':'')
        +'</div>';
    }).join('');
  }
  renderRecords();
})();
</script>
</body>
</html>

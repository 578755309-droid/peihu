      <div style="font-size:16px;font-weight:900">分配护理员</div>
      <button onclick="closeDispatchModal()" style="border:0;background:none;font-size:20px;cursor:pointer">×</button>
    </div>
    <div id="dispatchList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button onclick="closeDispatchModal()" style="padding:8px 16px;border:1px solid #CFF5ED;border-radius:8px;background:#fff;cursor:pointer">取消</button>
      <button onclick="confirmDispatch()" style="padding:8px 16px;border:0;border-radius:8px;background:#1CD8B7;color:#fff;font-weight:800;cursor:pointer">确认派单</button>
    </div>
  </div>
</div>

        document.getElementById('reportContent').innerHTML=reports.length?'<div class="report-summary"><b>'+reports.length+'</b><span>条日报已同步，记录来自陪护员移动端提交。</span></div><div class="report-list">'+reports.map(function(report){return '<article class="report"><div class="report-date">'+report.date+'<span>'+report.time+' 提交</span></div><div class="report-body"><div class="report-title">'+esc(report.title)+'</div><div class="report-desc">'+esc(report.desc)+'</div><div class="report-tags">'+report.tags.map(function(tag){return '<span class="report-tag">'+esc(tag)+'</span>';}).join('')+'</div></div><button class="report-action" onclick="location.href=\'daily-report.html?order='+encodeURIComponent(data.no)+'\'">查看日报</button></article>';}).join('')+'</div>':'<div class="empty"><strong>暂无已提交日报</strong>服务开始后，陪护员将从移动端提交当日服务记录。</div>';

      /* 退款申请卡片：展示用户端 bath-refund 提交的数据（原因/金额/描述/凭证/时间）+ 处理记录时间线，支持审核 */
      function renderRefund(data){
        var card=document.getElementById('refundCard');
        if(!card)return;
        var ra=null;
        if(data.refundApp)ra={reason:data.refundApp.reason,amount:data.refundApp.amount,maxAmount:data.refundApp.maxAmount||'',desc:data.refundApp.description,photos:data.refundApp.photos||[],appliedAt:data.refundApp.appliedAt,state:data.refundState||'待审核',resolvedAt:data.refundResolvedAt||''};
        else if(data.refundState||data.refundReason)ra={reason:data.refundReason,amount:data.refundAmount,maxAmount:data.refundMaxAmount,desc:data.refundRemark,photos:[],appliedAt:data.refundAppliedAt,state:data.refundState||'待审核',resolvedAt:data.refundResolvedAt||''};
        if(!ra){card.style.display='none';return;}
        card.style.display='';
        /* 金额对比 */
        var _paid=Number(String(data.amount||'').replace(/[^0-9.]/g,''))||0;
        var _applied=Number(String(ra.amount||'').replace(/[^0-9.]/g,''))||0;
        var _refunded=Number(String(data.refundAmount||'').replace(/[^0-9.]/g,''))||0;
        var _used=0;
        var _sessions=data.sessions&&data.sessions.length?data.sessions.length:0;
        var _isPkg=_sessions||(data.item&&String(data.item).indexOf('套餐')>-1);
        if(_isPkg&&_sessions&&_paid){_used=Number(((_paid/10)*_sessions).toFixed(2));}
        else if(data.state==='已完成'||data.state==='服务完成'){_used=_paid;}
        var _refundable=Math.max(0,Number((_paid-_used-_refunded).toFixed(2)));
        function _fm(n){return '¥'+Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
        var html='<div class="info-grid">'
          +info('付费金额',_fm(_paid))
          +info('已使用金额',_fm(_used))
          +info('可退款金额','<b style="color:#1CD8B7;font-weight:900">'+_fm(_refundable)+'</b>')
          +info('用户申请金额',_fm(_applied)+(_applied>_refundable?' <span style="color:#DC2626;font-weight:800">⚠ 超可退</span>':''))
          +info('退款原因',ra.reason||'—')
          +(ra.maxAmount?info('最大可退金额','¥'+ra.maxAmount):'')
          +info('申请时间',ra.appliedAt||'—')
          +info('审核状态',ra.state)
          +(ra.resolvedAt?info('处理时间',ra.resolvedAt):'')
          +'</div>'
          +(ra.desc?'<div style="margin-top:12px;padding:12px 14px;border-radius:10px;background:#F8FAFC;font-size:12px;color:#53647b;line-height:1.7">'+esc(ra.desc)+'</div>':'')
          +(ra.photos.length?'<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">'+ra.photos.map(function(p){return '<img src="'+p+'" style="width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid #E4FAF4">';}).join('')+'</div>':'');
        /* 处理记录：优先取订单 refundLog（用户提交→平台审核→退款完成），否则由申请/处理时间合成 */
        var logs=[];
        if(data.refundLog&&data.refundLog.length){
          logs=data.refundLog.slice();
          /* 兼容更新前提交的订单：refundLog 缺首条时按申请时间补全 */
          if(ra.appliedAt&&!logs.some(function(l){return l.title==='提交退款申请';})){
            logs.unshift({title:'提交退款申请',at:ra.appliedAt,desc:'退款原因：'+(ra.reason||'—')+' · 申请金额 ¥'+(ra.amount||'—'),operator:'用户',done:true});
          }
        }else{
          if(ra.appliedAt)logs.push({title:'提交退款申请',at:ra.appliedAt,desc:'退款原因：'+(ra.reason||'—')+' · 申请金额 ¥'+(ra.amount||'—'),operator:'用户',done:true});
          if(ra.state==='已退款'&&ra.resolvedAt){
            logs.push({title:'审核通过 · 同意退款',at:ra.resolvedAt,desc:'退款金额 ¥'+(ra.amount||'—')+' 原路退回',operator:'平台客服',done:true});
            logs.push({title:'退款完成',at:ra.resolvedAt,desc:'款项已原路退回支付账户',operator:'系统',done:true});
          }
          if(ra.state==='已拒绝'&&ra.resolvedAt)logs.push({title:'审核拒绝',at:ra.resolvedAt,desc:'退款申请未通过，订单恢复待服务',operator:'平台客服',done:true});
        }
        if(ra.state==='待审核')logs.push({title:'平台审核中',at:'',desc:'预计 1-3 个工作日内完成审核',operator:'平台客服',done:false});
        if(logs.length){
          html+='<div style="margin-top:16px;padding-top:14px;border-top:1px solid #E6FAF5"><div style="font-size:13px;font-weight:900;margin-bottom:12px">处理记录</div><div class="timeline">'
            +logs.map(function(log){return '<div class="timeline-item '+(log.done?'done':'')+'"><div class="timeline-time">'+esc(log.at||'待处理')+(log.operator?' · '+esc(log.operator):'')+'</div><div class="timeline-title">'+esc(log.title)+'</div>'+(log.desc?'<div class="timeline-desc">'+esc(log.desc)+'</div>':'')+'</div>';}).join('')
            +'</div></div>';
        }
        document.getElementById('refundInfo').innerHTML=html;
        document.getElementById('refundActions').innerHTML=ra.state==='待审核'
          ?'<button class="btn primary" onclick="resolveRefund(\''+esc(data.no)+'\',true)">同意退款</button><button class="btn" style="color:#DC2626;border-color:#FECACA" onclick="resolveRefund(\''+esc(data.no)+'\',false)">拒绝退款</button>'
          :'';
      }
      window.resolveRefund=function(no,approve){
        try{
          var saved=JSON.parse(localStorage.getItem('ankebang_service_orders')||'[]');
          if(!Array.isArray(saved))saved=[];
          var idx=saved.findIndex(function(o){return o.id===no;});
          var now=new Date();
          var at=now.getFullYear()+'-'+('0'+(now.getMonth()+1)).slice(-2)+'-'+('0'+now.getDate()).slice(-2)+' '+('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);
          if(idx<0){saved.unshift({id:no});idx=0;}
          var rec=saved[idx];
          rec.refundState=approve?'已退款':'已拒绝';
          rec.state=approve?'退款/售后':'待服务';
          rec.refundResolvedAt=at;
          var amount=rec.refundAmount||(rec.refundApp&&rec.refundApp.amount)||'—';
          rec.refundLog=(rec.refundLog||[]).concat(approve?[
            {title:'审核通过 · 同意退款',at:at,desc:'退款金额 ¥'+amount+' 原路退回',operator:'平台客服',done:true},
            {title:'退款完成',at:at,desc:'款项已原路退回支付账户',operator:'系统',done:true}
          ]:[
            {title:'审核拒绝',at:at,desc:'退款申请未通过，订单恢复待服务',operator:'平台客服',done:true}
          ]);
          localStorage.setItem('ankebang_service_orders',JSON.stringify(saved));
        }catch(e){}
        showToast(approve?'已同意退款，金额将原路退回':'已拒绝退款申请');
        render();
      };
      function renderContract(no){
        var card=document.getElementById('contractCard');
        if(!card||!window.AKBContract)return;
        card.style.display='';
        var rec=window.AKBContract.recordFor(no);
        var box=document.getElementById('contractInfo');
        if(!rec){
          box.innerHTML='<div class="empty" style="padding:22px 0"><strong>暂未发起电子合同</strong>护理员上门开始服务时，可在移动端「待上岗」订单中发起电子合同。</div>';
          return;
        }
        var signed=rec.status==='已签署';
        box.innerHTML='<div class="info-grid">'
          +info('合同编号',rec.contractNo)+info('合同状态',rec.status)
          +info('发起人',(rec.issuedBy||'—')+(rec.issuedAt?' · '+rec.issuedAt:''))+info('签署信息',signed?(rec.signerName+' · '+rec.signedAt):'等待用户在移动端签署')
          +'</div>'
          +(signed&&rec.signImage
            ?'<div style="margin-top:14px;padding:12px 14px;border:1px solid #d9f0e5;border-radius:11px;background:#f7fcf9;display:flex;align-items:center;justify-content:space-between;gap:12px"><div style="font-size:12px;color:#5d7090;font-weight:700">乙方电子签名<span style="display:block;margin-top:4px;color:#16a34a;font-weight:900">已存档，与手写签名具同等法律效力</span></div><img src="'+rec.signImage+'" alt="乙方签名" style="max-width:150px;max-height:56px"></div>'
            :'<div style="margin-top:14px;padding:12px 14px;border:1px dashed #dfe8f4;border-radius:11px;color:#94a3b8;font-size:12px;font-weight:700">用户完成签署后，此处展示乙方电子签名存档。</div>');
      }
      function info(label,value){return '<div class="info"><label>'+esc(label)+'</label><span>'+esc(value)+'</span></div>';}
      function person(role,name,detail,avatar){return '<div class="person"><div class="avatar">'+avatar+'</div><div><div class="role">'+esc(role)+'</div><div class="name">'+esc(name)+'</div><div class="detail">'+esc(detail)+'</div></div></div>';}
      function timeline(time,title,desc,done){return '<div class="timeline-item '+(done?'done':'')+'"><div class="timeline-time">'+esc(time)+'</div><div class="timeline-title">'+esc(title)+'</div><div class="timeline-desc">'+esc(desc)+'</div></div>';}
      if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',render);else render();
    })();
  </script>

      var mallPaid = data.state !== '待支付';
      document.getElementById('paymentInfo').innerHTML = '<div class="payment-row"><span>支付方式</span><span>'+(mallPaid?'微信支付':'—')+'</span></div><div class="payment-row"><span>商品金额</span><span>'+esc(data.amount)+'</span></div><div class="payment-row"><span>运费</span><span>¥0</span></div><div class="payment-row"><span>积分抵扣</span><span>¥0</span></div><div class="payment-row"><span>实付金额</span><span>'+(mallPaid?esc(data.amount):'—')+'</span></div><div class="payment-row"><span>实收金额</span><span>'+(mallPaid?esc(data.amount):'—')+'</span></div><div class="payment-row"><span>支付状态</span><span>'+esc(data.state === '待支付' ? '待支付' : '已支付')+'</span></div><div class="payment-row total"><span>应付金额</span><strong>'+esc(data.amount)+'</strong></div>';
      document.getElementById('timeline').innerHTML = timeline(data.orderedAt, '用户提交订单', '已从商城完成下单 · '+(data.deliveryType || '配送方式待确认'), true) + timeline(data.state === '待支付' ? '待处理' : '—', data.state === '待支付' ? '等待付款' : '订单已确认', data.state === '待支付' ? '当前订单尚未完成付款' : '配送费用已包含在商品售价内', data.state !== '待支付') + (data.state === '配送中' || data.state === '待收货确认' || data.state === '已完成' ? timeline(data.deliveredAt || '配送完成', '配送完成', data.logisticsNo && data.logisticsNo !== '—' ? data.logisticsCompany+' · '+data.logisticsNo : data.deliveryType+'已送达', true) : '') + (data.state === '待收货确认' ? timeline('待确认', '等待收货码确认', '收货码：'+(data.receiveCode || '—')+' · 可由用户确认或后台人工确认', false) : '') + (data.state === '已完成' ? timeline('已签收', '订单已完成', '确认方式：'+(data.confirmedBy || '用户确认'), true) : '');
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', renderMallDetail); else renderMallDetail();
    })();
  </script>
</body>
</html>

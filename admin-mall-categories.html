<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
<script src="common-ui.js"></script>
  <meta name="viewport" content="width=1280" />
  <title>分类商品管理 · 佑小邦运营后台</title>
  <link rel="stylesheet" href="admin-shell.css" />
  <link rel="stylesheet" href="admin-catalog.css" />
  <link rel="stylesheet" href="admin-mall.css" />
  <script src="admin-points-data.js"></script>
  <script src="admin-mall-data.js"></script>
  <script defer src="admin-sidebar.js"></script>
  <style>
    .catalog-layout{display:grid;grid-template-columns:300px 1fr;gap:18px}
    .category-list{padding:10px;max-height:560px;overflow-y:auto}
    .category-item{padding:14px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:6px;transition:all .12s}
    .category-item:hover{background:#F5F8FF}
    .category-item.active{background:#EEF4FF;border-color:#A5EFE0;box-shadow:inset 3px 0 #1CD8B7}
    .cat-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .cat-name{font-size:14px;font-weight:800;color:#172033}
    .cat-status{font-size:11px;font-weight:800;color:#16A34A}
    .cat-status.off{color:#DC2626}
    .cat-meta{font-size:11px;color:#8F9BB0;margin-top:6px;line-height:1.5}
    .cat-ops{display:flex;gap:4px;margin-top:9px}
    .cat-ops button{border:0;background:none;color:#1CD8B7;font:700 12px inherit;cursor:pointer;padding:3px 6px}
    .cat-ops .danger{color:#DC2626}
    .cat-empty-tip{padding:14px 19px;font-size:12px;color:#8F9BB0;background:#F3FDFA;border-bottom:1px solid #E4FAF4;line-height:1.6}
    .pt-badge{display:inline-flex;padding:4px 9px;border-radius:14px;font-size:11px;font-weight:800}
    .pt-badge.on{background:#DCFCE7;color:#16A34A}
    .pt-badge.off{background:#FEE2E2;color:#DC2626}
    .pt-sub{font-size:11px;color:#9AA7BA;margin-top:3px;font-weight:700}
    .ck{width:15px;height:15px;accent-color:#1CD8B7;cursor:pointer}
    .sel-chip{display:none;align-items:center;gap:8px;padding:5px 12px;border-radius:14px;background:#DDF7F1;color:#1CD8B7;font-size:12px;font-weight:800}
    .sel-chip.show{display:inline-flex}
    .sel-chip button{border:0;background:none;color:#1CD8B7;font:700 12px inherit;cursor:pointer;text-decoration:underline}
    .cover-uploader{display:flex;gap:14px;align-items:flex-start}
    .cover-preview{width:96px;height:96px;flex:none;border:1px dashed #A5EFE0;border-radius:10px;background:#F2FCF9;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#9AA7BA;font-size:11px;font-weight:700}
    .cover-preview img{width:100%;height:100%;object-fit:cover}
    .cover-thumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
    .cv-item{position:relative;width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid #CFF5ED;cursor:grab;background:#F2FCF9;flex:none}
    .cv-item.cv-primary{border-color:#1CD8B7;box-shadow:0 0 0 2px rgba(28,216,183,.15)}
    .cv-item img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
    .cv-item:active{cursor:grabbing}
    .cv-main{position:absolute;left:0;top:0;background:#1CD8B7;color:#fff;font-size:10px;font-weight:800;padding:2px 6px;border-radius:0 0 8px 0;z-index:2}
    .cv-del{position:absolute;right:3px;top:3px;width:18px;height:18px;border:0;border-radius:50%;background:rgba(23,32,51,.72);color:#fff;font-size:12px;line-height:18px;padding:0;cursor:pointer;z-index:2}
    .cv-del:hover{background:#DC2626}
    .cv-idx{position:absolute;left:3px;bottom:3px;background:rgba(255,255,255,.92);color:#172033;font-size:10px;font-weight:800;padding:1px 5px;border-radius:8px}
    .cv-add{width:76px;height:76px;flex:none;border:1.5px dashed #A5EFE0;border-radius:10px;background:#F2FCF9;color:#1CD8B7;font-size:20px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
    .cv-add span{font-size:10px;font-weight:700;color:#7A8AA8}
    .cv-add:hover{border-color:#1CD8B7;background:#EEF4FF}
    .cv-count{font-size:11px;color:#94A3B8;font-weight:700;align-self:center;width:100%}
    .cover-ops{display:flex;flex-direction:column;gap:8px}
    .field-tip{font-size:11px;color:#94A3B8;line-height:1.5;font-weight:600}
    .rich-editor{border:1px solid #CFF5ED;border-radius:10px;overflow:hidden;background:#fff}
    .rich-editor:focus-within{border-color:#1CD8B7}
    .rich-toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:7px 9px;border-bottom:1px solid #E7F0FA;background:#F2FCF9}
    .rich-toolbar button{min-width:30px;height:29px;padding:0 8px;border:1px solid transparent;border-radius:6px;background:none;color:#41536D;font:800 12px inherit;cursor:pointer}
    .rich-toolbar button:hover{background:#DDF7F1;border-color:#CFE1F6}
    .rich-toolbar .sep{width:1px;background:#D2F5EB;margin:4px 3px}
    .rich-area{min-height:180px;max-height:300px;overflow:auto;padding:12px 14px;font-size:13px;line-height:1.8;color:#172033;outline:none}
    .rich-area:empty:before{content:attr(data-ph);color:#A3B0C2}
    .rich-area img{max-width:100%;border-radius:8px;margin:6px 0}
    .rich-area h2{font-size:17px;margin:12px 0 6px}
    .rich-area h3{font-size:15px;margin:10px 0 5px}
    .rich-area ul,.rich-area ol{padding-left:22px;margin:6px 0}
  </style>
<link rel="stylesheet" href="modal-scroll.css"></head>
<body>
<div class="layout">
  <aside class="sidebar"><div class="brand"><div class="brand-title">佑小邦</div><div class="brand-sub">运营管理后台</div></div></aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb"><span>商城管理</span><span>›</span><span class="current">分类商品管理</span></div>
      <div class="top-actions"><span class="top-date" id="topDate"></span><div class="top-av">管</div></div>
    </header>

    <section class="page">
      <div class="page-head">
        <div>
          <h1 class="page-title">分类商品管理</h1>
          <p class="page-sub">管理商城分类的名称、排序与启用状态；右侧为商品管理，支持搜索、编辑、上下架与新增</p>
        </div>
        <div class="actions">
          <button class="btn" onclick="openBatchPoints()">批量设置积分</button>
          <button class="btn btn-primary" onclick="openProductModal()">+ 新增商品</button>
          <button class="btn btn-primary" onclick="openCategoryModal()">+ 新增分类</button>
        </div>
      </div>

      <!-- 统计 -->
      <div class="mall-metrics" id="metricCards" style="grid-template-columns:repeat(4,1fr)"></div>

      <!-- 筛选 -->
      <div class="mall-filter">
        <label>分类</label>
        <select class="select" id="fCategory"><option value="all">全部分类</option></select>
        <label>状态</label>
        <select class="select" id="fStatus">
          <option value="all">全部状态</option>
          <option value="on">已上架</option>
          <option value="off">已下架</option>
          <option value="low">库存预警</option>
        </select>
        <input class="search" id="fSearch" placeholder="搜索商品名称 / 卖点" />
        <span class="sel-chip" id="selChip"><span id="selChipText"></span><button onclick="clearSelection()">清除</button></span>
        <span class="result">共 <strong id="count">0</strong> 款商品</span>
      </div>

      <div class="catalog-layout">
        <!-- 左：分类列表 -->
        <section class="panel">
          <div class="panel-head" style="padding:18px 20px;border-bottom:1px solid #E4FAF4;display:flex;align-items:center;justify-content:space-between">
            <div>
              <div style="font-size:15px;font-weight:900;color:#172033">分类列表</div>
              <div style="font-size:11px;color:#9AA7BA;margin-top:4px">小程序商城顶部分类入口</div>
            </div>
          </div>
          <div class="category-list" id="categoryList"></div>
        </section>

        <!-- 右：商品管理 -->
        <section class="panel">
          <div class="panel-head" style="padding:18px 20px;border-bottom:1px solid #E4FAF4;display:flex;align-items:center;justify-content:space-between">
            <div>
              <div style="font-size:15px;font-weight:900;color:#172033" id="panelTitle">商品管理</div>
              <div style="font-size:11px;color:#9AA7BA;margin-top:4px" id="panelNote">管理全部商品的上下架、编辑与新增</div>
            </div>
          </div>
          <div class="cat-empty-tip" id="offTip" style="display:none">该分类已停用，小程序商城顶部入口已隐藏；重新上架分类即可恢复展示。</div>
          <div class="table-wrap mall-table-wrap" style="border:0;box-shadow:none;border-radius:0;overflow-x:auto">
            <table class="table mall-table" style="min-width:1100px">
              <thead><tr><th style="width:36px"><input type="checkbox" class="ck" id="ckAll" onchange="toggleAll(this)"></th><th>商品信息</th><th>分类</th><th>售价</th><th>库存</th><th>已售</th><th>积分抵扣</th><th>排序</th><th>状态</th><th>操作</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display:none">没有符合条件的商品</div>
          </div>
        </section>
      </div>

    </section>
  </main>
</div>

<!-- 分类弹窗 -->
<div class="modal-mask" id="categoryModal" onclick="if(event.target===this)closeCategoryModal()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">新增分类</div>
      <button class="modal-close" onclick="closeCategoryModal()">×</button>
    </div>
    <div class="form-grid">
      <div class="field"><label>分类名称 *</label><input id="cName" placeholder="例如：健康监测" /></div>
      <div class="field"><label>分类描述</label><textarea id="cDesc" placeholder="在后台与分类入口展示的说明"></textarea></div>
      <div class="form-2col">
        <div class="field"><label>排序</label><input id="cSort" type="number" min="1" step="1" value="99" /></div>
        <div class="field"><label>状态</label><select id="cStatus"><option value="on">启用</option><option value="off">停用</option></select></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeCategoryModal()">取消</button>
      <button class="btn btn-primary" onclick="saveCategory()">保存</button>
    </div>
  </div>
</div>

<!-- 新增/编辑商品弹窗 -->
<div class="modal-mask" id="productModal" onclick="if(event.target===this)closeProductModal()">
  <div class="modal modal-wide">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">新增商品</div>
      <button class="modal-close" onclick="closeProductModal()">×</button>
    </div>
    <div class="form-grid">
      <div class="form-2col">
        <div class="field"><label>商品名称 *</label><input id="pName" placeholder="例如：电子体温计" /></div>
        <div class="field"><label>所属分类 *</label><select id="pCategory"></select></div>
      </div>
      <div class="field"><label>卖点短句</label><input id="pSub" placeholder="例如：快速测温 · 大屏易读" /></div>
      <div class="form-3col">
        <div class="field"><label>售价（元）*</label><input id="pPrice" type="number" min="0" step="0.01" placeholder="0" /></div>
        <div class="field"><label>库存</label><input id="pStock" type="number" min="0" step="1" placeholder="0" /></div>
        <div class="field"><label>排序</label><input id="pSort" type="number" min="1" step="1" value="99" /></div>
      </div>
      <div class="form-2col" style="display:none">
        <div class="field"><label>角标文案</label><input id="pBadge" placeholder="例如：热销 / 居家常备" /></div>
        <div class="field"><label>商品图片路径</label><input id="pImage" placeholder="assets/mall/xxx.png（可留空使用默认图标）" /></div>
      </div>
      <div class="field">
        <label>封面图（最多 5 张 · 拖拽排序）</label>
        <div class="cover-uploader">
          <div class="cover-thumbs" id="pCoverThumbs"></div>
          <div class="cover-ops">
            <div>
              <button type="button" class="btn" onclick="document.getElementById('pCoverFile').click()">上传图片</button>
              <button type="button" class="btn" onclick="clearCover()">清除</button>
            </div>
            <input type="file" id="pCoverFile" accept="image/*" multiple style="display:none" onchange="onCoverFile(this)" />
            <input type="hidden" id="pCover" />
            <div class="field-tip">最多 5 张，本地上传自动压缩至 640px；拖动缩略图调整顺序，第 1 张为主封面（用户端展示主封面）。</div>
          </div>
        </div>
      </div>
      <div class="field" style="display:none">
        <label>展示色调</label>
        <div class="preview-tone" id="pTone"></div>
      </div>
      <div class="field" style="display:none"><label>商品说明</label><textarea id="pDesc" placeholder="商品详情底部展示的说明文字"></textarea></div>
      <div class="field">
        <label>商品详情（富文本，可上传图片、文字排版）</label>
        <div class="rich-editor">
          <div class="rich-toolbar">
            <button type="button" onclick="pCmd('bold')" title="加粗"><b>B</b></button>
            <button type="button" onclick="pCmd('italic')" title="斜体"><i>I</i></button>
            <button type="button" onclick="pCmd('underline')" title="下划线"><u>U</u></button>
            <span class="sep"></span>
            <button type="button" onclick="pCmd('formatBlock','h2')" title="大标题">H2</button>
            <button type="button" onclick="pCmd('formatBlock','h3')" title="小标题">H3</button>
            <button type="button" onclick="pCmd('formatBlock','p')" title="正文">正文</button>
            <span class="sep"></span>
            <button type="button" onclick="pCmd('insertUnorderedList')" title="无序列表">• 列表</button>
            <button type="button" onclick="pCmd('insertOrderedList')" title="有序列表">1. 列表</button>
            <span class="sep"></span>
            <button type="button" onclick="pInsertImageUrl()" title="插入图片链接">图片URL</button>
            <button type="button" onclick="document.getElementById('pDetailImgFile').click()" title="上传本地图片">上传图片</button>
            <span class="sep"></span>
            <button type="button" onclick="pCmd('removeFormat')" title="清除格式">清除</button>
          </div>
          <div class="rich-area" id="pDetailArea" contenteditable="true" data-ph="输入商品详情，可插入图片、设置标题与列表…"></div>
          <input type="file" id="pDetailImgFile" accept="image/*" style="display:none" onchange="pInsertImageFile(this)" />
        </div>
      </div>
      <div class="field" style="display:none">
        <label>商品特点</label>
        <div class="points-editor" id="pPoints"></div>
        <button type="button" class="point-add" onclick="addPointRow()">+ 添加一条特点</button>
      </div>
      <div class="form-2col">
        <div class="field"><label>上架状态</label><select id="pStatus"><option value="on">立即上架</option><option value="off">暂下架（小程序端隐藏）</option></select></div>
        <div class="field"><label>实际已售（系统统计，只读）</label><input id="pActualSales" type="number" readonly style="background:#F2FCF9" /></div>
      </div>
      <div class="form-2col">
        <div class="field"><label>已售基数</label><input id="pManualSales" type="number" min="0" step="1" /></div>
      </div>
      <div class="form-2col">
        <div class="field"><label>积分抵扣</label><select id="pPointsDeduct"><option value="follow">跟随全局规则</option><option value="on">开启（可使用积分抵扣）</option><option value="off">关闭（不可使用积分抵扣）</option></select></div>
        <div class="field"><label>抵扣上限（订单金额 %，留空跟随全局）</label><input id="pPointsCap" type="number" min="1" max="100" placeholder="例如 10" /></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeProductModal()">取消</button>
      <button class="btn btn-primary" onclick="saveProduct()">保存</button>
    </div>
  </div>
</div>

<script>
(function () {
  var M = window.AKBMallAdmin;
  var products = M.getProducts(true);
  var categories = M.getCategories();
  var selectedId = categories[0] ? categories[0].id : '';
  var editingId = '';
  var selectedTone = 'purple';
  var TONES = [
    { id: 'purple', bg: '#F0E9FA', fg: '#17BFA3' },
    { id: 'blue', bg: '#EAF3FF', fg: '#397EBA' },
    { id: 'green', bg: '#E7F7EF', fg: '#31956B' },
    { id: 'orange', bg: '#FFF3E1', fg: '#C17A24' },
    { id: 'red', bg: '#FDEDED', fg: '#C34F55' }
  ];

  document.getElementById('topDate').textContent =
    (new Date()).getFullYear() + '年' + (new Date().getMonth() + 1) + '月' + new Date().getDate() + '日';

  function persistProducts() { M.saveProducts(products); }
  function persistCategories() { M.saveCategories(categories); }

  function productsOf(catId) {
    return products.filter(function (p) { return p.category === catId; });
  }
  function thumb(p) {
    var fallback = (p.name || '商').slice(0, 1);
    var src = p.cover || p.image;
    var img = src ? '<img src="' + M.esc(src) + '" alt="" onerror="this.remove()">' : '';
    return '<div class="pdt-thumb tone-' + (p.tone || 'purple') + '">' + img + fallback + '</div>';
  }

  function stockCell(p) {
    if (p.status === 'off') return '<span class="stock-ok" style="color:#94A3B8">—</span>';
    if (p.stock <= 0) return '<span class="stock-out">缺货</span>';
    if (p.stock < 30) return '<span class="stock-warn">' + p.stock + ' · 预警</span>';
    return '<span class="stock-ok">' + p.stock + '</span>';
  }

  /* ── Toast 提示 ── */
  function showToast(msg){
    var t=document.createElement('div');t.style.cssText='position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:rgba(23,32,51,.92);color:#fff;padding:9px 16px;border-radius:18px;font-size:12px;font-weight:700;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none';
    t.textContent=msg;document.body.appendChild(t);
    setTimeout(function(){t.style.opacity='1'},10);
    setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove()},200)},2000);
  }

  /* ── 分类列表 ── */
  function renderCategories() {
    categories.sort(function (a, b) { return a.sort - b.sort; });
    document.getElementById('categoryList').innerHTML = categories.map(function (c) {
      var n = productsOf(c.id).length;
      var onSale = productsOf(c.id).filter(function (p) { return p.status === 'on'; }).length;
      return '<div class="category-item ' + (c.id === selectedId ? 'active' : '') + '" onclick="selectCategory(\'' + M.esc(c.id) + '\')">' +
        '<div class="cat-row"><span class="cat-name">' + M.esc(c.name) + '</span>' +
        '<span class="cat-status ' + (c.status === 'on' ? '' : 'off') + '">' + (c.status === 'on' ? '已启用' : '已停用') + '</span></div>' +
        '<div class="cat-meta">' + n + ' 款商品（在售 ' + onSale + '）· 排序 ' + c.sort + (c.description ? '<br>' + M.esc(c.description) : '') + '</div>' +
        '<div class="cat-ops"><button onclick="event.stopPropagation();openCategoryModal(\'' + M.esc(c.id) + '\')">编辑</button>' +
        '<button onclick="event.stopPropagation();toggleCategory(\'' + M.esc(c.id) + '\')">' + (c.status === 'on' ? '停用' : '启用') + '</button></div>' +
      '</div>';
    }).join('');
  }

  window.selectCategory = function (id) {
    selectedId = id;
    renderCategories();
    document.getElementById('fCategory').value = id;
    render();
  };

  window.toggleCategory = function (id) {
    var c = categories.filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    c.status = c.status === 'on' ? 'off' : 'on';
    persistCategories(); renderCategories(); render();
  };

  window.openCategoryModal = function (id) {
    editingId = id || '';
    var c = id ? categories.filter(function (x) { return x.id === id; })[0] : null;
    document.getElementById('modalTitle').textContent = c ? '编辑分类' : '新增分类';
    document.getElementById('cName').value = c ? c.name : '';
    document.getElementById('cDesc').value = c ? (c.description || '') : '';
    document.getElementById('cSort').value = c ? c.sort : categories.length + 1;
    document.getElementById('cStatus').value = c ? c.status : 'on';
    document.getElementById('categoryModal').classList.add('show');
  };
  window.closeCategoryModal = function () { document.getElementById('categoryModal').classList.remove('show'); };

  window.saveCategory = function () {
    var name = document.getElementById('cName').value.trim();
    if (!name) { showToast('请填写分类名称'); return; }
    var data = {
      name: name,
      description: document.getElementById('cDesc').value.trim(),
      sort: Math.max(1, parseInt(document.getElementById('cSort').value || '99', 10) || 99),
      status: document.getElementById('cStatus').value
    };
    if (editingId) {
      var c = categories.filter(function (x) { return x.id === editingId; })[0];
      if (c) Object.assign(c, data);
    } else {
      data.id = 'cat-' + Date.now();
      categories.push(data);
      selectedId = data.id;
    }
    persistCategories(); closeCategoryModal(); renderCategories(); render();
  };

  /* ── 统计卡 ── */
  function renderMetrics() {
    var on = products.filter(function (p) { return p.status === 'on'; });
    var offCount = products.length - on.length;
    var low = on.filter(function (p) { return p.stock < 30; });
    var cards = [
      { v: products.length, l: '全部商品', f: '共 ' + M.getCategories().length + ' 个分类', c: 'muted', k: 'all' },
      { v: on.length, l: '已上架', f: '小程序端正常展示', c: 'up', k: 'on' },
      { v: offCount, l: '已下架', f: offCount ? '有商品待处理' : '暂无下架商品', c: offCount ? 'warn' : 'muted', k: 'off' },
      { v: low.length, l: '库存预警（<30）', f: low.length ? '请及时补货' : '库存充足', c: low.length ? 'danger' : 'muted', k: 'low' }
    ];
    document.getElementById('metricCards').innerHTML = cards.map(function (c) {
      return '<a class="mall-metric" href="javascript:void(0)" onclick="setQuickFilter(\'' + c.k + '\')"><div class="mm-ico" style="background:#DDF7F1"><svg viewBox="0 0 22 22" fill="none"><path d="M3 7l6-3.5L15 7l-6 3.5L3 7zM9 10.5V16M15 7v5M21 10.5v5l-6 3v-5" stroke="#1CD8B7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>' +
        '<div><div class="mm-val">' + c.v + '</div><div class="mm-lbl">' + c.l + '</div><div class="mm-foot ' + c.c + '">' + c.f + '</div></div></a>';
    }).join('');
  }

  window.setQuickFilter = function (k) {
    document.getElementById('fStatus').value = k === 'all' ? 'all' : k;
    render();
  };

  function fillCategorySelects() {
    var all = M.getCategories();
    var filterOpts = all.filter(function (c) { return c.status === 'on'; }).map(function (c) {
      return '<option value="' + M.esc(c.id) + '">' + M.esc(c.name) + '</option>';
    }).join('');
    var formOpts = all.map(function (c) {
      return '<option value="' + M.esc(c.id) + '">' + M.esc(c.name) + (c.status === 'off' ? '（已下架）' : '') + '</option>';
    }).join('');
    document.getElementById('fCategory').innerHTML = '<option value="all">全部分类</option>' + filterOpts;
    document.getElementById('pCategory').innerHTML = formOpts;
  }

  /* ── 积分抵扣列 + 批量勾选 ── */
  var selected = {};
  var viewIds = [];

  function pointsCell(p) {
    var cfg = window.AKBPointsAdmin.getConfig();
    var mode = p.pointsDeduct || 'follow';
    var on = mode === 'on' ? true : mode === 'off' ? false : cfg.mallEnabled;
    var cap = p.pointsCap != null ? p.pointsCap : cfg.mallCapPercent;
    if (!on) return '<span class="pt-badge off">关闭</span><div class="pt-sub">' + (mode === 'off' ? '单品关闭，不可抵扣' : '跟随全局（全局未开启）') + '</div>';
    return '<span class="pt-badge on">开启</span><div class="pt-sub">' + (mode === 'follow' ? '跟随全局' : '单品设置') + ' · 上限 ' + cap + '%</div>';
  }

  function syncSelectionUi() {
    var n = Object.keys(selected).length;
    var chip = document.getElementById('selChip');
    chip.classList.toggle('show', n > 0);
    document.getElementById('selChipText').textContent = '已选 ' + n + ' 款商品';
    document.getElementById('ckAll').checked = viewIds.length > 0 && viewIds.every(function (id) { return selected[id]; });
  }

  window.toggleSel = function (id, checked) {
    if (checked) selected[id] = true; else delete selected[id];
    syncSelectionUi();
  };
  window.toggleAll = function (ck) {
    viewIds.forEach(function (id) { if (ck.checked) selected[id] = true; else delete selected[id]; });
    syncSelectionUi(); render();
  };
  window.clearSelection = function () { selected = {}; syncSelectionUi(); render(); };

  window.openBatchPoints = function () {
    var ids = Object.keys(selected);
    if (!ids.length) { showToast('请先在列表中勾选要设置的商品，再进行批量设置'); return; }
    var first = products.filter(function (p) { return selected[p.id]; })[0] || {};
    window.openBatchPointsModal({
      countLabel: '将对 <b>' + ids.length + '</b> 款已勾选商品应用相同的积分抵扣设置',
      deduct: first.pointsDeduct || 'follow',
      cap: first.pointsCap != null ? first.pointsCap : '',
      onApply: function (v) {
        products.forEach(function (p) {
          if (!selected[p.id]) return;
          p.pointsDeduct = v.deduct;
          p.pointsCap = v.cap;
        });
        persistProducts(); render();
      }
    });
  };

  /* ── 商品列表 ── */
  function render() {
    var cat = document.getElementById('fCategory').value;
    var st = document.getElementById('fStatus').value;
    var kw = document.getElementById('fSearch').value.trim().toLowerCase();
    var catObj = categories.filter(function (c) { return c.id === cat; })[0];
    document.getElementById('offTip').style.display = catObj && catObj.status === 'off' ? 'block' : 'none';
    document.getElementById('panelTitle').textContent = catObj ? catObj.name + ' · 商品' : '商品管理';
    var list = products.filter(function (p) {
      if (cat !== 'all' && p.category !== cat) return false;
      if (st === 'on' && p.status !== 'on') return false;
      if (st === 'off' && p.status !== 'off') return false;
      if (st === 'low' && !(p.status === 'on' && p.stock < 30)) return false;
      if (kw && (p.name + p.sub).toLowerCase().indexOf(kw) === -1) return false;
      return true;
    }).sort(function (a, b) { return a.sort - b.sort; });
    viewIds = list.map(function (p) { return p.id; });
    document.getElementById('count').textContent = list.length;
    document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
    document.getElementById('rows').innerHTML = list.map(function (p) {
      return '<tr>' +
        '<td><input type="checkbox" class="ck" ' + (selected[p.id] ? 'checked' : '') + ' onchange="toggleSel(\'' + M.esc(p.id) + '\', this.checked)"></td>' +
        '<td><div class="pdt-cell">' + thumb(p) +
          '<div style="min-width:0"><div class="pdt-name">' + M.esc(p.name) + (p.badge ? '<span class="pdt-badge">' + M.esc(p.badge) + '</span>' : '') + '</div>' +
          '<div class="pdt-sub">' + M.esc(p.sub || '—') + '</div></div></div></td>' +
        '<td><span class="cat-chip">' + M.esc(M.categoryName(p.category)) + '</span></td>' +
        '<td class="price-cell">' + M.money(p.price) + '</td>' +
        '<td>' + stockCell(p) + '</td>' +
        '<td><div style="font-weight:700;color:#172033">' + ((p.manualSales || 0) + (p.actualSales || 0)) + ' 件</div><div class="pt-sub">已售基数 ' + (p.manualSales || 0) + ' + 实际已售 ' + (p.actualSales || 0) + '</div></td>' +
        '<td>' + pointsCell(p) + '</td>' +
        '<td style="color:#657087;font-weight:700">' + p.sort + '</td>' +
        '<td><button class="status-btn ' + p.status + '" onclick="toggleStatus(\'' + M.esc(p.id) + '\')">' + (p.status === 'on' ? '已上架' : '已下架') + '</button></td>' +
        '<td><div class="op"><button onclick="openProductModal(\'' + M.esc(p.id) + '\')">编辑</button>' +
          '<button onclick="toggleStatus(\'' + M.esc(p.id) + '\')">' + (p.status === 'on' ? '下架' : '上架') + '</button>' +
          '<button class="danger" style="color:#DC2626" onclick="removeProduct(\'' + M.esc(p.id) + '\')">删除</button></div></td>' +
      '</tr>';
    }).join('');
    syncSelectionUi();
  }

  window.toggleStatus = function (id) {
    var p = products.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    p.status = p.status === 'on' ? 'off' : 'on';
    persistProducts(); renderMetrics(); render(); renderCategories();
  };

  window.removeProduct = async function (id) {
    var p = products.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    if (!await showConfirm('确认删除商品「' + p.name + '」？删除后小程序商城将不再展示。', { danger: true, okText: '删除' })) return;
    delete selected[id];
    products = products.filter(function (x) { return x.id !== id; });
    persistProducts(); renderMetrics(); render(); renderCategories();
  };

  /* ── 商品弹窗 ── */
  function renderToneSwatches() {
    document.getElementById('pTone').innerHTML = TONES.map(function (t) {
      return '<div class="tone-swatch ' + (t.id === selectedTone ? 'sel' : '') + '" style="background:' + t.bg + ';color:' + t.fg + '" onclick="selectTone(\'' + t.id + '\')">温</div>';
    }).join('');
  }
  window.selectTone = function (id) { selectedTone = id; renderToneSwatches(); };

  var COVER_MAX=5,coverList=[],_cvDrag=null;
  window.getCoverList=function(){return coverList;};
  function cvTip(msg){var t=document.getElementById('cvTipEl');if(!t){t=document.createElement('div');t.id='cvTipEl';t.style.cssText='position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:rgba(23,32,51,.92);color:#fff;padding:9px 16px;border-radius:18px;font-size:12px;font-weight:700;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none';document.body.appendChild(t);}t.textContent=msg;t.style.opacity='1';clearTimeout(t._tm);t._tm=setTimeout(function(){t.style.opacity='0';},1800);}
  function akbResizeImage(file,cb){var reader=new FileReader();reader.onload=function(){var img=new Image();img.onload=function(){var max=640,w=img.width,h=img.height,sc=Math.min(1,max/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));try{c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82));}catch(e){cb(reader.result);}};img.onerror=function(){cb(reader.result);};img.src=reader.result;};reader.readAsDataURL(file);}
  function renderCovers(){var box=document.getElementById('pCoverThumbs');if(box){box.innerHTML=coverList.map(function(src,i){return '<div class="cv-item'+(i===0?' cv-primary':'')+'" draggable="true" data-i="'+i+'" ondragstart="cvDragStart(event,'+i+')" ondragover="cvDragOver(event)" ondrop="cvDrop(event,'+i+')"><img src="'+src+'" alt="封面'+(i+1)+'">'+(i===0?'<span class="cv-main">主图</span>':'')+'<button type="button" class="cv-del" title="删除" onclick="cvRemove('+i+')">×</button><span class="cv-idx">'+(i+1)+'</span></div>';}).join('')+(coverList.length<COVER_MAX?'<button type="button" class="cv-add" title="添加封面图" onclick="document.getElementById(\''+'pCoverFile'+'\').click()">＋<span>添加</span></button>':'')+'<span class="cv-count">已上传 '+coverList.length+'/'+COVER_MAX+' 张 · 拖动图片可调整顺序</span>';}document.getElementById('pCover').value=coverList[0]||'';}
  window.setCovers=function(arr){coverList=(arr||[]).filter(function(x){return typeof x==='string'&&x;}).slice(0,COVER_MAX);renderCovers();};
  window.onCoverFile =function(input){var files=[].slice.call(input.files||[]),room=COVER_MAX-coverList.length;if(!files.length){input.value='';return;}if(files.length>room){cvTip('最多上传 '+COVER_MAX+' 张封面图，已保留前 '+room+' 张');}files.slice(0,room).forEach(function(f){akbResizeImage(f,function(data){if(coverList.length>=COVER_MAX)return;coverList.push(data);renderCovers();});});input.value='';};
  window.cvRemove=function(i){coverList.splice(i,1);renderCovers();};
  window.cvDragStart=function(e,i){_cvDrag=i;if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(i));}catch(err){}}};
  window.cvDragOver=function(e){if(_cvDrag!=null){e.preventDefault();}};
  window.cvDrop=function(e,i){e.preventDefault();if(_cvDrag==null||_cvDrag===i){_cvDrag=null;return;}var m=coverList.splice(_cvDrag,1)[0];coverList.splice(i,0,m);_cvDrag=null;renderCovers();};
  window.clearCover=function(){setCovers([]);};

  window.pCmd = function (command, arg) {
    document.getElementById('pDetailArea').focus();
    document.execCommand(command, false, arg || null);
  };
  window.pInsertImageUrl = function () {
    var url = window.prompt('请输入图片链接（https://…）', 'https://');
    if (!url || url === 'https://') return;
    pCmd('insertImage', url);
  };
  window.pInsertImageFile = function (input) {
    var file = input.files && input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () { pCmd('insertImage', reader.result); };
    reader.readAsDataURL(file);
    input.value = '';
  };

  function renderPoints(points) {
    var list = points && points.length ? points : [''];
    document.getElementById('pPoints').innerHTML = list.map(function (pt, i) {
      return '<div class="point-row"><input value="' + M.esc(pt) + '" placeholder="特点 ' + (i + 1) + '，如：测量便捷，适合老人使用" /><button type="button" onclick="removePointRow(this)">−</button></div>';
    }).join('');
  }
  window.addPointRow = function () {
    var box = document.getElementById('pPoints');
    var div = document.createElement('div');
    div.className = 'point-row';
    var i = box.children.length + 1;
    div.innerHTML = '<input value="" placeholder="特点 ' + i + '" /><button type="button" onclick="removePointRow(this)">−</button>';
    box.appendChild(div);
    div.querySelector('input').focus();
  };
  window.removePointRow = function (btn) {
    var box = document.getElementById('pPoints');
    if (box.children.length <= 1) { btn.previousElementSibling.value = ''; return; }
    btn.parentElement.remove();
  };

  window.openProductModal = function (id) {
    editingId = id || '';
    var p = id ? products.filter(function (x) { return x.id === id; })[0] : null;
    document.getElementById('modalTitle').textContent = p ? '编辑商品' : '新增商品';
    fillCategorySelects();
    document.getElementById('pName').value = p ? p.name : '';
    document.getElementById('pCategory').value = p ? p.category : (M.getCategories()[0] || {}).id;
    document.getElementById('pSub').value = p ? (p.sub || '') : '';
    document.getElementById('pPrice').value = p ? p.price : '';
    document.getElementById('pStock').value = p ? p.stock : 100;
    document.getElementById('pSort').value = p ? p.sort : products.length + 1;
    document.getElementById('pBadge').value = p ? (p.badge || '') : '';
    document.getElementById('pImage').value = p ? (p.image || '') : '';
    setCovers(p ? ((p.coverGallery && p.coverGallery.length) ? p.coverGallery : (p.cover ? [p.cover] : [])) : []);
    document.getElementById('pDetailArea').innerHTML = p ? (p.detailHtml || '') : '';
    document.getElementById('pDesc').value = p ? (p.desc || '') : '';
    document.getElementById('pStatus').value = p ? p.status : 'on';
    document.getElementById('pActualSales').value = p ? (p.actualSales || 0) : 0;
    document.getElementById('pManualSales').value = p ? (p.manualSales != null ? p.manualSales : (p.sales || 0)) : 0;
    selectedTone = p ? (p.tone || 'purple') : 'purple';
    renderToneSwatches();
    renderPoints(p ? p.points : null);
    document.getElementById('pPointsDeduct').value = p ? (p.pointsDeduct || 'follow') : 'follow';
    document.getElementById('pPointsCap').value = p && p.pointsCap != null ? p.pointsCap : '';
    document.getElementById('productModal').classList.add('show');
  };
  window.closeProductModal = function () { document.getElementById('productModal').classList.remove('show'); };

  window.saveProduct = function () {
    var name = document.getElementById('pName').value.trim();
    var category = document.getElementById('pCategory').value;
    var price = Number(document.getElementById('pPrice').value);
    if (!name) { showToast('请填写商品名称'); return; }
    if (!category) { showToast('请选择所属分类'); return; }
    if (!(price >= 0) || document.getElementById('pPrice').value === '') { showToast('请填写正确的售价'); return; }
    var points = [].map.call(document.querySelectorAll('#pPoints input'), function (i) { return i.value.trim(); }).filter(Boolean);
    var data = {
      name: name,
      category: category,
      sub: document.getElementById('pSub').value.trim(),
      price: Math.round(price * 100) / 100,
      stock: Math.max(0, parseInt(document.getElementById('pStock').value || '0', 10) || 0),
      sort: Math.max(1, parseInt(document.getElementById('pSort').value || '99', 10) || 99),
      badge: document.getElementById('pBadge').value.trim(),
      image: document.getElementById('pImage').value.trim(),
      cover: coverList[0] || '',
      coverGallery: coverList.slice(0, 5),
      detailHtml: document.getElementById('pDetailArea').innerHTML.trim(),
      desc: document.getElementById('pDesc').value.trim(),
      status: document.getElementById('pStatus').value,
      sales: Math.max(0, parseInt(document.getElementById('pManualSales').value || '0', 10) || 0),
      manualSales: Math.max(0, parseInt(document.getElementById('pManualSales').value || '0', 10) || 0),
      tone: selectedTone,
      points: points,
      pointsDeduct: document.getElementById('pPointsDeduct').value,
      pointsCap: document.getElementById('pPointsCap').value.trim() === '' ? null : Number(document.getElementById('pPointsCap').value),
      icon: 'generic'
    };
    if (editingId) {
      var p = products.filter(function (x) { return x.id === editingId; })[0];
      if (p) { data.id = p.id; data.icon = p.icon || 'generic'; Object.assign(p, data); }
    } else {
      data.id = 'p-' + Date.now();
      products.push(data);
    }
    persistProducts(); closeProductModal(); renderMetrics(); render(); renderCategories();
  };

  document.getElementById('fCategory').onchange = render;
  document.getElementById('fStatus').onchange = render;
  document.getElementById('fSearch').oninput = render;

  /* 初始化 */
  fillCategorySelects();
  renderCategories();
  renderMetrics();
  render();
  if (new URLSearchParams(location.search).get('new') === '1') window.openProductModal();
})();
</script>
<script src="admin-batch-points.js"></script>
</body>
</html>

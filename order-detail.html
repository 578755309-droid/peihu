  function render(){document.getElementById('detail').innerHTML='<section class="hero"><span class="hero-tag">'+esc(order.type)+'</span><div class="hero-title">'+esc(order.project)+'</div><div class="hero-desc">'+esc(order.desc)+'</div></section><section class="state-card"><div class="state-icon">'+stateIcon()+'</div><div><div class="state-title">'+esc(order.state)+'</div><div class="state-desc">'+esc(order.stateDesc)+'</div></div></section><section class="section-card"><div class="section-title">就诊地址</div><div class="info-box"><div class="location-main">'+esc(order.location)+'<span class="location-tag">'+esc(order.locationType)+'</span></div><div class="location-line">'+esc(order.address)+'</div><div class="location-line">'+esc(order.contact)+'</div></div></section><section class="section-card"><div class="section-title">就诊人信息</div><div class="patient-box"><div><span class="patient-name">'+esc(order.patient)+'</span><span class="patient-meta">'+esc(order.patientMeta)+'</span></div><div class="patient-sub">'+esc(order.patientSub)+'</div></div></section><section class="section-card"><div class="section-title">服务人员</div><div class="caregiver-box"><div class="caregiver-avatar">'+esc(order.caregiver.slice(0,1))+'</div><div class="caregiver-main"><div class="caregiver-name">'+esc(order.caregiver)+'</div><div class="caregiver-meta">'+esc(order.caregiverMeta)+'</div><div class="chips"><span class="chip">'+esc(order.cert)+'</span><span class="chip blue">'+esc(order.years)+'</span></div></div><button class="call" onclick="alert(\'护理员电话：138****2468\')" aria-label="联系服务人员">'+phoneIcon()+'</button></div></section><section class="section-card"><div class="section-title">服务信息</div><div class="info-list"><div class="info-row"><span class="info-key">订单号</span><span class="info-val">'+esc(order.no)+'</span></div><div class="info-row"><span class="info-key">下单时间</span><span class="info-val">'+esc(order.orderTime)+'</span></div><div class="info-row"><span class="info-key">服务内容</span><span class="info-val">'+esc(order.serviceContent)+'</span></div><div class="info-row"><span class="info-key">服务地址</span><span class="info-val">'+esc(order.serviceAddress)+'</span></div><div class="info-row"><span class="info-key">服务时间</span><span class="info-val">'+esc(order.serviceTime)+'</span></div></div></section><section class="section-card"><div class="section-title">费用信息</div><div class="fee-list"><div class="fee-row"><span>服务费用</span><strong>'+esc(order.unit)+'</strong></div><div class="fee-row"><span>服务天数 / 次数</span><strong>'+esc(order.days)+'</strong></div><div class="fee-row"><span>积分抵扣</span><strong>'+esc(order.discount)+'</strong></div></div><div class="fee-total"><span>合计金额</span><strong>¥ '+esc(order.total.replace('¥',''))+'</strong></div></section>'}
  function renderActions(){const box=document.getElementById('actions');let html='<button class="ghost" onclick="location.href=\'orders.html\'">返回订单</button>';if(order.state==='待支付')html+='<button class="primary" onclick="alert(\'请在订单页完成支付\')">立即支付</button>';else if(order.state==='服务中')html+='<button class="ghost" onclick="location.href=\'daily-report.html\'">查看日报</button><button class="primary" onclick="alert(\'护理员电话：138****2468\')">联系护理员</button>';else if(order.state==='待服务'){const cRec=window.AKBContract&&window.AKBContract.recordFor(order.no);if(cRec)html+=cRec.status==='已签署'?'<button class="ghost" onclick="location.href=\'contract.html?no='+encodeURIComponent(order.no)+'\'">查看电子合同</button>':'<button class="primary" onclick="location.href=\'contract.html?no='+encodeURIComponent(order.no)+'\'">签署电子合同</button>';html+='<button class="'+(cRec&&cRec.status!=='已签署'?'ghost':'primary')+'" onclick="alert(\'护理员电话：138****2468\')">联系护理员</button>';}else {const saved=readDetailRatings()[order.no];html+=saved?'<button class="rating-action done" type="button" disabled>已评价 '+saved.stars+'</button>':'<button class="rating-action" type="button" onclick="location.href=\'service-review.html?no='+encodeURIComponent(order.no)+'\'">服务评价</button>';html+='<button class="primary" onclick="location.href=\'home.html\'">再次预约</button>';}box.innerHTML=html}
  function appendPatientNeeds(){const box=document.querySelector('.patient-box');if(!box)return;box.insertAdjacentHTML('beforeend','<div class="patient-needs"><div class="patient-need"><span class="patient-need-label">患者自理等级</span><span class="patient-need-value">'+esc(careNeed.selfCare)+'</span></div><div class="patient-need"><span class="patient-need-label">有无管路</span><span class="patient-need-value">'+esc(careNeed.tubes)+'</span></div><div class="patient-need"><span class="patient-need-label">有无传染性疾病</span><span class="patient-need-value">'+esc(careNeed.infectious)+'</span></div></div>')}
  render();appendPatientNeeds();renderActions();
</script>

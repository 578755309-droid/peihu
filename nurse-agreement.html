</head><body data-surface="mobile" data-page="nurse-agreement"><main class="page"><header class="head"><button class="back" onclick="history.back()" aria-label="返回">‹</button><span class="title">合同 / 服务协议</span></header><section class="body"><div class="status">当前协议有效 · 最近更新 2026-03-01</div><article class="doc"><h2>护理员合作服务协议</h2><h3>一、服务范围</h3><p>护理员按照平台派单信息，为客户提供住院陪护、术后护理、生活照料及相关护理记录服务。</p><h3>二、服务规范</h3><ul><li>按订单约定时间准时到岗并完成交接。</li><li>按照护理任务清单执行服务，及时填写护理日志。</li><li>涉及患者异常情况时，及时联系家属和平台。</li></ul><h3>三、记录与隐私</h3><p>护理记录、现场照片和服务报告仅用于订单服务、质量复核和家属查看，平台按隐私政策进行管理。</p><h3>四、协议状态</h3><p>本协议自审核通过之日起生效，服务关系结束或协议变更时以平台最新记录为准。</p></article></section></main></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
<script src="common-ui.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>服务地址 · 佑小邦</title>
  <style>
    .phone{position:relative}
    :root{--purple:#8655C5;--purple-dark:#6B3FAA;--purple-light:#EDE6F7;--purple-bg:#F5F3FA;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--red:#EF4444;--sh:0 2px 16px rgba(100,60,160,.08);--r-lg:20px}
    *{box-sizing:border-box;margin:0;padding:0} body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}.frame{display:flex;justify-content:center;min-height:100vh;background:#E4DDF0}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg)}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:42px;overflow:hidden;box-shadow:0 24px 72px rgba(80,40,140,.22)}}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;background:linear-gradient(135deg,#8655C5,#6B3FAA)}.status-bar span{font-size:12px;font-weight:700;color:#fff}.status-right{display:flex;gap:5px;align-items:center}.nav{height:58px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff;border-bottom:1px solid var(--border)}.nav h1{font-size:18px;font-weight:900}.back{position:absolute;left:16px;width:34px;height:34px;border:0;background:var(--purple-light);border-radius:11px;color:var(--purple);display:grid;place-items:center;cursor:pointer}.back svg{width:18px;height:18px}.scroll{flex:1;overflow:auto;padding:16px 14px 90px}.hint{font-size:12px;color:var(--text3);margin:2px 4px 12px}.address-card{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:12px;border:1.5px solid transparent}.address-card.default{border-color:#B99BE3}.card-top{display:flex;align-items:center;gap:8px}.label{font-size:16px;font-weight:900}.default-tag{font-size:10px;color:var(--purple);background:var(--purple-light);border-radius:20px;padding:3px 8px;font-weight:800}.contact{margin-left:auto;font-size:12px;color:var(--text2)}.detail{margin-top:9px;font-size:13px;color:var(--text2);line-height:1.5}.region{font-size:12px;color:var(--text3);margin-top:4px}.card-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--border)}.card-foot button{border:0;border-radius:9px;padding:7px 12px;font:700 12px inherit;color:var(--purple);background:var(--purple-light);cursor:pointer}.card-foot .danger{color:var(--red);background:#FEE2E2}.card-foot .plain{color:var(--text2);background:#F4F2F8}.empty{text-align:center;color:var(--text3);padding:70px 0;font-size:13px}.add-btn{position:absolute;bottom:22px;left:14px;right:14px;height:46px;border:0;border-radius:15px;background:linear-gradient(135deg,#9161D3,#7547B7);color:#fff;font:800 15px inherit;box-shadow:0 8px 20px rgba(107,63,170,.28);cursor:pointer}
  </style>
</head>
<body><div class="frame"><div class="phone">
  <div class="status-bar"><span>9:41</span><div class="status-right"><span>▮▮▮</span><span>▰</span></div></div>
  <header class="nav"><button class="back" onclick="history.length>1?history.back():location.href='profile.html'" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>服务地址</h1></header>
  <main class="scroll"><div class="hint">维护家与医院服务地址，下单时按服务类型直接选择</div><div id="list"></div></main>
  <button class="add-btn" onclick="location.href='address-edit.html?return=addresses'">＋ 添加服务地址</button>
</div></div>
<script>
  const KEY='ankebang_saved_addresses';
  const defaults=[{id:1,detail:'北京市朝阳区望京街道 88 号 2 单元 1602',region:'北京市 朝阳区',contact:'张女士',phone:'138****2468',isDefault:true,addressType:'home'},{id:2,detail:'北京市朝阳区建国路 66 号 北京协和医院东院区',region:'北京市 东城区',contact:'张女士',phone:'138****2468',isDefault:false,addressType:'hospital'}];
  function data(){try{const v=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(v))return defaults.slice();const list=v.map(a=>({...a,addressType:a.addressType||'home'}));if(!list.some(a=>a.addressType==='hospital'))list.push(defaults[1]);return list}catch(e){return defaults.slice()}}
  function save(v){localStorage.setItem(KEY,JSON.stringify(v))}
  function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
  function render(){const box=document.getElementById('list'), list=data(); if(!list.length){box.innerHTML='<div class="empty">还没有保存服务地址<br>点击下方按钮添加一个吧</div>';return} box.innerHTML=list.map(a=>{const raw=a.contact||'';const phone=(a.phone||raw.split('·')[1]||'').trim();const contact=(a.phone?raw:(raw.split('·')[0]||raw)).trim();const type=a.addressType==='hospital'?'医院':'家';return '<article class="address-card '+(a.isDefault?'default':'')+'"><div class="card-top"><span class="default-tag">'+type+'</span>'+(a.isDefault?'<span class="default-tag">默认</span>':'')+'<span class="contact">'+esc(contact)+'　'+esc(phone)+'</span></div><div class="detail">'+esc(a.detail||'')+'</div><div class="region">'+esc(a.region||'')+'</div><div class="card-foot">'+(!a.isDefault?'<button class="plain" onclick="setDefault('+a.id+')">设为默认</button>':'')+'<button onclick="edit('+a.id+')">编辑</button><button class="danger" onclick="removeAddress('+a.id+')">删除</button></div></article>'}).join('')}
  function edit(id){location.href='address-edit.html?return=addresses&id='+encodeURIComponent(id)}
  function setDefault(id){const list=data().map(a=>({...a,isDefault:String(a.id)===String(id)}));save(list);render()}
  async function removeAddress(id){if(!await showConfirm('确认删除该地址？'))return;let list=data().filter(a=>String(a.id)!==String(id));if(list.length&&!list.some(a=>a.isDefault))list[0].isDefault=true;save(list);render()}
  render();
</script></body></html>

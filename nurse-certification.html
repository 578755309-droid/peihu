  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>护理员申请认证 · 护理员端</title>
  <style>
    :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg:#F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#16A34A;--green-bg:#DCFCE7;--amber:#D97706;--amber-bg:#FEF3C7;--red:#DC2626;--red-bg:#FEE2E2;--sh:0 2px 16px rgba(0,0,0,0.1);--r-lg:12px}
    *,*:before,*:after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .frame{display:flex;justify-content:center;min-height:100vh;background:#F5F5F5}
    .phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg)}
    @media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
    .scroll{flex:1;overflow:auto}.scroll::-webkit-scrollbar{display:none}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;background:#fff;font-size:14px;font-weight:600}
    .status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:17px}
    .navbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
    .back-btn{width:36px;height:36px;border:0;border-radius:12px;background:var(--purple-light);color:var(--purple);display:grid;place-items:center;cursor:pointer}
    .back-btn svg{width:20px;height:20px}.nav-title{font-size:17px;font-weight:700}.nav-ph{width:36px}
    .content{padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:28px}
    .card{background:var(--card);border-radius:12px;box-shadow:var(--sh);overflow:hidden}
    .status-card{padding:16px}.status-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .section-title{font-size:15px;font-weight:700}
    .status-badge{padding:5px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
    .status-badge.approved{background:var(--green-bg);color:var(--green)}
    .status-badge.pending{background:var(--amber-bg);color:var(--amber)}
    .status-badge.rejected{background:var(--red-bg);color:var(--red)}
    .status-desc{margin-top:9px;color:var(--text2);font-size:13px;line-height:1.55}
    .status-meta{margin-top:9px;color:var(--text3);font-size:12px}
    .reason{margin-top:11px;padding:10px 11px;border-radius:12px;background:var(--red-bg);color:#991B1B;font-size:12px;line-height:1.5}
    .card-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 11px;border-bottom:1px solid var(--border)}
    .card-action{border:0;background:none;color:var(--purple);font:800 12px inherit;cursor:pointer}
    .info-list{padding:13px 16px 16px;display:flex;flex-direction:column;gap:9px}
    .info-row{display:flex;justify-content:space-between;gap:12px;font-size:13px}
    .info-row .k{color:var(--text3);flex-shrink:0}
    .info-row .v{color:var(--text);font-weight:600;text-align:right;word-break:break-all}
    .chip-row{display:flex;flex-wrap:wrap;gap:7px}
    .chip{padding:4px 9px;border-radius:12px;background:var(--purple-light);color:var(--purple-dark);font-size:12px;font-weight:600}
    .cert-brief{display:flex;align-items:center;gap:9px;padding:10px;border-radius:12px;background:#FAF9FD}
    .cert-brief .ico{width:30px;height:30px;border-radius:12px;display:grid;place-items:center;background:var(--purple-light);color:var(--purple);font-size:13px;font-weight:700;flex-shrink:0}
    .cert-brief .nm{font-size:13px;font-weight:600}
    .cert-brief .sub{margin-top:2px;color:var(--text3);font-size:11px}
    /* 表单 */
    .form{padding:4px 16px 16px}
    .form-banner{margin-bottom:10px;padding:10px 11px;border-radius:12px;font-size:12px;line-height:1.5;background:var(--amber-bg);color:#92400E}
    .form-banner.red{background:var(--red-bg);color:#991B1B}
    .form-sec{margin:13px 0 4px;display:flex;align-items:center;gap:7px;font-size:14px;font-weight:700}
    .form-sec:before{content:"";width:4px;height:13px;border-radius:12px;background:var(--purple)}
    .field{padding:11px 0;border-bottom:1px solid var(--border)}
    .field:last-of-type{border-bottom:0}
    .field label{display:block;color:var(--text2);font-size:12px;font-weight:600;margin-bottom:7px}
    .req{color:var(--red);margin-left:2px}
    .field input,.field select{width:100%;height:42px;border:1px solid var(--border);outline:0;border-radius:12px;padding:0 11px;background:var(--purple-bg);color:var(--text);font:700 13px inherit}
    .field input:focus,.field select:focus{border-color:#7FE9D4;box-shadow:0 0 0 3px rgba(28,216,183,.1)}
    .field input[readonly]{color:var(--text3)}
    .skill-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    /* 上面文字、下面选项：字段纵向布局，选项一行三个 */
    body[data-page="nurse-certification"] .field.field-col{flex-direction:column!important;align-items:flex-start!important;gap:8px!important;padding:12px 16px 14px!important}
    body[data-page="nurse-certification"] .field.field-col>label{flex:0 0 auto!important;max-width:100%!important}
    body[data-page="nurse-certification"] .field.field-col>.skill-grid{flex:1 1 100%;width:100%!important;grid-template-columns:repeat(3,1fr)!important}
    .skill-chip{display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border:1.5px solid var(--border);border-radius:12px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;user-select:none;white-space:nowrap}
    .skill-chip.on{border-color:var(--purple);background:var(--purple-light);color:var(--purple-dark)}
    .skill-chip input{display:none}
    .cert-item{padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:#FCFBFE}
    .cert-item .cert-name{font-size:13px;font-weight:700;margin-bottom:8px}
    .up-row{display:flex;align-items:center;gap:8px;margin-top:8px}
    .up-ico{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--purple-light);color:var(--purple);font-size:12px;font-weight:700;flex-shrink:0}
    .up-ico img{width:100%;height:100%;object-fit:cover;border-radius:12px}
    .up-name{flex:1;min-width:0;font-size:11px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .up-btn{height:30px;padding:0 11px;border:1.5px dashed #7FE9D4;border-radius:12px;background:#fff;color:var(--purple);font:800 10px inherit;cursor:pointer;white-space:nowrap}
    .err{display:none;margin-top:6px;color:var(--red);font-size:11px;font-weight:600}
    .field.invalid .err{display:block}
    .cert-item.invalid{border-color:var(--red);background:#FFF8F8}
    .cert-item.invalid .err{display:block}
    .submit{display:block;width:100%;height:46px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;font:800 14px inherit;cursor:pointer;margin-top:14px}
    .submit:active{opacity:.88}
    .form-hint{padding:0 2px 4px;color:var(--text3);font-size:11px;line-height:1.5}
    .toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);padding:17px 25px;border-radius:12px;background:rgba(25,15,45,.9);color:#fff;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:80vw;text-align:center}
    .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    /* 提交按钮固定在页面底部 */
    .form-footer{flex-shrink:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--border);box-shadow:0 -6px 18px rgba(0,0,0,.05)}
    .form-footer .submit{width:100%!important;height:46px;margin:0!important;box-shadow:none}
    /* 表单三个卡片：表单本身是 flex 容器，卡片之间留 12px 间距 */
    body[data-page="nurse-certification"] #appForm{display:flex;flex-direction:column;gap:12px}
    body[data-page="nurse-certification"] .form-card{padding:4px 0 6px}
    body[data-page="nurse-certification"] .form-card .form-sec{padding:14px 16px 6px;margin:0;font-size:15px;font-weight:700;color:var(--text)}
    body[data-page="nurse-certification"] .form-card .form-sec:before{margin-right:7px}
    body[data-page="nurse-certification"] .form-card .form-banner{margin:12px 16px 4px}
    body[data-page="nurse-certification"] .form-card .form-hint{margin:12px 16px 4px;padding:0}
    body[data-page="nurse-certification"] .form-card .cert-item{margin:10px 16px}
    /* 个人照片：左文右图，不再显示"用于审核员核对身份"解释 */
    body[data-page="nurse-certification"] .photo-row{display:flex;align-items:center;gap:12px!important;justify-content:space-between!important;flex:1 1 auto;padding:0!important}
    body[data-page="nurse-certification"] .photo-row .ph-left{display:flex;align-items:center;gap:10px;min-width:0}
    body[data-page="nurse-certification"] .photo-row .up-ico{width:44px;height:44px;border-radius:12px;flex-shrink:0}
    body[data-page="nurse-certification"] .photo-row .ph-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
    body[data-page="nurse-certification"] .photo-row .up-btn{flex-shrink:0;margin-left:auto}
    body[data-page="nurse-certification"] .photo-row .up-name{display:none!important}
  </style>

<div class="frame"><div class="phone"><main class="scroll" id="pageScroll">
  <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".28"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="currentColor" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="currentColor"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="currentColor"/></svg></div></div>
  <header class="navbar"><button class="back-btn" onclick="history.length>1?history.back():location.href='nurse-profile.html'" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M13 4.5L7.5 10 13 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="nav-title">护理员申请认证</span><span class="nav-ph"></span></header>

<script>
  /* ── 护理员申请认证：字段与后台「新增陪护员档案」统一，状态流转 未提交→审核中→审核通过/审核驳回，修改后需重新审核 ── */
  var KEY='akbNurseApplications';
  var SKILLS=['住院陪护','居家陪护','陪诊服务','上门助浴'];
  var CERT_TYPES=['护士证','毕业证','健康证'];
  function validApp(raw){return !!(raw&&typeof raw==='object'&&typeof raw.status==='string'&&raw.name);}
  function readApp(){return AKBNurseCertification.read();}
  function saveApp(){localStorage.setItem(KEY,JSON.stringify(app));}
  var app=readApp();
  var editMode=false;
  var draft=null;
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function showToast(t){ return window.AKBUI.toast(t,2200); }
  function badgeClass(st){return st==='审核通过'?'approved':(st==='审核驳回'?'rejected':'pending');}
  function parseIdNo(value){if(!/^\d{17}[\dXx]$/.test(value))return null;var y=Number(value.slice(6,10)),m=Number(value.slice(10,12)),day=Number(value.slice(12,14)),d=new Date(y,m-1,day),now=new Date();if(d.getFullYear()!==y||d.getMonth()!==m-1||d.getDate()!==day||d>now)return null;var age=now.getFullYear()-y-((now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<day))?1:0);return {age:age,gender:Number(value.charAt(16))%2?'男':'女'};}
  /* 证书上传暂存 */
  var certData=[],certPending={idx:-1,kind:''};
  var photoData='',photoName='';
  function defaultCerts(){return CERT_TYPES.map(function(t){return {type:t,certNo:'',image:'',imageName:'',fileName:'',fileSize:0};});}
  function syncCertFromApp(){certData=defaultCerts().map(function(c){var hit=((app&&app.certs)||[]).find(function(x){return x.type===c.type;});return hit?{type:c.type,certNo:hit.certNo||'',image:hit.image||'',imageName:hit.imageName||'',fileName:hit.fileName||'',fileSize:hit.fileSize||0}:c;});}
  function pickCert(i,kind){certPending={idx:i,kind:kind};var input=document.getElementById('certFile');input.accept=kind==='image'?'image/*':'image/*,.pdf,.doc,.docx';input.click();}
  window.pickPhoto=function(){certPending={idx:-1,kind:'photo'};var input=document.getElementById('certFile');input.accept='image/*';input.click();};
  function captureDraft(){var get=function(id){return (document.getElementById(id)||{}).value||'';};if(!document.getElementById('fName'))return;draft={name:get('fName'),phone:get('fPhone'),gender:get('fGender'),idNo:get('fIdNo'),age:get('fAge'),workYears:get('fYears'),employmentType:get('fEmploy'),companyName:get('fCompany'),area:get('fArea'),skills:Array.from(document.querySelectorAll('#skillGrid .skill-chip.on')).map(el=>el.textContent)};}
  function onCertFileChange(){
    captureDraft();
    var file=this.files&&this.files[0];this.value='';
    if(!file)return;
    if(file.size>5*1024*1024){showToast('文件不能超过5MB，请压缩后重试');return;}
    if(certPending.kind==='photo'){
      photoName=file.name;
      if(window.akbFitImage){window.akbFitImage(file,function(dataUrl){photoData=dataUrl;render();});}
      else{var pr=new FileReader();pr.onload=function(){photoData=pr.result;render();};pr.readAsDataURL(file);}
      return;
    }
    if(certPending.idx<0)return;
    var rec=certData[certPending.idx];if(!rec)return;
    if(certPending.kind==='image'){
      rec.imageName=file.name;rec.fileSize=file.size;
      if(window.akbFitImage){window.akbFitImage(file,function(dataUrl){rec.image=dataUrl;render();});}
      else{var reader=new FileReader();reader.onload=function(){rec.image=reader.result;render();};reader.readAsDataURL(file);}
    }else{rec.fileName=file.name;rec.fileSize=file.size;render();}
  }
  /* 表单：基础信息 / 认证与服务 / 资质证书 三个卡片，共用一个 <form> 保证校验与提交正常 */
  function buildForm(bannerHtml){
    var a=draft||app||{};
    var skillsArr=Array.isArray(a.skills)?a.skills:[];
    if(!certData.length)syncCertFromApp();
    if(!photoData&&a.photo){photoData=a.photo;photoName=a.photoName||'';}
    var certsArr=certData;
    var hdr=function(t){return '<div class="form-sec">'+t+'</div>';};
    var sec1='';
    if(bannerHtml)sec1+=bannerHtml;
    sec1+=hdr('基础信息');
    sec1+='<div class="field"><label>个人照片</label><div class="photo-row"><div class="ph-left">'+(photoData?'<span class="up-ico"><img src="'+photoData+'" alt=""></span>':'<span class="up-ico">照</span>')+'<span class="ph-name">'+(photoData?'已上传':'未上传')+'</span></div><span class="up-name">'+esc(photoName||'未上传照片，用于审核员核对身份')+'</span><button type="button" class="up-btn" onclick="pickPhoto()">'+(photoData?'重新上传':'上传照片')+'</button></div></div>';
    sec1+='<div class="field" data-f="name"><label>姓名<span class="req">*</span></label><input id="fName" value="'+esc(a.name||'')+'" placeholder="请输入真实姓名"><div class="err">请填写姓名</div></div>';
    sec1+='<div class="field" data-f="phone"><label>手机号<span class="req">*</span></label><input id="fPhone" type="tel" maxlength="11" inputmode="numeric" value="'+esc(a.phone||'')+'" placeholder="请输入11位手机号"><div class="err">请填写正确的11位手机号</div></div>';
    sec1+='<div class="field" data-f="gender"><label>性别<span class="req">*</span></label><select id="fGender"><option'+(a.gender==='女'?' selected':'')+'>女</option><option'+(a.gender==='男'?' selected':'')+'>男</option></select></div>';
    sec1+='<div class="field" data-f="idNo"><label>身份证号</label><input id="fIdNo" maxlength="18" value="'+esc(a.idNo||'')+'" placeholder="选填，用于身份认证与自动识别年龄性别" oninput="onIdNoInput()"><div class="err">请输入有效身份证号（可选），年龄需在18至70岁之间</div></div>';
    sec1+='<div class="field"><label>年龄</label><input id="fAge" type="number" min="18" max="70" value="'+esc(a.age||'')+'" placeholder="自动识别或填写"></div>';
    sec1+='<div class="field" data-f="workYears"><label>工龄<span class="req">*</span></label><input id="fYears" type="number" min="0" max="50" value="'+esc(a.workYears||'')+'" placeholder="例如：5"><div class="err">工龄需为0至50之间的整数</div></div>';
    var sec2=hdr('认证与服务');
    sec2+='<div class="field"><label>人员类型<span class="req">*</span></label><select id="fEmploy" onchange="onEmployChange()"><option value="self"'+(a.employmentType==='self'?' selected':'')+'>自营</option><option value="personal"'+(!a.employmentType||a.employmentType==='personal'?' selected':'')+'>个人</option><option value="enterprise"'+(a.employmentType==='enterprise'?' selected':'')+'>企业</option></select></div>';
    sec2+='<div class="field" data-f="company" id="fCompanyField" style="display:'+(a.employmentType==='enterprise'?'':'none')+'"><label>入驻企业单位<span class="req">*</span></label><input id="fCompany" value="'+esc(a.companyName||'')+'" placeholder="企业人员入驻的企业/单位名称"></div>';
    sec2+='<div class="field" data-f="area"><label>服务区域<span class="req">*</span></label><input id="fArea" value="'+esc(a.area||'北京市朝阳区')+'" placeholder="请输入服务区域"><div class="err">请填写服务区域</div></div>';
    sec2+='<div class="field field-col" data-f="skills"><label>服务技能<span class="req">*</span></label><div class="skill-grid skill-grid-3" id="skillGrid">'+SKILLS.map(function(s){return '<div class="skill-chip'+(skillsArr.indexOf(s)>-1?' on':'')+'" onclick="toggleSkill(this)">'+s+'</div>';}).join('')+'</div><div class="err">请至少选择一项服务技能</div></div>';
    var sec3=hdr('资质证书');
    sec3+=certsArr.map(function(c,i){
      var noInput=c.type==='护士证'?'<div class="field" style="padding:8px 0"><label>证书编号</label><input placeholder="请输入证书编号" value="'+esc(c.certNo)+'" oninput="setCertNo('+i+',this.value)"></div>':'';
      var imgIco=c.image?'<span class="up-ico"><img src="'+c.image+'" alt=""></span>':'<span class="up-ico">图</span>';
      return '<div class="cert-item" data-f="cert-'+i+'"><div class="cert-name">'+c.type+'<span class="req">*</span></div>'+noInput+
        '<div class="up-row">'+imgIco+'<span class="up-name">'+esc(c.imageName||'未上传图片')+'</span><button type="button" class="up-btn" onclick="pickCert('+i+',\'image\')">'+(c.image?'重新上传':'上传图片')+'</button></div>'+
        '<div class="up-row"><span class="up-ico">文</span><span class="up-name">'+esc(c.fileName||'未上传文件')+'</span><button type="button" class="up-btn" onclick="pickCert('+i+',\'file\')">'+(c.fileName?'重新上传':'上传文件')+'</button></div>'+
        '<div class="err">请上传'+c.type+'材料（图片或文件至少一项）</div></div>';
    }).join('');
    sec3+='<div class="form-hint">护士证、毕业证、健康证均为必填项（每证至少上传图片或文件一项）。请确保证件信息真实有效、图片清晰完整，平台仅用于资质审核。</div>';
    var html='<form id="appForm" onsubmit="submitApp(event)" novalidate>';
    html+='<section class="card form-card">'+sec1+'</section>';
    html+='<section class="card form-card">'+sec2+'</section>';
    html+='<section class="card form-card">'+sec3+'</section>';
    html+='</form>';
    return html;
  }
  function submitLabel(){return app&&app.status==='审核通过'?'保存并重新提交审核':(app&&app.status==='审核驳回'?'重新提交审核':'提交审核申请');}
  /* 底部固定提交栏：仅在表单存在时显示 */
  function syncFormFooter(){
    var footer=document.getElementById('formFooter');
    var btn=document.getElementById('footerSubmit');
    if(footer)footer.hidden=!document.getElementById('appForm');
    if(btn)btn.textContent=submitLabel();
  }
  /* 只读摘要 */
  function buildSummary(){
    var a=app;
    var typeName={self:'自营',personal:'个人',enterprise:'企业'}[a.employmentType]||'—';
    var html='<div class="info-list">';
    html+='<div class="info-row" style="display:flex;align-items:center;gap:12px"><span class="k">个人照片</span>'+(a.photo?'<img src="'+a.photo+'" alt="个人照片" style="width:52px;height:52px;border-radius:12px;object-fit:cover">':'<span class="v">未上传</span>')+'</div>';
    html+='<div class="info-row"><span class="k">姓名</span><span class="v">'+esc(a.name)+'</span></div>';
    html+='<div class="info-row"><span class="k">手机号</span><span class="v">'+esc(a.phone)+'</span></div>';
    html+='<div class="info-row"><span class="k">性别 / 年龄</span><span class="v">'+esc(a.gender)+' / '+esc(a.age||'—')+'</span></div>';
    html+='<div class="info-row"><span class="k">身份证号</span><span class="v">'+esc(a.idNo)+'</span></div>';
    html+='<div class="info-row"><span class="k">工龄</span><span class="v">'+esc(a.workYears)+' 年</span></div>';
    html+='<div class="info-row"><span class="k">人员类型</span><span class="v">'+typeName+(a.employmentType==='enterprise'&&a.companyName?' · '+esc(a.companyName):'')+'</span></div>';
    html+='<div class="info-row"><span class="k">服务区域</span><span class="v">'+esc(a.area)+'</span></div>';
    html+='<div class="info-row"><span class="k">服务技能</span><span class="v"><span class="chip-row">'+(a.skills||[]).map(function(s){return '<span class="chip">'+esc(s)+'</span>';}).join('')+'</span></span></div>';
    html+='<div class="info-row" style="display:block"><span class="k">资质证书</span><div style="margin-top:8px;display:flex;flex-direction:column;gap:8px">'+(a.certs||[]).map(function(c){
      var sub=c.type==='护士证'&&c.certNo?'证书编号 '+esc(c.certNo):'';
      var f=[c.imageName?'图片 '+esc(c.imageName):'',c.fileName?'文件 '+esc(c.fileName):''].filter(Boolean).join(' · ');
      return '<div class="cert-brief"><span class="ico">证</span><div class="cert-copy" style="min-width:0;flex:1"><div class="nm">'+esc(c.type)+'</div><div class="sub">'+(sub?esc(sub)+(f?'<br>':''):'')+(f||'未上传材料')+'</div></div></div>';
    }).join('')+'</div></div></div>';
    return html;
  }
  function statusCard(showEditBtn){
    var st=app.status;
    var cfg={
      '审核中':{cls:'pending',label:'审核中',title:'申请已提交，等待平台审核',desc:'请耐心等待平台审核，可在本页或个人中心查看审核结果。'},
      '审核通过':{cls:'approved',label:'审核通过',title:'恭喜，你的护理员认证已通过',desc:'你的档案已在平台生效，可在服务中展示。如需修改资料，修改后将重新提交审核。'},
      '审核驳回':{cls:'rejected',label:'审核驳回',title:'认证申请未通过',desc:'请根据驳回原因修改资料后重新提交。'}
    }[st];
    var html='<section class="card status-card"><div class="status-head"><span class="section-title">认证状态</span><span class="status-badge '+cfg.cls+'">'+cfg.label+'</span></div>';
    html+='<div class="status-desc">'+cfg.title+'<br>'+cfg.desc+'</div>';
    html+='<div class="status-meta">最近提交：'+esc(app.submittedAt||'—')+(app.reviewedAt?' · 审核完成：'+esc(app.reviewedAt):'')+'</div>';
    if(st==='审核驳回'){
      html+='<div class="reason"><strong>驳回原因：</strong>'+esc(app.rejectReason||'资料不完整，请补充后重新提交。')+'</div>';
      if(showEditBtn){html+='<button class="submit" type="button" onclick="startEdit()">修改资料并重新提交</button>';}
    }
    html+='</section>';
    return html;
  }
  function summaryCard(headTitle,btnText,btnFn){
    return '<section class="card"><div class="card-head"><span class="section-title">'+headTitle+'</span><button class="card-action" onclick="'+btnFn+'">'+btnText+'</button></div>'+buildSummary()+'</section>';
  }
  /* 视图渲染 */
  function render(){
    var box=document.getElementById('app');
    if(!app){
      box.innerHTML='<section class="card status-card"><div class="status-head"><span class="section-title">认证状态</span><span class="status-badge pending">未认证</span></div><div class="status-desc">你还没有提交认证申请<br>完善基础资料、认证与服务能力后提交，平台审核通过即可成为平台护理员。</div></section>'+buildForm('');
      bindFileInput();syncFormFooter();return;
    }
    var html=statusCard(!editMode);
    if(app.status==='审核中'){
      html+='<section class="card"><div class="card-head"><span class="section-title">已提交资料</span><button class="card-action" onclick="toggleSummary()">查看资料</button></div><div id="summaryBody" hidden>'+buildSummary()+'</div></section>';
    }else if(app.status==='审核通过'){
      if(editMode){
        html+=buildForm('<div class="form-banner">当前认证已通过。修改资料保存后，档案将重新提交平台审核，审核期间原认证继续有效。</div>');
      }else{
        html+=summaryCard('认证资料','修改资料','startEdit()');
      }
    }else{ /* 审核驳回 */
      if(editMode){
        html+=buildForm('<div class="form-banner red"><strong>驳回原因：</strong>'+esc(app.rejectReason||'资料不完整')+'，请修改后重新提交。</div>');
      }else{
        html+='<section class="card"><div class="card-head"><span class="section-title">申请资料</span></div>'+buildSummary()+'</section>';
      }
    }
    if(AKBNurseCertification.effective(app))html+='<a class="submit role-approved-entry" href="nurse-home.html">进入陪护端</a>';
    box.innerHTML=html;
    bindFileInput();
    syncFormFooter();
  }
  window.toggleSummary=function(){
    var b=document.getElementById('summaryBody');
    if(!b)return;
    b.hidden=!b.hidden;
    if(window.event&&window.event.target)window.event.target.textContent=b.hidden?'查看资料':'收起资料';
  };
  window.startEdit=function(){draft=null;editMode=true;syncCertFromApp();render();window.scrollTo(0,0);};
  /* 表单交互 */
  window.onIdNoInput=function(){var v=document.getElementById('fIdNo').value.trim();var p=parseIdNo(v);if(p){document.getElementById('fAge').value=p.age;document.getElementById('fGender').value=p.gender;}};
  window.onEmployChange=function(){var v=document.getElementById('fEmploy').value;document.getElementById('fCompanyField').style.display=v==='enterprise'?'':'none';if(v!=='enterprise')document.getElementById('fCompany').value='';};
  window.toggleSkill=function(el){
    el.classList.toggle('on');
    var field=el.closest('.field');if(field)field.classList.remove('invalid');
  };
  window.setCertNo=function(i,v){if(certData[i])certData[i].certNo=v;};
  function bindFileInput(){
    var input=document.getElementById('certFile');
    if(!input){input=document.createElement('input');input.type='file';input.id='certFile';input.style.display='none';document.body.appendChild(input);input.onchange=onCertFileChange;}
  }
  function markInvalid(name,msg){
    var f=document.querySelector('[data-f="'+name+'"]');
    if(!f)return;
    var first=!document.querySelector('.invalid');
    f.classList.add('invalid');
    if(first)f.scrollIntoView({behavior:'smooth',block:'center'});
  }
  window.submitApp=function(ev){
    ev.preventDefault();
    var latest=readApp();if(latest&&latest.status==='审核中'){showToast('认证申请正在审核，请勿重复提交');return;}
    var name=document.getElementById('fName').value.trim();
    var phone=document.getElementById('fPhone').value.trim();
    var gender=document.getElementById('fGender').value;
    var idNo=document.getElementById('fIdNo').value.trim();
    var age=document.getElementById('fAge').value.trim();
    var years=document.getElementById('fYears').value.trim();
    var employ=document.getElementById('fEmploy').value;
    var company=document.getElementById('fCompany').value.trim();
    var area=document.getElementById('fArea').value.trim();
    var skills=Array.prototype.map.call(document.querySelectorAll('#skillGrid .skill-chip.on'),function(el){return el.textContent.trim();});
    Array.prototype.forEach.call(document.querySelectorAll('.invalid'),function(f){f.classList.remove('invalid');});
    var ok=true;
    if(!name){markInvalid('name');ok=false;}
    if(!/^1[3-9]\d{9}$/.test(phone)){markInvalid('phone');ok=false;}
    var parsedId=parseIdNo(idNo);if(!parsedId||parsedId.age<18||parsedId.age>70){markInvalid('idNo');ok=false;}else{age=String(parsedId.age);gender=parsedId.gender;}
    if(years===''||!Number.isInteger(Number(years))||Number(years)<0||Number(years)>50){markInvalid('workYears');ok=false;}
    if(employ==='enterprise'&&!company){markInvalid('company');ok=false;}
    if(!area){markInvalid('area');ok=false;}
    if(!skills.length){markInvalid('skills');ok=false;}
    /* 护士证、毕业证、健康证三证材料必填：每证至少图片或文件一项 */
    if(!certData.length)syncCertFromApp();
    certData.forEach(function(c,i){if(!c.image&&!c.fileName){markInvalid('cert-'+i);ok=false;}});
    if(!ok){showToast('请完善标红的必填项');return;}
    var wasApproved=app&&app.status==='审核通过';
    var wasRejected=app&&app.status==='审核驳回';
    var base=app||{caregiverId:''};
    app=Object.assign({},base,{
      status:'审核中',hasApprovedCertification:wasApproved||base.hasApprovedCertification===true,rejectReason:'',reviewedAt:'',
      submittedAt:new Date().toISOString().slice(0,10),
      name:name,phone:phone,gender:gender,idNo:idNo,
      age:age||'',workYears:years,
      employmentType:employ,companyName:company,area:area,skills:skills,
      photo:photoData,photoName:photoName,
      certs:certData.map(function(c){return {type:c.type,certNo:(c.certNo||'').trim(),image:c.image||'',imageName:c.imageName||'',fileName:c.fileName||'',fileSize:c.fileSize||0};})
    });
    try{saveApp();}catch(e){app=latest;showToast('申请未保存，请减少材料大小后重试');return;}
    draft=null;editMode=false;
    render();
    window.scrollTo(0,0);
    showToast(wasApproved?'已保存，资料重新提交审核':(wasRejected?'资料已重新提交，请等待平台审核':'认证申请已提交'));
  };
  function refreshApplication(){var latest=readApp();if(JSON.stringify(latest)!==JSON.stringify(app)){app=latest;editMode=false;draft=null;certData=[];render();}}
  window.addEventListener('storage',function(e){if(e.key===KEY||e.key===null)refreshApplication();});
  window.addEventListener('focus',refreshApplication);
  render();
</script>
<script src="youkang-bridge.js"></script>
</body>

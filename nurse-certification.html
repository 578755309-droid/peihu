<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>资质认证 · 护理员端</title>
  <style>
    :root{--purple:#8655C5;--purple-dark:#6B3FAA;--purple-light:#EDE6F7;--purple-bg:#F5F3FA;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#16A34A;--green-bg:#DCFCE7;--amber:#D97706;--amber-bg:#FEF3C7;--red:#DC2626;--red-bg:#FEE2E2;--sh:0 2px 16px rgba(100,60,160,.08);--r-lg:20px}
    *,*:before,*:after{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}.frame{display:flex;justify-content:center;min-height:100vh;background:#E4DDF0}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg)}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:42px;overflow:hidden;box-shadow:0 24px 72px rgba(80,40,140,.22)}}
    .scroll{flex:1;overflow:auto}.scroll::-webkit-scrollbar{display:none}.status-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;background:#fff;font-size:13px;font-weight:700}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:17px}.navbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}.back-btn{width:36px;height:36px;border:0;border-radius:11px;background:var(--purple-light);color:var(--purple);display:grid;place-items:center;cursor:pointer}.back-btn svg{width:20px;height:20px}.nav-title{font-size:17px;font-weight:900}.nav-ph{width:36px}.content{padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:28px}.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}.status-card{padding:16px}.status-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-title{font-size:15px;font-weight:900}.status-badge{padding:5px 9px;border-radius:8px;font-size:11px;font-weight:800}.status-badge.approved{background:var(--green-bg);color:var(--green)}.status-badge.pending{background:var(--amber-bg);color:var(--amber)}.status-badge.rejected{background:var(--red-bg);color:var(--red)}.status-desc{margin-top:9px;color:var(--text2);font-size:12px;line-height:1.55}.status-meta{margin-top:9px;color:var(--text3);font-size:11px}.card-head{display:flex;align-items:center;justify-content:space-between;padding:15px 16px 11px;border-bottom:1px solid var(--border)}.card-action{border:0;background:none;color:var(--purple);font:800 11px inherit;cursor:pointer}.cert-list{display:grid;gap:10px;padding:13px 16px 16px}.cert{display:flex;align-items:flex-start;gap:10px;padding:12px;border-radius:12px;background:#FAF9FD}.cert-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;background:var(--green-bg);color:var(--green);font-size:15px;font-weight:900}.cert-copy{min-width:0;flex:1}.cert-name{font-size:13px;font-weight:800}.cert-desc{margin-top:4px;color:var(--text3);font-size:10px;line-height:1.45}.cert-state{padding:4px 7px;border-radius:6px;background:var(--green-bg);color:var(--green);font-size:10px;font-weight:800;white-space:nowrap}.form{padding:5px 16px 16px}.field{padding:12px 0;border-bottom:1px solid var(--border)}.field:last-of-type{border-bottom:0}.field label{display:block;color:var(--text2);font-size:11px;font-weight:800;margin-bottom:7px}.req{color:var(--red)}.field input,.field select{width:100%;height:42px;border:1px solid var(--border);outline:0;border-radius:10px;padding:0 11px;background:var(--purple-bg);color:var(--text);font:700 13px inherit}.field input:focus,.field select:focus{border-color:#B99BE3;box-shadow:0 0 0 3px rgba(134,85,197,.1)}.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.upload-box{position:relative;display:grid;place-items:center;min-height:78px;border:1.5px dashed #CFC2E7;border-radius:11px;background:var(--purple-bg);color:var(--purple);cursor:pointer;text-align:center}.upload-box input{position:absolute;width:1px;height:1px;opacity:0}.upload-box svg{width:22px;height:22px;margin-bottom:5px}.upload-label{font-size:10px;font-weight:800;line-height:1.35}.upload-name{display:block;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text3);font-size:9px}.form-hint{padding:0 16px 14px;color:var(--text3);font-size:10px;line-height:1.5}.submit{display:block;width:100%;height:44px;border:0;border-radius:12px;background:var(--purple);color:#fff;font:800 13px inherit;cursor:pointer}.reason{margin:13px 16px 0;padding:10px 11px;border-radius:10px;background:var(--red-bg);color:#991B1B;font-size:11px;line-height:1.5}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);padding:17px 25px;border-radius:16px;background:rgba(25,15,45,.9);color:#fff;font-size:14px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  </style>
</head>
<body>
<div class="frame"><div class="phone"><main class="scroll">
  <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".28"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="currentColor" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="currentColor"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="currentColor"/></svg></div></div>
  <header class="navbar"><button class="back-btn" onclick="history.length>1?history.back():location.href='nurse-profile.html'" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M13 4.5L7.5 10 13 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="nav-title">资质认证</span><span class="nav-ph"></span></header>
  <section class="content" id="app"></section>
</main></div></div>
<div class="toast" id="toast"></div>
<script>
  const KEY='akb_nurse_certification_v1';
  const DEFAULT={state:'approved',submittedAt:'2026-04-15',reviewedAt:'2026-04-16',reason:'',name:'李桂芳',idNo:'110***********0013',certType:'护理师证',certNo:'NRS-2024-06018',expiry:'2028-06-30',files:{idFront:'身份证正面.jpg',idBack:'身份证反面.jpg',certificate:'护理师证.jpg'},certs:[{name:'护士执照',desc:'已审核通过 · 有效期至 2028-06-30'},{name:'护理师证',desc:'平台资质审核通过'},{name:'急救认证',desc:'已审核通过 · 有效期至 2027-12-31'}]};
  let data=readData();
  function readData(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');return saved&&typeof saved==='object'?Object.assign({},DEFAULT,saved):Object.assign({},DEFAULT);}catch(e){return Object.assign({},DEFAULT);}}
  function saveData(){localStorage.setItem(KEY,JSON.stringify(data));}
  function esc(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function statusConfig(){return {approved:{label:'已认证',title:'认证资料已审核通过',desc:'你的护理员资质已完成平台认证，可正常承接对应服务。'},pending:{label:'审核中',title:'认证申请审核中',desc:'平台将在 1-3 个工作日内完成审核，请留意消息通知。'},rejected:{label:'需重新提交',title:'认证申请未通过',desc:'请根据驳回原因补充或修改资料后重新提交。'}}[data.state];}
  function render(){const cfg=statusConfig();let html='<section class="card status-card"><div class="status-head"><span class="section-title">认证状态</span><span class="status-badge '+data.state+'">'+cfg.label+'</span></div><div class="status-desc">'+cfg.title+'<br>'+cfg.desc+'</div>'+(data.submittedAt?'<div class="status-meta">最近提交：'+esc(data.submittedAt)+(data.reviewedAt?' · 审核完成：'+esc(data.reviewedAt):'')+'</div>':'')+(data.state==='rejected'?'<div class="reason"><strong>驳回原因：</strong>'+esc(data.reason||'证件信息不完整，请补充清晰的证件照片。')+'</div>':'')+'</section>';
    if(data.state==='approved') html+='<section class="card"><div class="card-head"><span class="section-title">已认证资质</span><button class="card-action" onclick="showForm()">新增认证</button></div><div class="cert-list">'+data.certs.map(function(cert){return '<div class="cert"><div class="cert-icon">✓</div><div class="cert-copy"><div class="cert-name">'+esc(cert.name)+'</div><div class="cert-desc">'+esc(cert.desc)+'</div></div><span class="cert-state">已认证</span></div>';}).join('')+'</div></section>';
    if(data.state==='pending') html+='<section class="card"><div class="card-head"><span class="section-title">已提交资料</span><button class="card-action" onclick="showForm()">查看资料</button></div><div class="cert-list"><div class="cert"><div class="cert-icon" style="background:var(--amber-bg);color:var(--amber)">…</div><div class="cert-copy"><div class="cert-name">'+esc(data.certType||'护理资质申请')+'</div><div class="cert-desc">证书编号：'+esc(data.certNo||'待填写')+' · 有效期至 '+esc(data.expiry||'待填写')+'</div></div><span class="cert-state" style="background:var(--amber-bg);color:var(--amber)">审核中</span></div></div></section>';
    if(data.state!=='pending') html+='<section class="card" id="formCard" hidden></section>';
    document.getElementById('app').innerHTML=html;}
  function showForm(){if(!document.getElementById('formCard'))document.getElementById('app').insertAdjacentHTML('beforeend','<section class="card" id="formCard"></section>');const formCard=document.getElementById('formCard');formCard.hidden=false;formCard.innerHTML='<div class="card-head"><span class="section-title">'+(data.state==='rejected'?'重新申请认证':'申请新增认证')+'</span><button class="card-action" onclick="hideForm()">收起</button></div><form class="form" onsubmit="submitApplication(event)"><div class="field"><label for="appName">真实姓名 <span class="req">*</span></label><input id="appName" required value="'+esc(data.name||'李桂芳')+'" placeholder="请输入真实姓名" /></div><div class="field"><label for="appIdNo">身份证号 <span class="req">*</span></label><input id="appIdNo" required maxlength="18" value="'+esc(data.idNo||'')+'" placeholder="请输入18位身份证号" /></div><div class="field"><label for="appCertType">证书类型 <span class="req">*</span></label><select id="appCertType" required><option>护理师证</option><option>护士执照</option><option>急救认证</option><option>其他护理相关证书</option></select></div><div class="field"><label for="appCertNo">证书编号 <span class="req">*</span></label><input id="appCertNo" required value="'+esc(data.certNo||'')+'" placeholder="请输入证书编号" /></div><div class="field"><label for="appExpiry">证书有效期 <span class="req">*</span></label><input id="appExpiry" required type="date" value="'+esc(data.expiry||'')+'" /></div><div class="field"><label>上传认证材料 <span class="req">*</span></label><div class="upload-grid"><label class="upload-box"><input type="file" accept="image/*,.pdf" onchange="pickFile(this,&quot;idFrontName&quot;)"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="upload-label">身份证正面<span class="upload-name" id="idFrontName">'+esc(data.files&&data.files.idFront||'点击上传')+'</span></span></label><label class="upload-box"><input type="file" accept="image/*,.pdf" onchange="pickFile(this,&quot;idBackName&quot;)"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="upload-label">身份证反面<span class="upload-name" id="idBackName">'+esc(data.files&&data.files.idBack||'点击上传')+'</span></span></label><label class="upload-box"><input type="file" accept="image/*,.pdf" onchange="pickFile(this,&quot;certificateName&quot;)"><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="upload-label">资格证书<span class="upload-name" id="certificateName">'+esc(data.files&&data.files.certificate||'点击上传')+'</span></span></label></div></div><button class="submit" type="submit">提交认证申请</button></form><div class="form-hint">请确保姓名、身份证和证书信息真实有效，图片清晰完整。平台仅用于资质审核。</div>';const select=document.getElementById('appCertType');select.value=data.certType||'护理师证';}
  function hideForm(){const card=document.getElementById('formCard');if(card)card.hidden=true;}
  function pickFile(input,target){const file=input.files&&input.files[0];if(file)document.getElementById(target).textContent=file.name;}
  function submitApplication(event){event.preventDefault();const name=document.getElementById('appName').value.trim(),idNo=document.getElementById('appIdNo').value.trim(),certType=document.getElementById('appCertType').value,certNo=document.getElementById('appCertNo').value.trim(),expiry=document.getElementById('appExpiry').value;if(!name||!idNo||!certNo||!expiry){showToast('请完整填写认证资料');return;}data=Object.assign({},data,{state:'pending',submittedAt:new Date().toISOString().slice(0,10),reviewedAt:'',name:name,idNo:idNo,certType:certType,certNo:certNo,expiry:expiry,files:{idFront:document.getElementById('idFrontName').textContent,idBack:document.getElementById('idBackName').textContent,certificate:document.getElementById('certificateName').textContent}});saveData();render();showToast('认证申请已提交');}
  function showToast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(function(){el.classList.remove('show');},2200);}
  render();
</script>
</body>
</html>

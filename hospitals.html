<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>覆盖医院</title>
  <style>
    :root {
      --purple:       #8655C5;
      --purple-dark:  #6B3FAA;
      --purple-light: #EDE6F7;
      --purple-bg:    #F5F3FA;
      --card:         #FFFFFF;
      --text:         #1A1828;
      --text2:        #6B6880;
      --text3:        #AEACC0;
      --border:       #EDE9F5;
      --sh: 0 2px 16px rgba(100,60,160,.08);
      --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--purple-bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Desktop frame */
    .frame { display: flex; justify-content: center; min-height: 100vh; background: #E4DDF0; }
    .phone {
      width: 100%; max-width: 430px;
      display: flex; flex-direction: column; background: var(--purple-bg); min-height: 100vh;
    }
    @media (min-width: 520px) {
      .frame { align-items: flex-start; padding: 20px 0 40px; }
      .phone {
        height: 900px; min-height: unset; border-radius: 42px; overflow: hidden;
        box-shadow: 0 24px 72px rgba(80,40,140,.22), 0 2px 8px rgba(0,0,0,.06);
      }
    }

    .scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .scroll-area::-webkit-scrollbar { display: none; }

    /* Status bar */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 13px 22px 8px; font-size: 13px; font-weight: 700;
      background: var(--card); letter-spacing: .2px;
    }
    .status-right { display: flex; align-items: center; gap: 5px; }
    .status-right svg { width: 17px; height: 17px; }

    /* Navbar */
    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px 12px; background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .back-btn {
      width: 36px; height: 36px; border: none; cursor: pointer;
      background: var(--purple-light); border-radius: 11px;
      display: grid; place-items: center; -webkit-tap-highlight-color: transparent;
    }
    .back-btn svg { width: 20px; height: 20px; }
    .nav-title { font-size: 17px; font-weight: 800; color: var(--text); }
    .nav-ph { width: 36px; }

    /* ── Search bar ── */
    .search-wrap {
      padding: 12px 14px; background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .search-box {
      display: flex; align-items: center; gap: 9px;
      background: var(--purple-bg); border-radius: 13px;
      padding: 0 14px; height: 44px;
      border: 1.5px solid transparent; transition: border-color .2s;
    }
    .search-box:focus-within {
      border-color: var(--purple); background: #fff;
      box-shadow: 0 0 0 3px rgba(134,85,197,.12);
    }
    .search-box svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--text3); transition: color .2s; }
    .search-box:focus-within svg { color: var(--purple); }
    .search-box input {
      flex: 1; border: none; background: transparent; outline: none;
      font-size: 15px; font-weight: 500; color: var(--text); font-family: inherit;
    }
    .search-box input::placeholder { color: var(--text3); font-weight: 500; }
    .clear-btn {
      width: 20px; height: 20px; border-radius: 50%; border: none; cursor: pointer;
      background: var(--text3); display: none; place-items: center;
      -webkit-tap-highlight-color: transparent; flex-shrink: 0;
    }
    .clear-btn.show { display: grid; }
    .clear-btn svg { width: 10px; height: 10px; }

    /* ── Region filter tabs ── */
    .region-tabs {
      display: flex; gap: 8px; overflow-x: auto; padding: 11px 14px;
      -webkit-overflow-scrolling: touch; background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .region-tabs::-webkit-scrollbar { display: none; }
    .rtab {
      flex-shrink: 0; padding: 5px 14px; border-radius: 20px;
      font-size: 12px; font-weight: 700; cursor: pointer;
      border: 1.5px solid var(--border); background: transparent;
      color: var(--text3); font-family: inherit;
      transition: all .15s; -webkit-tap-highlight-color: transparent;
    }
    .rtab.on {
      background: var(--purple); border-color: var(--purple);
      color: #fff; box-shadow: 0 3px 10px rgba(134,85,197,.28);
    }

    /* ── List ── */
    .list { padding: 14px; display: flex; flex-direction: column; gap: 12px; }

    /* Result count */
    .result-count { font-size: 12px; color: var(--text3); font-weight: 600; padding: 2px 0 4px; }
    .result-count strong { color: var(--purple); }

    /* Hospital card */
    .hosp-card {
      background: var(--card); border-radius: var(--r-lg);
      box-shadow: var(--sh); padding: 16px;
      display: flex; align-items: center; gap: 14px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: transform .1s, box-shadow .1s;
    }
    .hosp-card:active { transform: scale(.99); box-shadow: 0 1px 8px rgba(100,60,160,.06); }

    /* Logo */
    .hlogo {
      width: 56px; height: 56px; border-radius: 15px; flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 12px; font-weight: 900; color: #fff;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }

    /* Info */
    .hinfo { flex: 1; min-width: 0; }
    .hname { font-size: 15px; font-weight: 800; color: var(--text); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hmeta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .hloc {
      display: flex; align-items: center; gap: 3px;
      font-size: 12px; color: var(--text3); font-weight: 600;
    }
    .hloc svg { width: 12px; height: 12px; }
    .hdept { font-size: 12px; color: var(--text2); font-weight: 600; }
    .htags { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
    .htag {
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
    }
    .htag-partner { background: var(--purple-light); color: var(--purple); }
    .htag-grade   { background: #FEF3C7; color: #D97706; }
    .htag-dept    { background: #DCFCE7; color: #16A34A; }

    /* Arrow */
    .harrow { color: var(--text3); flex-shrink: 0; }
    .harrow svg { width: 16px; height: 16px; display: block; }

    /* ── Empty state ── */
    .empty {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      padding: 60px 30px; gap: 16px; text-align: center;
    }
    .empty.show { display: flex; }
    .empty-icon {
      width: 80px; height: 80px; border-radius: 24px;
      background: var(--purple-light); display: grid; place-items: center;
    }
    .empty-icon svg { width: 38px; height: 38px; }
    .empty-title { font-size: 16px; font-weight: 800; color: var(--text2); }
    .empty-sub { font-size: 13px; color: var(--text3); line-height: 1.6; }
    .empty-clear {
      padding: 9px 24px; border-radius: 20px; border: none; cursor: pointer;
      background: var(--purple-light); color: var(--purple);
      font-size: 13px; font-weight: 700; font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

  </style>
</head>
<body>
<div class="frame">
  <div class="phone">
    <div class="scroll-area">

      <!-- iOS status bar -->
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-right">
          <svg viewBox="0 0 17 12" fill="currentColor">
            <rect x="0" y="3" width="3" height="9" rx="1"/>
            <rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/>
            <rect x="9" y="0" width="3" height="12" rx="1"/>
            <rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".28"/>
          </svg>
          <svg viewBox="0 0 17 13" fill="none" stroke="currentColor" stroke-linecap="round">
            <path d="M8.5 9.5a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8z" fill="currentColor" stroke="none"/>
            <path d="M5.2 7a4.7 4.7 0 016.6 0" stroke-width="1.5"/>
            <path d="M2 4a8.8 8.8 0 0113 0" stroke-width="1.5"/>
          </svg>
          <svg viewBox="0 0 24 12" fill="none">
            <rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="currentColor" stroke-width="1.2"/>
            <rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="currentColor"/>
            <rect x="2" y="2" width="15" height="8" rx="1.8" fill="currentColor"/>
          </svg>
        </div>
      </div>

      <!-- Navbar -->
      <div class="navbar">
        <button class="back-btn" onclick="location.href='home.html'" aria-label="返回">
          <svg viewBox="0 0 20 20" fill="none">
            <path d="M13 4.5L7.5 10 13 15.5" stroke="#8655C5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="nav-title">覆盖医院</span>
        <div class="nav-ph"></div>
      </div>

      <!-- Search bar -->
      <div class="search-wrap">
        <div class="search-box">
          <svg viewBox="0 0 18 18" fill="none">
            <circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor" stroke-width="1.6"/>
            <path d="M11.5 11.5l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input id="searchInput" type="search" placeholder="搜索医院名称 / 科室"
                 autocomplete="off" oninput="onSearch(this.value)" />
          <button class="clear-btn" id="clearBtn" onclick="clearSearch()">
            <svg viewBox="0 0 10 10" fill="none">
              <path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Region filter -->
      <div class="region-tabs" id="regionTabs">
        <button class="rtab on" onclick="filterRegion(this,'全部')">全部</button>
        <button class="rtab" onclick="filterRegion(this,'北京')">北京</button>
        <button class="rtab" onclick="filterRegion(this,'上海')">上海</button>
        <button class="rtab" onclick="filterRegion(this,'广州')">广州</button>
        <button class="rtab" onclick="filterRegion(this,'深圳')">深圳</button>
        <button class="rtab" onclick="filterRegion(this,'杭州')">杭州</button>
        <button class="rtab" onclick="filterRegion(this,'成都')">成都</button>
      </div>

      <!-- List -->
      <div class="list" id="hospList">
        <div class="result-count" id="resultCount"><strong>12</strong> 家覆盖医院</div>
        <!-- Cards rendered by JS -->
      </div>

      <!-- Empty state -->
      <div class="empty" id="emptyState">
        <div class="empty-icon">
          <svg viewBox="0 0 38 38" fill="none">
            <circle cx="17" cy="17" r="12" stroke="#8655C5" stroke-width="2"/>
            <path d="M26 26l8 8" stroke="#8655C5" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M12 17h10M17 12v10" stroke="#8655C5" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="empty-title">暂无匹配医院</div>
        <div class="empty-sub">未找到与「<span id="emptyKeyword"></span>」相关的医院<br/>请尝试其他关键词或切换地区</div>
        <button class="empty-clear" onclick="clearSearch()">清除搜索</button>
      </div>

    </div><!-- .scroll-area -->


  </div><!-- .phone -->
</div><!-- .frame -->

<script>
  /* ── Data ── */
  const HOSPITALS = [
    { name:'北京红十字会急诊抢救中心', region:'北京', dept:'急诊科 · 重症医学科', grade:'三级甲等', color:['#C92B2B','#E86060'], abbr:'红会' },
    { name:'北京协和医院',              region:'北京', dept:'内科 · 外科 · 妇产科',  grade:'三级甲等', color:['#2350A8','#547FD8'], abbr:'协和' },
    { name:'解放军总医院',              region:'北京', dept:'骨科 · 神经外科',        grade:'三级甲等', color:['#166B35','#2EAA5A'], abbr:'解放' },
    { name:'北京大学人民医院',          region:'北京', dept:'血液科 · 肿瘤科',        grade:'三级甲等', color:['#7B3FBE','#AA7AE0'], abbr:'人民' },
    { name:'首都医科大学附属北京天坛医院', region:'北京', dept:'神经科 · 脑外科',    grade:'三级甲等', color:['#1A5C8C','#3A9AC7'], abbr:'天坛' },
    { name:'上海瑞金医院',              region:'上海', dept:'内分泌科 · 心内科',      grade:'三级甲等', color:['#C75510','#F4A030'], abbr:'瑞金' },
    { name:'复旦大学附属中山医院',      region:'上海', dept:'心外科 · 消化科',        grade:'三级甲等', color:['#1A7A6E','#28BBA9'], abbr:'中山' },
    { name:'广州中山大学附属第一医院',  region:'广州', dept:'肾内科 · 器官移植',      grade:'三级甲等', color:['#8B3A0C','#D4651E'], abbr:'中一' },
    { name:'南方医科大学南方医院',      region:'广州', dept:'肿瘤科 · 骨科',          grade:'三级甲等', color:['#0C5E8C','#1A9ACA'], abbr:'南方' },
    { name:'深圳市人民医院',            region:'深圳', dept:'急诊科 · 内科',          grade:'三级甲等', color:['#5E3A8C','#9A6AD4'], abbr:'深人' },
    { name:'浙江大学医学院附属第一医院',region:'杭州', dept:'消化科 · 肝胆外科',      grade:'三级甲等', color:['#1A6B5C','#28AA8C'], abbr:'浙一' },
    { name:'四川大学华西医院',          region:'成都', dept:'胸外科 · 精神科',        grade:'三级甲等', color:['#8C2B2B','#C04848'], abbr:'华西' },
  ];

  let currentRegion  = '全部';
  let currentKeyword = '';

  function filteredList() {
    return HOSPITALS.filter(h => {
      const matchRegion  = currentRegion === '全部' || h.region === currentRegion;
      const kw = currentKeyword.toLowerCase();
      const matchKeyword = !kw || h.name.toLowerCase().includes(kw) || h.dept.toLowerCase().includes(kw) || h.region.toLowerCase().includes(kw);
      return matchRegion && matchKeyword;
    });
  }

  function render() {
    const list   = document.getElementById('hospList');
    const empty  = document.getElementById('emptyState');
    const count  = document.getElementById('resultCount');
    const data   = filteredList();

    /* remove old cards (keep result-count) */
    list.querySelectorAll('.hosp-card').forEach(c => c.remove());

    if (data.length === 0) {
      list.style.display = 'none';
      empty.classList.add('show');
      document.getElementById('emptyKeyword').textContent = currentKeyword || currentRegion;
      return;
    }

    list.style.display = '';
    empty.classList.remove('show');
    count.innerHTML = `<strong>${data.length}</strong> 家覆盖医院`;

    data.forEach(h => {
      const card = document.createElement('div');
      card.className = 'hosp-card';
      card.onclick   = () => alert(`${h.name}\n地区：${h.region}\n科室：${h.dept}\n等级：${h.grade}`);
      card.innerHTML = `
        <div class="hlogo" style="background:linear-gradient(140deg,${h.color[0]},${h.color[1]})">${h.abbr}</div>
        <div class="hinfo">
          <div class="hname">${h.name}</div>
          <div class="hmeta">
            <div class="hloc">
              <svg viewBox="0 0 12 12" fill="none">
                <path d="M6 1a4 4 0 014 4c0 2.5-4 7-4 7S2 7.5 2 5a4 4 0 014-4z" stroke="currentColor" stroke-width="1.2"/>
                <circle cx="6" cy="5" r="1.2" fill="currentColor"/>
              </svg>
              ${h.region}
            </div>
            <span style="color:var(--border)">·</span>
            <div class="hdept">${h.dept}</div>
          </div>
          <div class="htags">
            <span class="htag htag-partner">官方合作</span>
            <span class="htag htag-grade">${h.grade}</span>
          </div>
        </div>
        <div class="harrow">
          <svg viewBox="0 0 16 16" fill="none">
            <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>`;
      list.appendChild(card);
    });
  }

  function onSearch(val) {
    currentKeyword = val.trim();
    document.getElementById('clearBtn').classList.toggle('show', val.length > 0);
    render();
  }

  function clearSearch() {
    const input = document.getElementById('searchInput');
    input.value = '';
    currentKeyword = '';
    document.getElementById('clearBtn').classList.remove('show');
    input.focus();
    render();
  }

  function filterRegion(el, region) {
    document.querySelectorAll('.rtab').forEach(t => t.classList.remove('on'));
    el.classList.add('on');
    currentRegion = region;
    render();
  }

  /* initial render */
  render();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <script src="vendor/vue.global.prod.js"></script>
  <script src="ui/icons.js"></script>
  <script src="ui/vue-ui.js"></script>
  <script src="common-ui.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AI健康咨询 · 佑小邦</title>
  <style>
    :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#2F9B72;--sh:0 2px 16px rgba(0,0,0,0.1)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    .frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}
    .phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg)}
    @media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;background:linear-gradient(135deg,#1CD8B7,#0FA98C)}.status-bar span{font-size:13px;font-weight:600;color:#fff}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:12px}
    .nav{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}.nav h1{font-size:17px;font-weight:600;color:var(--text);letter-spacing:.3px;position:absolute;left:50%;transform:translateX(-50%)}
    .back-btn{width:36px;height:36px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;cursor:pointer}.back-btn:active{background:#D9CFF0}.back-btn svg{width:20px;height:20px}.nav-ph{width:36px}
    .scroll{flex:1;overflow:auto;padding:16px 14px 22px}.scroll::-webkit-scrollbar{display:none}
    .intro{background:linear-gradient(135deg,#1CD8B7,#0FA98C);border-radius:12px;padding:18px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,0.1);position:relative;overflow:hidden}.intro:after{content:'';position:absolute;width:150px;height:150px;border-radius:12px;right:-44px;top:-58px;background:rgba(255,255,255,.09)}.intro-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}.bot-icon{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex-shrink:0}.bot-icon svg{width:27px;height:27px}.intro-title{font-size:18px;font-weight:700}.intro-sub{font-size:13px;color:rgba(255,255,255,.75);margin-top:4px}.intro-note{font-size:12px;line-height:1.5;color:rgba(255,255,255,.8);margin-top:15px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);position:relative;z-index:1}
    .notice{margin:12px 0;background:#FFF9EC;border:1px solid #F8E4B5;border-radius:12px;padding:10px 12px;color:#8A6A25;font-size:12px;line-height:1.55}.notice strong{font-weight:700}
    .section-title{font-size:13px;font-weight:600;color:var(--text3);margin:16px 4px 8px}.quick-list{display:flex;flex-wrap:wrap;gap:8px}.quick-btn{border:1px solid #DDD2EE;background:#fff;color:var(--purple);border-radius:12px;padding:8px 12px;font-size:13px;cursor:pointer}.quick-btn:active{background:var(--purple-light)}
    .chat{display:flex;flex-direction:column;gap:10px;margin-top:10px}.message{display:flex;gap:8px;align-items:flex-start}.message.user{justify-content:flex-end}.bubble{max-width:82%;padding:11px 12px;border-radius:12px;font-size:14px;line-height:1.55;white-space:pre-wrap}.message.bot .bubble{background:#fff;box-shadow:var(--sh);border-top-left-radius:12px;color:var(--text2)}.message.user .bubble{background:var(--purple);color:#fff;border-top-right-radius:12px}.message-avatar{width:27px;height:27px;border-radius:12px;background:var(--purple-light);color:var(--purple);display:grid;place-items:center;flex-shrink:0}.message-avatar svg{width:16px;height:16px}
    .composer{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:12px;padding:7px 8px 7px 12px;margin-top:16px;box-shadow:var(--sh)}.composer input{min-width:0;flex:1;border:0;outline:0;font-size:14px;color:var(--text);background:transparent}.composer input::placeholder{color:var(--text3)}.send-btn{width:36px;height:36px;border:0;border-radius:12px;background:var(--purple);color:#fff;display:grid;place-items:center;cursor:pointer}.send-btn svg{width:17px;height:17px}.helper{font-size:12px;color:var(--text3);text-align:center;margin-top:8px}
    .bottom-nav{flex-shrink:0;display:flex;background:#fff;border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;text-decoration:none;min-width:0}.nav-ico{width:26px;height:26px}.nav-lbl{font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap}.nav-item.active .nav-lbl{color:var(--purple)}.nav-item.active .ni{stroke:var(--purple)!important}.nav-item.active .nif{fill:var(--purple)!important}
  </style>
  <link rel="stylesheet" href="visual-theme.css" />
  <link rel="stylesheet" href="ui/vue-ui.css" />
</head>
<body data-surface="mobile" data-page="ai-health">
<div class="frame"><div class="phone">
  <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="9" y=".5" width="3" height="11.5" rx="1" fill="#fff"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".35"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="#fff" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="#fff"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#fff"/></svg></div></div>
  <header class="nav">
    <button class="back-btn" onclick="history.length>1?history.back():location.href='home.html'" aria-label="返回">
      <svg viewBox="0 0 20 20" fill="none"><path d="M13 4.5L7.5 10 13 15.5" stroke="#1CD8B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <h1>AI健康咨询</h1>
    <div class="nav-ph"></div>
  </header>
  <main class="scroll">
    <section class="intro"><div class="intro-top"><div class="bot-icon"><svg viewBox="0 0 28 28" fill="none"><rect x="5" y="7" width="18" height="14" rx="5" stroke="#fff" stroke-width="1.7"/><circle cx="10.5" cy="14" r="1.3" fill="#fff"/><circle cx="17.5" cy="14" r="1.3" fill="#fff"/><path d="M11 18h6M14 4v3" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="14" cy="3" r="1" fill="#fff"/></svg></div><div><div class="intro-title">你好，我是佑小邦小助手</div><div class="intro-sub">陪你了解常见健康知识</div></div></div><div class="intro-note">可以问我照护、康复、饮食和安全防护等基础知识。</div></section>
    <div class="notice"><strong>温馨提示：</strong>内容仅供健康知识参考，不能替代医生诊断、用药建议或急救指导。如有紧急情况，请立即拨打 120 或前往医院。</div>
    <div class="section-title">你可以这样问</div>
    <div class="quick-list"><button class="quick-btn" onclick="ask('术后如何安全翻身？')">术后如何安全翻身？</button><button class="quick-btn" onclick="ask('老人饮食有哪些注意事项？')">老人饮食注意事项</button><button class="quick-btn" onclick="ask('如何预防老年人跌倒？')">如何预防跌倒？</button><button class="quick-btn" onclick="ask('发热时应该怎么护理？')">发热时怎么护理？</button><button class="quick-btn" onclick="ask('血压多少算正常？')">血压多少算正常？</button></div>
    <div class="section-title">咨询记录</div>
    <section class="chat" id="chat"><div class="message bot"><div class="message-avatar"><svg viewBox="0 0 20 20" fill="none"><rect x="3.5" y="5" width="13" height="10" rx="3.5" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="10" r="1" fill="currentColor"/><circle cx="12.5" cy="10" r="1" fill="currentColor"/><path d="M8 13h4M10 2.5V5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></div><div class="bubble">你好，我可以帮你解答一些常见的照护和健康知识问题。请选择上方问题，或直接输入想了解的内容。</div></div></section>
    <div class="composer"><input id="question" maxlength="80" placeholder="输入健康问题，例如：如何预防跌倒" onkeydown="if(event.key==='Enter')sendQuestion()" /><button class="send-btn" onclick="sendQuestion()" aria-label="发送"><svg viewBox="0 0 20 20" fill="none"><path d="M3 3.5l13.5 6.2L3 16.5l2-5.8L12 10 5 9.3 3 3.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button></div><div class="helper">佑小邦小助手只提供基础健康知识问答</div>
  </main>
</div></div>
<script>
  const ANSWERS = [
    {keys:['翻身','术后'], answer:'术后翻身前先确认管路、伤口和引流袋没有受压或牵拉。两人配合时保持肩、髋部同步移动，动作慢且避免直接拉患侧肢体。如出现明显疼痛、出血或不适，应立即停止并联系医护人员。'},
    {keys:['饮食','吃什么','营养'], answer:'老人饮食一般建议清淡、少量多餐，保证优质蛋白和蔬菜摄入；吞咽困难时注意食物软烂、细碎，进食时保持坐位。若有糖尿病、肾病等基础疾病，应以医生或营养师的个体化建议为准。'},
    {keys:['跌倒','防摔','防跌'], answer:'可从环境、穿着和陪护三方面预防跌倒：保持地面干燥、夜间有照明，移走杂物和电线；穿合脚防滑鞋；起身、转身和如厕时先坐稳再站立，必要时使用助行器并有人陪同。'},
    {keys:['发热','发烧'], answer:'发热时应注意休息、适量补水并观察体温变化，保持室内通风和舒适的衣被厚度。不要自行叠加使用多种退热药；高热不退、意识异常、呼吸困难或持续不适时，应及时就医。'},
    {keys:['血压','高压','低压'], answer:'血压会受时间、情绪和活动影响，建议安静休息 5 分钟后测量，并连续记录。单次读数不能直接判断疾病；如果多次明显偏高或伴有胸痛、呼吸困难、肢体无力等情况，应及时就医。'}
  ];
  function esc(value){return String(value||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function answerFor(question){const item=ANSWERS.find(function(entry){return entry.keys.some(function(key){return question.includes(key)})});return item?item.answer:'这个问题暂时超出我的基础知识范围。我可以先帮你了解照护、康复、饮食和安全防护等常见知识；涉及具体病情、用药或检查结果，请咨询医生。'}
  function appendMessage(type,text){const chat=document.getElementById('chat'), row=document.createElement('div');row.className='message '+type;if(type==='bot'){row.innerHTML='<div class="message-avatar"><svg viewBox="0 0 20 20" fill="none"><rect x="3.5" y="5" width="13" height="10" rx="3.5" stroke="currentColor" stroke-width="1.3"/><circle cx="7.5" cy="10" r="1" fill="currentColor"/><circle cx="12.5" cy="10" r="1" fill="currentColor"/><path d="M8 13h4M10 2.5V5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></div><div class="bubble">'+esc(text)+'</div>'}else{row.innerHTML='<div class="bubble">'+esc(text)+'</div>'}chat.appendChild(row);row.scrollIntoView({behavior:'smooth',block:'nearest'})}
  function ask(question){appendMessage('user',question);setTimeout(function(){appendMessage('bot',answerFor(question))},180)}
  function sendQuestion(){const input=document.getElementById('question'),question=input.value.trim();if(!question)return;input.value='';ask(question)}
</script>
</body>
</html>

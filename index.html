<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>多康陪护服务</title>
  <style>
    :root{
      --bg-top:#f4f9ff;
      --bg-bottom:#ffffff;
      --primary:#1e64ff;
      --primary-dark:#1554e0;
      --text:#193a8a;
      --sub:#5aa2ff;
      --muted:#a9b7d1;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      color:var(--text);
      background: linear-gradient(180deg, var(--bg-top) 0%, #f7fbff 35%, var(--bg-bottom) 100%);
    }

    .app{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-between;
      padding: 56px 20px calc(28px + env(safe-area-inset-bottom));
    }

    .top{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      padding-top: 24px;
    }

    .logo{
      width:92px;
      height:92px;
      border-radius:18px;
      background: #dfeeff;
      box-shadow:
        0 10px 30px rgba(30,100,255,.12),
        inset 0 0 0 2px rgba(30,100,255,.12);
      display:grid;
      place-items:center;
    }

    .logo svg{
      width:44px;
      height:44px;
      opacity:.9;
    }

    h1{
      margin: 10px 0 0;
      font-size: 34px;
      letter-spacing: 1px;
      font-weight: 800;
      text-align:center;
    }

    .subtitle{
      margin: 0;
      font-size: 16px;
      color: var(--sub);
      letter-spacing: .5px;
      font-weight: 600;
    }

    .middle{
      width:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:10px;
      margin-top: 22px;
      margin-bottom: 20px;
    }

    .cta{
      width:min(320px, 92vw);
      height:68px;
      border:0;
      border-radius:18px;
      background: linear-gradient(180deg, #1f6bff 0%, #175dff 100%);
      color:#fff;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      box-shadow:
        0 14px 28px rgba(30,100,255,.22),
        0 6px 10px rgba(30,100,255,.14);
      cursor:pointer;
      transition: transform .12s ease, filter .12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .cta:active{
      transform: translateY(1px);
      filter: brightness(.98);
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
    }

    .hint{
      margin: 0;
      font-size: 13px;
      color: #b8c6df;
      font-weight: 600;
    }

    .footer{
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .5px;
      padding-top: 18px;
    }

    /* 让页面在桌面浏览器中也像手机预览 */
    .frame{
      width:100%;
      display:flex;
      justify-content:center;
    }

    @media (min-width: 520px){
      body{
        background: #eef5ff;
      }
      .frame{
        padding: 18px 0;
      }
      .app{
        width: 420px;
        min-height: 860px;
        border-radius: 34px;
        background: linear-gradient(180deg, var(--bg-top) 0%, #f7fbff 35%, var(--bg-bottom) 100%);
        box-shadow:
          0 20px 60px rgba(23,93,255,.18),
          0 2px 6px rgba(15, 23, 42, .06);
        overflow:hidden;
      }
    }
  </style>
</head>
<body>
  <div class="frame">
    <main class="app" role="main">
      <section class="top" aria-label="欢迎">
        <div class="logo" aria-hidden="true">
          <!-- 简洁的人像图标，接近截图风格 -->
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 12.2c2.35 0 4.25-1.95 4.25-4.35S14.35 3.5 12 3.5 7.75 5.45 7.75 7.85 9.65 12.2 12 12.2Z" stroke="#2f7bff" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M5.2 20.1c1.8-3.35 4.5-5.1 6.8-5.1s5 1.75 6.8 5.1" stroke="#2f7bff" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>多康陪护服务</h1>
          <p class="subtitle">专业陪护 · 贴心守护</p>
        </div>
      </section>

      <section class="middle" aria-label="操作">
        <button class="cta" type="button" onclick="location.href='home.html'">进入小程序</button>
        <p class="hint">点击即可体验完整功能</p>
      </section>

      <footer class="footer">演示版 | 2026</footer>
    </main>
  </div>

</body>
</html>

<body>
<div class="layout">
  <aside class="sidebar"><div class="brand"><div class="brand-title">佑小邦</div><div class="brand-sub">运营管理后台</div></div></aside>

  <main class="main">
    <header class="topbar">
      <div class="crumb"><span>其他</span><span>›</span><span class="current">消息模板</span></div>
      <div class="top-actions"><span class="top-date" id="topDate"></span><div class="top-av">管</div></div>
    </header>

    <section class="page" style="padding:24px 28px">
      <div class="page-head" style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px">
        <div>
          <h1 class="page-title" style="font-size:22px;font-weight:900;margin:0">消息模板</h1>
          <p class="page-sub" style="font-size:13px;color:#9AA7BA;margin-top:5px">维护各业务节点的通知模板（站内消息 / 短信），启用后节点触发时按模板自动发送给对应用户</p>
        </div>
        <div class="actions" style="display:flex;gap:10px">
          <button class="btn" onclick="resetTemplates()" style="display:none" id="btnReset">恢复默认模板</button>
          <button class="btn btn-primary" onclick="openTplModal()">+ 新增模板</button>
        </div>
      </div>

      <div class="stat-row" id="statRow"></div>

      <div class="filter-bar">
        <label>业务分组</label>
        <select id="fGroup" onchange="render()"><option value="all">全部分组</option></select>
        <label>接收对象</label>
        <select id="fAud" onchange="render()">
          <option value="all">全部对象</option><option value="用户">用户</option><option value="护理员">护理员</option><option value="管理员">管理员</option><option value="用户+护理员">用户+护理员</option><option value="用户+管理员">用户+管理员</option>
        </select>
        <label>状态</label>
        <select id="fStatus" onchange="render()"><option value="all">全部状态</option><option value="on">启用</option><option value="off">停用</option></select>
        <input class="search" id="fSearch" placeholder="搜索模板名称 / 消息标题 / 内容" oninput="render()" />
        <span class="result">共 <strong id="count">0</strong> 套模板</span>
      </div>

      <div class="table-wrap" style="overflow-x:auto">
        <table class="table" style="min-width:1150px">
          <thead><tr><th>模板名称</th><th>触发节点</th><th>接收对象</th><th>发送渠道</th><th>消息内容</th><th>状态</th><th>最近修改</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty-state" id="emptyState">没有符合条件的模板</div>
      </div>
    </section>
  </main>
</div>

<!-- 新增/编辑模板弹窗 -->
<div class="modal-mask" id="tplModal" onclick="if(event.target===this)closeTplModal()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">新增模板</div>
      <button class="modal-close" onclick="closeTplModal()">×</button>
    </div>
    <div class="form-grid">
      <div class="form-2col">
        <div class="field"><label>模板名称 *</label><input id="tName" placeholder="例如：护理员分配通知" /></div>
        <div class="field"><label>触发节点 *</label><select id="tNode"></select></div>
      </div>
      <div class="form-2col">
        <div class="field"><label>接收对象 *</label><select id="tAud"><option>用户</option><option>护理员</option><option>管理员</option><option>用户+护理员</option><option>用户+管理员</option></select></div>
        <div class="field"><label>发送渠道</label><select id="tChannel"><option>站内消息</option><option>站内消息 + 短信</option><option>短信</option></select></div>
      </div>
      <div class="field"><label>消息标题 *</label><input id="tTitle" placeholder="例如：护理员已分配" /></div>
      <div class="field">
        <label>消息内容 *（支持变量占位符，触发时自动替换为真实数据）</label>
        <textarea id="tContent" placeholder="例如：订单{{订单号}}已分配护理员{{护理员}}，将于{{服务时间}}开始服务。"></textarea>
      </div>
      <div class="field">
        <label>插入变量（点击追加到内容末尾）</label>
        <div class="var-chips" id="varChips"></div>
        <div class="var-tip">常用变量：{{用户姓名}} {{订单号}} {{服务项目}} {{护理员}} {{联系电话}} {{服务时间}} {{医院}} {{金额}} {{积分}}。未识别的变量在预览时原样保留。</div>
      </div>
      <div class="form-2col">
        <div class="field"><label>状态</label><select id="tStatus"><option value="on">启用</option><option value="off">停用</option></select></div>
        <div class="field"><label>节点说明（只读）</label><input id="tNodeTip" readonly style="background:#F2FCF9" /></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="previewCurrent()">预览效果</button>
      <button class="btn" onclick="closeTplModal()">取消</button>
      <button class="btn btn-primary" onclick="saveTpl()">保存</button>
    </div>
  </div>
</div>

<!-- 预览弹窗 -->
<div class="modal-mask" id="pvModal" onclick="if(event.target===this)closePvModal()">
  <div class="modal" style="width:min(420px,100%)">
    <div class="modal-head">
      <div class="modal-title">消息预览</div>
      <button class="modal-close" onclick="closePvModal()">×</button>
    </div>
    <div class="pv-phone">
      <div class="pv-msg">
        <div class="pv-title" id="pvTitle"></div>
        <div class="pv-body" id="pvBody"></div>
        <div class="pv-meta" id="pvMeta"></div>
      </div>
    </div>
    <div class="pv-unchanged" id="pvWarn" style="display:none"></div>
  </div>
</div>

      { id: 'tpl-006', group: 'order', name: '服务完成通知', node: 'order.done', aud: '用户', ch: '站内消息', title: '服务已完成，快来评价吧', content: '订单{{订单号}}服务已全部完成。本次服务还满意吗？前往评价可获得{{积分}}积分奖励。', status: 'on', updatedAt: t },
      { id: 'tpl-007', group: 'order', name: '订单取消通知', node: 'order.cancel', aud: '用户+管理员', ch: '站内消息', title: '订单已取消', content: '订单{{订单号}}已取消，取消原因：{{原因}}。如对订单有疑问，请联系客服 400-800-1234。', status: 'on', updatedAt: t },
      { id: 'tpl-008', group: 'order', name: '退款进度-已通过', node: 'order.refund', aud: '用户', ch: '站内消息 + 短信', title: '退款已通过', content: '订单{{订单号}}退款申请已通过，{{金额}}将按原支付路径退回，预计 1-3 个工作日内到账，请注意查收。', status: 'on', updatedAt: t },
      { id: 'tpl-009', group: 'order', name: '退款进度-未通过', node: 'order.refund_reject', aud: '用户', ch: '站内消息', title: '退款申请未通过', content: '很抱歉，订单{{订单号}}的退款申请未通过审核，原因：{{原因}}。如需申诉请联系客服 400-800-1234。', status: 'on', updatedAt: t },
      { id: 'tpl-010', group: 'mall', name: '商城下单成功', node: 'mall.submit', aud: '用户', ch: '站内消息', title: '商城订单提交成功', content: '您的商城订单{{订单号}}已提交，应付{{金额}}，请尽快完成支付，我们将在付款后 24 小时内发货。', status: 'on', updatedAt: t },
      { id: 'tpl-011', group: 'mall', name: '商城支付成功', node: 'mall.paid', aud: '用户', ch: '站内消息', title: '商城订单支付成功', content: '您的商城订单{{订单号}}已支付成功（{{金额}}），商家将尽快为您安排发货。', status: 'on', updatedAt: t },
      { id: 'tpl-012', group: 'mall', name: '商城发货通知', node: 'mall.shipped', aud: '用户', ch: '站内消息 + 短信', title: '商城订单已发货', content: '订单{{订单号}}已发货，承运快递：{{快递公司}} {{快递单号}}，请注意查收物流信息。', status: 'on', updatedAt: t },
      { id: 'tpl-013', group: 'mall', name: '商城签收提醒', node: 'mall.done', aud: '用户', ch: '站内消息', title: '订单已签收', content: '订单{{订单号}}已确认签收。如商品存在质量问题，可在签收后 7 天内申请售后。', status: 'on', updatedAt: t },
      { id: 'tpl-014', group: 'mall', name: '商城售后进度', node: 'mall.refund', aud: '用户', ch: '站内消息', title: '售后进度更新', content: '订单{{订单号}}的售后申请状态已更新：{{状态}}。详情可在订单页查看。', status: 'on', updatedAt: t },
      { id: 'tpl-015', group: 'booking', name: '预约提交回执', node: 'booking.submit', aud: '用户', ch: '站内消息', title: '预约提交成功', content: '您已成功预约{{服务项目}}（{{预约时间}}），工作人员将尽快与您电话确认，请保持手机畅通。', status: 'on', updatedAt: t },
      { id: 'tpl-016', group: 'booking', name: '预约确认通知', node: 'booking.confirm', aud: '用户', ch: '站内消息 + 短信', title: '预约已确认', content: '您预约的{{服务项目}}已确认，时间：{{预约时间}}，地点：{{医院}}，请准时到达。变更请提前联系客服。', status: 'on', updatedAt: t },
      { id: 'tpl-017', group: 'contract', name: '合同待签署', node: 'contract.pending', aud: '用户+护理员', ch: '站内消息', title: '服务合同待签署', content: '订单{{订单号}}的服务合同已生成，请及时查看合同条款并完成签署，签署后方可正式生效。', status: 'on', updatedAt: t },
      { id: 'tpl-018', group: 'contract', name: '合同签署完成', node: 'contract.signed', aud: '用户+管理员', ch: '站内消息', title: '合同签署完成', content: '订单{{订单号}}的服务合同已完成签署，电子合同可在订单详情中随时查看与下载。', status: 'on', updatedAt: t },
      { id: 'tpl-019', group: 'points', name: '积分获取通知', node: 'points.earn', aud: '用户', ch: '站内消息', title: '积分到账通知', content: '您获得{{积分}}积分（{{说明}}），当前可用积分{{可用积分}}，可在积分商城兑换好物。', status: 'on', updatedAt: t },
      { id: 'tpl-020', group: 'points', name: '积分使用通知', node: 'points.spend', aud: '用户', ch: '站内消息', title: '积分使用通知', content: '订单{{订单号}}已成功使用{{积分}}积分抵扣{{金额}}，本次消费为您省心又省钱。', status: 'on', updatedAt: t },
      { id: 'tpl-021', group: 'points', name: '邀请奖励到账', node: 'points.invite', aud: '用户', ch: '站内消息', title: '邀请奖励到账', content: '您邀请的好友{{好友昵称}}已注册成功，{{积分}}积分奖励已发放至您的账户，快去邀请更多好友吧！', status: 'on', updatedAt: t },
      { id: 'tpl-022', group: 'nurse', name: '新订单指派（护理员）', node: 'nurse.assign', aud: '护理员', ch: '站内消息 + 短信', title: '新订单指派提醒', content: '您有新的服务订单：{{服务项目}}（订单号{{订单号}}），{{服务时间}}在{{医院}}上岗，请及时确认排班。', status: 'on', updatedAt: t },
      { id: 'tpl-023', group: 'nurse', name: '认证审核结果', node: 'nurse.cert', aud: '护理员', ch: '站内消息', title: '认证审核结果通知', content: '您提交的护理员认证审核{{结果}}。{{说明}}如有疑问请联系运营人员。', status: 'on', updatedAt: t },
      { id: 'tpl-024', group: 'nurse', name: '收到新评价', node: 'nurse.review', aud: '护理员', ch: '站内消息', title: '收到新的服务评价', content: '订单{{订单号}}收到{{用户姓名}}的{{星级}}星评价，您的优质服务是用户信任的来源，继续加油！', status: 'on', updatedAt: t },
      { id: 'tpl-025', group: 'system', name: '系统公告', node: 'system.notice', aud: '用户+护理员', ch: '站内消息', title: '系统公告', content: '{{公告内容}}', status: 'on', updatedAt: t },
      { id: 'tpl-026', group: 'system', name: '反馈回复通知', node: 'system.feedback_reply', aud: '用户', ch: '站内消息', title: '您的反馈有新回复', content: '您提交的反馈（{{反馈编号}}）已有官方回复：{{回复内容}}', status: 'on', updatedAt: t }
    ];
  }

  function load() {
    try {
      var list = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (Array.isArray(list) && list.length) return list;
    } catch (e) {}
    var s = seed();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
    return s;
  }
  var templates = load();
  function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(templates)); } catch (e) {} }

  var editingId = '';
  document.getElementById('topDate').textContent = (new Date()).getFullYear() + '年' + (new Date().getMonth() + 1) + '月' + new Date().getDate() + '日';

  /* ── 统计 ── */
  function renderStats() {
    var on = templates.filter(function (t) { return t.status === 'on'; }).length;
    var groups = {};
    templates.forEach(function (t) { groups[t.node] = 1; });
    var auds = {};
    templates.forEach(function (t) { String(t.aud).split('+').forEach(function (a) { auds[a] = 1; }); });
    var cards = [
      { v: templates.length, l: '模板总数' },
      { v: on, l: '启用中' },
      { v: Object.keys(groups).length, l: '覆盖业务节点' },
      { v: Object.keys(auds).length, l: '触达对象类型' }
    ];
    document.getElementById('statRow').innerHTML = cards.map(function (c) {
      return '<div class="stat-card"><div class="stat-val">' + c.v + '</div><div class="stat-lbl">' + c.l + '</div></div>';
    }).join('');
  }

  /* ── 筛选下拉 ── */
  function fillGroupSelect() {
    document.getElementById('fGroup').innerHTML = '<option value="all">全部分组</option>' + GROUPS.map(function (g) {
      return '<option value="' + g.id + '">' + g.name + '</option>';
    }).join('');
  }

  /* ── 列表 ── */
  function render() {
    var g = document.getElementById('fGroup').value;
    var aud = document.getElementById('fAud').value;
    var st = document.getElementById('fStatus').value;
    var kw = document.getElementById('fSearch').value.trim().toLowerCase();
    var list = templates.filter(function (t) {
      if (g !== 'all' && t.group !== g) return false;
      if (aud !== 'all' && String(t.aud).indexOf(aud) === -1) return false;
      if (st !== 'all' && t.status !== st) return false;
      if (kw && (t.name + t.title + t.content + t.node).toLowerCase().indexOf(kw) === -1) return false;
      return true;
    });
    document.getElementById('count').textContent = list.length;
    document.getElementById('emptyState').style.display = list.length ? 'none' : 'block';
    document.getElementById('rows').innerHTML = list.map(function (t) {
      var grp = groupOf(t.group);
      return '<tr>' +
        '<td><div class="tp-name">' + esc(t.name) + '</div><div class="tp-id">' + esc(t.id) + '</div></td>' +
        '<td><span class="node-chip" style="background:' + grp.color + ';color:' + grp.fg + '">' + grp.name + '</span><div class="node-key">' + esc(t.node) + '</div></td>' +
        '<td><span class="aud-chip">' + esc(t.aud) + '</span></td>' +
        '<td style="white-space:nowrap">' + esc(t.ch) + '</td>' +
        '<td><div class="tp-title">' + esc(t.title) + '</div><div class="tp-content">' + esc(t.content) + '</div></td>' +
        '<td><button class="st-btn ' + t.status + '" onclick="toggleTpl(\'' + esc(t.id) + '\')">' + (t.status === 'on' ? '启用中' : '已停用') + '</button></td>' +
        '<td class="upd">' + esc(t.updatedAt || '—') + '</td>' +
        '<td><div class="op"><button onclick="previewTpl(\'' + esc(t.id) + '\')">预览</button>' +
          '<button onclick="openTplModal(\'' + esc(t.id) + '\')">编辑</button>' +
          '<button class="danger" onclick="removeTpl(\'' + esc(t.id) + '\')">删除</button></div></td>' +
      '</tr>';
    }).join('');
    renderStats();
  }

  window.toggleTpl = function (id) {
    var t = templates.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    t.status = t.status === 'on' ? 'off' : 'on';
    t.updatedAt = nowStr();
    persist(); render();
  };
  window.removeTpl = async function (id) {
    var t = templates.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    if (!await showConfirm('确认删除模板「' + t.name + '」？删除后该节点通知将不再发送。', { danger: true, okText: '删除' })) return;
    templates = templates.filter(function (x) { return x.id !== id; });
    persist(); render();
  };
  window.resetTemplates = async function () {
    if (!await showConfirm('确认恢复默认模板？当前新增/修改的模板将被重置。')) return;
    localStorage.removeItem(STORE_KEY);
    templates = load();
    render();
  };

  /* ── 编辑弹窗 ── */
  function fillNodeSelect(sel) {
    sel.innerHTML = GROUPS.map(function (g) {
      var opts = NODES.filter(function (n) { return n.g === g.id; }).map(function (n) {
        return '<option value="' + n.key + '">' + g.name + ' / ' + n.tip.split('（')[0] + '</option>';
      }).join('');
      return '<optgroup label="' + g.name + '">' + opts + '</optgroup>';
    }).join('');
  }
  window.openTplModal = function (id) {
    editingId = id || '';
    var t = id ? templates.filter(function (x) { return x.id === id; })[0] : null;
    document.getElementById('modalTitle').textContent = t ? '编辑模板 · ' + t.name : '新增模板';
    fillNodeSelect(document.getElementById('tNode'));
    document.getElementById('tName').value = t ? t.name : '';
    document.getElementById('tNode').value = t ? t.node : NODES[0].key;
    document.getElementById('tAud').value = t ? t.aud : '用户';
    document.getElementById('tChannel').value = t ? t.ch : '站内消息';
    document.getElementById('tTitle').value = t ? t.title : '';
    document.getElementById('tContent').value = t ? t.content : '';
    document.getElementById('tStatus').value = t ? t.status : 'on';
    syncNodeTip();
    renderVarChips();
    document.getElementById('tplModal').classList.add('show');
  };
  window.closeTplModal = function () { document.getElementById('tplModal').classList.remove('show'); };
  function syncNodeTip() {
    var n = nodeOf(document.getElementById('tNode').value);
    document.getElementById('tNodeTip').value = n.tip;
  }
  document.getElementById('tNode').addEventListener('change', syncNodeTip);

  function renderVarChips() {
    document.getElementById('varChips').innerHTML = VARS.map(function (v) {
      return '<button type="button" class="var-chip" onclick="insertVar(\'' + v + '\')">{{' + v + '}}</button>';
    }).join('');
  }
  window.insertVar = function (v) {
    var ta = document.getElementById('tContent');
    var pos = ta.selectionStart != null ? ta.selectionStart : ta.value.length;
    var token = '{{' + v + '}}';
    ta.value = ta.value.slice(0, pos) + token + ta.value.slice(ta.selectionEnd || pos);
    ta.focus();
    ta.selectionStart = ta.selectionEnd = pos + token.length;
  };

  window.saveTpl = function () {
    var name = document.getElementById('tName').value.trim();
    var title = document.getElementById('tTitle').value.trim();
    var content = document.getElementById('tContent').value.trim();
    if (!name) { alert('请填写模板名称'); return; }
    if (!title) { alert('请填写消息标题'); return; }
    if (!content) { alert('请填写消息内容'); return; }
    var node = document.getElementById('tNode').value;
    var data = {
      name: name, node: node, group: nodeOf(node).g,
      aud: document.getElementById('tAud').value,
      ch: document.getElementById('tChannel').value,
      title: title, content: content,
      status: document.getElementById('tStatus').value,
      updatedAt: nowStr()
    };
    if (editingId) {
      var t = templates.filter(function (x) { return x.id === editingId; })[0];
      if (t) Object.assign(t, data);
    } else {
      data.id = 'tpl-' + String(templates.length + 1).padStart(3, '0') + '-' + Date.now().toString().slice(-4);
      templates.push(data);
    }
    persist(); closeTplModal(); render();
  };

  /* ── 预览 ── */
  function fillPreview(t) {
    var used = [];
    var body = String(t.content || '').replace(/\{\{([^}]+)\}\}/g, function (m, k) {
      k = k.trim();
      if (SAMPLE[k] != null) { used.push(k); return SAMPLE[k]; }
      return '{{' + k + '}}';
    });
    document.getElementById('pvTitle').textContent = t.title || '（无标题）';
    document.getElementById('pvBody').textContent = body || '（无内容）';
    document.getElementById('pvMeta').textContent = t.ch + ' · 接收：' + t.aud + ' · ' + nowStr();
    var miss = (String(t.content || '').match(/\{\{[^}]+\}\}/g) || []).filter(function (x) {
      var k = x.slice(2, -2).trim();
      return SAMPLE[k] == null;
    });
    var warn = document.getElementById('pvWarn');
    if (miss.length) {
      warn.style.display = 'block';
      warn.textContent = '以下变量无示例数据，预览中保留占位：' + Array.from(new Set(miss)).join('、');
    } else warn.style.display = 'none';
  }
  window.previewTpl = function (id) {
    var t = templates.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    fillPreview(t);
    document.getElementById('pvModal').classList.add('show');
  };
  window.previewCurrent = function () {
    var node = document.getElementById('tNode').value;
    fillPreview({
      title: document.getElementById('tTitle').value.trim() || '（未填写标题）',
      content: document.getElementById('tContent').value,
      aud: document.getElementById('tAud').value,
      ch: document.getElementById('tChannel').value,
      node: node
    });
    document.getElementById('pvModal').classList.add('show');
  };
  window.closePvModal = function () { document.getElementById('pvModal').classList.remove('show'); };

  /* ── 初始化 ── */
  fillGroupSelect();
  render();
})();
</script>
<script src="admin-batch-points.js"></script>

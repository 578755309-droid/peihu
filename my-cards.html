<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的卡包 · 佑小邦</title>
  <style>
    :root {
      --purple:#1CD8B7; --purple-dark:#0FA98C; --purple-light:#DDF7F1; --purple-bg: #F5F5F5;
      --card:#FFFFFF; --text:#1A1828; --text2:#6B6880; --text3:#AEACC0; --border:#EDE9F5;
      --sh:0 2px 16px rgba(0,0,0,0.1);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}
    .phone{width:100%;max-width:430px;display:flex;flex-direction:column;background:var(--purple-bg);min-height:100vh}
    @media (min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:42px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1),0 2px 8px rgba(0,0,0,.06)}}
    .scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .scroll-area::-webkit-scrollbar{display:none}

    .topbar{display:flex;align-items:center;gap:12px;padding:18px 16px 10px;background:linear-gradient(135deg,#1CD8B7,#0FA98C)}
    .back{width:32px;height:32px;border:0;border-radius:10px;background:rgba(255,255,255,.16);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center}
    .topbar-title{font-size:17px;font-weight:900;color:#fff}

    .head{padding:6px 16px 14px;background:linear-gradient(135deg,#1CD8B7,#0FA98C);border-radius:0 0 24px 24px}
    .head-title{font-size:20px;font-weight:900;color:#fff}
    .head-sub{font-size:12px;color:rgba(255,255,255,.75);margin-top:4px;font-weight:600}

    .list{padding:16px 14px 24px;display:flex;flex-direction:column;gap:14px}

    .bath-card{border-radius:20px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,0.1);position:relative}
    .bath-card-main{background:linear-gradient(140deg,#2BD8BC,#0FA98C);padding:18px 18px 14px;position:relative;overflow:hidden}
    .bath-card-main::after{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08);top:-60px;right:-40px}
    .bath-card-tag{display:inline-block;background:rgba(255,255,255,.2);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:3px 9px;margin-bottom:8px}
    .bath-card-name{font-size:18px;font-weight:900;color:#fff}
    .bath-card-patient{font-size:12px;color:rgba(255,255,255,.85);font-weight:700;margin-top:6px}
    .bath-card-count{position:absolute;right:18px;bottom:14px;text-align:right;z-index:1}
    .bath-card-count b{font-size:30px;font-weight:900;color:#fff;line-height:1}
    .bath-card-count span{font-size:11px;color:rgba(255,255,255,.75);font-weight:700;display:block;margin-top:2px}
    .bath-card-foot{background:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px}
    .bath-card-meta{flex:1;min-width:0}
    .bath-card-no{font-size:11px;color:var(--text3);font-weight:700}
    .bath-card-progress{height:6px;border-radius:6px;background:var(--purple-light);margin-top:7px;overflow:hidden}
    .bath-card-progress i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#2BD8BC,#C98FFF)}
    .use-btn{border:0;border-radius:999px;padding:10px 20px;background:linear-gradient(135deg,#1CD8B7,#0FA98C);color:#fff;font:800 13px inherit;cursor:pointer;flex:none;box-shadow:0 6px 14px rgba(0,0,0,0.1)}
    .use-btn:active{filter:brightness(.92)}
    .bath-card.used .bath-card-main{background:linear-gradient(140deg,#B9B4C9,#8E88A3)}
    .bath-card.used .use-btn{background:#E5E2EE;color:var(--text3);box-shadow:none;cursor:not-allowed}
    .bath-card.used .bath-card-count b{color:rgba(255,255,255,.85)}

    .empty{text-align:center;padding:70px 20px}
    .empty-ico{width:72px;height:72px;border-radius:22px;background:var(--purple-light);display:grid;place-items:center;margin:0 auto 14px}
    .empty-title{font-size:15px;font-weight:800;color:var(--text2)}
    .empty-sub{font-size:12px;color:var(--text3);margin-top:6px}
    .empty-btn{display:inline-block;margin-top:18px;border:0;border-radius:999px;padding:11px 26px;background:linear-gradient(135deg,#1CD8B7,#0FA98C);color:#fff;font:800 13px inherit;cursor:pointer}
  </style>
</head>
<body>
<div class="frame">
  <div class="phone">
    <div class="scroll-area">
      <div class="topbar">
        <button class="back" type="button" onclick="history.length>1?history.back():location.href='profile.html'">‹</button>
        <span class="topbar-title">我的卡包</span>
      </div>
      <div class="head">
        <div class="head-title">兑换卡</div>
        <div class="head-sub">购买上门助浴 10 次套餐后自动生成，按次免费兑换</div>
      </div>
      <div class="list" id="cardList"></div>
    </div>
  </div>
</div>
<script>
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function loadCards(){
    try{
      var raw=localStorage.getItem('ankebang_bath_cards');
      if(raw===null){
        /* 首次访问（如公网演示环境）：写入演示兑换卡，保证可体验兑换流程 */
        var demo=[{id:'CARD-DEMO-001',orderNo:'AKB-DEMO-0001',total:9,used:0,patient:{name:'张爷爷',gender:'男',age:'68'},createdAt:Date.now()}];
        localStorage.setItem('ankebang_bath_cards',JSON.stringify(demo));
        return demo;
      }
      var v=JSON.parse(raw||'[]');if(!Array.isArray(v))return [];return v.filter(function(c){return c.id&&String(c.id).indexOf('CARD-')===0;});
    }catch(e){return [];}
  }
  function useCard(id){
    location.href='hospital-care.html?service=bath&card='+encodeURIComponent(id);
  }
  function render(){
    var cards=loadCards();
    var box=document.getElementById('cardList');
    if(!cards.length){
      box.innerHTML='<div class="empty"><div class="empty-ico"><svg viewBox="0 0 32 32" width="34" height="34" fill="none"><rect x="4" y="8" width="24" height="17" rx="4" stroke="#1CD8B7" stroke-width="2"/><path d="M4 14h24" stroke="#1CD8B7" stroke-width="2"/><path d="M16 8v17" stroke="#1CD8B7" stroke-width="1.6" stroke-dasharray="3 3"/></svg></div><div class="empty-title">暂无兑换卡</div><div class="empty-sub">购买上门助浴 10 次套餐后自动生成兑换卡</div><button class="empty-btn" onclick="location.href=\'hospital-care.html?service=bath\'">去购买套餐</button></div>';
      return;
    }
    box.innerHTML=cards.map(function(c){
      var total=c.total||10, used=c.used||0, left=Math.max(0,total-used);
      var done=left<=0;
      var p=c.patient||{};
      return '<div class="bath-card'+(done?' used':'')+'">'+
        '<div class="bath-card-main">'+
          '<span class="bath-card-tag">上门助浴 · 兑换卡</span>'+
          '<div class="bath-card-name">10 次助浴兑换卡</div>'+
          '<div class="bath-card-patient">适用对象：'+esc(p.name||'—')+'（'+(p.gender||'')+' · '+(p.age||'?')+'岁 · 锁定）</div>'+
          '<div class="bath-card-count"><b>'+left+'</b><span>剩余次数 / 共 '+total+' 次</span></div>'+
        '</div>'+
        '<div class="bath-card-foot">'+
          '<div class="bath-card-meta"><div class="bath-card-no">卡号 '+esc(c.id)+'</div><div class="bath-card-progress"><i style="width:'+Math.round(left/total*100)+'%"></i></div></div>'+
          (done?'<button class="use-btn" type="button" disabled>已用完</button>':'<button class="use-btn" type="button" onclick="useCard(\''+esc(c.id)+'\')">去使用</button>')+
        '</div>'+
      '</div>';
    }).join('');
  }
  render();
</script>
</body>
</html>

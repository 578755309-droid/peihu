<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
<script src="common-ui.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>护理日报</title>
  <style>
    :root {
      --purple:       #1CD8B7;
      --purple-dark:  #0FA98C;
      --purple-light: #DDF7F1;
      --purple-bg: #F5F5F5;
      --card:         #FFFFFF;
      --text:         #1A1828;
      --text2:        #6B6880;
      --text3:        #AEACC0;
      --border:       #EDE9F5;
      --green:        #16A34A;
      --green-bg:     #DCFCE7;
      --sh: 0 2px 16px rgba(0,0,0,0.1);
      --r-lg: 12px; --r-md: 12px; --r-sm: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--purple-bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Desktop frame */
    .frame { display: flex; justify-content: center; min-height: 100vh; background: #F5F5F5; }
    .phone {
      width: 100%; max-width: 430px;
      display: flex; flex-direction: column; background: var(--purple-bg); min-height: 100vh;
    }
    @media (min-width: 520px) {
      .frame { align-items: flex-start; padding: 20px 0 40px; }
      .phone {
        height: 900px; min-height: unset; border-radius: 12px; overflow: hidden;
        box-shadow: 0 24px 72px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,.06);
      }
    }

    .scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding-bottom: 88px; }
    .scroll-area::-webkit-scrollbar { display: none; }

    /* Status bar */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 13px 22px 8px; font-size: 14px; font-weight: 600;
      background: var(--card); letter-spacing: .2px;
    }
    .status-right { display: flex; align-items: center; gap: 5px; }
    .status-right svg { width: 17px; height: 17px; }

    /* Navbar */
    .navbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px 12px; background: var(--card);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .back-btn {
      width: 36px; height: 36px; border: none; cursor: pointer;
      background: var(--purple-light); border-radius: 12px;
      display: grid; place-items: center; -webkit-tap-highlight-color: transparent;
    }
    .back-btn svg { width: 20px; height: 20px; }
    .nav-title { font-size: 17px; font-weight: 600; color: var(--text); }
    .nav-ph { width: 36px; }

    /* ── Date strip ── */
    .date-strip {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 11px 16px; position: sticky; top: 56px; z-index: 9;
    }
    .date-arrow {
      width: 34px; height: 34px; border: none; cursor: pointer;
      background: var(--purple-bg); border-radius: 12px;
      display: grid; place-items: center; -webkit-tap-highlight-color: transparent;
      transition: background .12s;
    }
    .date-arrow:active { background: var(--purple-light); }
    .date-arrow svg { width: 18px; height: 18px; }
    .date-center {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
      position: relative;
    }
    .date-label {
      font-size: 16px; font-weight: 600; color: var(--text); letter-spacing: .3px;
    }
    .date-label span { color: var(--purple); }
    .cal-icon { color: var(--purple); }
    .cal-icon svg { width: 18px; height: 18px; display: block; }
    /* hidden native date input layered over center */
    #datePicker {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
      font-size: 16px; /* prevent iOS zoom */
    }
    .date-dot {
      width: 6px; height: 6px; border-radius: 12px;
      background: var(--purple); margin-top: 2px;
    }

    /* ── Content ── */
    .content { padding: 14px; display: flex; flex-direction: column; gap: 14px; }

    /* Shared card */
    .card {
      background: var(--card); border-radius: 12px;
      box-shadow: var(--sh); overflow: hidden;
    }
    .card-hd {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
    }
    .card-hd-left { display: flex; align-items: center; gap: 8px; }
    .sec-dot { width: 8px; height: 8px; border-radius: 12px; background: var(--purple); flex-shrink: 0; }
    .sec-title { font-size: 14px; font-weight: 600; color: var(--text); }

    /* ── Status tags ── */
    .status-tags { display: flex; gap: 8px; padding: 14px 16px; flex-wrap: wrap; }
    .tag {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 12px; border-radius: 12px;
      font-size: 13px; font-weight: 600;
    }
    .tag svg { width: 13px; height: 13px; }
    .tag-green  { background: var(--green-bg); color: var(--green); }
    .tag-purple { background: var(--purple-light); color: var(--purple); }
    .tag-gray   { background: #F1F5F9; color: #64748B; }

    /* ── Nurse identity row ── */
    .nurse-id {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px; background: var(--purple-bg);
      border-radius: 12px; margin: 0 16px 14px;
    }
    .nid-av {
      width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
      display: grid; place-items: center;
      font-size: 14px; font-weight: 700; color: #fff;
      background: linear-gradient(140deg,#7B3FBE,#AA7AE0);
    }
    .nid-name  { font-size: 14px; font-weight: 600; color: var(--text); }
    .nid-time  { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .nid-badge {
      margin-left: auto; font-size: 11px; font-weight: 600;
      background: var(--green-bg); color: var(--green);
      padding: 3px 8px; border-radius: 12px;
    }

    /* ── Text description ── */
    .report-text {
      padding: 0 16px 16px; font-size: 14px; color: var(--text2);
      line-height: 1.85; white-space: pre-line;
    }
    .report-text strong { color: var(--text); font-weight: 600; }

    /* ── Photo grid ── */
    .photo-section { padding: 14px 16px; }
    .photo-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .photo-cell {
      aspect-ratio: 1; border-radius: 12px;
      background: var(--purple-bg); border: 1.5px dashed var(--border);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 6px; cursor: pointer; position: relative; overflow: hidden;
      transition: border-color .15s, background .15s;
    }
    .photo-cell:active { border-color: var(--purple); background: var(--purple-light); }
    .photo-cell svg { width: 28px; height: 28px; opacity: .45; }
    .photo-cell span { font-size: 12px; font-weight: 600; color: var(--text3); }
    /* Filled cell simulation */
    .photo-cell.filled { border-style: solid; border-color: transparent; background: #ddd; }
    .photo-cell.filled .photo-img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; border-radius: 12px;
    }
    .photo-cell .photo-num {
      position: absolute; bottom: 5px; right: 6px;
      font-size: 11px; font-weight: 600; color: #fff;
      background: rgba(0,0,0,.38); padding: 1px 5px; border-radius: 12px;
    }

    /* Photo placeholder colors (simulated photos) */
    .photo-cell:nth-child(1) { background: linear-gradient(135deg,#C9D6FF,#E2E2E2); border-style: solid; border-color: transparent; }
    .photo-cell:nth-child(2) { background: linear-gradient(135deg,#D4F1C9,#E2E2E2); border-style: solid; border-color: transparent; }
    .photo-cell:nth-child(3) { background: linear-gradient(135deg,#FDE8C8,#E2E2E2); border-style: solid; border-color: transparent; }
    .photo-cell:nth-child(1) svg,
    .photo-cell:nth-child(2) svg,
    .photo-cell:nth-child(3) svg { opacity: .22; }

    /* ── Video placeholder ── */
    .video-section { padding: 0 16px 16px; }
    .video-cell {
      width: 100%; aspect-ratio: 16/9; border-radius: 12px;
      background: linear-gradient(135deg,#2D1B52,#4A2B7A);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; cursor: pointer; position: relative; overflow: hidden;
    }
    .video-cell::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 30% 40%, rgba(255,255,255,.08), transparent 60%);
    }
    .play-btn {
      width: 52px; height: 52px; border-radius: 12px;
      background: rgba(255,255,255,.18); backdrop-filter: blur(4px);
      display: grid; place-items: center; border: 2px solid rgba(255,255,255,.35);
    }
    .play-btn svg { width: 22px; height: 22px; margin-left: 3px; }
    .video-lbl { font-size: 14px; font-weight: 600; color: rgba(255,255,255,.75); }
    .video-dur {
      position: absolute; bottom: 10px; right: 12px;
      font-size: 13px; font-weight: 600; color: rgba(255,255,255,.7);
      background: rgba(0,0,0,.35); padding: 2px 8px; border-radius: 12px;
    }

    /* ── Vital signs ── */
    .vitals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 16px; }
    .vital-item {
      background: var(--purple-bg); border-radius: 12px;
      padding: 11px 13px;
    }
    .vital-lbl { font-size: 12px; color: var(--text3); font-weight: 600; margin-bottom: 4px; }
    .vital-val { font-size: 18px; font-weight: 700; color: var(--text); }
    .vital-val span { font-size: 12px; font-weight: 600; color: var(--text3); margin-left: 2px; }
    .vital-trend { font-size: 12px; font-weight: 600; margin-top: 3px; }
    .trend-ok { color: var(--green); }
    .trend-warn { color: #D97706; }

    /* ── Bottom bar ── */
    .bottom-bar {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: var(--card); border-top: 1px solid var(--border);
      padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
      z-index: 20;
    }
    .btn-back {
      width: 100%; height: 50px; border-radius: 12px; border: 2px solid var(--purple);
      background: transparent; color: var(--purple);
      font-size: 15px; font-weight: 600; letter-spacing: .3px;
      font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 7px;
      -webkit-tap-highlight-color: transparent; transition: background .12s;
    }
    .btn-back:active { background: var(--purple-light); }
    .btn-back svg { width: 18px; height: 18px; }

    /* ── Share button ── */
    .share-btn {
      width: 36px; height: 36px; border: none; cursor: pointer;
      background: var(--purple-light); border-radius: 12px;
      display: grid; place-items: center; -webkit-tap-highlight-color: transparent;
      transition: background .12s;
    }
    .share-btn:active { background: #D9CFF0; }
    .share-btn svg { width: 18px; height: 18px; }

    /* ── Per-sentence record items ── */
    .record-list { padding: 0 16px 12px; }
    .record-item {
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .record-item:last-child { border-bottom: none; }
    .record-item-text {
      font-size: 14px; color: var(--text2); line-height: 1.8;
    }
    .record-item-text strong { color: var(--text); font-weight: 600; }
    /* Keep the report action bar inside the phone frame on desktop previews. */
    .phone{position:relative}
    .bottom-bar{position:absolute;left:0;transform:none;width:100%;max-width:none}
  </style>
  <link rel="stylesheet" href="visual-theme.css" />
</head>

<script>
  /* ── Date navigation ── */
  const picker = document.getElementById('datePicker');
  const label  = document.getElementById('dateLabel');
  const MIN_DATE = new Date('2026-04-01');
  const MAX_DATE = new Date('2026-04-17');

  function renderLabel(val) {
    const [y, m, d] = val.split('-');
    label.innerHTML = `<span>${y}</span>-${m}-${d}`;
  }

  function shiftDate(delta) {
    const cur = new Date(picker.value);
    cur.setDate(cur.getDate() + delta);
    if (cur < MIN_DATE || cur > MAX_DATE) return;
    const iso = cur.toISOString().slice(0, 10);
    picker.value = iso;
    renderLabel(iso);
  }

  function onDateChange(val) {
    renderLabel(val);
  }

  renderLabel(picker.value);

  /* ── Share ── */
  function shareReport() {
    if (navigator.share) {
      navigator.share({ title: '护理日报 - 2026-04-17', text: '查看今日护理日报详情', url: location.href }).catch(() => {});
    } else {
      alert('分享链接已复制到剪贴板');
    }
  }

  /* ── Nursing records ── */
  const RECORDS = [
    { key: 'diet',     label: '饮食',     text: '早餐进食约 200ml 稀粥，午餐进食七成，患者食欲较昨日改善，无呙咳。' },
    { key: 'medicine', label: '用药',     text: '08:30 按时服用降压药（硝苯地平缓释片 1 片），11:00 输液 250ml 已完成，无不良反应。' },
    { key: 'activity', label: '活动',     text: '上午协助患者床边坐立约 20 分钟，精神状态尚可，未诉头晕。下午在走廊缓慢步行 10 分钟，步态稳定。' },
    { key: 'excrete',  label: '排泄',     text: '大便 1 次，成形，正常。小便次数正常，颜色淡黄。' },
    { key: 'mood',     label: '情绪',     text: '患者今日情绪较为稳定，主动与护理员交流，睡眠质量良好，夜间未呼叫。' },

  function renderRecordList() {
    const el = document.getElementById('recordList');
    el.innerHTML = RECORDS.map(r => `<div class="record-item">
        <div class="record-item-text"><strong>${r.label}：</strong>${r.text}</div>

  }
  renderRecordList();

  /* ── Photo preview ── */
  function previewPhoto(n) {
    const labels = ['用餐记录', '活动记录', '用药记录'];
    alert(`预览第 ${n} 张：${labels[n-1]}\n（图片查看功能开发中）`);
  }
</script>

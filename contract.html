  <meta charset="utf-8" />

  <title>电子合同 · 佑小邦</title>
  <script src="admin-contract-data.js"></script>
  <style>
    :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#22A06B;--orange:#D97706;--red:#EF4444;--sh:0 2px 16px rgba(0,0,0,0.1)}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}button{font:inherit}.frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg);position:relative}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;background:#fff}.status-bar span{font-size:13px;font-weight:600}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:12px}.nav{height:58px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}.nav h1{font-size:18px;font-weight:700}.back{position:absolute;left:16px;width:34px;height:34px;border:0;background:var(--purple-light);border-radius:12px;color:var(--purple);display:grid;place-items:center;cursor:pointer}.back svg{width:18px;height:18px}.scroll{flex:1;overflow:auto;padding:14px 14px 92px}.scroll::-webkit-scrollbar{display:none}
    .state-card{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:14px 16px;display:flex;align-items:center;gap:12px}.state-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}.state-icon svg{width:24px;height:24px}.state-icon.pending{background:#FEF3C7;color:var(--orange)}.state-icon.signed{background:#DCFCE7;color:var(--green)}.state-title{font-size:16px;font-weight:700}.state-desc{font-size:13px;color:var(--text2);margin-top:3px}
    .paper{background:#fff;border-radius:12px;box-shadow:var(--sh);margin-top:12px;padding:22px 20px;position:relative;overflow:hidden}.paper:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 8%,rgba(0,0,0,0.1),transparent 42%);pointer-events:none}.paper-title{text-align:center;font-size:19px;font-weight:700;letter-spacing:1px}.paper-no{text-align:center;margin-top:8px;font-size:12px;color:var(--text3);font-weight:600}.paper-parties{margin-top:16px;padding:12px 14px;border-radius:12px;background:#F7F5FC;font-size:13px;line-height:1.9;color:var(--text2)}.paper-parties strong{color:var(--text);font-weight:600}.paper-meta{margin-top:14px;display:grid;gap:8px}.paper-meta-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;font-size:13px;line-height:1.5}.paper-meta-row b{color:var(--text3);font-weight:600}.paper-meta-row span{color:var(--text);font-weight:600}.paper-clauses{margin-top:16px;border-top:1px dashed var(--border);padding-top:14px}.clause{display:flex;gap:8px;margin-bottom:12px}.clause-idx{flex-shrink:0;width:20px;height:20px;border-radius:12px;background:var(--purple-light);color:var(--purple);font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:1px}.clause p{font-size:13px;color:var(--text2);line-height:1.75}.paper-footer{margin-top:6px;border-top:1px dashed var(--border);padding-top:14px;font-size:12px;color:var(--text3);line-height:1.7}.seal-zone{margin-top:16px;display:flex;justify-content:flex-end}.seal{position:relative;width:150px;padding:14px 12px;border:1.5px dashed #E3B7B7;border-radius:12px;text-align:center}.seal-text{font-size:11px;color:#C04444;font-weight:600;line-height:1.5}.seal-sign{margin-top:8px}.seal-sign img{max-width:120px;max-height:52px}.seal-empty{margin-top:8px;font-size:11px;color:var(--text3)}
    .sign-card{background:#fff;border-radius:12px;box-shadow:var(--sh);margin-top:12px;padding:16px}.sign-title{font-size:15px;font-weight:700}.sign-desc{margin-top:5px;font-size:12px;color:var(--text3)}.sign-name{margin-top:12px}.sign-name label{display:block;font-size:12px;color:var(--text2);font-weight:600;margin-bottom:6px}.sign-name input{width:100%;height:42px;border:1.5px solid var(--border);border-radius:12px;padding:0 12px;font:inherit;font-size:14px;font-weight:600;color:var(--text);background:#FBFAFD;outline:none}.sign-name input:focus{border-color:var(--purple)}.sign-pad{margin-top:12px;border:1.5px dashed #C9BCE3;border-radius:12px;background:repeating-linear-gradient(0deg,#FCFBFE,#FCFBFE 27px,#F3EEF9 28px);position:relative;overflow:hidden}.sign-pad canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}.sign-hint{position:absolute;inset:0;display:grid;place-items:center;color:#C6BEE0;font-size:14px;font-weight:600;pointer-events:none;transition:opacity .15s}.sign-pad.inked .sign-hint{opacity:0}.sign-tools{display:flex;justify-content:flex-end;margin-top:8px}.sign-clear{border:0;background:none;color:var(--purple);font-size:13px;font-weight:600;cursor:pointer}
    .signed-card{background:#fff;border-radius:12px;box-shadow:var(--sh);margin-top:12px;padding:16px}.signed-head{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:700;color:var(--green)}.signed-head svg{width:20px;height:20px}.signed-img{margin-top:12px;border:1.5px solid #D9F0E5;border-radius:12px;background:#F7FCF9;padding:14px;display:grid;place-items:center;min-height:90px}.signed-img img{max-width:200px;max-height:76px}.signed-meta{margin-top:10px;font-size:13px;color:var(--text2);line-height:1.8}.signed-meta b{color:var(--text)}
    .bottom-actions{position:absolute;bottom:0;left:0;right:0;z-index:12;background:rgba(255,255,255,.98);border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px}.bottom-actions button{height:44px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--text2);font-size:14px;font-weight:600;cursor:pointer;min-width:0}.bottom-actions .ghost{flex:1}.bottom-actions .primary{flex:1.6;border-color:var(--purple);background:var(--purple);color:#fff}.bottom-actions .primary:disabled{background:#CFC8DE;border-color:#CFC8DE;cursor:not-allowed}
    .empty{padding:80px 20px;text-align:center;color:var(--text3);font-size:14px;line-height:1.8}
    .toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.95);z-index:30;background:rgba(26,24,40,.88);color:#fff;font-size:14px;font-weight:600;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:80%;text-align:center;line-height:1.5}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  </style>

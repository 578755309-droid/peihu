<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>电子合同 · 佑小邦</title>
  <script src="admin-contract-data.js"></script>
  <style>
    :root{--purple:#8655C5;--purple-dark:#6B3FAA;--purple-light:#EDE6F7;--purple-bg:#F5F3FA;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#22A06B;--orange:#D97706;--red:#EF4444;--sh:0 2px 16px rgba(100,60,160,.08)}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}button{font:inherit}.frame{display:flex;justify-content:center;min-height:100vh;background:#E4DDF0}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg);position:relative}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:42px;overflow:hidden;box-shadow:0 24px 72px rgba(80,40,140,.22)}}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;background:#fff}.status-bar span{font-size:12px;font-weight:700}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:12px}.nav{height:58px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}.nav h1{font-size:18px;font-weight:900}.back{position:absolute;left:16px;width:34px;height:34px;border:0;background:var(--purple-light);border-radius:11px;color:var(--purple);display:grid;place-items:center;cursor:pointer}.back svg{width:18px;height:18px}.scroll{flex:1;overflow:auto;padding:14px 14px 92px}.scroll::-webkit-scrollbar{display:none}
    .state-card{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:14px 16px;display:flex;align-items:center;gap:12px}.state-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex-shrink:0}.state-icon svg{width:24px;height:24px}.state-icon.pending{background:#FEF3C7;color:var(--orange)}.state-icon.signed{background:#DCFCE7;color:var(--green)}.state-title{font-size:16px;font-weight:900}.state-desc{font-size:12px;color:var(--text2);margin-top:3px}
    .paper{background:#fff;border-radius:20px;box-shadow:var(--sh);margin-top:12px;padding:22px 20px;position:relative;overflow:hidden}.paper:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 88% 8%,rgba(134,85,197,.05),transparent 42%);pointer-events:none}.paper-title{text-align:center;font-size:19px;font-weight:900;letter-spacing:1px}.paper-no{text-align:center;margin-top:8px;font-size:11px;color:var(--text3);font-weight:700}.paper-parties{margin-top:16px;padding:12px 14px;border-radius:12px;background:#F7F5FC;font-size:12px;line-height:1.9;color:var(--text2)}.paper-parties strong{color:var(--text);font-weight:800}.paper-meta{margin-top:14px;display:grid;gap:8px}.paper-meta-row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;font-size:12px;line-height:1.5}.paper-meta-row b{color:var(--text3);font-weight:600}.paper-meta-row span{color:var(--text);font-weight:700}.paper-clauses{margin-top:16px;border-top:1px dashed var(--border);padding-top:14px}.clause{display:flex;gap:8px;margin-bottom:12px}.clause-idx{flex-shrink:0;width:20px;height:20px;border-radius:6px;background:var(--purple-light);color:var(--purple);font-size:11px;font-weight:900;display:grid;place-items:center;margin-top:1px}.clause p{font-size:12px;color:var(--text2);line-height:1.75}.paper-footer{margin-top:6px;border-top:1px dashed var(--border);padding-top:14px;font-size:11px;color:var(--text3);line-height:1.7}.seal-zone{margin-top:16px;display:flex;justify-content:flex-end}.seal{position:relative;width:150px;padding:14px 12px;border:1.5px dashed #E3B7B7;border-radius:12px;text-align:center}.seal-text{font-size:10px;color:#C04444;font-weight:800;line-height:1.5}.seal-sign{margin-top:8px}.seal-sign img{max-width:120px;max-height:52px}.seal-empty{margin-top:8px;font-size:10px;color:var(--text3)}
    .sign-card{background:#fff;border-radius:20px;box-shadow:var(--sh);margin-top:12px;padding:16px}.sign-title{font-size:15px;font-weight:900}.sign-desc{margin-top:5px;font-size:11px;color:var(--text3)}.sign-name{margin-top:12px}.sign-name label{display:block;font-size:11px;color:var(--text2);font-weight:700;margin-bottom:6px}.sign-name input{width:100%;height:42px;border:1.5px solid var(--border);border-radius:11px;padding:0 12px;font:inherit;font-size:13px;font-weight:700;color:var(--text);background:#FBFAFD;outline:none}.sign-name input:focus{border-color:var(--purple)}.sign-pad{margin-top:12px;border:1.5px dashed #C9BCE3;border-radius:14px;background:repeating-linear-gradient(0deg,#FCFBFE,#FCFBFE 27px,#F3EEF9 28px);position:relative;overflow:hidden}.sign-pad canvas{display:block;width:100%;height:170px;touch-action:none;cursor:crosshair}.sign-hint{position:absolute;inset:0;display:grid;place-items:center;color:#C6BEE0;font-size:13px;font-weight:700;pointer-events:none;transition:opacity .15s}.sign-pad.inked .sign-hint{opacity:0}.sign-tools{display:flex;justify-content:flex-end;margin-top:8px}.sign-clear{border:0;background:none;color:var(--purple);font-size:12px;font-weight:800;cursor:pointer}
    .signed-card{background:#fff;border-radius:20px;box-shadow:var(--sh);margin-top:12px;padding:16px}.signed-head{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:900;color:var(--green)}.signed-head svg{width:20px;height:20px}.signed-img{margin-top:12px;border:1.5px solid #D9F0E5;border-radius:12px;background:#F7FCF9;padding:14px;display:grid;place-items:center;min-height:90px}.signed-img img{max-width:200px;max-height:76px}.signed-meta{margin-top:10px;font-size:12px;color:var(--text2);line-height:1.8}.signed-meta b{color:var(--text)}
    .bottom-actions{position:absolute;bottom:0;left:0;right:0;z-index:12;background:rgba(255,255,255,.98);border-top:1px solid var(--border);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px}.bottom-actions button{height:44px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--text2);font-size:13px;font-weight:800;cursor:pointer;min-width:0}.bottom-actions .ghost{flex:1}.bottom-actions .primary{flex:1.6;border-color:var(--purple);background:var(--purple);color:#fff}.bottom-actions .primary:disabled{background:#CFC8DE;border-color:#CFC8DE;cursor:not-allowed}
    .empty{padding:80px 20px;text-align:center;color:var(--text3);font-size:13px;line-height:1.8}
    .toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.95);z-index:30;background:rgba(26,24,40,.88);color:#fff;font-size:13px;font-weight:700;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:80%;text-align:center;line-height:1.5}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  </style>
</head>
<body>
<div class="frame"><div class="phone">
  <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#1A1828"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#1A1828"/><rect x="9" y=".5" width="3" height="11.5" rx="1" fill="#1A1828"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#1A1828" opacity=".35"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="#1A1828" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="#1A1828"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#1A1828"/></svg></div></div>
  <header class="nav"><button class="back" onclick="history.length>1?history.back():location.href='orders.html'" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>电子合同</h1></header>
  <main class="scroll" id="body"></main>
  <div class="bottom-actions" id="actions" style="display:none"></div>
  <div class="toast" id="toast"></div>
</div></div>
<script>
(function(){
  var esc=window.AKBContract.esc;
  var qs=new URLSearchParams(location.search);
  var orderNo=qs.get('no')||'';
  var rec=window.AKBContract.recordFor(orderNo);
  var tpl=window.AKBContract.getTemplate();
  var body=document.getElementById('body');
  var actions=document.getElementById('actions');
  var hasInk=false;

  function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1800);}

  function stateCard(){
    if(rec.status==='已签署'){
      return '<div class="state-card"><div class="state-icon signed"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><div class="state-title" style="color:var(--green)">合同已签署</div><div class="state-desc">签署时间：'+esc(rec.signedAt)+'</div></div></div>';
    }
    return '<div class="state-card"><div class="state-icon pending"><svg viewBox="0 0 24 24" fill="none"><path d="M12 8v5l3 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.2"/></svg></div><div><div class="state-title" style="color:var(--orange)">待签署</div><div class="state-desc">护理员已发起电子合同，请阅读并签名确认</div></div></div>';
  }

  function metaRow(k,v){return v?'<div class="paper-meta-row"><b>'+k+'</b><span>'+esc(v)+'</span></div>':'';}

  function paper(){
    var clauses=tpl.clauses.map(function(c,i){return '<div class="clause"><span class="clause-idx">'+(i+1)+'</span><p>'+esc(c)+'</p></div>';}).join('');
    var sealSign=rec.status==='已签署'&&rec.signImage
      ?'<div class="seal-sign"><img src="'+rec.signImage+'" alt="乙方签名"></div>'
      :'<div class="seal-empty">乙方签署后此处显示签名</div>';
    return '<section class="paper">'
      +'<div class="paper-title">'+esc(tpl.title)+'</div>'
      +'<div class="paper-no">合同编号：'+esc(rec.contractNo)+'</div>'
      +'<div class="paper-parties"><strong>'+esc(tpl.partyALabel)+'：</strong>'+esc(tpl.partyA)+'<br><strong>'+esc(tpl.partyBLabel)+'：</strong>'+esc(rec.userName)+'</div>'
      +'<div class="paper-meta">'
      +metaRow('关联订单',rec.orderNo)
      +metaRow('服务项目',rec.serviceType)
      +metaRow('服务期限',rec.serviceTime)
      +metaRow('服务地址',rec.address)
      +metaRow('服务费用',rec.amount)
      +metaRow('发起时间',rec.issuedAt+' · '+rec.issuedBy)
      +'</div>'
      +'<div class="paper-clauses">'+clauses+'</div>'
      +'<div class="paper-footer">'+esc(tpl.footerNote)+'</div>'
      +'<div class="seal-zone"><div class="seal"><div class="seal-text">'+esc(tpl.sealText)+'</div>'+sealSign+'</div></div>'
      +'</section>';
  }

  function signCard(){
    return '<section class="sign-card"><div class="sign-title">乙方签名</div><div class="sign-desc">请在下方区域手写签名，签名即代表您已阅读并同意合同全部条款</div>'
      +'<div class="sign-name"><label>签署人姓名</label><input id="signerName" maxlength="12" placeholder="请输入签署人姓名" value=""></div>'
      +'<div class="sign-pad" id="pad"><canvas id="cv"></canvas><div class="sign-hint">请在此区域手写签名</div></div>'
      +'<div class="sign-tools"><button class="sign-clear" type="button" onclick="clearPad()">清除重签</button></div></section>';
  }

  function signedCard(){
    return '<section class="signed-card"><div class="signed-head"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>乙方签名</div>'
      +'<div class="signed-img">'+(rec.signImage?'<img src="'+rec.signImage+'" alt="签名">':'<span style="color:var(--text3);font-size:12px">签名存档</span>')+'</div>'
      +'<div class="signed-meta">签署人：<b>'+esc(rec.signerName)+'</b><br>签署时间：<b>'+esc(rec.signedAt)+'</b><br>签署方式：<b>电子签名（与手写签名具有同等法律效力）</b></div></section>';
  }

  function render(){
    if(!rec){
      body.innerHTML='<div class="empty">未找到该订单的电子合同<br>请联系护理员发起后再签署</div>';
      actions.style.display='none';
      return;
    }
    body.innerHTML=stateCard()+paper()+(rec.status==='已签署'?signedCard():signCard());
    if(rec.status==='已签署'){
      actions.style.display='flex';
      actions.innerHTML='<button class="primary" onclick="history.length>1?history.back():location.href=\'order-detail.html?no='+encodeURIComponent(orderNo)+'\'">返回订单</button>';
    }else{
      actions.style.display='flex';
      actions.innerHTML='<button class="ghost" onclick="history.back()">暂不签署</button><button class="primary" id="confirmBtn" onclick="confirmSign()">确认签署</button>';
      initPad();
    }
  }

  var cv,ctx,drawing=false,last=null;
  function initPad(){
    cv=document.getElementById('cv');ctx=cv.getContext('2d');
    var pad=document.getElementById('pad');
    var ratio=window.devicePixelRatio||1;
    var w=pad.clientWidth,h=170;
    cv.width=w*ratio;cv.height=h*ratio;cv.style.height=h+'px';
    ctx.scale(ratio,ratio);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#1F3FA0';
    function pos(e){var r=cv.getBoundingClientRect();var p=e.touches?e.touches[0]:e;return {x:p.clientX-r.left,y:p.clientY-r.top};}
    function start(e){e.preventDefault();drawing=true;last=pos(e);}
    function move(e){if(!drawing)return;e.preventDefault();var p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;if(!hasInk){hasInk=true;pad.classList.add('inked');}}
    function end(){drawing=false;}
    cv.addEventListener('mousedown',start);cv.addEventListener('mousemove',move);window.addEventListener('mouseup',end);
    cv.addEventListener('touchstart',start,{passive:false});cv.addEventListener('touchmove',move,{passive:false});cv.addEventListener('touchend',end);
  }

  window.clearPad=function(){
    if(!ctx)return;
    ctx.clearRect(0,0,cv.width,cv.height);hasInk=false;
    document.getElementById('pad').classList.remove('inked');
  };

  window.confirmSign=function(){
    var name=document.getElementById('signerName').value.trim();
    if(!name){toast('请输入签署人姓名');return;}
    if(!hasInk){toast('请先手写签名');return;}
    var img=cv.toDataURL('image/png');
    rec=window.AKBContract.sign(orderNo,{signerName:name,signImage:img});
    toast('签署成功，合同已生效');
    setTimeout(render,600);
  };

  render();
})();
</script>
</body>
</html>

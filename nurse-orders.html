<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的订单 · 护理员端</title>
  <style>
    :root{--purple:#8655C5;--purple-dark:#6B3FAA;--purple-light:#EDE6F7;--purple-bg:#F5F3FA;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#16A34A;--green-bg:#DCFCE7;--red:#DC2626;--red-bg:#FEE2E2;--amber:#D97706;--amber-bg:#FEF3C7;--blue:#397EED;--blue-bg:#E8F1FF;--sh:0 2px 16px rgba(100,60,160,.08);--r-lg:20px;--r-md:14px;--r-sm:10px}
    *,*:before,*:after{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}.frame{display:flex;justify-content:center;min-height:100vh;background:#E4DDF0}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg)}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:42px;overflow:hidden;box-shadow:0 24px 72px rgba(80,40,140,.22)}}
    .scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}.scroll::-webkit-scrollbar{display:none}.status-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;background:#fff;font-size:13px;font-weight:700}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:17px}.navbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}.back-btn{width:36px;height:36px;border:0;border-radius:11px;background:var(--purple-light);color:var(--purple);display:grid;place-items:center;cursor:pointer}.back-btn svg{width:20px;height:20px}.nav-title{font-size:17px;font-weight:900}.nav-ph{width:36px}.status-tabs{display:flex;overflow:auto;background:#fff;border-bottom:1px solid var(--border);padding:0 8px;position:sticky;top:58px;z-index:9}.status-tabs::-webkit-scrollbar{display:none}.status-tab{flex:1;min-width:62px;padding:12px 4px 10px;border:0;border-bottom:2.5px solid transparent;background:none;color:var(--text3);font:700 11px inherit;white-space:nowrap;cursor:pointer}.status-tab.on{color:var(--purple);border-bottom-color:var(--purple)}.status-count{margin-left:2px;font-size:10px}.content{padding:14px 14px 30px;display:flex;flex-direction:column;gap:12px}.order-card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh);overflow:hidden}.order-main{padding:15px 16px 13px}.order-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.order-no{font-size:11px;color:var(--text3);font-weight:600}.state{padding:4px 9px;border-radius:15px;font-size:11px;font-weight:800;white-space:nowrap}.state.pending-confirm{background:var(--amber-bg);color:var(--amber)}.state.pending-start{background:#FFF1DD;color:#C26C16}.state.in-progress{background:var(--green-bg);color:var(--green)}.state.pending-complete{background:var(--purple-light);color:var(--purple)}.state.completed{background:#F1F5F9;color:#64748B}.state.cancelled{background:var(--red-bg);color:var(--red)}.patient-line{display:flex;align-items:center;gap:11px;margin-top:14px}.patient-avatar{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#3B82F6,#60A5FA);color:#fff;font-size:17px;font-weight:900;flex-shrink:0}.patient-copy{min-width:0;flex:1}.patient-name{font-size:16px;font-weight:900}.patient-meta{margin-top:4px;color:var(--text2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.service-tag{padding:4px 8px;border-radius:6px;background:var(--purple-light);color:var(--purple);font-size:11px;font-weight:800;white-space:nowrap}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.info-cell{padding:9px 10px;border-radius:var(--r-sm);background:var(--purple-bg)}.info-label{color:var(--text3);font-size:10px;font-weight:600}.info-value{margin-top:3px;color:var(--text);font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info-value.accent{color:var(--purple)}.cancel-note{margin-top:11px;padding:9px 10px;border-radius:var(--r-sm);background:var(--red-bg);color:#991B1B;font-size:11px;line-height:1.5}.order-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 14px}.action{height:35px;padding:0 13px;border-radius:18px;border:1px solid var(--border);background:#fff;color:var(--text2);font:800 11px inherit;cursor:pointer}.action.primary{border-color:var(--purple);background:var(--purple);color:#fff}.action.green{border-color:var(--green);background:var(--green);color:#fff}.action.amber{border-color:var(--amber);background:var(--amber);color:#fff}.empty{padding:52px 20px;text-align:center;color:var(--text3);font-size:13px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh)}.empty strong{display:block;color:var(--text2);font-size:15px;margin-bottom:5px}.bottom-nav{flex-shrink:0;display:flex;background:var(--card);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;text-decoration:none}.nav-item svg{width:24px;height:24px}.nav-lbl{font-size:11px;font-weight:700;color:var(--text3)}.nav-item.active .nav-lbl{color:var(--purple)}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);padding:17px 25px;border-radius:16px;background:rgba(25,15,45,.9);color:#fff;font-size:14px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.photo-overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(25,15,45,.48);opacity:0;pointer-events:none;transition:opacity .2s}.photo-overlay.show{opacity:1;pointer-events:auto}.photo-sheet{width:min(430px,100%);padding:18px 16px calc(20px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#fff}.photo-head{display:flex;align-items:center;justify-content:space-between}.photo-title{font-size:17px;font-weight:900}.photo-close{border:0;background:var(--purple-light);color:var(--text2);width:32px;height:32px;border-radius:10px;font-size:20px;cursor:pointer}.photo-desc{margin-top:9px;color:var(--text2);font-size:12px;line-height:1.5}.photo-upload{display:flex;align-items:center;gap:10px;margin-top:15px}.photo-picker{width:82px;height:82px;display:grid;place-items:center;border:1.5px dashed #CFC2E7;border-radius:12px;background:var(--purple-bg);color:var(--purple);cursor:pointer}.photo-picker svg{width:25px;height:25px}.photo-preview{width:82px;height:82px;border-radius:12px;object-fit:cover}.photo-actions{display:flex;gap:8px;margin-top:17px}.photo-actions button{flex:1;height:43px;border:0;border-radius:12px;font:800 13px inherit;cursor:pointer}.photo-cancel{background:var(--purple-bg);color:var(--text2)}.photo-confirm{background:var(--purple);color:#fff}.photo-confirm:disabled{opacity:.45;cursor:not-allowed}
    .care-needs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px;padding:8px;border-radius:var(--r-sm);background:#FFF9ED;border:1px solid #FDE7B0}.care-need{min-width:0;padding:7px 6px;border-radius:8px;background:#fff}.care-need-label{display:block;color:#A87628;font-size:9px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.care-need-value{display:block;margin-top:3px;color:var(--text);font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.care-need-value.warn{color:var(--red)}
  </style>
</head>
<body>
<div class="frame"><div class="phone">
  <main class="scroll">
    <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".28"/></svg><svg viewBox="0 0 17 13" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M8.5 9.5a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8z" fill="currentColor" stroke="none"/><path d="M5.2 7a4.7 4.7 0 016.6 0M2 4a8.8 8.8 0 0113 0" stroke-width="1.5"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="currentColor" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="currentColor"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="currentColor"/></svg></div></div>
    <header class="navbar"><button class="back-btn" onclick="location.href='nurse-home.html'" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M13 4.5L7.5 10 13 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="nav-title">我的订单</span><div class="nav-ph"></div></header>
    <nav class="status-tabs" id="statusTabs" aria-label="订单状态"></nav>
    <section class="content" id="orderList"></section>
  </main>
  <nav class="bottom-nav"><a class="nav-item" href="nurse-home.html"><svg viewBox="0 0 24 24" fill="none"><path d="M3 12L12 4l9 8v8a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" stroke="#AEACC0" stroke-width="1.8" stroke-linejoin="round"/></svg><span class="nav-lbl">首页</span></a><a class="nav-item active" href="nurse-orders.html"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="17" rx="3" stroke="#8655C5" stroke-width="1.8"/><path d="M3 9h18M8 14h8M8 17h5" stroke="#8655C5" stroke-width="1.6" stroke-linecap="round"/></svg><span class="nav-lbl">订单</span></a><a class="nav-item" href="nurse-profile.html"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#AEACC0" stroke-width="1.8"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke="#AEACC0" stroke-width="1.8" stroke-linecap="round"/></svg><span class="nav-lbl">我的</span></a></nav>
</div></div>
<div class="toast" id="toast"></div>
<div class="photo-overlay" id="photoOverlay" onclick="closeStartModal(event)"><section class="photo-sheet"><div class="photo-head"><span class="photo-title">开始服务前拍照</span><button class="photo-close" onclick="closeStartModal()" aria-label="关闭">×</button></div><div class="photo-desc">请拍摄到岗现场或交接状态照片，照片将作为服务开始记录保存。</div><div class="photo-upload"><label class="photo-picker"><input id="startPhoto" type="file" accept="image/*" capture="environment" hidden><svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></label><img class="photo-preview" id="photoPreview" alt="到岗照片预览" hidden></div><div class="photo-actions"><button class="photo-cancel" onclick="closeStartModal()">取消</button><button class="photo-confirm" id="startConfirm" disabled onclick="confirmStartService()">确认开始服务</button></div></section></div>
<script>
  const STATUS=[['all','全部'],['pending-confirm','待确认'],['pending-start','待上岗'],['in-progress','服务中'],['pending-complete','待完成'],['completed','已完成'],['cancelled','已取消']];
  const ORDERS=[
    {id:'AKB-N-2026-041701',status:'pending-confirm',state:'待确认',name:'张三',meta:'男 · 67岁 · 高血压病史',type:'住院陪护',place:'北京红十字医院 · 内科5楼3床',time:'今日 11:00 - 23:00',income:'¥224/天',avatar:'张',careNeeds:{independence:'半自理',tube:'有',infection:'无'},actions:['accept','transfer']},
    {id:'AKB-N-2026-041642',status:'pending-start',state:'待上岗',name:'王奶奶',meta:'女 · 76岁 · 术后重症观察',type:'重症陪护',place:'北京协和医院 · 外科8楼12床',time:'今日 11:00 - 23:00',income:'¥320/天',avatar:'王',careNeeds:{independence:'完全失能',tube:'有',infection:'无'},actions:['start','detail']},
    {id:'AKB-N-2026-041508',status:'in-progress',state:'服务中',name:'李先生',meta:'男 · 59岁 · 术后康复期',type:'术后康复',place:'解放军总医院 · 骨科3楼7床',time:'今日 08:30 - 20:30',income:'¥280/天',avatar:'李',careNeeds:{independence:'半自理',tube:'无',infection:'无'},actions:['log','detail']},
    {id:'AKB-N-2026-041229',status:'pending-complete',state:'待完成',name:'赵阿姨',meta:'女 · 72岁 · 日常起居照护',type:'居家陪护',place:'雁塔区雁南一路88号',time:'今日 08:00 - 20:00',income:'¥260/天',avatar:'赵',careNeeds:{independence:'完全自理',tube:'无',infection:'无'},actions:['submit','detail']},
    {id:'AKB-N-2026-040918',status:'completed',state:'已完成',name:'刘先生',meta:'男 · 70岁 · 协助助浴',type:'上门助浴',place:'高新区科技路36号',time:'昨日 14:00 - 15:00',income:'¥129/次',avatar:'刘',careNeeds:{independence:'半自理',tube:'无',infection:'无'},actions:['detail','history']},
    {id:'AKB-N-2026-040807',status:'cancelled',state:'已取消',name:'陈女士',meta:'女 · 64岁 · 门诊复诊',type:'陪诊服务',place:'北京协和医院 · 门诊部',time:'2026-04-08 09:00',income:'¥180/次',avatar:'陈',careNeeds:{independence:'完全自理',tube:'无',infection:'无'},reason:'客户临时调整就诊计划',compensation:'平台确认无赔付',actions:['cancel-detail']}
  ];
  let current=new URLSearchParams(location.search).get('status')||'all';
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function renderTabs(){document.getElementById('statusTabs').innerHTML=STATUS.map(([key,label])=>`<button class="status-tab ${current===key?'on':''}" onclick="setStatus('${key}')">${label}<span class="status-count">${key==='all'?ORDERS.length:ORDERS.filter(o=>o.status===key).length}</span></button>`).join('');}
  function action(order,kind){const map={accept:['接单','primary',`acceptOrder('${order.id}')`],transfer:['转单','',`showToast('请在订单详情中填写转单原因')`],start:['开始服务','green',`openStartModal('${order.id}')`],detail:['查看详情','',`location.href='nurse-order-detail.html?id=${order.id}'`],navigate:['查看路线','',`showToast('已打开医院导航')`],log:['记录护理','green',`location.href='nurse-logs.html?order=${order.id}'`],submit:['提交记录','primary',`location.href='nurse-order-detail.html?id=${order.id}&mode=submit'`],history:['护理记录','',`location.href='nurse-logs.html?order=${order.id}'`],'cancel-detail':['查看原因','',`showToast('${order.reason}')`]};const item=map[kind];return `<button class="action ${item[1]}" onclick="${item[2]}">${item[0]}</button>`;}
  function card(o){const needs=o.careNeeds||{independence:'—',tube:'—',infection:'—'};return `<article class="order-card"><div class="order-main"><div class="order-top"><span class="order-no">订单号 ${esc(o.id)}</span><span class="state ${o.status}">${o.state}</span></div><div class="patient-line"><div class="patient-avatar">${esc(o.avatar)}</div><div class="patient-copy"><div class="patient-name">${esc(o.name)}</div><div class="patient-meta">${esc(o.meta)}</div></div><span class="service-tag">${esc(o.type)}</span></div><div class="info-grid"><div class="info-cell"><div class="info-label">服务地址</div><div class="info-value">${esc(o.place)}</div></div><div class="info-cell"><div class="info-label">服务时间</div><div class="info-value">${esc(o.time)}</div></div><div class="info-cell"><div class="info-label">预计收入</div><div class="info-value accent">${esc(o.income)}</div></div><div class="info-cell"><div class="info-label">订单进度</div><div class="info-value">${o.status==='pending-complete'?'待提交护理记录':o.status==='in-progress'?'护理进行中':o.state}</div></div></div><div class="care-needs" aria-label="客户护理要点"><div class="care-need"><span class="care-need-label">自理能力</span><span class="care-need-value">${esc(needs.independence)}</span></div><div class="care-need"><span class="care-need-label">管路</span><span class="care-need-value ${needs.tube==='有'?'warn':''}">${esc(needs.tube)}</span></div><div class="care-need"><span class="care-need-label">传染性疾病</span><span class="care-need-value ${needs.infection==='有'?'warn':''}">${esc(needs.infection)}</span></div></div>${o.reason?`<div class="cancel-note">取消原因：${esc(o.reason)}<br>${esc(o.compensation)}</div>`:''}</div><div class="order-actions">${o.actions.map(k=>action(o,k)).join('')}</div></article>`;}
  function render(){renderTabs();const list=document.getElementById('orderList');const data=current==='all'?ORDERS:ORDERS.filter(o=>o.status===current);list.innerHTML=data.length?data.map(card).join(''):'<div class="empty"><strong>暂无相关订单</strong>新的订单状态会在这里显示</div>';}
  function setStatus(status){current=status;history.replaceState(null,'',`nurse-orders.html${status==='all'?'':'?status='+status}`);render();}
  function acceptOrder(id){const order=ORDERS.find(o=>o.id===id);if(!order)return;order.status='pending-start';order.state='待上岗';order.actions=['detail','navigate'];showToast('接单成功，服务开始前请准时到岗');render();}
  let startingOrderId='';
  function openStartModal(id){startingOrderId=id;document.getElementById('photoOverlay').classList.add('show');document.getElementById('startPhoto').value='';document.getElementById('photoPreview').hidden=true;document.getElementById('startConfirm').disabled=true;}
  function closeStartModal(event){if(event&&event.target!==document.getElementById('photoOverlay'))return;document.getElementById('photoOverlay').classList.remove('show');}
  document.getElementById('startPhoto').addEventListener('change',function(){const file=this.files&&this.files[0];if(!file)return;const preview=document.getElementById('photoPreview');preview.src=URL.createObjectURL(file);preview.hidden=false;document.getElementById('startConfirm').disabled=false;});
  function confirmStartService(){const file=document.getElementById('startPhoto').files[0];if(!file){showToast('请先拍照后再开始服务');return}const order=ORDERS.find(o=>o.id===startingOrderId);if(!order)return;order.status='in-progress';order.state='服务中';order.photoName=file.name;order.actions=['log','detail'];closeStartModal();showToast('已开始服务，现场照片已保存');render();}
  function showToast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200)}
  render();
</script>
</body>
</html>

    :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#16A34A;--green-bg:#DCFCE7;--red:#DC2626;--red-bg:#FEE2E2;--amber:#D97706;--amber-bg:#FEF3C7;--blue:#397EED;--blue-bg:#E8F1FF;--sh:0 2px 16px rgba(0,0,0,0.1);--r-lg:12px;--r-md:12px;--r-sm:12px}
    *,*:before,*:after{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}.frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg)}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
    .scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}.scroll::-webkit-scrollbar{display:none}.status-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;background:#fff;font-size:14px;font-weight:600}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:17px}.navbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}.back-btn{width:36px;height:36px;border:0;border-radius:12px;background:var(--purple-light);color:var(--purple);display:grid;place-items:center;cursor:pointer}.back-btn svg{width:20px;height:20px}.nav-title{font-size:17px;font-weight:700}.nav-ph{width:36px}.status-tabs{display:flex;overflow:auto;background:#fff;border-bottom:1px solid var(--border);padding:0 8px;position:sticky;top:58px;z-index:9}.status-tabs::-webkit-scrollbar{display:none}.status-tab{flex:1;min-width:62px;padding:12px 4px 10px;border:0;border-bottom:2.5px solid transparent;background:none;color:var(--text3);font:700 11px inherit;white-space:nowrap;cursor:pointer}.status-tab.on{color:var(--purple);border-bottom-color:var(--purple)}.status-count{margin-left:2px;font-size:11px}.content{padding:14px 14px 30px;display:flex;flex-direction:column;gap:12px}.order-card{background:var(--card);border-radius:12px;box-shadow:var(--sh);overflow:hidden}.order-main{padding:15px 16px 13px}.order-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.order-no{font-size:12px;color:var(--text3);font-weight:600}.state{padding:4px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}.state.pending-confirm{background:var(--amber-bg);color:var(--amber)}.state.pending-start{background:#FFF1DD;color:#C26C16}.state.in-progress{background:var(--green-bg);color:var(--green)}.state.pending-complete{background:var(--purple-light);color:var(--purple)}.state.completed{background:#F1F5F9;color:#64748B}.state.cancelled{background:var(--red-bg);color:var(--red)}.patient-line{display:flex;align-items:center;gap:11px;margin-top:14px}.patient-avatar{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(140deg,#3B82F6,#60A5FA);color:#fff;font-size:17px;font-weight:700;flex-shrink:0}.patient-copy{min-width:0;flex:1}.patient-name{font-size:16px;font-weight:700}.patient-meta{margin-top:4px;color:var(--text2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.service-tag{padding:4px 8px;border-radius:12px;background:var(--purple-light);color:var(--purple);font-size:12px;font-weight:600;white-space:nowrap}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.info-cell{padding:9px 10px;border-radius:12px;background:var(--purple-bg)}.info-label{color:var(--text3);font-size:11px;font-weight:600}.info-value{margin-top:3px;color:var(--text);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info-value.accent{color:var(--purple)}.cancel-note{margin-top:11px;padding:9px 10px;border-radius:12px;background:var(--red-bg);color:#991B1B;font-size:12px;line-height:1.5}.order-actions{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 14px}.action{height:35px;padding:0 13px;border-radius:12px;border:1px solid var(--border);background:#fff;color:var(--text2);font:800 11px inherit;cursor:pointer}.action.primary{border-color:var(--purple);background:var(--purple);color:#fff}.action.green{border-color:var(--green);background:var(--green);color:#fff}.action.amber{border-color:var(--amber);background:var(--amber);color:#fff}.empty{padding:52px 20px;text-align:center;color:var(--text3);font-size:14px;background:var(--card);border-radius:12px;box-shadow:var(--sh)}.empty strong{display:block;color:var(--text2);font-size:15px;margin-bottom:5px}.bottom-nav{flex-shrink:0;display:flex;background:var(--card);border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;text-decoration:none}.nav-item svg{width:24px;height:24px}.nav-lbl{font-size:12px;font-weight:600;color:var(--text3)}.nav-item.active .nav-lbl{color:var(--purple)}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);padding:17px 25px;border-radius:12px;background:rgba(25,15,45,.9);color:#fff;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.photo-overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(25,15,45,.48);opacity:0;pointer-events:none;transition:opacity .2s}.photo-overlay.show{opacity:1;pointer-events:auto}.photo-sheet{width:min(430px,100%);padding:18px 16px calc(20px + env(safe-area-inset-bottom));border-radius:12px;background:#fff}.photo-head{display:flex;align-items:center;justify-content:space-between}.photo-title{font-size:17px;font-weight:700}.photo-close{border:0;background:var(--purple-light);color:var(--text2);width:32px;height:32px;border-radius:12px;font-size:20px;cursor:pointer}.photo-desc{margin-top:9px;color:var(--text2);font-size:13px;line-height:1.5}.photo-upload{display:flex;align-items:center;gap:10px;margin-top:15px}.photo-picker{width:82px;height:82px;display:grid;place-items:center;border:1.5px dashed #CFC2E7;border-radius:12px;background:var(--purple-bg);color:var(--purple);cursor:pointer}.photo-picker svg{width:25px;height:25px}.photo-preview{width:82px;height:82px;border-radius:12px;object-fit:cover}.photo-actions{display:flex;gap:8px;margin-top:17px}.photo-actions button{flex:1;height:43px;border:0;border-radius:12px;font:800 13px inherit;cursor:pointer}.photo-cancel{background:var(--purple-bg);color:var(--text2)}.photo-confirm{background:var(--purple);color:#fff}.photo-confirm:disabled{opacity:.45;cursor:not-allowed}
    .care-needs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px;padding:8px;border-radius:12px;background:#FFF9ED;border:1px solid #FDE7B0}.care-need{min-width:0;padding:7px 6px;border-radius:12px;background:#fff}.care-need-label{display:block;color:#A87628;font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.care-need-value{display:block;margin-top:3px;color:var(--text);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.care-need-value.warn{color:var(--red)}.plan-note{margin-top:8px;padding:9px 10px;border-radius:12px;background: #F5F5F5;color:var(--text2);font-size:12px;line-height:1.5}.plan-note strong{color:var(--text);font-weight:600}.form-label{display:block;margin-top:16px;margin-bottom:7px;color:var(--text);font-size:13px;font-weight:600}.req{color:var(--red)}.start-plan{display:block;width:100%;min-height:82px;padding:10px 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--purple-bg);color:var(--text);font-size:14px;line-height:1.5;font-family:inherit;resize:vertical;outline:none}.start-plan:focus{border-color:#7FE9D4;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,0.1)}.start-plan::placeholder{color:var(--text3)}

<script>
  const STATUS=[['all','全部'],['pending-confirm','待确认'],['pending-start','待上岗'],['in-progress','服务中'],['completed','已完成'],['cancelled','已取消']];
  const identity=AKBNurseCertification.read();
  const ORDERS=(AKBNurseCertification.effective(identity)?window.AKBNurseOrderSeeds:[]).map(function(o){return Object.assign({},o);});
  AKBServiceOrderFields.list().filter(AKBNurseCertification.matchesOrder).forEach(function(o){const m=AKBServiceOrderFields.normalize(o),status=({'待服务':'pending-start','服务中':'in-progress','待完成':'in-progress','已完成':'completed','已取消':'cancelled'})[o.state];if(!status||ORDERS.some(s=>s.id===o.id))return;const care={};Object.keys(m.careNeeds).forEach(k=>{care[k]=AKBServiceOrderFields.labels[k]?.[m.careNeeds[k]]||m.careNeeds[k];});ORDERS.unshift({id:o.id,status,state:o.state,name:m.patient.name,meta:[m.patient.gender,m.patient.age!==''?m.patient.age+'岁':'',m.patient.condition].filter(Boolean).join(' · '),type:m.projectName,place:m.addresses.map(a=>a.detail).filter(Boolean).join(' → '),time:m.time,income:o.nurseIncome||o.nurseFee||'待结算',avatar:(m.patient.name||'服').charAt(0),careNeeds:care,showNeeds:['hospital','home','bath'].includes(m.projectId),extras:AKBServiceOrderFields.summary(o,'nurse'),actions:['detail']});});
  ORDERS.forEach((o,i)=>{const latest=AKBNurseWorkflow.read(o.id)||o;const state=latest.state==='待完成'?'服务中':latest.state;ORDERS[i]=Object.assign({},o,{state:state==='待服务'?'待上岗':state,status:({'待服务':'pending-start','待上岗':'pending-start','待确认':'pending-confirm','服务中':'in-progress','已完成':'completed','已取消':'cancelled'})[state]||o.status,actions:state==='服务中'?['submit','detail']:latest.actions||o.actions,servicePlan:latest.servicePlan||o.servicePlan});});
  let current=new URLSearchParams(location.search).get('status')||'all';if(current==='pending-complete')current='in-progress';if(!STATUS.some(([key])=>key===current))current='all';
  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function renderTabs(){document.getElementById('statusTabs').innerHTML=STATUS.map(([key,label])=>`<button class="status-tab ${current===key?'on':''}" onclick="setStatus('${key}')">${label}<span class="status-count">${key==='all'?ORDERS.length:ORDERS.filter(o=>o.status===key).length}</span></button>`).join('');}
  function action(order,kind){if(window.AKBYoukang&&AKBYoukang.state().orders.some(o=>o.id===order.id)&&['detail','start'].includes(kind)){return '<button class="action primary" onclick="location.href=\'nurse-youkang.html?order='+encodeURIComponent(order.id)+'\'">'+(kind==='start'?'开始体检服务':'体检服务详情')+'</button>';}if(kind==='contract')return '';const map={accept:['接单','primary',`acceptOrder('${order.id}')`],start:['开始服务','green',`openStartModal('${order.id}')`],detail:['查看详情','',`location.href='nurse-order-detail.html?id=${order.id}'`],navigate:['查看路线','',`showToast('已打开医院导航')`],log:['提交记录','green',`location.href='nurse-logs.html?order=${order.id}'`],submit:['提交记录','primary',`location.href='nurse-logs.html?order=${order.id}'`],history:['护理记录','',`location.href='nurse-logs.html?order=${order.id}'`],'cancel-detail':['查看原因','',`showToast('${order.reason}')`]};const item=map[kind];return `<button class="action ${item[1]}" onclick="${item[2]}">${item[0]}</button>`;}
  function card(o){const needs=Object.assign({independence:'—',tube:'—',infection:'—'},o.careNeeds||{});return `<article class="order-card"><div class="order-main"><div class="order-top"><span class="order-no">订单号 ${esc(o.id)}</span><span class="state ${o.status}">${o.state}</span></div><div class="patient-line"><div class="patient-avatar">${esc(o.avatar)}</div><div class="patient-copy"><div class="patient-name">${esc(o.name)}</div><div class="patient-meta">${esc(o.meta)}</div></div><span class="service-tag">${esc(o.type)}</span></div><div class="info-grid"><div class="info-cell"><div class="info-label">服务地址</div><div class="info-value">${esc(o.place)}</div></div><div class="info-cell"><div class="info-label">服务时间</div><div class="info-value">${esc(o.time)}</div></div><div class="info-cell"><div class="info-label">预计收入</div><div class="info-value accent">${esc(o.income)}</div></div><div class="info-cell"><div class="info-label">订单进度</div><div class="info-value">${o.status==='in-progress'?'护理进行中':o.state}</div></div>${(o.extras||[]).filter(e=>e.label!=='护理需求'&&e.label!=='服务需求').map(e=>`<div class="info-cell"><div class="info-label">${esc(e.label)}</div><div class="info-value">${esc(e.value)}</div></div>`).join('')}</div>${(o.extras||[]).filter(e=>e.label==='服务需求').map(e=>`<div class="plan-note"><strong>服务需求：</strong>${esc(e.value)}</div>`).join('')}<div class="care-needs" style="${o.showNeeds===false?'display:none':''}" aria-label="客户护理要点"><div class="care-need"><span class="care-need-label">自理能力</span><span class="care-need-value">${esc(needs.independence)}</span></div><div class="care-need"><span class="care-need-label">管路</span><span class="care-need-value ${needs.tube==='有'?'warn':''}">${esc(needs.tube)}</span></div><div class="care-need"><span class="care-need-label">传染性疾病</span><span class="care-need-value ${needs.infection==='有'?'warn':''}">${esc(needs.infection)}</span></div></div>${o.servicePlan?`<div class="plan-note"><strong>服务计划：</strong>${esc(o.servicePlan)}</div>`:''}${o.reason?`<div class="cancel-note">取消原因：${esc(o.reason)}<br>${esc(o.compensation)}</div>`:''}</div><div class="order-actions">${o.actions.map(k=>action(o,k)).join('')}</div></article>`;}
  function render(){renderTabs();const list=document.getElementById('orderList');const data=current==='all'?ORDERS:ORDERS.filter(o=>o.status===current);list.innerHTML=data.length?data.map(card).join(''):'<div class="empty"><strong>暂无相关订单</strong>新的订单状态会在这里显示</div>';}
  function setStatus(status){current=status;history.replaceState(null,'',`nurse-orders.html${status==='all'?'':'?status='+status}`);render();}
  function acceptOrder(id){if(!AKBNurseCertification.require())return;const order=ORDERS.find(o=>o.id===id);if(!order)return;order.status='pending-start';order.state='待上岗';order.actions=['start','detail'];AKBNurseWorkflow.update(id,{status:order.status,state:order.state,actions:order.actions});showToast('接单成功，服务开始前请准时到岗');render();}
  let startingOrderId='';
  function updateStartConfirmState(){const hasPhoto=Boolean(document.getElementById('startPhoto').files&&document.getElementById('startPhoto').files[0]);const hasPlan=Boolean(document.getElementById('startPlan').value.trim());document.getElementById('startConfirm').disabled=!(hasPhoto&&hasPlan);}
  function openStartModal(id){if(!AKBNurseCertification.require())return;startingOrderId=id;document.getElementById('photoOverlay').classList.add('show');document.getElementById('startPhoto').value='';document.getElementById('startPlan').value='';document.getElementById('photoPreview').hidden=true;document.getElementById('startConfirm').disabled=true;setTimeout(()=>document.getElementById('startPlan').focus(),50);}
  function closeStartModal(event){if(event&&event.target!==document.getElementById('photoOverlay'))return;document.getElementById('photoOverlay').classList.remove('show');}
  document.getElementById('startPhoto').addEventListener('change',function(){const file=this.files&&this.files[0];if(!file)return;const preview=document.getElementById('photoPreview');preview.src=URL.createObjectURL(file);preview.hidden=false;updateStartConfirmState();});
  document.getElementById('startPlan').addEventListener('input',updateStartConfirmState);
  function confirmStartService(){const file=document.getElementById('startPhoto').files[0],plan=document.getElementById('startPlan').value.trim();if(!plan){showToast('请先填写服务计划');document.getElementById('startPlan').focus();return}if(!file){showToast('请先拍照后再开始服务');return}const order=ORDERS.find(o=>o.id===startingOrderId);if(!order)return;order.status='in-progress';order.state='服务中';order.photoName=file.name;order.servicePlan=plan;order.actions=['submit','detail'];AKBNurseWorkflow.update(order.id,{status:order.status,state:order.state,actions:order.actions,servicePlan:plan,photoName:file.name});closeStartModal();showToast('已开始服务，照片和服务计划已保存');render();}
  function contractOrder(){showToast('电子签合同功能已停用');}
  function showToast(text){ return window.AKBUI.toast(text,2200); }
  render();
</script>

<!doctype html>
<html lang="zh-CN">
<head>
  <script src="vendor/vue.global.prod.js"></script>
  <script src="ui/icons.js"></script>
  <script src="ui/vue-ui.js"></script>
  <script src="common-ui.js"></script>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>购物车 · 佑小邦陪护</title>
  <style>
    :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--r-md:12px;--r-lg:12px;--sh:0 2px 12px rgba(0,0,0,0.1)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}
    .phone{width:100%;max-width:430px;display:flex;flex-direction:column;background:var(--purple-bg);min-height:100vh;position:relative}
    @media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
    .scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
    .scroll-area::-webkit-scrollbar{display:none}

    /* 状态栏 */
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 6px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#DDF7F1,#EFFBF8)}
    .status-right{display:flex;align-items:center;gap:5px}
    .status-right svg{width:17px;height:17px}

    /* 顶部导航 */
    .top-bar{display:flex;align-items:center;justify-content:center;height:56px;padding:0 14px;background:linear-gradient(135deg,#DDF7F1,#EFFBF8);position:relative}
    .top-bar h1{font-size:18px;font-weight:700;color:var(--text)}

    /* 购物车列表 */
    .cart-list{padding:14px}
    .cart-item{display:flex;gap:12px;background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:var(--sh)}
    .cart-check{width:20px;height:20px;border-radius:12px;border:2px solid var(--text3);flex-shrink:0;margin-top:2px;display:grid;place-items:center;cursor:pointer}
    .cart-item.checked .cart-check{background:var(--purple);border-color:var(--purple)}
    .cart-check svg{width:12px;height:12px;color:#fff;display:none}
    .cart-item.checked .cart-check svg{display:block}
    .cart-img{width:80px;height:80px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;background:var(--purple-light);color:var(--purple)}
    .cart-img svg{width:40px;height:40px}
    .cart-info{flex:1;min-width:0;display:flex;flex-direction:column}
    .cart-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.3}
    .cart-sub{font-size:13px;color:var(--text3);margin-top:4px;line-height:1.4}
    .cart-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
    .cart-price{font-size:16px;font-weight:700;color:#E94E4E}
    .qty-ctrl{display:flex;align-items:center;gap:8px}
    .qty-btn{width:24px;height:24px;border:1px solid var(--border);border-radius:12px;background:#fff;display:grid;place-items:center;cursor:pointer;color:var(--text2);font-size:15px;font-weight:600}
    .qty-num{font-size:14px;font-weight:600;color:var(--text);min-width:16px;text-align:center}
    .cart-del{font-size:13px;color:var(--text3);cursor:pointer;margin-left:8px}

    /* 空状态 */
    .empty{text-align:center;padding:80px 20px;color:var(--text3)}
    .empty svg{width:64px;height:64px;color:var(--text3);opacity:.5;margin-bottom:16px}
    .empty p{font-size:14px;margin-bottom:16px}
    .empty button{padding:10px 24px;border:0;border-radius:12px;background:var(--purple);color:#fff;font-size:14px;font-weight:600;cursor:pointer}

    /* 底部结算栏 */
    .checkout-bar{flex-shrink:0;display:flex;align-items:center;background:#fff;border-top:1px solid var(--border);padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,0.1)}
    .checkout-left{flex:1}
    .checkout-total{font-size:14px;color:var(--text2)}
    .checkout-total b{font-size:18px;color:#E94E4E}
    .checkout-btn{padding:11px 28px;border:0;border-radius:12px;background:var(--purple);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
    .checkout-btn:disabled{background:var(--text3);cursor:not-allowed}

    /* ── 结算支付弹窗（与商城单品一致） ── */
    .overlay{position:absolute;inset:0;z-index:30;background:rgba(25,15,45,.48);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
    .overlay.show{opacity:1;pointer-events:auto}
    .sheet{width:min(430px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:12px;padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(18px);transition:transform .24s}
    .overlay.show .sheet{transform:none}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-shrink:0}
    .sheet-title{font-size:18px;font-weight:700}
    .close{width:32px;height:32px;border:0;border-radius:12px;background:var(--purple-light);color:var(--text2);font-size:20px;cursor:pointer}
    .pay-sheet{padding:0;display:flex;flex-direction:column;transform:none !important;transition:none}
    .pay-scroll{flex:1;overflow-y:auto;padding:0 16px;-webkit-overflow-scrolling:touch;min-height:0}
    .pay-scroll::-webkit-scrollbar{display:none}
    .pay-product{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
    .pay-thumb{position:relative;width:82px;height:82px;border-radius:12px;background:var(--purple-bg);display:grid;place-items:center;flex-shrink:0;overflow:hidden}
    .pay-thumb svg{width:48px;height:48px}
    .pay-thumb img{width:100%;height:100%;object-fit:cover;padding:0}
    .pay-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
    .pay-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.35}
    .pay-sub{font-size:13px;color:var(--text3);margin-top:2px}
    .pay-price-row{display:flex;align-items:baseline;gap:5px;justify-content:space-between}
    .pay-price{font-size:17px;font-weight:700;color:#E94E4E}
    .pay-price small{font-size:13px}
    .pay-qty-txt{font-size:13px;color:var(--text3)}
    .pay-sec{padding:13px 0;border-bottom:1px solid var(--border)}
    .pay-sec-label{font-size:13px;color:var(--text2);font-weight:600;margin-bottom:8px}
    .pay-addr{font-size:14px;color:var(--text);font-weight:600;line-height:1.5;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
    .pay-addr svg{width:14px;height:14px;color:var(--text3);flex-shrink:0}
    .addr-list{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto}
    .addr-item{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:12px;cursor:pointer}
    .addr-item.sel{border-color:var(--purple);background:var(--purple-light)}
    .addr-radio{width:16px;height:16px;border:2px solid #D5CFE0;border-radius:12px;flex-shrink:0;margin-top:2px}
    .addr-item.sel .addr-radio{border-color:var(--purple);background:radial-gradient(circle,var(--purple) 0 5px,transparent 6px)}
    .addr-detail{font-size:14px;font-weight:600;color:var(--text);line-height:1.5}
    .addr-sub{font-size:13px;color:var(--text3);margin-top:4px}
    .addr-add{width:100%;height:42px;margin-top:12px;border:1px dashed #9FEDE0;border-radius:12px;background:var(--purple-bg);color:var(--purple);font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
    .pay-dlv-row{display:flex;gap:8px}
    .pay-dlv{flex:1;height:38px;border:1px solid var(--border);border-radius:12px;background:#fff;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;font-family:inherit;position:relative;transition:all .15s}
    .pay-dlv.on{border-color:#1CD8B7;color:#0FA98C;background:#DDF7F1}
    .pay-dlv.on:after{content:'✓';position:absolute;right:6px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:12px;background:#1CD8B7;color:#fff;font-size:11px;display:grid;place-items:center}
    .pay-points-row{display:flex;align-items:center;justify-content:space-between}
    .pay-points-txt{font-size:13px;color:#E94E4E;font-weight:600}
    .pay-toggle{width:40px;height:22px;border-radius:12px;background:#E5E0EF;border:0;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
    .pay-toggle:after{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:left .2s}
    .pay-toggle.on{background:#1CD8B7}
    .pay-toggle.on:after{left:20px}
    .pay-confirm{width:calc(100% - 32px);height:46px;margin:10px 16px calc(14px + env(safe-area-inset-bottom));flex-shrink:0;border:0;border-radius:12px;background:linear-gradient(135deg,#1CD8B7,#0FA98C);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
    .pay-confirm:active{opacity:.88}

    /* ── 支付成功全页 ── */
    .pay-success-page{background: #F5F5F5;min-height:100%;width:min(430px,100%);display:flex;flex-direction:column}
    .pay-success-top{flex:1;display:flex;flex-direction:column;align-items:center;padding:42px 20px 20px;text-align:center}
    .pay-success-icon{width:66px;height:66px;border-radius:12px;background:linear-gradient(135deg,#34D399,#10B981);display:grid;place-items:center;margin-bottom:16px}
    .pay-success-icon svg{width:32px;height:32px;color:#fff}
    .pay-success-title{font-size:20px;font-weight:700;margin-bottom:8px}
    .pay-success-desc{font-size:14px;color:var(--text2);line-height:1.65;max-width:280px}
    .pay-success-card{background:#fff;border-radius:12px;padding:4px 18px;margin:20px 16px 0;box-shadow:var(--sh)}
    .pay-success-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);font-size:14px}
    .pay-success-row:last-child{border-bottom:0}
    .pay-success-row .k{color:var(--text3);font-weight:600}
    .pay-success-row .v{color:var(--text);font-weight:600;max-width:210px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .pay-success-row .v.highlight{color:#0FA98C}
    .pay-success-row .v.deduct{color:#EF4444}
    .pay-success-btns{display:flex;gap:12px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--border)}
    .pay-success-btns button{flex:1;height:46px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
    .pay-success-btns .btn-ghost{border:1px solid #C5BDD8;background:#fff;color:var(--purple)}
    .pay-success-btns .btn-primary{border:0;background:linear-gradient(135deg,#34D399,#10B981);color:#fff}

    /* 底部 Tab */
    .bottom-nav{flex-shrink:0;display:flex;background:#fff;border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,0.1)}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;text-decoration:none;min-width:0}
    .nav-ico{width:26px;height:26px;stroke:#AEACC0;fill:none}
    .nav-lbl{font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap}
    .nav-item.act .nav-ico{stroke:var(--purple)}
    .nav-item.act .nav-lbl{color:var(--purple)}
  </style>
  <link rel="stylesheet" href="visual-theme.css" />
  <link rel="stylesheet" href="ui/vue-ui.css" />
</head>
<body data-surface="mobile" data-page="cart">
<div class="frame"><div class="phone">

      <div class="status-right">
        <svg viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".28"/></svg>

        <svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="currentColor" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="currentColor"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="currentColor"/></svg>

<script src="points-store.js"></script>
<script>
  /* 商城商品数据 */
  const PRODUCTS = [
    {id:'thermometer',name:'电子体温计',sub:'快速测温 · 大屏易读',price:39,tone:'purple',image:'assets/mall/thermometer.png'},
    {id:'infrared',name:'红外额温枪 / 耳温枪',sub:'非接触测温 · 一机两用',price:129,tone:'blue',image:'assets/mall/infrared-thermometer.png'},
    {id:'bp',name:'电子血压计',sub:'上臂式无创血压计',price:239,tone:'blue',image:'assets/mall/blood-pressure-monitor.png'},
    {id:'glucose',name:'血糖仪 + 血糖试纸',sub:'家用血糖监测套装',price:168,tone:'green',image:'assets/mall/glucose-meter.png'},
    {id:'oxygen',name:'家用制氧机',sub:'医用级 · 安静运行',price:1599,tone:'green',image:'assets/mall/oxygen-concentrator.png'},
    {id:'nebulizer',name:'家用雾化器',sub:'细雾雾化 · 便携易收纳',price:199,tone:'purple',image:'assets/mall/nebulizer.png'},
    {id:'hearing',name:'助听器',sub:'轻巧隐形 · 日常交流辅助',price:699,tone:'orange',image:'assets/mall/hearing-aid.png'},
    {id:'mask',name:'医用无菌口罩',sub:'医用外科 / 一次性使用',price:29,tone:'blue',image:'assets/mall/medical-mask.png'},
    {id:'fetal',name:'家用胎心仪',sub:'胎心监护 · 孕期辅助',price:299,tone:'red',image:'assets/mall/fetal-monitor.png'}
  ];

  const MALL_CART_KEY = 'ankebang_mall_cart';
  let mallCart = loadCart(MALL_CART_KEY, [
    {id:'thermometer',qty:1},{id:'mask',qty:2},{id:'nebulizer',qty:1}
  ]);
  let selected = new Set();
  let usePoints = false;

  function loadCart(key, preset){
    try{
      const v = JSON.parse(localStorage.getItem(key));
      if(Array.isArray(v) && v.length) return v;
    }catch(e){}
    localStorage.setItem(key, JSON.stringify(preset));
    return preset.slice();
  }
  function saveCart(){
    localStorage.setItem(MALL_CART_KEY, JSON.stringify(mallCart));
  }
  function getProduct(id){ return PRODUCTS.find(function(p){return p.id===id;}); }

  function render(){
    const mallEl = document.getElementById('cartMall');
    if(!mallCart.length){
      mallEl.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M3 3h2l.5 3h13l1.5-7H6.5"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg><p>购物车空空如也</p><button onclick="location.href=\'mall.html\'">去商城逛逛</button></div>';
    }else{
      mallEl.innerHTML = mallCart.map(function(item){
        const p = getProduct(item.id); if(!p) return '';
        return renderItem(item, p, 'mall');
      }).join('');
    }
    updateTotal();
  }

  function renderItem(item, p, type){
    const key = type+':'+item.id;
    const checked = selected.has(key);
    return '<div class="cart-item '+(checked?'checked':'')+'" data-key="'+key+'">'+
      '<div class="cart-check" onclick="toggleCheck(\''+key+'\')"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.5l3 3 4-5"/></svg></div>'+
      '<div class="cart-img" style="background:var(--purple-light)">'+(p.image?'<img src="'+p.image+'" alt="'+p.name+'" style="width:100%;height:100%;object-fit:cover;border-radius:12px" onerror="this.style.display=\'none\'">':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s-7-4.5-7-11a5 5 0 019-3 5 5 0 019 3c0 6.5-7 11-7 11z"/></svg>')+'</div>'+
      '<div class="cart-info">'+
        '<div class="cart-name">'+p.name+'</div>'+
        '<div class="cart-sub">'+p.sub+(p.unit?' · '+p.unit:'')+'</div>'+
        '<div class="cart-foot">'+
          '<div class="cart-price">¥'+p.price+'</div>'+
          '<div class="qty-ctrl">'+
            '<button class="qty-btn" onclick="changeQty(\''+type+'\',\''+item.id+'\',-1)">−</button>'+
            '<span class="qty-num">'+item.qty+'</span>'+
            '<button class="qty-btn" onclick="changeQty(\''+type+'\',\''+item.id+'\',1)">+</button>'+
            '<span class="cart-del" onclick="removeItem(\''+type+'\',\''+item.id+'\')">删除</span>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }

  function toggleCheck(key){
    if(selected.has(key)) selected.delete(key); else selected.add(key);
    render();
  }

  function changeQty(type, id, delta){
    const item = mallCart.find(function(i){return i.id===id;});
    if(!item) return;
    item.qty = Math.max(1, item.qty + delta);
    saveCart();
    render();
  }

  function removeItem(type, id){
    mallCart = mallCart.filter(function(i){return i.id!==id;});
    selected.delete('mall:'+id);
    saveCart();
    render();
  }

  /* 获取选中商品的明细和总价 */
  function getSelectedItems(){
    var items = [];
    mallCart.forEach(function(item){
      if(selected.has('mall:'+item.id)){
        var p = getProduct(item.id);
        if(p) items.push({type:'mall',id:item.id,name:p.name,sub:p.sub,price:p.price,qty:item.qty,image:p.image,tone:p.tone});
      }
    });
    return items;
  }

  /* 计算积分可抵扣金额：1积分=1元，最多抵扣订单30%，不超过积分余额 */
  function getPointsDiscount(total){
    if(!usePoints || !window.AKBPoints) return 0;
    var balance = window.AKBPoints.get().balance || 0;
    var maxByOrder = Math.floor(total * 0.3);
    return Math.min(balance, maxByOrder);
  }

  function updateTotal(){
    var items = getSelectedItems();
    var total = items.reduce(function(sum,it){ return sum + it.price*it.qty; }, 0);
    var count = items.reduce(function(sum,it){ return sum + it.qty; }, 0);
    var discount = getPointsDiscount(total);
    var finalPrice = total - discount;
    document.getElementById('totalPrice').innerHTML = discount > 0 ? '<s style="font-size:14px;color:#AEACC0;font-weight:400">¥'+total+'</s> <b style="color:#E94E4E">¥'+finalPrice+'</b>' : '<b>¥'+total+'</b>';
    document.getElementById('pointsRow').style.display = items.length ? '' : 'none';
    var ptsBalance = window.AKBPoints ? window.AKBPoints.get().balance : 0;
    document.getElementById('pointsInfo').textContent = '可用积分 '+ptsBalance+'，本单可抵扣 ¥'+getPointsDiscount(total);
    document.getElementById('pointsCheck').checked = usePoints;
    const btn = document.getElementById('checkoutBtn');
    btn.textContent = '结算('+count+')';
    btn.disabled = count===0;
  }

  function togglePoints(el){
    usePoints = el.checked;
    updateTotal();
  }

  function esc(value){return String(value||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  /* 收货地址（与服务订单同一数据源） */
  var ADDR_KEY='ankebang_saved_addresses';
  var fallbackAddrs=[
    {id:1,detail:'北京市朝阳区望京街道 88 号 2 单元 1602',contact:'张女士',phone:'138****2468',addressType:'home'},
    {id:2,detail:'北京市朝阳区建国路 66 号 北京协和医院东院区',contact:'张女士',phone:'138****2468',addressType:'hospital'}
  ];
  var payAddrId='';
  var payDelivery='instant';
  var pendingItems=[];
  function getMallAddresses(){try{const v=JSON.parse(localStorage.getItem(ADDR_KEY));if(!Array.isArray(v))return fallbackAddrs.slice();const list=v.map(function(a){return Object.assign({addressType:'home'},a)});if(!list.some(function(a){return a.addressType==='hospital'}))list.push(fallbackAddrs[1]);return list}catch(e){return fallbackAddrs.slice()}}
  function renderPayAddr(){var list=getMallAddresses();var sel=list.find(function(a){return String(a.id)===String(payAddrId)});if(!sel&&list.length){sel=list[0];payAddrId=sel.id}var el=document.getElementById('payAddr');if(el)el.textContent=sel?sel.detail:'请选择收货地址';return sel}
  function openAddrDrawer(){renderAddrList();document.getElementById('addrOverlay').classList.add('show')}
  function renderAddrList(){var list=getMallAddresses();document.getElementById('addrList').innerHTML=list.length?list.map(function(a){return '<div class="addr-item'+(String(a.id)===String(payAddrId)?' sel':'')+'" onclick="selectPayAddr(\''+a.id+'\')"><div class="addr-radio"></div><div><div class="addr-detail">'+esc(a.detail)+'</div><div class="addr-sub">'+(a.contact||'')+(a.phone?' · '+esc(a.phone):'')+'</div></div></div>'}).join(''):'<div style="text-align:center;color:var(--text3);font-size:13px;padding:10px 0">暂无收货地址，请新增</div>'}
  function selectPayAddr(id){payAddrId=id;renderPayAddr();renderAddrList();closeOverlay('addrOverlay')}

  /* 结算 → 打开支付确认弹窗 */
  function checkout(){
    pendingItems=getSelectedItems();
    if(!pendingItems.length) return;
    payDelivery='instant'; usePoints=false;
    renderPayBody();
    renderPayAddr();
    document.getElementById('payOverlay').classList.add('show');
  }

  function renderPayBody(){
    var total=pendingItems.reduce(function(s,it){return s+it.price*it.qty;},0);
    var discount=getPointsDiscount(total);
    var finalPrice=total-discount;
    var productHtml=pendingItems.map(function(it){
      return '<div class="pay-product"><div class="pay-thumb">'+(it.image?'<img src="'+esc(it.image)+'" alt="'+esc(it.name)+'">':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 21s-7-4.5-7-11a5 5 0 019-3 5 5 0 019 3c0 6.5-7 11-7 11z"/></svg>')+'</div><div class="pay-info"><div class="pay-name">'+esc(it.name)+'</div><div class="pay-sub">'+esc(it.sub)+'</div><div class="pay-price-row"><div class="pay-price"><small>¥</small>'+it.price+'</div><div class="pay-qty-txt">x'+it.qty+'</div></div></div></div>';
    }).join('');
    var addrSec='<div class="pay-sec"><div class="pay-sec-label">收货地址</div><div class="pay-addr" onclick="openAddrDrawer()"><span id="payAddr">请选择收货地址</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 3l5 5-5 5"/></svg></div></div>';
    var dlvSec='<div class="pay-sec"><div class="pay-sec-label">配送方式</div><div class="pay-dlv-row"><button class="pay-dlv on" data-dlv="instant" onclick="paySetDelivery(\'instant\',this)">立即送达</button><button class="pay-dlv" data-dlv="runner" onclick="paySetDelivery(\'runner\',this)">跑腿送达</button><button class="pay-dlv" data-dlv="express" onclick="paySetDelivery(\'express\',this)">快递送达</button></div></div>';
    var ptsSec='<div class="pay-sec" style="border-bottom:0"><div class="pay-points-row"><span class="pay-points-txt">可抵 ¥'+discount+'（'+discount+' 积分）</span><button class="pay-toggle '+(usePoints?'on':'')+'" id="payToggle" onclick="payTogglePoints()"></button></div></div>';
    document.getElementById('payBody').innerHTML=productHtml+addrSec+dlvSec+ptsSec;
    document.getElementById('payConfirmBtn').textContent='立即支付 ¥'+finalPrice.toFixed(2);
  }

  function paySetDelivery(v,btn){
    payDelivery=v;
    document.querySelectorAll('.pay-dlv').forEach(function(b){b.classList.toggle('on',b===btn)});
  }
  function payTogglePoints(){
    usePoints=!usePoints;
    var tgl=document.getElementById('payToggle');if(tgl)tgl.classList.toggle('on',usePoints);
    var total=pendingItems.reduce(function(s,it){return s+it.price*it.qty;},0);
    var discount=getPointsDiscount(total);
    var finalPrice=total-discount;
    document.getElementById('payConfirmBtn').textContent='立即支付 ¥'+finalPrice.toFixed(2);
  }

  /* 立即支付 */
  function payConfirm(){
    if(!pendingItems.length) return;
    var selAddr=renderPayAddr();
    if(!selAddr){alert('请先选择收货地址'); return;}
    var total=pendingItems.reduce(function(s,it){return s+it.price*it.qty;},0);
    var discount=getPointsDiscount(total);
    var finalPrice=total-discount;
    if(discount>0 && window.AKBPoints){window.AKBPoints.spend(discount,'购物车订单');}
    var now=new Date();
    var dateStr=now.toISOString().slice(0,10);
    var orderNo='AKB-M'+now.getFullYear()+String(Math.floor(Math.random()*999999)).padStart(6,'0');
    var code=String(Math.floor(1000+Math.random()*9000));
    var deliveryLabels={instant:'立即送达',runner:'跑腿送达',express:'快递送达'};
    var first=pendingItems[0];
    var addrText=selAddr?(selAddr.detail+(selAddr.contact?' · '+selAddr.contact:'')):'默认收货地址';
    var order={
      id:orderNo, status:'shipping', state:'待发货',
      product:first.name, desc:first.sub,
      price:String(first.price),
      quantity:pendingItems.reduce(function(s,i){return s+i.qty;},0),
      amount:String(total),
      pointsDiscount:discount,
      finalAmount:String(finalPrice),
      date:dateStr, address:addrText,
      image:first.image||'', tone:first.tone||'purple',
      deliveryMethod:payDelivery, deliveryLabel:deliveryLabels[payDelivery],
      receiptCode:code, deliveryStatus:'processing',
      items:pendingItems.map(function(i){return {product:i.name,desc:i.sub,price:String(i.price),quantity:i.qty,image:i.image,tone:i.tone};})
    };
    try{
      var saved=JSON.parse(localStorage.getItem('ankebang_mall_orders')||'[]');
      if(!Array.isArray(saved)) saved=[];
      saved.unshift(order);
      localStorage.setItem('ankebang_mall_orders',JSON.stringify(saved));
    }catch(e){}
    pendingItems.forEach(function(it){
      mallCart=mallCart.filter(function(c){return c.id!==it.id;});
      selected.delete('mall:'+it.id);
    });
    saveCart(); usePoints=false; pendingItems=[];
    closeOverlay('payOverlay');
    document.getElementById('okProduct').textContent=first.name+' 等'+order.quantity+'件';
    document.getElementById('okAddr').textContent=addrText;
    document.getElementById('okCode').textContent=code;
    document.getElementById('okTotal').textContent='¥'+total;
    document.getElementById('okDeduct').textContent=discount>0?'-¥'+discount:'—';
    document.getElementById('okPaid').textContent='¥'+finalPrice;
    document.getElementById('successOverlay').classList.add('show');
    render();
  }

  function closeOverlay(id){document.getElementById(id).classList.remove('show')}
  function closeBackdrop(event,id){if(event.target===document.getElementById(id))closeOverlay(id)}

  render();
</script>

<!-- 结算支付弹窗 -->
  <div class="overlay" id="payOverlay" onclick="closeBackdrop(event,'payOverlay')">
    <section class="sheet pay-sheet">
      <div class="sheet-head" style="padding:18px 16px 0"><div class="sheet-title">确认订单</div><button class="close" onclick="closeOverlay('payOverlay')" aria-label="关闭">×</button></div>
      <div class="pay-scroll" id="payBody"></div>
      <button class="pay-confirm" id="payConfirmBtn" onclick="payConfirm()">立即支付 ¥0</button>
    </section>
  </div>

  <!-- 收货地址选择抽屉 -->
  <div class="overlay" id="addrOverlay" onclick="closeBackdrop(event,'addrOverlay')">
    <section class="sheet">
      <div class="sheet-head"><div class="sheet-title">选择收货地址</div><button class="close" onclick="closeOverlay('addrOverlay')" aria-label="关闭">×</button></div>
      <div class="addr-list" id="addrList"></div>
      <button class="addr-add" onclick="location.href='address-edit.html?return=cart'">＋ 新增收货地址</button>
    </section>
  </div>

  <!-- 支付成功全页 -->
  <div class="overlay" id="successOverlay" style="align-items:stretch">
    <div class="pay-success-page">
      <div class="pay-success-top">
        <div class="pay-success-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
        <div class="pay-success-title">支付成功</div>
        <div class="pay-success-desc">商品会按你选择的方式配送，送达后请向配送员提供收货码完成签收。</div>
      </div>
      <div class="pay-success-card">
        <div class="pay-success-row"><span class="k">商品名称</span><span class="v" id="okProduct">—</span></div>
        <div class="pay-success-row"><span class="k">收货地址</span><span class="v" id="okAddr">—</span></div>
        <div class="pay-success-row"><span class="k">收货码</span><span class="v" id="okCode">—</span></div>
        <div class="pay-success-row"><span class="k">支付方式</span><span class="v">微信支付</span></div>
        <div class="pay-success-row"><span class="k">应付金额</span><span class="v" id="okTotal">—</span></div>
        <div class="pay-success-row"><span class="k">积分抵扣</span><span class="v deduct" id="okDeduct">—</span></div>
        <div class="pay-success-row"><span class="k">实付金额</span><span class="v highlight" id="okPaid">—</span></div>
      </div>
      <div class="pay-success-btns">
        <button class="btn-ghost" onclick="closeOverlay('successOverlay')">返回首页</button>
        <button class="btn-primary" onclick="location.href='orders.html'">查看订单</button>
      </div>
    </div>
  </div>
</div></div>
</html>

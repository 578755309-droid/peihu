<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>服务评价 · 佑小邦</title>
  <style>
    :root{--purple:#8655C5;--purple-dark:#6B3FAA;--purple-light:#EDE6F7;--purple-bg:#F5F3FA;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#16965A;--sh:0 2px 16px rgba(100,60,160,.08)}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}.frame{display:flex;justify-content:center;min-height:100vh;background:#E4DDF0}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg);position:relative}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:42px;overflow:hidden;box-shadow:0 24px 72px rgba(80,40,140,.22)}}
    .scroll{flex:1;overflow:auto;padding-bottom:28px}.scroll::-webkit-scrollbar{display:none}.status-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;background:#fff;font-size:13px;font-weight:700}.status-right{display:flex;gap:5px}.status-right svg{width:17px;height:12px}.navbar{height:58px;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--border)}.nav-title{font-size:18px;font-weight:900}.back{position:absolute;left:16px;width:36px;height:36px;border:0;border-radius:11px;background:var(--purple-light);color:var(--purple);display:grid;place-items:center;cursor:pointer}.back svg{width:20px;height:20px}.review-card{margin:14px;padding:20px 16px;border-radius:20px;background:#fff;box-shadow:var(--sh)}.review-service{padding:13px;border-radius:13px;background:#F8F6FC}.service-label{color:var(--text3);font-size:11px}.service-name{margin-top:5px;font-size:16px;font-weight:900}.service-meta{margin-top:4px;color:var(--text2);font-size:12px;line-height:1.5}.review-title{text-align:center;margin-top:24px;font-size:18px;font-weight:900}.review-sub{text-align:center;margin-top:7px;color:var(--text2);font-size:12px}.stars{display:flex;justify-content:center;gap:7px;margin:18px 0 8px}.star{width:39px;height:39px;padding:0;border:0;background:transparent;color:#D8D2E4;font-size:32px;line-height:1;cursor:pointer;transition:color .15s,transform .15s}.star.selected,.star:hover{color:#F3B63F;transform:scale(1.08)}.score{text-align:center;min-height:18px;color:var(--purple);font-size:12px;font-weight:800}.field-label{display:block;margin:23px 0 8px;font-size:13px;font-weight:900}.review-input{width:100%;height:128px;resize:none;padding:12px;border:1.5px solid var(--border);border-radius:13px;background:#FAF9FD;color:var(--text);font:500 13px/1.6 inherit;outline:none}.review-input:focus{border-color:var(--purple);background:#fff}.review-input::placeholder{color:var(--text3)}.error{min-height:18px;margin-top:6px;color:#D93025;font-size:11px}.submit{width:100%;height:46px;margin-top:8px;border:0;border-radius:13px;background:linear-gradient(135deg,#9060D0,#6B3FAA);color:#fff;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 7px 18px rgba(107,63,170,.22)}.success{display:none;margin:14px;padding:52px 20px 30px;border-radius:20px;background:#fff;box-shadow:var(--sh);text-align:center}.success.show{display:block}.form.hidden{display:none}.success-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:#DCFCE7;color:var(--green)}.success-icon svg{width:34px;height:34px}.success-title{font-size:20px;font-weight:900}.success-desc{margin-top:9px;color:var(--text2);font-size:13px;line-height:1.6}.success-score{margin-top:18px;padding:12px;border-radius:12px;background:var(--purple-light);color:var(--purple);font-size:13px;font-weight:900}.success-actions{display:flex;gap:9px;margin-top:22px}.success-actions button{flex:1;height:43px;border:0;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer}.back-order{background:var(--purple-light);color:var(--purple)}.home{background:var(--purple);color:#fff}
  </style>
</head>
<body><div class="frame"><div class="phone"><main class="scroll"><div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/><rect x="9" y="0" width="3" height="12"/><rect x="13.5" y="0" width="3" height="12" opacity=".28"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="currentColor" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="currentColor"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="currentColor"/></svg></div></div><header class="navbar"><button class="back" type="button" onclick="history.length>1?history.back():location.href='orders.html'" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M13 4.5L7.5 10 13 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1 class="nav-title">服务评价</h1></header><section class="review-card form" id="reviewForm"><div class="review-service"><div class="service-label">本次服务</div><div class="service-name" id="serviceName">基础陪护服务</div><div class="service-meta" id="serviceMeta">护理员：张秀英 · 住院陪护</div></div><div class="review-title">综合陪护星级</div><div class="review-sub">请为本次陪护服务选择星级并留下评价</div><div class="stars" role="radiogroup" aria-label="综合陪护星级"><button class="star" type="button" data-value="1" onclick="selectRating(1)" aria-label="1星">★</button><button class="star" type="button" data-value="2" onclick="selectRating(2)" aria-label="2星">★</button><button class="star" type="button" data-value="3" onclick="selectRating(3)" aria-label="3星">★</button><button class="star" type="button" data-value="4" onclick="selectRating(4)" aria-label="4星">★</button><button class="star" type="button" data-value="5" onclick="selectRating(5)" aria-label="5星">★</button></div><div class="score" id="score">请选择星级</div><label class="field-label" for="reviewText">文字评价</label><textarea class="review-input" id="reviewText" maxlength="200" placeholder="说说本次护理服务的体验吧"></textarea><div class="error" id="error"></div><button class="submit" type="button" onclick="submitReview()">提交评价</button></section><section class="success" id="success"><div class="success-icon"><svg viewBox="0 0 34 34" fill="none"><path d="M8 17l6 6 12-12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="success-title">评价成功</div><div class="success-desc">感谢你的反馈，我们会持续提升陪护服务质量。</div><div class="success-score" id="successScore">综合陪护星级 ★★★★★ · 4.9 分</div><div class="success-actions"><button class="back-order" type="button" onclick="location.href='orders.html'">返回订单</button><button class="home" type="button" onclick="location.href='home.html'">返回首页</button></div></section></main></div></div>
<script>
  const DATA={
    'AKB-2026-022301':{service:'基础陪护服务',meta:'护理员：张秀英 · 住院陪护',years:3},
    'AKB-2026-040318':{service:'上门助浴服务',meta:'护理员：陈护理师 · 上门助浴',years:5}
  };
  const no=new URLSearchParams(location.search).get('no')||'AKB-2026-022301';const data=DATA[no]||DATA['AKB-2026-022301'];let rating=0;
  document.getElementById('serviceName').textContent=data.service;document.getElementById('serviceMeta').textContent=data.meta;
  function readRatings(){try{const value=JSON.parse(localStorage.getItem('akb_service_ratings_v2')||'{}');return value&&typeof value==='object'?value:{};}catch(error){return {};}}
  function stars(score){const filled=Math.max(0,Math.min(5,Math.round(score)));return '★'.repeat(filled)+'☆'.repeat(5-filled)}
  function composite(userScore){const care=Math.min(5,3.8+data.years*.2);return Number((4.8*.3+care*.3+userScore*.4).toFixed(1))}
  function selectRating(value){rating=value;document.querySelectorAll('.star').forEach(function(star){star.classList.toggle('selected',Number(star.dataset.value)<=rating)});document.getElementById('score').textContent=rating+' 星';document.getElementById('error').textContent=''}
  function submitReview(){const text=document.getElementById('reviewText').value.trim();const error=document.getElementById('error');if(!rating){error.textContent='请选择星级';return}if(!text){error.textContent='请填写文字评价';document.getElementById('reviewText').focus();return}const total=composite(rating);const ratings=readRatings();ratings[no]={userScore:rating,total:total,stars:stars(total),text:text};localStorage.setItem('akb_service_ratings_v2',JSON.stringify(ratings));document.getElementById('reviewForm').classList.add('hidden');document.getElementById('success').classList.add('show');document.getElementById('successScore').textContent='综合陪护星级 '+ratings[no].stars+' · '+total+' 分'}
  if(readRatings()[no]){const saved=readRatings()[no];document.getElementById('reviewForm').classList.add('hidden');document.getElementById('success').classList.add('show');document.getElementById('successScore').textContent='综合陪护星级 '+(saved.stars||stars(saved.total))+' · '+saved.total+' 分'}
</script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <script src="vendor/vue.global.prod.js"></script>
  <script src="ui/icons.js"></script>
  <script src="ui/vue-ui.js"></script>
  <script src="common-ui.js"></script>
<script src="review-order-seeds.js"></script>
<script src="review-store.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>服务评价 · 佑小邦</title>
  <style>
    :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#16965A;--sh:0 2px 16px rgba(0,0,0,0.1)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}
    .phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg);position:relative}
    @media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
    .scroll{flex:1;overflow:auto;padding-bottom:28px}
    .scroll::-webkit-scrollbar{display:none}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;background:#fff;font-size:14px;font-weight:600}
    .status-right{display:flex;gap:5px}
    .status-right svg{width:17px;height:12px}
    .navbar{height:58px;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--border)}
    .nav-title{font-size:18px;font-weight:700}
    .back{position:absolute;left:16px;width:36px;height:36px;border:0;border-radius:12px;background:var(--purple-light);color:var(--purple);display:grid;place-items:center;cursor:pointer}
    .back svg{width:20px;height:20px}
    .review-card{margin:14px;padding:18px 16px;border-radius:12px;background:#fff;box-shadow:var(--sh)}
    /* 服务信息卡 */
    .review-service{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:#F8F6FC}
    .svc-cover{width:54px;height:54px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#E7F7EF}
    .service-name{font-size:16px;font-weight:700;line-height:1.3}
    .service-meta{margin-top:4px;color:var(--text2);font-size:13px}
    /* 维度评分 */
    .dim-row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid var(--border)}
    .dim-row:last-of-type{border-bottom:0}
    .dim-label{font-size:14px;color:var(--text);font-weight:600}
    .dim-stars{display:flex;gap:9px}
    .dim-star{padding:0;border:0;background:transparent;color:#D8D2E4;font-size:25px;line-height:1;cursor:pointer}
    .dim-star.on{color:#F59E0B}
    /* 快捷标签 */
    .tag-section{margin-top:20px}
    .field-label{display:block;margin:0 0 10px;font-size:14px;font-weight:700}
    .tag-row{display:flex;flex-wrap:wrap;gap:9px}
    .q-tag{padding:7px 14px;border:1px solid var(--border);border-radius:12px;background:#FAF9FD;color:var(--text2);font:700 12px inherit;cursor:pointer}
    .q-tag.on{border-color:var(--purple);background:var(--purple-light);color:var(--purple-dark);font-weight:600}
    /* 文字评价 */
    .text-section{margin-top:20px;position:relative}
    .review-input{width:100%;height:120px;resize:none;padding:12px;border:1.5px solid var(--border);border-radius:12px;background:#FAF9FD;color:var(--text);font:500 13px/1.6 inherit;outline:none}
    .review-input:focus{border-color:var(--purple);background:#fff}
    .review-input::placeholder{color:var(--text3)}
    .char-count{position:absolute;right:12px;bottom:10px;color:var(--text3);font-size:12px}
    .error{min-height:18px;margin-top:6px;color:#D93025;font-size:12px}
    /* 图片上传 */
    .img-section{margin-top:18px}
    .img-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
    .img-cell{position:relative;width:100%;padding-top:100%;border-radius:12px;overflow:hidden}
    .img-cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .img-del{position:absolute;right:4px;top:4px;width:20px;height:20px;border:0;border-radius:12px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:1;cursor:pointer;z-index:2}
    .img-add{position:absolute;inset:0;border:1.5px dashed var(--border);border-radius:12px;background:#FAF9FD;color:var(--text3);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
    .img-add svg{width:26px;height:26px}
    .img-add span{font-size:12px;font-weight:600}
    .submit{width:100%;height:46px;margin-top:22px;border:0;border-radius:12px;background:linear-gradient(135deg,#2BD8BC,#0FA98C);color:#fff;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 7px 18px rgba(0,0,0,0.1)}
    .success{display:none;margin:14px;padding:52px 20px 30px;border-radius:12px;background:#fff;box-shadow:var(--sh);text-align:center}
    .success.show{display:block}
    .form.hidden{display:none}
    .success-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:12px;display:grid;place-items:center;background:#DCFCE7;color:var(--green)}
    .success-icon svg{width:34px;height:34px}
    .success-title{font-size:20px;font-weight:700}
    .success-desc{margin-top:9px;color:var(--text2);font-size:14px;line-height:1.6}
    .success-score{margin-top:18px;padding:12px;border-radius:12px;background:var(--purple-light);color:var(--purple);font-size:14px;font-weight:700}
    .success-actions{display:flex;gap:9px;margin-top:22px}
    .success-actions button{flex:1;height:43px;border:0;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer}
    .back-order{background:var(--purple-light);color:var(--purple)}
    .home{background:var(--purple);color:#fff}
  </style>
  <link rel="stylesheet" href="visual-theme.css" />
  <link rel="stylesheet" href="ui/vue-ui.css" />
  <link rel="stylesheet" href="ui/mobile-ui.css">
</head>
<body data-surface="mobile" data-page="service-review">
<div class="frame"><div class="phone">
  <main class="scroll">
    <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/><rect x="9" y="0" width="3" height="12"/><rect x="13.5" y="0" width="3" height="12" opacity=".28"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="currentColor" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="currentColor"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="currentColor"/></svg></div></div>
    <header class="navbar">
      <button class="back" type="button" onclick="history.length>1?history.back():location.href='orders.html'" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M13 4.5L7.5 10 13 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h1 class="nav-title">服务评价</h1>
    </header>

    <section class="review-card form" id="reviewForm">
      <div class="review-service">
        <img class="svc-cover" id="serviceCover" alt="服务封面" />
        <div>
          <div class="service-name" id="serviceName">基础版-陪护</div>
          <div class="service-meta" id="serviceMeta">护理员张秀英 · 住院陪护</div>
        </div>
      </div>

      <div id="dimBox"></div>

      <div class="tag-section">
        <div class="field-label">印象标签</div>
        <div class="tag-row" id="tagRow"></div>
      </div>

      <div class="text-section">
        <textarea class="review-input" id="reviewText" maxlength="200" placeholder="说说本次护理服务的体验吧"></textarea>
        <span class="char-count" id="charCount">0/200</span>
      </div>
      <div class="error" id="error"></div>

      <div class="img-section">
        <div class="img-grid" id="imgGrid"></div>
        <input type="file" id="imgInput" accept="image/*" multiple style="display:none" />
      </div>

      <button class="submit" type="button" onclick="submitReview()">提交评价</button>
    </section>

    <section class="success" id="success">
      <div class="success-icon"><svg viewBox="0 0 34 34" fill="none"><path d="M8 17l6 6 12-12" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="success-title">评价成功</div>
      <div class="success-desc">感谢你的反馈，我们会持续提升陪护服务质量。</div>
      <div class="success-score" id="successScore">综合陪护星级 ★★★★★ · 4.9 分</div>
      <div class="success-actions"><button class="back-order" type="button" onclick="location.href='orders.html'">返回订单</button><button class="home" type="button" onclick="location.href='home.html'">返回首页</button></div>
    </section>
  </main>
</div></div>

<script>
  /* 简单的服务封面（内联 SVG，离线可用） */
  function coverSvg(bg,fg,label){var svg='<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108"><rect width="108" height="108" rx="14" fill="'+bg+'"/><circle cx="84" cy="22" r="26" fill="'+fg+'" opacity=".18"/><text x="54" y="58" font-size="15" font-weight="bold" text-anchor="middle" fill="'+fg+'" font-family="sans-serif">'+label+'</text><path d="M34 78h40v14H34z" fill="'+fg+'" opacity=".25"/></svg>';return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
  var COVERS={default:coverSvg('#E7F7EF','#16965A','陪护服务'),mall:coverSvg('#FFF0F0','#D94646','商城商品'),bath:coverSvg('#EAF3FF','#397EBA','上门助浴'),clinic:coverSvg('#FFF3E1','#C17A24','陪诊服务')};
  var params=new URLSearchParams(location.search),orderKind=params.get('kind')==='mall'?'mall':'service';
  var no=params.get('no')||'AKB-2026-022301',order=AKBReviews.find(orderKind,no);
  var category=AKBReviews.type(order,orderKind),profile=AKBReviews.profile(category);
  var data={service:orderKind==='mall'?(order&&order.product):(order&&(order.project||order.type)),meta:orderKind==='mall'?(order&&order.desc):[order&&order.nurse,order&&order.type].filter(Boolean).join(' · '),cover:order&&order.image||COVERS[category==='mall'?'mall':category==='visit'?'clinic':category==='bath'?'bath':'default']};
  document.querySelector('.nav-title').textContent=profile.title;document.title=profile.title+' · 佑小邦';
  document.getElementById('serviceName').textContent=data.service||'未找到订单';
  document.getElementById('serviceMeta').textContent=data.meta||'';
  document.getElementById('serviceCover').src=data.cover;
  document.getElementById('serviceCover').alt=orderKind==='mall'?'商品图片':'服务封面';
  document.getElementById('reviewText').placeholder=profile.placeholder;
  document.querySelector('.success-desc').textContent=profile.thanks;
  document.querySelector('.back-order').onclick=function(){location.href='orders.html'+(orderKind==='mall'?'?type=mall':'');};
  var DIMS=profile.dims.map(function(d){return {key:d[0],label:d[1]};});
  var TAG_OPTIONS=profile.tags;
  var MAX_IMGS=6;
  var dimScores={}, pickedTags=[], reviewImages=[];

  /* 渲染维度星级 */
  document.getElementById('dimBox').innerHTML=DIMS.map(function(d){
    return '<div class="dim-row"><span class="dim-label">'+d.label+'</span><div class="dim-stars" data-dim="'+d.key+'">'+[1,2,3,4,5].map(function(n){return '<button type="button" class="dim-star" data-n="'+n+'" onclick="setDim(\''+d.key+'\','+n+')">★</button>'}).join('')+'</div></div>';
  }).join('');
  function setDim(key,n){if(!DIMS.some(function(d){return d.key===key;})||!Number.isInteger(n)||n<1||n>5)return;dimScores[key]=n;document.querySelectorAll('.dim-stars[data-dim="'+key+'"] .dim-star').forEach(function(s){s.classList.toggle('on',Number(s.dataset.n)<=n)});document.getElementById('error').textContent=''}
  window.setDim=setDim;

  /* 渲染快捷标签 */
  document.getElementById('tagRow').innerHTML=TAG_OPTIONS.map(function(t){return '<button type="button" class="q-tag" onclick="toggleTag(this)">'+t+'</button>'}).join('');
  function toggleTag(btn){btn.classList.toggle('on');pickedTags=Array.prototype.map.call(document.querySelectorAll('.q-tag.on'),function(b){return b.textContent})}
  window.toggleTag=toggleTag;

  /* 字数统计 */
  document.getElementById('reviewText').addEventListener('input',function(e){document.getElementById('charCount').textContent=e.target.value.length+'/200'});

  /* 图片上传与压缩 */
  var imgInput=document.getElementById('imgInput');
  document.getElementById('imgGrid').innerHTML='<div class="img-cell"><label class="img-add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="14" rx="2.5"/><circle cx="12" cy="13" r="3.2"/><path d="M8 6l1.2-2h5.6L16 6" stroke-linecap="round"/></svg><span>上传</span></label></div>';
  document.querySelector('.img-add').addEventListener('click',function(){imgInput.click()});
  imgInput.addEventListener('change',function(e){
    var files=Array.prototype.slice.call(e.target.files||[]);
    files.forEach(function(file){
      if(reviewImages.length>=MAX_IMGS)return;
      var reader=new FileReader();
      reader.onload=function(ev){compress(ev.target.result,function(dataUrl){if(reviewImages.length<MAX_IMGS){reviewImages.push(dataUrl);renderImgs()}})};
      reader.readAsDataURL(file);
    });
    imgInput.value='';
  });
  function compress(src,cb){
    var img=new Image();
    img.onload=function(){
      var max=800,scale=Math.min(1,max/Math.max(img.width,img.height));
      var w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg',.72));
    };
    img.onerror=function(){cb(src)};
    img.src=src;
  }
  function renderImgs(){
    var cells=reviewImages.map(function(src,i){return '<div class="img-cell"><img src="'+src+'" alt="评价图片"><button type="button" class="img-del" onclick="removeImg('+i+')">×</button></div>'}).join('');
    var add=reviewImages.length<MAX_IMGS?'<div class="img-cell"><div class="img-add" id="imgAddBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="14" rx="2.5"/><circle cx="12" cy="13" r="3.2"/><path d="M8 6l1.2-2h5.6L16 6" stroke-linecap="round"/></svg><span>上传</span></div></div>':'';
    document.getElementById('imgGrid').innerHTML=cells+add;
    var btn=document.getElementById('imgAddBtn');if(btn)btn.addEventListener('click',function(){imgInput.click()});
  }
  window.removeImg=function(i){reviewImages.splice(i,1);renderImgs()};

  function showSaved(saved){
    document.getElementById('reviewForm').classList.add('hidden');document.getElementById('success').classList.add('show');
    document.getElementById('successScore').textContent=profile.score+' '+(saved.stars||AKBReviews.stars(saved.total))+' · '+saved.total+' 分';
    var old=document.getElementById('savedReview');if(old)old.remove();var box=document.createElement('div');box.id='savedReview';box.style.cssText='text-align:left;margin-top:18px;font-size:13px;line-height:1.8;overflow-wrap:anywhere';
    var app=Vue.createApp({render:function(){return Vue.h('div',null,[...(saved.dimensionLabels||(saved.dimensions&&saved.dimensions.professional!=null?AKBReviews.profile('care').dims.map(function(d){return {key:d[0],label:d[1]};}):DIMS)).map(function(d){return Vue.h('div',{class:'dim-row'},[Vue.h('span',null,d.label),Vue.h('span',{style:'color:#EBAF26'},AKBReviews.stars((saved.dimensions||{})[d.key]))]);}),Vue.h('p',{style:'white-space:pre-wrap'},saved.text||''),Vue.h('p',{style:'color:#718195'},(saved.tags||[]).join(' · ')),Vue.h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},(saved.images||[]).map(function(src){return Vue.h('img',{src:src,alt:'评价图片',style:'width:80px;height:80px;object-fit:cover;border-radius:12px'});} ))]);}});document.getElementById('successScore').after(box);app.mount(box);
  }
  function submitReview(){
    var error=document.getElementById('error');
    try{var saved=AKBReviews.submit(orderKind,no,{dimensions:dimScores,text:document.getElementById('reviewText').value,tags:pickedTags,images:reviewImages,cover:data.cover});showSaved(saved);}catch(e){error.textContent=e.name==='QuotaExceededError'?'评价未保存，请减少图片后重试':e.message;}
  }
  var saved=AKBReviews.read()[no];
  if(saved&&!saved.deleted)showSaved(saved);
  else if(!AKBReviews.eligible(order)||saved&&saved.deleted){document.getElementById('error').textContent=saved&&saved.deleted?'该订单的评价已处理，不能重复提交':'仅已完成的订单可以评价';document.querySelector('.submit').disabled=true;}
</script>
</body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <script src="vendor/vue.global.prod.js"></script>
  <script src="ui/icons.js"></script>
  <script src="ui/vue-ui.js"></script>
  <script src="common-ui.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>消息 · 佑小邦陪护</title>
  <style>
    :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--r-md:12px;--r-lg:12px;--sh:0 2px 12px rgba(0,0,0,0.1)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}
    .phone{width:100%;max-width:430px;display:flex;flex-direction:column;background:var(--purple-bg);min-height:100vh;position:relative}
    @media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
    .scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
    .scroll-area::-webkit-scrollbar{display:none}

    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 6px;font-size:14px;font-weight:600;background:linear-gradient(135deg,#DDF7F1,#EFFBF8)}
    .status-right{display:flex;align-items:center;gap:5px}
    .status-right svg{width:17px;height:17px}

    .top-bar{display:flex;align-items:center;justify-content:center;height:56px;padding:0 14px;background:linear-gradient(135deg,#DDF7F1,#EFFBF8)}
    .top-bar h1{font-size:18px;font-weight:700;color:var(--text)}

    .cat-tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);padding:0 14px}
    .cat-tab{flex:1;text-align:center;padding:14px 0;font-size:15px;font-weight:600;color:var(--text3);cursor:pointer;position:relative}
    .cat-tab.on{color:var(--purple)}
    .cat-tab.on::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:24px;height:3px;border-radius:12px;background:var(--purple)}

    .msg-list{padding:14px}
    .msg-item{display:flex;gap:12px;background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--sh);cursor:pointer}
    .msg-avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
    .msg-avatar.system{background:#EAF3FF;color:#397EBA}
    .msg-avatar.order{background:#FFF3E1;color:#C17A24}
    .msg-avatar.activity{background:#E7F7EF;color:#31956B}
    .msg-avatar svg{width:24px;height:24px}
    .msg-body{flex:1;min-width:0}
    .msg-row{display:flex;justify-content:space-between;align-items:center}
    .msg-name{font-size:14px;font-weight:600;color:var(--text)}
    .msg-time{font-size:12px;color:var(--text3);flex-shrink:0;margin-left:8px}
    .msg-preview{font-size:13px;color:var(--text3);margin-top:5px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .badge{display:inline-block;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 5px;border-radius:12px;background:#E94E4E;color:#fff;font-size:11px;font-weight:600;margin-left:6px;vertical-align:middle}

    .empty{text-align:center;padding:80px 20px;color:var(--text3)}
    .empty svg{width:64px;height:64px;color:var(--text3);opacity:.5;margin-bottom:16px}
    .empty p{font-size:14px}

    /* 底部 Tab */
    .bottom-nav{flex-shrink:0;display:flex;background:#fff;border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,0.1)}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;text-decoration:none;min-width:0}
    .nav-ico{width:26px;height:26px;stroke:#AEACC0;fill:none}
    .nav-lbl{font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap}
    .nav-item.act .nav-ico{stroke:var(--purple)}
    .nav-item.act .nav-lbl{color:var(--purple)}
  </style>
  <link rel="stylesheet" href="visual-theme.css" />
  <link rel="stylesheet" href="ui/vue-ui.css" />
</head>
<body data-surface="mobile" data-page="messages">
<div class="frame"><div class="phone">
  <div class="scroll-area">
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-right">
        <svg viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".28"/></svg>
        <svg viewBox="0 0 17 13" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M8.5 9.5a1.4 1.4 0 100 2.8 1.4 1.4 0 000-2.8z" fill="currentColor" stroke="none"/><path d="M5.2 7a4.7 4.7 0 016.6 0" stroke-width="1.5"/><path d="M2 4a8.8 8.8 0 0113 0" stroke-width="1.5"/></svg>
        <svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="currentColor" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="currentColor"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="currentColor"/></svg>
      </div>
    </div>

    <div class="top-bar"><h1>消息</h1></div>

    <div class="cat-tabs">
      <div class="cat-tab on" data-cat="all" onclick="switchCat('all')">全部</div>
      <div class="cat-tab" data-cat="system" onclick="switchCat('system')">系统消息</div>
      <div class="cat-tab" data-cat="order" onclick="switchCat('order')">订单消息</div>
    </div>

    <div class="msg-list" id="msgList"></div>
    <div style="height:72px"></div>
  </div>

  <!-- 底部 Tab -->
  <nav class="bottom-nav">
    <a class="nav-item" href="home.html">
      <svg class="nav-ico" viewBox="0 0 26 26" fill="none"><path d="M4.5 13.2L13 5.8l8.5 7.4V22a1.4 1.4 0 01-1.4 1.4H16V18h-6v5.4H5.9A1.4 1.4 0 014.5 22z" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span class="nav-lbl">首页</span>
    </a>
    <a class="nav-item" href="visit-services.html">
      <svg class="nav-ico" viewBox="0 0 26 26" fill="none"><rect x="4.5" y="4" width="17" height="18" rx="2.5" stroke-width="1.8"/><path d="M4.5 9h17" stroke-width="1.8" stroke-linecap="round"/><circle cx="13" cy="15" r="2.5" stroke-width="1.8"/></svg>
      <span class="nav-lbl">热门服务</span>
    </a>
    <a class="nav-item" href="cart.html">
      <svg class="nav-ico" viewBox="0 0 26 26" fill="none"><path d="M5 9h16l-1 13H6L5 9zM9 10V7a4 4 0 018 0v3" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span class="nav-lbl">购物车</span>
    </a>
    <a class="nav-item act" href="messages.html">
      <svg class="nav-ico" viewBox="0 0 26 26" fill="none"><path d="M5 6.5A3.5 3.5 0 018.5 3h9A3.5 3.5 0 0121 6.5v7a3.5 3.5 0 01-3.5 3.5H12l-4.5 4v-4.2A3.5 3.5 0 015 13.5z" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 9.5h6" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="nav-lbl">消息</span>
    </a>
    <a class="nav-item" href="profile.html">
      <svg class="nav-ico" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="10" r="4.2" stroke-width="1.8"/><path d="M5 22.5c1.6-3.8 4.6-6 8-6s6.4 2.2 8 6" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="nav-lbl">我的</span>
    </a>
  </nav>
</div></div>
<script>
  const MESSAGES = {
    system: [
      {name:'系统公告',time:'10:30',preview:'尊敬的用户，平台将于本周日凌晨2:00-4:00进行系统升级维护，期间部分功能可能无法正常使用，敬请谅解。',unread:1},
      {name:'安全提醒',time:'昨天',preview:'为保障您的账户安全，建议定期修改密码并开启短信验证。',unread:0}
    ],
    order: [
      {name:'订单提醒',time:'今天 09:15',preview:'您的住院陪护订单（AKB-20251014-883271）护理员已接单，预计10分钟后到达医院。',unread:1},
      {name:'订单提醒',time:'昨天 16:42',preview:'您的商城订单已发货，配送方式：顺丰速运，单号：SF1234567890。',unread:0},
      {name:'订单提醒',time:'10月12日',preview:'您的陪诊服务已完成，服务评价已记录，感谢您的信任与支持！',unread:0}
    ]
  };

  let currentCat = 'all';

  function iconFor(type){
    if(type==='system') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V5l8-3z"/></svg>';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h10"/></svg>';
  }

  function render(){
    let list = [];
    if(currentCat==='all'){
      list = [...MESSAGES.system.map(m=>({...m,type:'system'})), ...MESSAGES.order.map(m=>({...m,type:'order'}))];
    } else {
      list = MESSAGES[currentCat].map(m=>({...m,type:currentCat}));
    }
    const el = document.getElementById('msgList');
    if(!list.length){
      el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M5 6.5A3.5 3.5 0 018.5 3h9A3.5 3.5 0 0121 6.5v7a3.5 3.5 0 01-3.5 3.5H12l-4.5 4v-4.2A3.5 3.5 0 015 13.5z"/></svg><p>暂无消息</p></div>';
      return;
    }
    el.innerHTML = list.map(m =>
      '<div class="msg-item" onclick="alert(\'消息详情\')">'+
        '<div class="msg-avatar '+m.type+'">'+iconFor(m.type)+'</div>'+
        '<div class="msg-body">'+
          '<div class="msg-row"><div><span class="msg-name">'+m.name+'</span>'+(m.unread?'<span class="badge">'+m.unread+'</span>':'')+'</div><span class="msg-time">'+m.time+'</span></div>'+
          '<div class="msg-preview">'+m.preview+'</div>'+
        '</div>'+
      '</div>'
    ).join('');
  }

  function switchCat(cat){
    currentCat = cat;
    document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('on', t.dataset.cat===cat));
    render();
  }

  render();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>编辑个人资料 · 护理员端</title>
  <style>
    :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--sh:0 2px 16px rgba(0,0,0,0.1);--r-lg:12px}
    *,*:before,*:after{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}.frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg)}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
    .scroll{flex:1;overflow:auto}.scroll::-webkit-scrollbar{display:none}.status-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;background:#fff;font-size:14px;font-weight:600}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:17px}.navbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;background:#fff;border-bottom:1px solid var(--border)}.back-btn{width:36px;height:36px;border:0;border-radius:12px;background:var(--purple-light);color:var(--purple);display:grid;place-items:center;cursor:pointer}.back-btn svg{width:20px;height:20px}.nav-title{font-size:17px;font-weight:700}.nav-ph{width:36px}.content{padding:14px;display:flex;flex-direction:column;gap:12px;padding-bottom:28px}.section{background:var(--card);border-radius:12px;box-shadow:var(--sh);overflow:hidden}.section-head{padding:15px 16px 11px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700}.form{padding:5px 16px 16px}.field{padding:12px 0;border-bottom:1px solid var(--border)}.field:last-child{border-bottom:0}.field label{display:block;color:var(--text3);font-size:12px;font-weight:600;margin-bottom:7px}.field input,.field textarea{width:100%;border:0;outline:0;background:var(--purple-bg);border-radius:12px;padding:10px 11px;color:var(--text);font:700 13px inherit}.field textarea{min-height:88px;resize:vertical;line-height:1.55}.hint{padding:0 16px 14px;color:var(--text3);font-size:11px;line-height:1.5}.save{display:block;width:100%;height:44px;border:0;border-radius:12px;background:var(--purple);color:#fff;font:800 13px inherit;cursor:pointer}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);padding:17px 25px;border-radius:12px;background:rgba(25,15,45,.9);color:#fff;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  </style>
  <link rel="stylesheet" href="visual-theme.css" />
</head>
<body data-surface="mobile" data-page="nurse-profile-edit">
  <div class="frame"><div class="phone"><main class="scroll">
    <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".28"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="currentColor" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="currentColor"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="currentColor"/></svg></div></div>
    <header class="navbar"><button class="back-btn" onclick="history.back()" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M13 4.5L7.5 10 13 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="nav-title">编辑个人资料</span><span class="nav-ph"></span></header>
    <section class="content"><article class="section"><div class="section-head">基本资料</div><form class="form" onsubmit="saveProfile(event)"><div class="field"><label for="name">姓名</label><input id="name" value="李桂芳" /></div><div class="field"><label for="age">年龄</label><input id="age" type="number" value="38" /></div><div class="field"><label for="specialty">擅长陪护类型</label><input id="specialty" value="住院专护 / 术后护理" /></div><div class="field"><label for="years">从业年限</label><input id="years" value="5 年" /></div><div class="field"><label for="intro">自我介绍</label><textarea id="intro">从业 5 年，持证上岗，擅长术后康复与老年患者住院陪护，重视沟通和护理细节。</textarea></div><button class="save" type="submit">保存资料</button></form><div class="hint">资料提交后将用于服务档案展示，平台审核中的资质信息请在资质管理中维护。</div></article></section>
  </main></div></div><div class="toast" id="toast"></div>
  <script>function saveProfile(event){event.preventDefault();const toast=document.getElementById('toast');toast.textContent='资料已保存';toast.classList.add('show');setTimeout(()=>location.href='nurse-profile.html',900)}</script>
</body>
</html>

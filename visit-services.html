<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>陪诊服务 · 安科邦陪护</title>
  <style>
    :root{--purple:#8655C5;--purple-dark:#6B3FAA;--purple-light:#EDE6F7;--purple-bg:#F5F3FA;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--sh:0 2px 16px rgba(100,60,160,.08);--r-lg:20px}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}.frame{display:flex;justify-content:center;min-height:100vh;background:#E4DDF0}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg)}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:42px;overflow:hidden;box-shadow:0 24px 72px rgba(80,40,140,.22)}}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;background:#fff;font-size:13px;font-weight:700}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:17px}.navbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 12px;background:#fff;border-bottom:1px solid var(--border)}.back-btn{width:36px;height:36px;border:0;border-radius:11px;background:var(--purple-light);display:grid;place-items:center;cursor:pointer}.back-btn svg{width:20px;height:20px}.nav-title{font-size:17px;font-weight:800}.nav-ph{width:36px}.scroll{flex:1;overflow:auto;padding:16px 14px 28px}.intro{padding:15px 16px;border-radius:18px;background:linear-gradient(135deg,#9060D0,#6B3FAA);color:#fff;margin-bottom:14px;box-shadow:0 8px 22px rgba(107,63,170,.2)}.intro h1{font-size:18px;font-weight:900;margin-bottom:4px}.intro p{font-size:12px;line-height:1.55;color:rgba(255,255,255,.78)}.service-list{display:grid;gap:11px}.service-card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--sh);overflow:hidden}.service-main{display:flex;align-items:center;gap:12px;padding:15px}.service-index{width:32px;height:32px;flex-shrink:0;border-radius:10px;background:var(--purple-light);color:var(--purple);font-size:13px;font-weight:900;display:grid;place-items:center}.service-copy{flex:1;min-width:0}.service-name{font-size:15px;font-weight:900;color:var(--text)}.service-summary{margin-top:4px;font-size:12px;color:var(--text3);line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.choose-btn{height:36px;padding:0 12px;border:0;border-radius:10px;background:var(--purple);color:#fff;font:800 12px inherit;white-space:nowrap;cursor:pointer}.service-detail{border-top:1px solid var(--border)}.service-detail summary{padding:10px 15px;color:var(--purple);font-size:12px;font-weight:800;cursor:pointer;list-style:none}.service-detail summary::-webkit-details-marker{display:none}.service-detail summary::after{content:'展开';float:right;color:var(--text3);font-weight:600}.service-detail[open] summary::after{content:'收起'}.service-detail ol{padding:0 18px 14px 32px;color:var(--text2);font-size:12px;line-height:1.65}.service-detail li+li{margin-top:3px}.list-note{text-align:center;color:var(--text3);font-size:11px;margin:16px 0 4px}
  </style>
</head>
<body><div class="frame"><div class="phone">
  <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="currentColor" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="currentColor"/></svg></div></div>
  <header class="navbar"><button class="back-btn" onclick="history.length>1?history.back():location.href='home.html'" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M13 4.5L7.5 10 13 15.5" stroke="#8655C5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="nav-title">陪诊服务</span><div class="nav-ph"></div></header>
  <main class="scroll"><section class="intro"><h1>选择所需服务</h1><p>按实际就医需求选择服务，后续可选择医院、护理员和服务日期。</p></section><div class="service-list" id="serviceList"></div><p class="list-note">服务内容以实际就医安排为准</p></main>
</div></div>
<script src="service-catalog.js"></script><script>
  const services=[
    {id:'vip',name:'贵宾陪诊',price:298,summary:'全流程就医陪同与诊后回访',details:['了解患者基本情况、病史、本次主诉','了解目标医院，确认目标科室','代办目标医院电子就诊卡','诊前提醒注意事项','代办线上挂号手续','微信发送医院定位','医院门口接送患者','代办诊室签到手续','协助患者与门诊医生沟通','代缴医院相关费用','代约检查项目','陪同做检查','代取药','解读医嘱','记录诊疗方案，诊后回访']},
    {id:'premium',name:'优享陪诊',price:698,summary:'含目标医院目标科室门诊医生预约',details:['代约目标医院目标科室门诊医生','了解患者基本情况、病史、本次主诉','了解目标医院，确认目标科室','代办目标医院电子就诊卡','诊前提醒注意事项','代办线上挂号手续','微信发送医院定位','医院门口接送患者','代办诊室签到手续','协助患者与门诊医生沟通','代缴医院相关费用','代约检查项目','陪同做检查','代取药','解读医嘱','记录诊疗方案，诊后回访']},
    {id:'medicine',name:'代买药',price:99,summary:'协助沟通、问诊、取药及快递寄送',details:['沟通患者用药基本情况','确认药品厂家、规格、商品名、通用名及购买数量等','确认目标医院','确认报销方式','门诊挂号','与门诊医生沟通患者基本情况','缴费取药','药品、病历、发票全国发顺丰快递']},
    {id:'exam-booking',name:'代约检查',price:169,summary:'协助开检查单、缴费并预约检查',details:['沟通患者基本情况','办理目标医院电子就诊卡','挂号','门诊与医生沟通患者情况，开检查单','缴费、预约检查','邮寄检查单或在检查当日将检查单交予患者']},
    {id:'result',name:'代看检查结果',price:169,summary:'协助问诊、解读医嘱及后续办理',details:['了解患者主诉','挂号','门诊与医生沟通患者病情','按照医嘱和患者沟通是否执行医嘱','代缴费','执行医嘱代取药、代约检查等','邮寄就医相关资料']},
    {id:'admission',name:'代办住院手续',price:300,summary:'协助获取住院证并办理入院手续',details:['了解患者基本情况、病史、主诉','门诊挂号','与医生沟通患者情况，获取住院证','医院办理住院登记等手续','住院当日科室、住院部办理入院手续']},
    {id:'discharge',name:'代办出院手续',price:300,summary:'协助出院、报销与资料邮寄',details:['协助准备出院资料','住院部办理出院手续','办理报销','打印住院清单、发票','邮寄出院相关资料','落实押金、报销费用到账']},
    {id:'ring-pickup',name:'三环内接/送患者',price:150,summary:'安排商务车辆接送患者',details:['确认接送地点、时间、人数','安排五座或七座商务车辆']},
    {id:'airport',name:'机场接/送患者',price:380,summary:'司机与陪诊员协同完成接送机',details:['确认航班信息、人数','安排五座或七座商务车辆','确认是否需要轮椅等','接送机由司机和陪诊员两人完成','机场接客户至医院或者酒店']},
    {id:'report',name:'代取报告',price:89,summary:'协助取检查报告并顺丰寄送',details:['沟通检查项目、检查日期、取报告日期','目标医院取报告','全国顺丰快递发纸质报告']},
    {id:'station',name:'西安北站接送患者',price:200,summary:'安排商务车辆接送患者',details:['确认列车信息、人数','安排五座或七座商务车辆','确认是否需要轮椅等','接送由司机和陪诊员两人完成','西安北站接客户至医院或者酒店']}
  ];
  const escapeHtml=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function renderServices(list){document.getElementById('serviceList').innerHTML=list.map((s,i)=>'<article class="service-card"><div class="service-main"><div class="service-index">'+String(i+1).padStart(2,'0')+'</div><div class="service-copy"><div class="service-name">'+escapeHtml(s.name)+'</div><div class="service-summary">'+escapeHtml(s.summary)+'</div></div><button class="choose-btn" onclick="selectService(\''+s.id+'\')">选择服务</button></div><details class="service-detail"><summary>服务详情</summary><ol>'+s.details.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ol></details></article>').join('');}
  renderServices(services);
  function selectService(id){location.href='hospital-care.html?service=visit&visitService='+encodeURIComponent(id)}
</script>
<script>
  (function(){var c=window.AKBServiceCatalog&&window.AKBServiceCatalog.get();if(!c)return;var base={};services.forEach(function(s){base[s.id]=s});var list=c.services.filter(function(s){return s.category==='visit'&&s.status==='on'}).sort(function(a,b){return (a.sort||0)-(b.sort||0)}).map(function(s){return Object.assign({},base[s.id]||{},s,{details:(base[s.id]&&base[s.id].details)||[]})});if(list.length)renderServices(list);})();
</script>
</body></html>

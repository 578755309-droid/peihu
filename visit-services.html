<!doctype html>
<html lang="zh-CN">
<head>
  <script src="vendor/vue.global.prod.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>热门服务 · 安科邦陪护</title>
  <style>
    :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}
    .phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg)}
    @media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;background:#fff;font-size:14px;font-weight:600}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:17px}
    .navbar{display:flex;align-items:center;justify-content:center;padding:10px 16px 12px;background:#fff;border-bottom:1px solid var(--border)}
    .nav-title{font-size:17px;font-weight:600}
    .scroll{flex:1;overflow:auto;padding:14px 13px 28px}

    /* Service cards share the home page component in visual-theme.css. */
    .svc-tile-wrap{position:relative;min-width:0}
    /* ── 底部 Tab ── */
    .bottom-nav{flex-shrink:0;display:flex;background:#fff;border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,0.1)}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;text-decoration:none;min-width:0}
    .nav-ico{width:26px;height:26px;stroke:#AEACC0;fill:none}
    .nav-lbl{font-size:12px;font-weight:600;color:var(--text3);white-space:nowrap}
    .nav-item.act .nav-ico{stroke:var(--purple)}
    .nav-item.act .nav-lbl{color:var(--purple)}
  </style>
  <link rel="stylesheet" href="visual-theme.css" />
  <link rel="stylesheet" href="ui/vue-ui.css" />
<script src="youkang-store.js"></script>
</head>
<body data-surface="mobile" data-page="visit-services"><div class="frame"><div class="phone">
  <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="3" width="3" height="9" rx="1"/><rect x="4.5" y="1.5" width="3" height="10.5" rx="1"/><rect x="9" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="currentColor" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="currentColor"/></svg></div></div>
  <header class="navbar"><span class="nav-title">热门服务</span></header>
  <main class="scroll"><div class="svc-grid service-card-grid" id="serviceList"></div></main>

  <!-- 底部 Tab -->
  <nav class="bottom-nav">
    <a class="nav-item" href="home.html">
      <svg class="nav-ico" viewBox="0 0 26 26" fill="none"><path d="M4.5 13.2L13 5.8l8.5 7.4V22a1.4 1.4 0 01-1.4 1.4H16V18h-6v5.4H5.9A1.4 1.4 0 014.5 22z" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span class="nav-lbl">首页</span>
    </a>
    <a class="nav-item act" href="visit-services.html">
      <svg class="nav-ico" viewBox="0 0 26 26" fill="none"><rect x="4.5" y="4" width="17" height="18" rx="2.5" stroke-width="1.8"/><path d="M4.5 9h17" stroke-width="1.8" stroke-linecap="round"/><circle cx="13" cy="15" r="2.5" stroke-width="1.8"/></svg>
      <span class="nav-lbl">热门服务</span>
    </a>
    <a class="nav-item" href="cart.html">
      <svg class="nav-ico" viewBox="0 0 26 26" fill="none"><path d="M5 9h16l-1 13H6L5 9zM9 10V7a4 4 0 018 0v3" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span class="nav-lbl">购物车</span>
    </a>
    <a class="nav-item" href="messages.html">
      <svg class="nav-ico" viewBox="0 0 26 26" fill="none"><path d="M5 6.5A3.5 3.5 0 018.5 3h9A3.5 3.5 0 0121 6.5v7a3.5 3.5 0 01-3.5 3.5H12l-4.5 4v-4.2A3.5 3.5 0 015 13.5z" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 9.5h6" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span class="nav-lbl">消息</span>
    </a>
    <a class="nav-item" href="profile.html">
      <svg class="nav-ico" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="10" r="4.2" stroke-width="1.8"/><path d="M5 22.5c1.6-3.8 4.6-6 8-6s6.4 2.2 8 6" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span class="nav-lbl">我的</span>
    </a>
  </nav>
</div></div>
<script src="service-catalog.js"></script>
<script>
  /* 服务默认销量（供无数据时的种子展示） */
  const DEFAULT_SALES={vip:1280,premium:680,medicine:320,'exam-booking':210,result:190,admission:150,discharge:130,'ring-pickup':260,airport:145,report:380,station:175};
  /* 服务配图：只显示照片，不叠加图标。 */
  var IMG_API='https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?image_size=landscape_4_3&prompt=';
  var SVC_IMGS={
    vip:'assets/svc/vip.png',
    premium:'assets/svc/premium.png',
    medicine:'assets/svc/medicine.png',
    'exam-booking':IMG_API+'doctor%20scheduling%20medical%20examination%20appointment%20for%20senior%20patient%2C%20modern%20hospital%2C%20photorealistic',
    result:IMG_API+'doctor%20reviewing%20medical%20test%20report%20with%20patient%2C%20modern%20clinic%2C%20photorealistic',
    admission:'assets/svc/admission.png',
    discharge:IMG_API+'smiling%20senior%20patient%20leaving%20hospital%20ward%20with%20discharge%20documents%2C%20photorealistic',
    'ring-pickup':'assets/svc/ring-pickup.png',
    airport:IMG_API+'airport%20pickup%20service%2C%20driver%20welcoming%20elderly%20traveler%20at%20arrival%20hall%2C%20photorealistic',
    report:IMG_API+'courier%20delivering%20medical%20report%20documents%20with%20express%20envelope%2C%20photorealistic',
    station:IMG_API+'railway%20station%20pickup%20service%2C%20driver%20helping%20elderly%20passenger%20with%20luggage%2C%20photorealistic'
  };
  function fmtSales(n){return n>=1000?(n/1000).toFixed(1)+'k':n}
  function renderServices(list){
    document.getElementById('serviceList').innerHTML=list.map(function(s){
      var sales;
      if(s.useManualSales===false){sales=s.actualSales!=null?s.actualSales:0;}
      else if(s.manualSales!=null){sales=s.manualSales;}
      else if(s.sales!=null){sales=s.sales;}
      else{sales=DEFAULT_SALES[s.id]||0;}
      var price=s.price!=null?s.price:0;
      return '<div class="svc-tile-wrap" onclick="selectService(\''+s.id+'\')"><article class="svc-tile service-card">'+
        '<div class="svc-tile-img">'+(SVC_IMGS[s.id]?'<img src="'+SVC_IMGS[s.id]+'" alt="'+(s.name||'服务')+'" onerror="this.remove()">':'')+'</div>'+
        '<div class="svc-tile-body">'+
          '<div class="svc-tile-name">'+(s.name||'')+'</div>'+
          '<div class="svc-tile-sub">'+(s.summary||'')+'</div>'+
          '<div class="svc-tile-pts"><span class="pts-tag">积分立减30%</span><span class="pts-link">我的积分 30</span></div>'+
          '<div class="svc-tile-meta">'+
            '<div class="svc-tile-price"><small>¥</small>'+price+'<small>起</small></div>'+
            '<div class="svc-tile-sales">已售 '+fmtSales(sales)+'</div>'+
          '</div>'+
        '</div>'+
      '</article></div>';
    }).join('');
  }
  /* 兜底静态列表 */
  const FALLBACK=[
    {id:'vip',name:'贵宾陪诊',price:298,summary:'全流程就医陪同与诊后回访'},
    {id:'premium',name:'优享陪诊',price:698,summary:'含目标医院目标科室门诊医生预约'},
    {id:'medicine',name:'代买药',price:99,summary:'协助沟通、问诊、取药及快递寄送'},
    {id:'exam-booking',name:'代约检查',price:169,summary:'协助开检查单、缴费并预约检查'},
    {id:'result',name:'代看检查结果',price:169,summary:'协助问诊、解读医嘱及后续办理'},
    {id:'admission',name:'代办住院手续',price:300,summary:'协助获取住院证并办理入院手续'},
    {id:'discharge',name:'代办出院手续',price:300,summary:'协助出院、报销与资料邮寄'},
    {id:'ring-pickup',name:'三环内接/送患者',price:150,summary:'安排商务车辆接送患者'},
    {id:'airport',name:'机场接/送患者',price:380,summary:'司机与陪诊员协同完成接送机'},
    {id:'report',name:'代取报告',price:89,summary:'协助取检查报告并顺丰寄送'},
    {id:'station',name:'西安北站接送患者',price:200,summary:'安排商务车辆接送患者'}
  ];
  function selectService(id){location.href='hospital-care.html?service=visit&visitService='+encodeURIComponent(id)}
  /* 优先从数据层读取，兜底静态 */
  (function(){
    var cat=window.AKBServiceCatalog&&window.AKBServiceCatalog.get();
    var list=cat?(cat.services.filter(function(s){return s.category==='visit'&&s.status==='on'}).sort(function(a,b){return(a.sort||0)-(b.sort||0)})):[];
    if(!list.length)list=FALLBACK;
    renderServices(list);
  })();
</script>
<script src="youkang-bridge.js"></script>
</body></html>

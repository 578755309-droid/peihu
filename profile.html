<!doctype html>
<html lang="zh-CN">
<head>
  <script src="vendor/vue.global.prod.js"></script>
  <script src="ui/icons.js"></script>
  <script src="ui/vue-ui.js"></script>
  <script src="common-ui.js"></script>
  <script src="nurse-certification-state.js"></script>
  <script src="ui/role-switch.js"></script>
  <meta charset="utf-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的 · 佑小邦</title>
  <style>
    :root {
      --purple:       #1CD8B7;
      --purple-dark:  #0FA98C;
      --purple-light: #DDF7F1;
      --purple-bg: #F5F5F5;
      --card:         #FFFFFF;
      --text:         #1A1828;
      --text2:        #6B6880;
      --text3:        #AEACC0;
      --border:       #EDE9F5;
      --red:          #EF4444;
      --green:        #22C55E;
      --sh: 0 2px 16px rgba(0,0,0,0.1);
      --r-lg: 12px; --r-md: 12px; --r-sm: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--purple-bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Desktop frame */
    .frame { display: flex; justify-content: center; min-height: 100vh; background: #F5F5F5; }
    .phone {
      width: 100%; max-width: 430px;
      display: flex; flex-direction: column; background: var(--purple-bg); min-height: 100vh;
    }
    @media (min-width: 520px) {
      .frame { align-items: flex-start; padding: 20px 0 40px; }
      .phone {
        height: 900px; min-height: unset; border-radius: 12px; overflow: hidden;
        box-shadow: 0 24px 72px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,.06);
      }
    }

    .scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .scroll-area::-webkit-scrollbar { display: none; }
    .phone > .profile-header { position:sticky; top:0; z-index:40; flex-shrink:0; background:#0D8373; }
    .phone > .scroll-area { min-height:0; padding-top:10px; }
    body[data-page="profile"] .profile-header .hero { padding-bottom:16px; }
    body[data-page="profile"] .stats-card { margin-top:0; }

    /* Status bar */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px 6px;
      background: linear-gradient(135deg,#2DD4BF,#10B981);
    }
    .status-bar span { font-size: 13px; font-weight: 600; color: #fff; }
    .status-right { display: flex; align-items: center; gap: 5px; }

    /* Hero */
    .hero {
      background: linear-gradient(135deg,#2DD4BF 0%,#10B981 100%);
      padding: 12px 20px 40px;
      position: relative; overflow: hidden;
    }
    .hero::after {
      content: ''; position: absolute;
      width: 240px; height: 240px; border-radius: 12px;
      background: rgba(255,255,255,.06); top: -80px; right: -60px; pointer-events: none;
    }
    .hero-top-actions { position: absolute; top: 8px; right: 16px; display: flex; gap: 10px; align-items: center; z-index: 2; }
    .hero-top-actions svg { width: 22px; height: 22px; color: rgba(255,255,255,.85); }
    .hero-row { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar {
      width: 64px; height: 64px; border-radius: 12px;
      background: linear-gradient(140deg,#FCD34D,#F59E0B);
      display: grid; place-items: center;
      border: 3px solid rgba(255,255,255,.45);
      font-size: 24px; font-weight: 700; color: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
    }
    .hero-info { flex: 1; min-width: 0; }
    .hero-name-row { display: flex; align-items: center; gap: 8px; }
    .hero-name { font-size: 18px; font-weight: 700; color: #fff; }
    .hero-id-inline { font-size: 14px; color: rgba(255,255,255,.75); font-weight: 600; }
    .hero-cert {
      display: inline-block; margin-top: 6px;
      background: #F59E0B; border-radius: 12px;
      padding: 2px 7px; font-size: 12px; font-weight: 600; color: #fff;
    }
    .hero-arrow { color: rgba(255,255,255,.6); flex-shrink: 0; margin-left: auto; }
    .hero-arrow svg { width: 20px; height: 20px; }

    /* Stats card */
    .stats-card {
      background: var(--card); border-radius: 12px;
      margin: -20px 14px 0; position: relative; z-index: 2;
      box-shadow: 0 8px 28px rgba(16,185,129,.12);
      display: flex; overflow: hidden;
    }
    .stat-item {
      flex: 1; padding: 14px 16px; display: flex; flex-direction: column;
      align-items: center; gap: 4px; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: background .12s;
    }
    .stat-item:active { background: var(--purple-bg); }
    .stat-item + .stat-item { border-left: 1px solid var(--border); }
    .stat-num { font-size: 20px; font-weight: 700; color: var(--text); }
    .stat-lbl { font-size: 13px; font-weight: 600; color: var(--text2); }
    .stat-sub { font-size: 11px; color: var(--text3); }
    .stat-tag { display: inline-block; background: #F59E0B; border-radius: 12px; padding: 1px 5px; font-size: 11px; font-weight: 600; color: #fff; margin-top: 2px; }

    /* Section */
    .section { margin: 16px 14px 0; }
    .sec-title {
      font-size: 13px; font-weight: 600; color: var(--text3);
      letter-spacing: .5px; margin-bottom: 8px; padding-left: 4px;
    }
    .menu-card {
      background: var(--card); border-radius: 12px;
      box-shadow: var(--sh); overflow: hidden;
    }
    .menu-item {
      display: flex; align-items: center; gap: 13px;
      padding: 15px 16px; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: background .12s;
      text-decoration: none; color: inherit;
    }
    .menu-item:active { background: var(--purple-bg); }
    .menu-item + .menu-item { border-top: 1px solid var(--border); }
    .menu-ico {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .menu-ico svg { width: 20px; height: 20px; }
    .menu-ico.purple { background: var(--purple-light); }
    .menu-ico.blue   { background: #DBEAFE; }
    .menu-ico.green  { background: #DCFCE7; }
    .menu-ico.orange { background: #FEF3C7; }
    .menu-ico.red    { background: #FEE2E2; }
    .menu-ico.gray   { background: #F3F4F6; }
    .menu-text { flex: 1; }
    .menu-name { font-size: 15px; font-weight: 600; color: var(--text); }
    .menu-sub  { font-size: 12px; color: var(--text3); margin-top: 2px; }
    .menu-arrow { color: var(--text3); flex-shrink: 0; }
    .menu-arrow svg { width: 16px; height: 16px; }
    .menu-badge {
      background: var(--red); color: #fff; font-size: 11px; font-weight: 600;
      border-radius: 12px; padding: 2px 7px; margin-right: 4px;
    }

    /* Invite banner */
    .invite-banner {
      margin: 16px 14px 0; border-radius: 12px; overflow: hidden;
      background: linear-gradient(135deg,#F97316,#EA580C);
      display: flex; align-items: center; padding: 18px 20px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      position: relative; box-shadow: 0 6px 20px rgba(249,115,22,.25);
    }
    .invite-banner:active { filter: brightness(.93); }
    .invite-text { flex: 1; color: #fff; }
    .invite-title { font-size: 17px; font-weight: 700; }
    .invite-sub { font-size: 13px; font-weight: 600; opacity: .85; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
    .invite-sub svg { width: 14px; height: 14px; }
    .invite-icon { width: 52px; height: 52px; flex-shrink: 0; margin-left: 12px; }
    .invite-icon svg { width: 100%; height: 100%; }

    /* Logout */
    .logout-wrap { margin: 28px 14px 0; text-align: center; }
    .logout-btn { border: 0; background: none; color: var(--text3); font: 700 14px inherit; cursor: pointer; padding: 10px 20px; }

    /* Points card */
    .points-card {
      background: linear-gradient(135deg,#2BD8BC,#0FA98C);
      border-radius: 12px; padding: 16px 18px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: filter .12s;
    }
    .points-card:active { filter: brightness(.92); }
    .points-ico {
      width: 46px; height: 46px; border-radius: 12px;
      background: rgba(255,255,255,.12); display: grid; place-items: center; flex-shrink: 0;
    }
    .points-ico svg { width: 26px; height: 26px; }
    .points-info { flex: 1; }
    .points-title { font-size: 13px; font-weight: 600; color: rgba(255,255,255,.68); margin-bottom: 3px; }
    .points-num { font-size: 25px; font-weight: 700; color: #fff; line-height:1; }
    .points-sub { font-size: 13px; color: rgba(255,255,255,.72); font-weight: 600; }
    .points-arrow { color: rgba(255,255,255,.8); }
    .points-arrow svg { width: 18px; height: 18px; }

    /* Order shortcuts */
    .order-shortcuts { background:var(--card); border-radius:12px; box-shadow:var(--sh); overflow:hidden; }
    .order-shortcuts-head { display:flex; align-items:center; justify-content:space-between; padding:16px 16px 10px; }
    .order-shortcuts-title { font-size:17px; font-weight:700; color:var(--text); }
    .order-all { border:0; background:none; color:var(--purple); font:700 12px inherit; cursor:pointer; display:flex; align-items:center; gap:3px; }
    .order-all svg { width:14px; height:14px; }
    .order-type-switch { display:flex; margin:0 16px; border-bottom:1px solid var(--border); }
    .order-type-option { flex:1; padding:8px 4px 9px; border:0; border-bottom:2px solid transparent; background:none; color:var(--text3); font:800 12px inherit; cursor:pointer; }
    .order-type-option.on { color:var(--purple); border-bottom-color:var(--purple); }
    .order-shortcuts-list { display:grid; grid-template-columns:repeat(5,1fr); padding:2px 7px 15px; }
    .order-shortcuts-list[hidden] { display:none; }

    /* 专属护理员卡片 */
    .cg-count { font-size:13px; font-weight:600; color:var(--text3); }
    .cg-scroll {
      display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
      padding:2px 16px 16px; scrollbar-width:none; -webkit-overflow-scrolling:touch;
    }
    .cg-scroll::-webkit-scrollbar { display:none; }
    .cg-card {
      flex:0 0 calc(100% - 46px); scroll-snap-align:center;
      background:linear-gradient(150deg,#EDFBF7,#FFFFFF 55%);
      border:1px solid #CFF5ED; border-radius:12px; padding:14px;
    }
    .cg-top { display:flex; align-items:center; gap:12px; }
    .cg-av {
      width:52px; height:52px; border-radius:12px; flex:0 0 52px;
      background:linear-gradient(140deg,#1CD8B7,#0FA98C); color:#fff;
      display:grid; place-items:center; font-size:19px; font-weight:700;
      border:2px solid #fff; box-shadow:0 2px 7px rgba(15,169,140,.2);
    }
    .cg-info { min-width:0; flex:1; }
    .cg-name { font-size:15px; font-weight:700; color:var(--text); }
    .cg-role { margin-left:5px; font-size:12px; font-weight:600; color:var(--text3); }
    .cg-badges { display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
    .cg-badge { padding:3px 7px; border-radius:12px; background:#DCFCE7; color:#16A34A; font-size:11px; font-weight:600; }
    .cg-badge.exp { background:#DDF7F1; color:#0FA98C; }
    .cg-status { flex:0 0 auto; padding:4px 9px; border-radius:12px; background:#DCFCE7; color:#16A34A; font-size:12px; font-weight:600; display:inline-flex; align-items:center; gap:4px; }
    .cg-status::before { content:""; width:6px; height:6px; border-radius:12px; background:#22C55E; animation:cgPulse 1.6s ease-in-out infinite; }
    @keyframes cgPulse { 0%,100%{opacity:1} 50%{opacity:.35} }
    .cg-order {
      margin-top:12px; background:#fff; border:1px solid #EFF3F6; border-radius:12px;
      padding:11px 13px; cursor:pointer; transition:background .12s;
    }
    .cg-order:active { background:#F6FBF9; }
    .cg-order-title { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .cg-order-name { font-size:14px; font-weight:700; color:var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .cg-order-no { font-size:11px; color:var(--text3); font-weight:600; flex:0 0 auto; }
    .cg-rows { margin-top:7px; display:grid; gap:4px; }
    .cg-row { display:flex; gap:8px; font-size:12px; line-height:1.5; color:var(--text2); }
    .cg-row b { flex:0 0 auto; font-weight:600; color:var(--text3); }
    .cg-row span { min-width:0; }
    .cg-foot { display:flex; gap:9px; margin-top:12px; }
    .cg-btn {
      flex:1; height:36px; border-radius:12px; border:1px solid #A9EEE0;
      background:#fff; color:var(--purple); font:800 13px inherit; cursor:pointer;
      display:inline-flex; align-items:center; justify-content:center; gap:5px;
    }
    .cg-btn svg { width:15px; height:15px; }
    .cg-btn.primary { border-color:var(--purple); background:var(--purple); color:#fff; }
    .cg-btn:active { transform:scale(.98); }
    .cg-hint { text-align:center; font-size:11px; color:var(--text3); font-weight:600; padding:0 0 4px; }
    .order-shortcut { min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px; padding:4px 0; border:0; background:none; color:var(--text2); font:700 10px inherit; cursor:pointer; }
    .shortcut-ico { width:28px; height:28px; color:var(--purple); }
    .shortcut-ico svg { width:100%; height:100%; }
    .shortcut-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

    /* Bottom padding */
    .bottom-space { height: 20px; }

    /* Bottom nav */
    .bottom-nav {
      flex-shrink: 0; display: flex; background: var(--card);
      border-top: 1px solid var(--border);
      padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 4px 0; cursor: pointer; text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-ico { width: 26px; height: 26px; stroke:#AEACC0; fill:none; }
    .nav-lbl { font-size: 12px; font-weight: 600; color: var(--text3); }
    .nav-item.act .nav-lbl { color: var(--purple); }
    .nav-item.act .nav-ico { stroke: var(--purple); }
    .address-overlay { position:fixed; inset:0; z-index:200; background:rgba(25,15,45,.48); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s; }
    .address-overlay.show { opacity:1; pointer-events:auto; }
    .address-sheet { width:min(430px,100%); max-height:82vh; overflow:auto; background:#fff; border-radius:12px; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); transform:translateY(18px); transition:transform .24s; }
    .address-overlay.show .address-sheet { transform:none; }
    .address-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .address-title { font-size:18px; font-weight:700; color:var(--text); }
    .address-close { width:32px; height:32px; border:0; border-radius:12px; background:var(--purple-light); color:var(--text2); cursor:pointer; font-size:20px; }
    .saved-address { display:flex; align-items:flex-start; gap:10px; padding:13px 12px; border:1.5px solid var(--border); border-radius:12px; margin-bottom:10px; }
    .saved-address-main { flex:1; min-width:0; }
    .saved-address-name { font-size:14px; font-weight:600; color:var(--text); }
    .saved-address-detail { font-size:13px; color:var(--text2); margin-top:4px; line-height:1.45; }
    .saved-address-actions { display:flex; gap:6px; }
    .saved-address-actions button { border:0; background:var(--purple-light); color:var(--purple); border-radius:12px; padding:5px 8px; font:700 11px inherit; cursor:pointer; }
    .saved-address-actions .danger { color:#DC2626; background:#FEE2E2; }
    .address-empty { padding:24px 0; text-align:center; color:var(--text3); font-size:14px; }
    .address-add-btn { width:100%; height:44px; border:1.5px dashed var(--purple); border-radius:12px; background:#fff; color:var(--purple); font:800 13px inherit; cursor:pointer; }
  </style>
  <link rel="stylesheet" href="visual-theme.css" />
  <link rel="stylesheet" href="ui/vue-ui.css" />
<script src="youkang-store.js"></script>
</head>
<body data-surface="mobile" data-page="profile">
<div class="frame">
  <div class="phone">
    <header class="profile-header" aria-label="个人信息">
      <!-- Status bar -->
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-right">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
            <rect x="0" y="3" width="3" height="9" rx="1" fill="#fff"/>
            <rect x="4.5" y="2" width="3" height="10" rx="1" fill="#fff"/>
            <rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="#fff"/>
            <rect x="13.5" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".35"/>
          </svg>
          <svg width="17" height="12" viewBox="0 0 24 12" fill="none">
            <rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="#fff" stroke-width="1.2"/>
            <rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="#fff"/>
            <rect x="2" y="2" width="15" height="8" rx="1.8" fill="#fff"/>
          </svg>
        </div>
      </div>

      <!-- Hero -->
      <div class="hero">
        <div class="hero-top-actions">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="18" cy="12" r="1.5" fill="currentColor"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
        </div>
        <a class="hero-row" href="user-profile.html" aria-label="查看和编辑个人资料" style="text-decoration:none;color:inherit">
          <div class="avatar-wrap"><div class="avatar">章</div></div>
          <div class="hero-info">
            <div class="hero-name-row">
              <span class="hero-name">章北海</span>
              <span class="hero-id-inline">10001000</span>
            </div>
            <span class="hero-cert">普通用户</span>
          </div>
          <div class="hero-arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </a>
      </div>

    </header>

    <div class="scroll-area">
      <!-- Stats -->
      <div class="stats-card">
        <div class="stat-item" onclick="location.href='my-cards.html'">
          <span class="stat-num">1张</span>
          <span class="stat-lbl">卡包</span>
          <span class="stat-sub" id="cardCountSub">9次服务</span>
        </div>
        <div class="stat-item" onclick="location.href='points.html'">
          <span class="stat-num" id="profilePointsNum">123</span>
          <span class="stat-lbl">积分</span>
          <span class="stat-tag">去使用</span>
        </div>
      </div>

      <!-- 我的订单 -->
      <div class="section">
        <div class="order-shortcuts">
          <div class="order-shortcuts-head">
            <span class="order-shortcuts-title">我的订单</span>
            <button class="order-all" onclick="location.href='orders.html'">全部<svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <div class="order-shortcuts-list">
            <button class="order-shortcut" onclick="location.href='orders.html?tab=payment'"><span class="shortcut-ico"><img class="design-icon" src="assets/design/wallet.svg" width="48" height="48" alt="" aria-hidden="true" /></span><span class="shortcut-name">待支付</span></button>
            <button class="order-shortcut" onclick="location.href='orders.html?tab=pending-service'"><span class="shortcut-ico"><img class="design-icon" src="assets/design/calendar.svg" width="48" height="48" alt="" aria-hidden="true" /></span><span class="shortcut-name">待服务</span></button>
            <button class="order-shortcut" onclick="location.href='orders.html?tab=active'"><span class="shortcut-ico"><img class="design-icon" src="assets/design/hourglass.svg" width="48" height="48" alt="" aria-hidden="true" /></span><span class="shortcut-name">服务中</span></button>
            <button class="order-shortcut" onclick="location.href='orders.html?tab=done'"><span class="shortcut-ico"><img class="design-icon" src="assets/design/complete.svg" width="48" height="48" alt="" aria-hidden="true" /></span><span class="shortcut-name">已完成</span></button>
            <button class="order-shortcut" onclick="location.href='orders.html?tab=refund'"><span class="shortcut-ico"><img class="design-icon" src="assets/design/refund.svg" width="48" height="48" alt="" aria-hidden="true" /></span><span class="shortcut-name">退款/售后</span></button>
          </div>
        </div>
      </div>

      <!-- 专属护理员 -->
      <div class="section" id="nurseSection" hidden>
        <div class="order-shortcuts">
          <div class="order-shortcuts-head">
            <span class="order-shortcuts-title">专属护理员</span>
            <span class="cg-count" id="cgCount"></span>
          </div>
          <div class="cg-scroll" id="cgScroll"></div>
          <div class="cg-hint" id="cgHint" hidden>左右滑动查看更多</div>
        </div>
      </div>

<script>
  /* 积分 */
  document.getElementById('profilePointsNum').textContent = AKBPoints.get().balance;
  /* 切换到陪护端：已有陪护员身份直接进入，否则走认证流程 */
  window.switchToNurse = function () {
    var s = window.AKBNurseCertification ? AKBNurseCertification.summary() : { effective: false, label: '未认证' };
    if (s.effective) { location.href = 'nurse-home.html'; return; }
    location.href = 'nurse-certification.html';
  };
  (function () {
    var chip = document.getElementById('nurseRoleChip');
    var sub = document.getElementById('nurseRoleSub');
    if (!chip) return;
    var s = window.AKBNurseCertification ? AKBNurseCertification.summary() : { effective: false, label: '未认证', app: null };
    if (s.effective) {
      chip.textContent = '已认证';
      chip.style.color = '#0FA98C';
      sub.textContent = s.app && s.app.caregiverId ? '工号 ' + s.app.caregiverId + ' · 进入工作台' : '进入工作台';
    } else if (s.app && s.app.status === '审核中') {
      chip.textContent = '审核中';
      chip.style.color = '#D97706';
      sub.textContent = '认证通过后即可进入';
    } else if (s.app && s.app.status === '审核驳回') {
      chip.textContent = '未通过';
      chip.style.color = '#EF4444';
      sub.textContent = '查看原因并重新提交';
    } else {
      chip.textContent = '去认证';
      chip.style.color = '#6B6880';
      sub.textContent = '填写资料申请成为护理员';
    }
  })();

  /* 卡包剩余次数 */
  (function () {
    try {
      var raw = localStorage.getItem('ankebang_bath_cards');
      var cards;
      if (raw === null) {
        /* 首次访问：写入演示兑换卡 */
        cards = [{ id: 'CARD-DEMO-001', orderNo: 'AKB-DEMO-0001', total: 9, used: 0, patient: { name: '示例服务对象', gender: '', age: '' }, createdAt: Date.now() }];
        localStorage.setItem('ankebang_bath_cards', JSON.stringify(cards));
      } else {
        cards = JSON.parse(raw || '[]');
        if (!Array.isArray(cards)) return;
      }
      cards = cards.filter(function (c) { return c.id && String(c.id).indexOf('CARD-') === 0; });
      var healthCards = window.AKBYoukang ? AKBYoukang.state().cards.filter(function(c){return c.userId===AKBYoukang.currentId();}) : [];
      var total = cards.length + healthCards.length;
      var left = cards.reduce(function (sum, c) { return sum + Math.max(0, (c.total || 10) - (c.used || 0)); }, 0);
      left += healthCards.filter(function(c){return c.status==='可预约' && new Date(c.expiresAt)>new Date();}).length;
      document.getElementById('cardCountSub').textContent = total + '张卡包 · ' + left + '次服务';
    } catch (e) {}
  })();

  /* 专属护理员：展示服务中订单的护理员与订单信息，多单可左右滑动 */
  (function () {
    var DEMO = [{ id:'AKB-2026-031085', state:'服务中', type:'住院陪护', project:'重症陪护服务', person:'示例服务对象', address:'示例服务地点', time:'2026-04-08 08:00 至 2026-04-11 08:00', nurse:'示例护理员', role:'高级护理师｜重症陪护', cert:'持证上岗', years:'8年经验', avatar:'护' }];
    var actives = [];
    try {
      var saved = JSON.parse(localStorage.getItem('ankebang_service_orders') || '[]');
      if (Array.isArray(saved)) {
        saved.forEach(function (o) { if (o && o.state === '服务中' && o.nurse) actives.push(o); });
      }
    } catch (e) {}
    if (!actives.length) actives = DEMO;
    var phoneSvg = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.4c.5-.4 1.1-.4 1.6 0l1.6 1.6c.4.4.5 1 .2 1.5l-.8 1.2c.8 1.8 2.2 3.2 4 4l1.2-.8c.5-.3 1.1-.2 1.5.2l1.6 1.6c.4.5.4 1.1 0 1.6l-.7.7c-.7.7-1.7 1-2.6.7C8.5 15 5 11.5 4.3 7.6c-.3-.9 0-1.9.7-2.6z"/></svg>';
    var html = actives.map(function (o) {
      var surname = o.avatar || (o.nurse || '').charAt(0);
      return '<div class="cg-card">' +
        '<div class="cg-top">' +
          '<div class="cg-av">' + surname + '</div>' +
          '<div class="cg-info"><div><span class="cg-name">' + o.nurse + '</span><span class="cg-role">' + (o.role || '') + '</span></div>' +
          '<div class="cg-badges"><span class="cg-badge">' + (o.cert || '持证上岗') + '</span><span class="cg-badge exp">' + (o.years || '') + '</span></div></div>' +
          '<span class="cg-status">服务中</span>' +
        '</div>' +
        '<div class="cg-order" onclick="location.href=\'order-detail.html?no=' + encodeURIComponent(o.id) + '\'">' +
          '<div class="cg-order-title"><span class="cg-order-name">' + (o.project || '') + '</span><span class="cg-order-no">' + o.id + '</span></div>' +
          '<div class="cg-rows">' +
            '<div class="cg-row"><b>对象</b><span>' + (o.person || '—') + '</span></div>' +
            '<div class="cg-row"><b>时间</b><span>' + (o.time || '—') + '</span></div>' +
            '<div class="cg-row"><b>地点</b><span>' + (o.address || '—') + '</span></div>' +
          '</div>' +
        '</div>' +
        '<div class="cg-foot">' +
          '<button class="cg-btn" onclick="showToast(\'正在为您接通护理员电话，请稍候…\')">' + phoneSvg + '联系护理员</button>' +
          '<button class="cg-btn primary" onclick="location.href=\'order-detail.html?no=' + encodeURIComponent(o.id) + '\'">查看订单</button>' +
          '<button class="cg-btn" onclick="location.href=\'orders.html?renew=' + encodeURIComponent(o.id) + '\'">续单</button>' +
        '</div>' +
      '</div>';
    }).join('');
    document.getElementById('cgScroll').innerHTML = html;
    document.getElementById('cgCount').textContent = actives.length > 1 ? actives.length + ' 位护理员服务中' : '1 位护理员服务中';
    document.getElementById('cgHint').hidden = actives.length < 2;
    document.getElementById('nurseSection').hidden = false;
  })();
</script>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
<script src="common-ui.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的 · 佑小邦</title>
  <style>
    :root {
      --purple:       #1CD8B7;
      --purple-dark:  #0FA98C;
      --purple-light: #DDF7F1;
      --purple-bg: #F5F5F5;
      --card:         #FFFFFF;
      --text:         #1A1828;
      --text2:        #6B6880;
      --text3:        #AEACC0;
      --border:       #EDE9F5;
      --red:          #EF4444;
      --green:        #22C55E;
      --sh: 0 2px 16px rgba(0,0,0,0.1);
      --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--purple-bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* Desktop frame */
    .frame { display: flex; justify-content: center; min-height: 100vh; background: #F5F5F5; }
    .phone {
      width: 100%; max-width: 430px;
      display: flex; flex-direction: column; background: var(--purple-bg); min-height: 100vh;
    }
    @media (min-width: 520px) {
      .frame { align-items: flex-start; padding: 20px 0 40px; }
      .phone {
        height: 900px; min-height: unset; border-radius: 42px; overflow: hidden;
        box-shadow: 0 24px 72px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,.06);
      }
    }

    .scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .scroll-area::-webkit-scrollbar { display: none; }

    /* Status bar */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px 6px;
      background: linear-gradient(135deg,#2DD4BF,#10B981);
    }
    .status-bar span { font-size: 12px; font-weight: 700; color: #fff; }
    .status-right { display: flex; align-items: center; gap: 5px; }

    /* Hero */
    .hero {
      background: linear-gradient(135deg,#2DD4BF 0%,#10B981 100%);
      padding: 12px 20px 40px;
      position: relative; overflow: hidden;
    }
    .hero::after {
      content: ''; position: absolute;
      width: 240px; height: 240px; border-radius: 50%;
      background: rgba(255,255,255,.06); top: -80px; right: -60px; pointer-events: none;
    }
    .hero-top-actions { position: absolute; top: 8px; right: 16px; display: flex; gap: 10px; align-items: center; z-index: 2; }
    .hero-top-actions svg { width: 22px; height: 22px; color: rgba(255,255,255,.85); }
    .hero-row { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
    .avatar-wrap { position: relative; flex-shrink: 0; }
    .avatar {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(140deg,#FCD34D,#F59E0B);
      display: grid; place-items: center;
      border: 3px solid rgba(255,255,255,.45);
      font-size: 24px; font-weight: 900; color: #fff;
      box-shadow: 0 6px 20px rgba(0,0,0,.15);
    }
    .hero-info { flex: 1; min-width: 0; }
    .hero-name-row { display: flex; align-items: center; gap: 8px; }
    .hero-name { font-size: 18px; font-weight: 900; color: #fff; }
    .hero-id-inline { font-size: 13px; color: rgba(255,255,255,.75); font-weight: 700; }
    .hero-cert {
      display: inline-block; margin-top: 6px;
      background: #F59E0B; border-radius: 4px;
      padding: 2px 7px; font-size: 11px; font-weight: 800; color: #fff;
    }
    .hero-arrow { color: rgba(255,255,255,.6); flex-shrink: 0; margin-left: auto; }
    .hero-arrow svg { width: 20px; height: 20px; }

    /* Stats card */
    .stats-card {
      background: var(--card); border-radius: var(--r-lg);
      margin: -20px 14px 0; position: relative; z-index: 2;
      box-shadow: 0 8px 28px rgba(16,185,129,.12);
      display: flex; overflow: hidden;
    }
    .stat-item {
      flex: 1; padding: 14px 16px; display: flex; flex-direction: column;
      align-items: center; gap: 4px; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: background .12s;
    }
    .stat-item:active { background: var(--purple-bg); }
    .stat-item + .stat-item { border-left: 1px solid var(--border); }
    .stat-num { font-size: 20px; font-weight: 900; color: var(--text); }
    .stat-lbl { font-size: 12px; font-weight: 700; color: var(--text2); }
    .stat-sub { font-size: 10px; color: var(--text3); }
    .stat-tag { display: inline-block; background: #F59E0B; border-radius: 3px; padding: 1px 5px; font-size: 10px; font-weight: 800; color: #fff; margin-top: 2px; }

    /* Section */
    .section { margin: 16px 14px 0; }
    .sec-title {
      font-size: 12px; font-weight: 800; color: var(--text3);
      letter-spacing: .5px; margin-bottom: 8px; padding-left: 4px;
    }
    .menu-card {
      background: var(--card); border-radius: var(--r-lg);
      box-shadow: var(--sh); overflow: hidden;
    }
    .menu-item {
      display: flex; align-items: center; gap: 13px;
      padding: 15px 16px; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: background .12s;
      text-decoration: none; color: inherit;
    }
    .menu-item:active { background: var(--purple-bg); }
    .menu-item + .menu-item { border-top: 1px solid var(--border); }
    .menu-ico {
      width: 38px; height: 38px; border-radius: 11px;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .menu-ico svg { width: 20px; height: 20px; }
    .menu-ico.purple { background: var(--purple-light); }
    .menu-ico.blue   { background: #DBEAFE; }
    .menu-ico.green  { background: #DCFCE7; }
    .menu-ico.orange { background: #FEF3C7; }
    .menu-ico.red    { background: #FEE2E2; }
    .menu-ico.gray   { background: #F3F4F6; }
    .menu-text { flex: 1; }
    .menu-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .menu-sub  { font-size: 11px; color: var(--text3); margin-top: 2px; }
    .menu-arrow { color: var(--text3); flex-shrink: 0; }
    .menu-arrow svg { width: 16px; height: 16px; }
    .menu-badge {
      background: var(--red); color: #fff; font-size: 10px; font-weight: 800;
      border-radius: 20px; padding: 2px 7px; margin-right: 4px;
    }

    /* Invite banner */
    .invite-banner {
      margin: 16px 14px 0; border-radius: var(--r-lg); overflow: hidden;
      background: linear-gradient(135deg,#F97316,#EA580C);
      display: flex; align-items: center; padding: 18px 20px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      position: relative; box-shadow: 0 6px 20px rgba(249,115,22,.25);
    }
    .invite-banner:active { filter: brightness(.93); }
    .invite-text { flex: 1; color: #fff; }
    .invite-title { font-size: 17px; font-weight: 900; }
    .invite-sub { font-size: 12px; font-weight: 700; opacity: .85; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
    .invite-sub svg { width: 14px; height: 14px; }
    .invite-icon { width: 52px; height: 52px; flex-shrink: 0; margin-left: 12px; }
    .invite-icon svg { width: 100%; height: 100%; }

    /* Logout */
    .logout-wrap { margin: 28px 14px 0; text-align: center; }
    .logout-btn { border: 0; background: none; color: var(--text3); font: 700 14px inherit; cursor: pointer; padding: 10px 20px; }

    /* Points card */
    .points-card {
      background: linear-gradient(135deg,#2BD8BC,#0FA98C);
      border-radius: var(--r-lg); padding: 16px 18px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      cursor: pointer; -webkit-tap-highlight-color: transparent;
      transition: filter .12s;
    }
    .points-card:active { filter: brightness(.92); }
    .points-ico {
      width: 46px; height: 46px; border-radius: 14px;
      background: rgba(255,255,255,.12); display: grid; place-items: center; flex-shrink: 0;
    }
    .points-ico svg { width: 26px; height: 26px; }
    .points-info { flex: 1; }
    .points-title { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.68); margin-bottom: 3px; }
    .points-num { font-size: 25px; font-weight: 900; color: #fff; line-height:1; }
    .points-sub { font-size: 12px; color: rgba(255,255,255,.72); font-weight: 600; }
    .points-arrow { color: rgba(255,255,255,.8); }
    .points-arrow svg { width: 18px; height: 18px; }

    /* Order shortcuts */
    .order-shortcuts { background:var(--card); border-radius:var(--r-lg); box-shadow:var(--sh); overflow:hidden; }
    .order-shortcuts-head { display:flex; align-items:center; justify-content:space-between; padding:16px 16px 10px; }
    .order-shortcuts-title { font-size:17px; font-weight:900; color:var(--text); }
    .order-all { border:0; background:none; color:var(--purple); font:700 12px inherit; cursor:pointer; display:flex; align-items:center; gap:3px; }
    .order-all svg { width:14px; height:14px; }
    .order-type-switch { display:flex; margin:0 16px; border-bottom:1px solid var(--border); }
    .order-type-option { flex:1; padding:8px 4px 9px; border:0; border-bottom:2px solid transparent; background:none; color:var(--text3); font:800 12px inherit; cursor:pointer; }
    .order-type-option.on { color:var(--purple); border-bottom-color:var(--purple); }
    .order-shortcuts-list { display:grid; grid-template-columns:repeat(5,1fr); padding:2px 7px 15px; }
    .order-shortcuts-list[hidden] { display:none; }
    .order-shortcut { min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px; padding:4px 0; border:0; background:none; color:var(--text2); font:700 10px inherit; cursor:pointer; }
    .shortcut-ico { width:28px; height:28px; color:var(--purple); }
    .shortcut-ico svg { width:100%; height:100%; }
    .shortcut-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

    /* Bottom padding */
    .bottom-space { height: 20px; }

    /* Bottom nav */
    .bottom-nav {
      flex-shrink: 0; display: flex; background: var(--card);
      border-top: 1px solid var(--border);
      padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
    }
    .nav-item {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 4px 0; cursor: pointer; text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-ico { width: 26px; height: 26px; stroke:#AEACC0; fill:none; }
    .nav-lbl { font-size: 11px; font-weight: 700; color: var(--text3); }
    .nav-item.act .nav-lbl { color: var(--purple); }
    .nav-item.act .nav-ico { stroke: var(--purple); }
    .address-overlay { position:fixed; inset:0; z-index:200; background:rgba(25,15,45,.48); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity .2s; }
    .address-overlay.show { opacity:1; pointer-events:auto; }
    .address-sheet { width:min(430px,100%); max-height:82vh; overflow:auto; background:#fff; border-radius:24px 24px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom)); transform:translateY(18px); transition:transform .24s; }
    .address-overlay.show .address-sheet { transform:none; }
    .address-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .address-title { font-size:18px; font-weight:900; color:var(--text); }
    .address-close { width:32px; height:32px; border:0; border-radius:10px; background:var(--purple-light); color:var(--text2); cursor:pointer; font-size:20px; }
    .saved-address { display:flex; align-items:flex-start; gap:10px; padding:13px 12px; border:1.5px solid var(--border); border-radius:14px; margin-bottom:10px; }
    .saved-address-main { flex:1; min-width:0; }
    .saved-address-name { font-size:14px; font-weight:800; color:var(--text); }
    .saved-address-detail { font-size:12px; color:var(--text2); margin-top:4px; line-height:1.45; }
    .saved-address-actions { display:flex; gap:6px; }
    .saved-address-actions button { border:0; background:var(--purple-light); color:var(--purple); border-radius:8px; padding:5px 8px; font:700 11px inherit; cursor:pointer; }
    .saved-address-actions .danger { color:#DC2626; background:#FEE2E2; }
    .address-empty { padding:24px 0; text-align:center; color:var(--text3); font-size:13px; }
    .address-add-btn { width:100%; height:44px; border:1.5px dashed var(--purple); border-radius:12px; background:#fff; color:var(--purple); font:800 13px inherit; cursor:pointer; }
  </style>
</head>
<body>
<div class="frame">
  <div class="phone">
    <div class="scroll-area">

      <!-- Status bar -->
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-right">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
            <rect x="0" y="3" width="3" height="9" rx="1" fill="#fff"/>
            <rect x="4.5" y="2" width="3" height="10" rx="1" fill="#fff"/>
            <rect x="9" y="0.5" width="3" height="11.5" rx="1" fill="#fff"/>
            <rect x="13.5" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".35"/>
          </svg>
          <svg width="17" height="12" viewBox="0 0 24 12" fill="none">
            <rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="#fff" stroke-width="1.2"/>
            <rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="#fff"/>
            <rect x="2" y="2" width="15" height="8" rx="1.8" fill="#fff"/>
          </svg>
        </div>
      </div>

      <!-- Hero -->
      <div class="hero">
        <div class="hero-top-actions">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="18" cy="12" r="1.5" fill="currentColor"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
        </div>
        <div class="hero-row">
          <div class="avatar-wrap"><div class="avatar">章</div></div>
          <div class="hero-info">
            <div class="hero-name-row">
              <span class="hero-name">章北海</span>
              <span class="hero-id-inline">10001000</span>
            </div>
            <span class="hero-cert">已认证</span>
          </div>
          <div class="hero-arrow"><svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-card">
        <div class="stat-item" onclick="location.href='my-cards.html'">
          <span class="stat-num">1张</span>
          <span class="stat-lbl">卡包</span>
          <span class="stat-sub" id="cardCountSub">9次服务</span>
        </div>
        <div class="stat-item" onclick="location.href='points.html'">
          <span class="stat-num" id="profilePointsNum">123</span>
          <span class="stat-lbl">积分</span>
          <span class="stat-tag">去使用</span>
        </div>
      </div>

      <!-- 我的订单 -->
      <div class="section">
        <div class="order-shortcuts">
          <div class="order-shortcuts-head">
            <span class="order-shortcuts-title">我的订单</span>
            <button class="order-all" onclick="location.href='orders.html'">全部<svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <div class="order-shortcuts-list">
            <button class="order-shortcut" onclick="location.href='orders.html?tab=payment'"><span class="shortcut-ico"><svg viewBox="0 0 28 28" fill="none"><rect x="5" y="6" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.7"/><path d="M5 11h18M9 16h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><span class="shortcut-name">待支付</span></button>
            <button class="order-shortcut" onclick="location.href='orders.html?tab=pending-service'"><span class="shortcut-ico"><svg viewBox="0 0 28 28" fill="none"><path d="M8 7h12v15H8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M11 4v5M17 4v5M11 14h6M11 18h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><span class="shortcut-name">待服务</span></button>
            <button class="order-shortcut" onclick="location.href='orders.html?tab=active'"><span class="shortcut-ico"><svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M14 9v5l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span><span class="shortcut-name">服务中</span></button>
            <button class="order-shortcut" onclick="location.href='orders.html?tab=done'"><span class="shortcut-ico"><svg viewBox="0 0 28 28" fill="none"><circle cx="14" cy="14" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M10 14l2.6 2.7L18.5 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="shortcut-name">已完成</span></button>
            <button class="order-shortcut" onclick="location.href='orders.html?tab=refund'"><span class="shortcut-ico"><svg viewBox="0 0 28 28" fill="none"><path d="M19 9.5A8 8 0 006.5 12L4 14.5m0 0L7.5 15m-3.5-.5L4.5 11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 18.5A8 8 0 0021.5 16l2.5-2.5m0 0L20.5 13m3.5.5L23.5 17" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="shortcut-name">退款/售后</span></button>
          </div>
        </div>
      </div>

      <!-- 邀请好友横幅 -->
      <div class="invite-banner" onclick="location.href='invite-friends.html'">
        <div class="invite-text">
          <div class="invite-title">邀请好友</div>
          <div class="invite-sub">邀请好友得积分<svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        </div>
        <div class="invite-icon">
          <svg viewBox="0 0 52 52" fill="none"><rect x="6" y="14" width="40" height="28" rx="4" fill="rgba(255,255,255,.15)"/><rect x="10" y="10" width="32" height="6" rx="2" fill="rgba(255,255,255,.2)"/><circle cx="18" cy="28" r="3" fill="rgba(255,255,255,.25)"/><circle cx="34" cy="28" r="3" fill="rgba(255,255,255,.25)"/><path d="M20 38h12" stroke="rgba(255,255,255,.3)" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
      </div>

      <!-- 菜单 -->
      <div class="section">
        <div class="menu-card">
          <div class="menu-item" onclick="location.href='addresses.html'">
            <div class="menu-ico blue">
              <svg viewBox="0 0 20 20" fill="none">
                <path d="M10 2a5.5 5.5 0 015.5 5.5C15.5 12 10 18 10 18S4.5 12 4.5 7.5A5.5 5.5 0 0110 2z" stroke="#3B82F6" stroke-width="1.6"/>
                <circle cx="10" cy="7.5" r="2" fill="#3B82F6" opacity=".8"/>
              </svg>
            </div>
            <div class="menu-text"><div class="menu-name">常用地址</div></div>
            <div class="menu-arrow"><svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#AEACC0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
          <div class="menu-item" onclick="location.href='feedback.html'">
            <div class="menu-ico orange">
              <svg viewBox="0 0 20 20" fill="none">
                <path d="M2 14V7a5 5 0 0110 0v1h1a3 3 0 010 6H3a3 3 0 01-1-5.83" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M10 14l1.5 3L13 14" stroke="#F59E0B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="menu-text"><div class="menu-name">意见与反馈</div></div>
            <div class="menu-arrow"><svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#AEACC0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
          <div class="menu-item" onclick="alert('安科邦陪护服务\n版本 V1.0\n© 2026 安科邦健康科技')">
            <div class="menu-ico green">
              <svg viewBox="0 0 20 20" fill="none">
                <circle cx="10" cy="7" r="3" stroke="#22C55E" stroke-width="1.6"/>
                <path d="M2.5 17c.7-3 2.7-4.7 5.5-4.7s4.8 1.7 5.5 4.7" stroke="#22C55E" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <div class="menu-text"><div class="menu-name">关于我们</div></div>
            <span style="font-size:12px;color:var(--text3);font-weight:700">V1.0</span>
            <div class="menu-arrow"><svg viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#AEACC0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          </div>
        </div>
      </div>

      <!-- 退出 -->
      <div class="logout-wrap">
        <button class="logout-btn" onclick="showConfirm('确认退出登录？').then(function(ok){if(ok)location.href='index.html'})">退出登录</button>
      </div>

      <div class="bottom-space"></div>

    </div><!-- .scroll-area -->

    <!-- Bottom nav -->

<script>
  /* 积分 */
  document.getElementById('profilePointsNum').textContent = AKBPoints.get().balance;
  /* 卡包剩余次数 */
  (function () {
    try {
      var raw = localStorage.getItem('ankebang_bath_cards');
      var cards;
      if (raw === null) {
        /* 首次访问：写入演示兑换卡 */
        cards = [{ id: 'CARD-DEMO-001', orderNo: 'AKB-DEMO-0001', total: 9, used: 0, patient: { name: '张爷爷', gender: '男', age: '68' }, createdAt: Date.now() }];
        localStorage.setItem('ankebang_bath_cards', JSON.stringify(cards));
      } else {
        cards = JSON.parse(raw || '[]');
        if (!Array.isArray(cards)) return;
      }
      cards = cards.filter(function (c) { return c.id && String(c.id).indexOf('CARD-') === 0; });
      var total = cards.length;
      var left = cards.reduce(function (sum, c) { return sum + Math.max(0, (c.total || 10) - (c.used || 0)); }, 0);
      document.getElementById('cardCountSub').textContent = total + '张卡包 · ' + left + '次服务';
    } catch (e) {}
  })();
</script>

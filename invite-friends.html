<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><title>邀请好友 · 安科邦陪护</title>
<style>
:root{--purple:#8655C5;--purple-dark:#6B3FAA;--purple-light:#EDE6F7;--purple-bg:#F5F3FA;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#22C55E;--sh:0 2px 16px rgba(100,60,160,.08)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text)}.frame{min-height:100vh;display:flex;justify-content:center;background:#E4DDF0}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg)}@media(min-width:520px){.frame{padding:20px 0 40px;align-items:flex-start}.phone{height:900px;min-height:unset;border-radius:42px;overflow:hidden;box-shadow:0 24px 72px rgba(80,40,140,.22)}}.status{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;background:#fff;font-size:13px;font-weight:700}.nav{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative}.nav h1{font-size:18px;font-weight:900}.back{position:absolute;left:16px;width:36px;height:36px;border:0;border-radius:11px;background:var(--purple-light);color:var(--purple);display:grid;place-items:center;cursor:pointer}.back svg{width:20px;height:20px}.scroll{flex:1;overflow:auto;padding:16px 14px 30px}.poster{background:linear-gradient(145deg,#9B6CDC,#6B3FAA);border-radius:24px;padding:22px 20px 18px;box-shadow:0 12px 28px rgba(107,63,170,.28);color:#fff;text-align:center}.poster-mark{width:44px;height:44px;border-radius:14px;margin:0 auto 12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:19px;font-weight:900}.poster h2{font-size:23px;font-weight:900}.poster p{margin-top:8px;font-size:13px;line-height:1.55;color:rgba(255,255,255,.82)}.qr-wrap{width:156px;height:156px;margin:18px auto 13px;background:#fff;padding:10px;border-radius:15px;display:grid;place-items:center}.invite-code{font-size:13px;color:rgba(255,255,255,.8)}.invite-code strong{display:block;color:#fff;font-size:24px;letter-spacing:1.5px;margin-top:4px}.copy-btn{border:0;background:rgba(255,255,255,.17);color:#fff;padding:7px 12px;border-radius:9px;font:700 12px inherit;margin-top:10px;cursor:pointer}.reward-card{display:flex;gap:11px;align-items:center;padding:15px 16px;background:#fff;border-radius:17px;box-shadow:var(--sh);margin-top:14px}.reward-num{width:38px;height:38px;flex-shrink:0;border-radius:12px;background:#DCFCE7;color:#16A34A;display:grid;place-items:center;font-size:15px;font-weight:900}.reward-card p{font-size:12px;line-height:1.55;color:var(--text2)}.reward-card strong{color:var(--text);font-size:14px}.btns{display:flex;gap:10px;margin-top:16px}.btns button{flex:1;height:46px;border-radius:14px;font:800 13px inherit;cursor:pointer}.share{border:0;color:#fff;background:linear-gradient(135deg,#9060D0,#6B3FAA);box-shadow:0 8px 20px rgba(107,63,170,.22)}.invitees{border:1.5px solid #CDB9EB;background:#fff;color:var(--purple)}.modal{position:fixed;inset:0;z-index:20;background:rgba(25,15,45,.45);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}.modal.show{opacity:1;pointer-events:auto}.sheet{width:min(430px,100%);background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom));transform:translateY(20px);transition:transform .2s}.modal.show .sheet{transform:none}.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet-head h3{font-size:17px;font-weight:900}.close{border:0;background:var(--purple-light);color:var(--purple);width:32px;height:32px;border-radius:10px;font-size:20px;cursor:pointer}.invitee{display:flex;align-items:center;gap:10px;padding:13px 4px}.invitee+.invitee{border-top:1px solid var(--border)}.invitee-av{width:38px;height:38px;border-radius:50%;background:var(--purple-light);color:var(--purple);display:grid;place-items:center;font-size:14px;font-weight:900}.invitee-main{flex:1}.invitee-name{font-size:13px;font-weight:800}.invitee-date{font-size:11px;color:var(--text3);margin-top:3px}.invitee-points{font-size:12px;font-weight:900;color:var(--green)}.toast{position:fixed;left:50%;bottom:34px;z-index:30;transform:translate(-50%,20px);padding:10px 15px;background:rgba(26,24,40,.9);color:#fff;border-radius:11px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><div class="frame"><div class="phone"><div class="status"><span>9:41</span><span>▮▮▮　▰</span></div><header class="nav"><button class="back" onclick="history.length>1?history.back():location.href='profile.html'" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M13 4.5L7.5 10 13 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>邀请好友</h1></header><main class="scroll"><section class="poster"><div class="poster-mark">安</div><h2>邀请好友，共享安心陪护</h2><p>好友使用邀请码成功注册后，你将获得 30 积分。</p><div class="qr-wrap"><div id="inviteQr"></div></div><div class="invite-code">我的邀请码<strong id="inviteCode">AKB-8Q6M</strong></div><button class="copy-btn" onclick="copyCode()">复制邀请码</button></section><section class="reward-card"><div class="reward-num">30</div><p><strong>每成功邀请 1 位好友注册</strong><br/>好友注册成功后，即可获得 30 积分奖励。</p></section><div class="btns"><button class="share" onclick="sharePoster()">分享邀请海报</button><button class="invitees" onclick="location.href='invitees.html'">我邀请的人</button></div></main></div></div><div class="toast" id="toast"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="points-store.js"></script><script>
const state=AKBPoints.get(), code=state.inviteCode;document.getElementById('inviteCode').textContent=code;new QRCode(document.getElementById('inviteQr'),{text:'https://ankebang.example/invite?code='+encodeURIComponent(code),width:136,height:136,colorDark:'#1A1828',colorLight:'#FFFFFF',correctLevel:QRCode.CorrectLevel.H});function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function copyCode(){if(navigator.clipboard){navigator.clipboard.writeText(code).then(()=>toast('邀请码已复制'))}else toast('邀请码：'+code)}function sharePoster(){if(navigator.share){navigator.share({title:'安科邦陪护',text:'邀请你使用安科邦陪护，邀请码：'+code}).catch(()=>{})}else toast('邀请海报已准备，可分享给好友')}
</script></body></html>

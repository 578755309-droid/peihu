<!doctype html>
<html lang="zh-CN">
<head>
  <script src="vendor/vue.global.prod.js"></script>
  <script src="ui/icons.js"></script>
  <script src="ui/vue-ui.js"></script>
  <script src="common-ui.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>就诊人管理 · 佑小邦</title>
  <style>
    :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--red:#EF4444;--sh:0 2px 16px rgba(0,0,0,0.1)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit}
    .frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}
    .phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg);position:relative}
    @media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;background:linear-gradient(135deg,#1CD8B7,#0FA98C)}
    .status-bar span{font-size:13px;font-weight:600;color:#fff}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:12px}
    .nav{height:58px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}.nav h1{font-size:18px;font-weight:700}.back{position:absolute;left:16px;width:34px;height:34px;border:0;background:var(--purple-light);border-radius:12px;color:var(--purple);display:grid;place-items:center;cursor:pointer}.back svg{width:18px;height:18px}
    .scroll{flex:1;overflow:auto;padding:16px 14px 90px}.scroll::-webkit-scrollbar{display:none}.hint{font-size:13px;color:var(--text3);margin:2px 4px 12px;line-height:1.5}.patient-list{display:grid;gap:12px}
    .patient-card{background:var(--card);border-radius:12px;padding:16px;box-shadow:var(--sh);border:1.5px solid transparent}.patient-main{display:flex;align-items:flex-start;gap:12px}.patient-avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--purple-light);color:var(--purple);font-size:19px;font-weight:700;flex-shrink:0}.patient-content{min-width:0;flex:1}.patient-head{display:flex;align-items:center;gap:8px;min-width:0}.patient-name{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.patient-default{font-size:11px;color:var(--purple);background:var(--purple-light);border-radius:12px;padding:3px 7px;font-weight:600;flex-shrink:0}.patient-meta{font-size:13px;color:var(--text2);margin-top:5px}.patient-condition{margin-top:12px;padding:10px 11px;background:#FAF8FD;border-radius:12px;color:var(--text2);font-size:13px;line-height:1.55}.patient-condition strong{color:var(--text);font-weight:600}.patient-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:13px;padding-top:11px;border-top:1px solid var(--border)}.patient-foot button{border:0;border-radius:12px;padding:7px 12px;font:700 12px inherit;color:var(--purple);background:var(--purple-light);cursor:pointer}.patient-foot .danger{color:var(--red);background:#FEE2E2}.empty{text-align:center;color:var(--text3);padding:80px 0;font-size:14px;line-height:1.8}.empty-icon{width:56px;height:56px;margin:0 auto 13px;border-radius:12px;background:var(--purple-light);display:grid;place-items:center;color:var(--purple)}.empty-icon svg{width:27px;height:27px}
    .add-btn{position:absolute;bottom:22px;left:14px;right:14px;height:46px;border:0;border-radius:12px;background:linear-gradient(135deg,#3FE0C3,#0FA98C);color:#fff;font:800 15px inherit;box-shadow:0 8px 20px rgba(0,0,0,0.1);cursor:pointer}.add-btn svg{width:17px;height:17px;vertical-align:-3px;margin-right:6px}
    .overlay{position:fixed;inset:0;z-index:20;background:rgba(25,15,45,.48);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}.overlay.show{opacity:1;pointer-events:auto}.sheet{width:min(430px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:12px;padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(18px);transition:transform .24s}.overlay.show .sheet{transform:none}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheet-title{font-size:18px;font-weight:700}.sheet-close{width:32px;height:32px;border:0;border-radius:12px;background:var(--purple-light);color:var(--text2);font-size:20px;cursor:pointer}.form-row{margin-bottom:13px}.form-label{display:block;margin-bottom:7px;font-size:13px;font-weight:600;color:var(--text)}.req{color:var(--red)}.f-input{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:11px 12px;background:#fff;color:var(--text);outline:none;font-size:14px}.f-input:focus{border-color:#7FE9D4;box-shadow:0 0 0 3px rgba(0,0,0,0.1)}.f-input.invalid{border-color:var(--red);background:#FFF8F8}.f-input[readonly]{background:var(--purple-bg);color:var(--text2)}textarea.f-input{min-height:82px;resize:vertical;line-height:1.5}.patient-inline-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-tip{font-size:12px;color:var(--text3);margin-top:6px;line-height:1.45}.sheet-actions{display:flex;gap:9px;margin-top:18px}.sheet-actions button{height:44px;border:0;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer}.cancel-btn{flex:1;background:#F4F2F8;color:var(--text2)}.save-btn{flex:2;background:linear-gradient(135deg,#3FE0C3,#0FA98C);color:#fff}.confirm-sheet{padding-bottom:calc(22px + env(safe-area-inset-bottom));text-align:center}.confirm-icon{width:46px;height:46px;border-radius:12px;background:#FEE2E2;color:var(--red);display:grid;place-items:center;margin:0 auto 11px}.confirm-icon svg{width:24px;height:24px}.confirm-title{font-size:17px;font-weight:700}.confirm-desc{font-size:13px;color:var(--text2);margin-top:7px}.confirm-actions{display:flex;gap:9px;margin-top:18px}.confirm-actions button{height:44px;border:0;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer}.confirm-actions .delete-btn{flex:1;background:var(--red);color:#fff}.confirm-actions .cancel-btn{flex:1}
  </style>
  <link rel="stylesheet" href="visual-theme.css" />
  <link rel="stylesheet" href="ui/vue-ui.css" />
</head>
<body data-surface="mobile" data-page="patients">
<div class="frame"><div class="phone">
  <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="9" y=".5" width="3" height="11.5" rx="1" fill="#fff"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".35"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="#fff" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="#fff"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#fff"/></svg></div></div>
  <header class="nav"><button class="back" onclick="history.length>1?history.back():location.href='profile.html'" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>就诊人管理</h1></header>
  <main class="scroll"><div class="hint">维护常用就诊人信息，下单时可直接选择档案</div><div class="patient-list" id="patientList"></div></main>
  <button class="add-btn" onclick="openEditor()"><svg viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>新增就诊人</button>
</div></div>

<div class="overlay" id="editorOverlay" onclick="closeOnBackdrop(event,'editorOverlay')"><section class="sheet"><div class="sheet-head"><div class="sheet-title" id="editorTitle">新增就诊人</div><button class="sheet-close" onclick="closeEditor()" aria-label="关闭">×</button></div>
  <div class="form-row"><label class="form-label" for="patientName">姓名 <span class="req">*</span></label><input class="f-input" id="patientName" type="text" maxlength="20" placeholder="请输入姓名" /></div>
  <div class="form-row"><label class="form-label" for="patientIdNo">身份证号 <span class="req">*</span></label><input class="f-input" id="patientIdNo" type="text" maxlength="18" inputmode="text" placeholder="请输入18位身份证号" oninput="syncFromId(this.value)" /><div class="form-tip">填写有效身份证号后，将自动识别年龄与性别。</div></div>
  <div class="patient-inline-grid form-row"><div><label class="form-label" for="patientAge">年龄</label><input class="f-input" id="patientAge" type="text" readonly placeholder="自动识别" /></div><div><label class="form-label" for="patientGender">性别</label><input class="f-input" id="patientGender" type="text" readonly placeholder="自动识别" /></div></div>
  <div class="form-row"><label class="form-label" for="patientCondition">健康情况及服务需求 <span class="req">*</span></label><textarea class="f-input" id="patientCondition" maxlength="160" placeholder="例如：术后恢复期，需协助翻身、起身及日常照护"></textarea></div>
  <div class="sheet-actions"><button class="cancel-btn" onclick="closeEditor()">取消</button><button class="save-btn" onclick="savePatient()">保存</button></div>
</section></div>

<div class="overlay" id="deleteOverlay" onclick="closeOnBackdrop(event,'deleteOverlay')"><section class="sheet confirm-sheet"><div class="confirm-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M6 8h12M9 8V5h6v3m-7 3v5m4-5v5m4-5v5M7 8l.8 11h8.4L17 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="confirm-title">删除就诊人档案？</div><div class="confirm-desc">删除后，该档案将无法在下单时继续选择。</div><div class="confirm-actions"><button class="cancel-btn" onclick="closeDelete()">取消</button><button class="delete-btn" onclick="deletePatient()">确认删除</button></div></section></div>

<script>
  const PATIENT_KEY = 'ankebang_saved_patients';
  const DEFAULT_PATIENTS = [
    { id:'P1001', name:'张爷爷', idNo:'110101195803180013', condition:'骨折术后恢复期，需协助翻身、起身及日常照护' },
    { id:'P1002', name:'李女士', idNo:'110101197204080026', condition:'慢性病住院观察，需协助日常照护' }
  ];
  let editingId = null;
  let deletingId = null;
  function getPatients() { try { const value = JSON.parse(localStorage.getItem(PATIENT_KEY)); return Array.isArray(value) ? value : DEFAULT_PATIENTS.slice(); } catch (e) { return DEFAULT_PATIENTS.slice(); } }
  function setPatients(list) { localStorage.setItem(PATIENT_KEY, JSON.stringify(list)); }
  function esc(value) { return String(value ?? '').replace(/[&<>"']/g, function(char) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]; }); }
  function parseId(value) { const id = String(value || '').trim().toUpperCase(); const matched = /^(\d{6})(\d{4})(\d{2})(\d{2})\d{3}[\dX]$/.exec(id); if (!matched) return null; const year = Number(matched[2]), month = Number(matched[3]), day = Number(matched[4]); const birthday = new Date(year, month - 1, day), today = new Date(); if (birthday.getFullYear() !== year || birthday.getMonth() !== month - 1 || birthday.getDate() !== day || birthday > today) return null; let age = today.getFullYear() - year; if (today.getMonth() + 1 < month || today.getMonth() + 1 === month && today.getDate() < day) age--; return {id, age, gender:Number(id.charAt(16)) % 2 ? '男' : '女'}; }
  function syncFromId(value) { const input = document.getElementById('patientIdNo'), normalized = String(value || '').toUpperCase().replace(/[^0-9X]/g, '').slice(0,18); input.value = normalized; const parsed = parseId(normalized); document.getElementById('patientAge').value = parsed ? parsed.age + ' 岁' : ''; document.getElementById('patientGender').value = parsed ? parsed.gender : ''; input.classList.toggle('invalid', normalized.length === 18 && !parsed); }
  function render() { const box = document.getElementById('patientList'), patients = getPatients(); if (!patients.length) { box.innerHTML = '<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 19c.8-3.2 3-5 6.5-5s5.7 1.8 6.5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M19 5v5m-2.5-2.5h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></div>还没有就诊人档案<br>点击下方按钮添加吧</div>'; return; } box.innerHTML = patients.map(function(patient) { const parsed = parseId(patient.idNo), meta = parsed ? parsed.gender + ' · ' + parsed.age + '岁' : '身份信息待完善'; return '<article class="patient-card"><div class="patient-main"><div class="patient-avatar">' + esc((patient.name || '人').slice(0,1)) + '</div><div class="patient-content"><div class="patient-head"><div class="patient-name">' + esc(patient.name) + '</div>' + (patient.isDefault ? '<span class="patient-default">默认</span>' : '') + '</div><div class="patient-meta">' + meta + '</div></div></div><div class="patient-condition"><strong>健康情况及服务需求</strong><br>' + esc(patient.condition || '暂未填写') + '</div><div class="patient-foot"><button onclick="openEditor(\'' + esc(patient.id) + '\')">编辑</button><button class="danger" onclick="openDelete(\'' + esc(patient.id) + '\')">删除</button></div></article>'; }).join(''); }
  function openEditor(id) { editingId = id || null; const patient = id ? getPatients().find(function(item) { return String(item.id) === String(id); }) : null; document.getElementById('editorTitle').textContent = patient ? '编辑就诊人' : '新增就诊人'; document.getElementById('patientName').value = patient ? patient.name || '' : ''; document.getElementById('patientIdNo').value = patient ? patient.idNo || '' : ''; document.getElementById('patientCondition').value = patient ? patient.condition || '' : ''; syncFromId(document.getElementById('patientIdNo').value); document.getElementById('editorOverlay').classList.add('show'); setTimeout(function() { document.getElementById('patientName').focus(); }, 50); }
  function closeEditor() { document.getElementById('editorOverlay').classList.remove('show'); }
  function savePatient() { const name = document.getElementById('patientName').value.trim(), idNo = document.getElementById('patientIdNo').value.trim(), condition = document.getElementById('patientCondition').value.trim(), parsed = parseId(idNo); if (!name) { alert('请填写就诊人姓名'); return; } if (!parsed) { alert('请填写有效的18位身份证号'); document.getElementById('patientIdNo').focus(); return; } if (!condition) { alert('请填写健康情况及服务需求'); return; } const list = getPatients(); if (editingId) { const target = list.find(function(item) { return String(item.id) === String(editingId); }); if (target) Object.assign(target, {name, idNo:parsed.id, condition}); } else { list.push({id:'P' + Date.now(), name, idNo:parsed.id, condition}); } setPatients(list); closeEditor(); render(); }
  function openDelete(id) { deletingId = id; document.getElementById('deleteOverlay').classList.add('show'); }
  function closeDelete() { deletingId = null; document.getElementById('deleteOverlay').classList.remove('show'); }
  function deletePatient() { if (!deletingId) return; setPatients(getPatients().filter(function(item) { return String(item.id) !== String(deletingId); })); closeDelete(); render(); }
  function closeOnBackdrop(event, id) { if (event.target === document.getElementById(id)) document.getElementById(id).classList.remove('show'); }
  render();
</script>
</body>
</html>

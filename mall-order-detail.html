  function statusSteps(order){const signed=order.deliveryStatus==='signed';const delivered=signed||order.deliveryStatus==='delivered';return '<div class="timeline"><div class="step done"><div class="dot"></div><div class="step-copy"><strong>订单已提交</strong><span>'+esc(order.date)+' · 已生成商城订单</span></div></div><div class="step '+(order.deliveryStatus!=='pending'?'done':'')+'"><div class="dot"></div><div class="step-copy"><strong>商家备货</strong><span>'+(order.deliveryStatus==='pending'?'等待付款后安排备货':'商品已进入配送流程')+'</span></div></div><div class="step '+(delivered?'done':'')+'"><div class="dot"></div><div class="step-copy"><strong>配送中</strong><span>'+(delivered?'配送员已送达，请提供收货码':'配送完成后会在这里提示')+'</span></div></div><div class="step '+(signed?'done':'')+'"><div class="dot"></div><div class="step-copy"><strong>已签收</strong><span>'+(signed?'用户已完成收货确认':'等待收货码确认签收')+'</span></div></div></div>'}
  function render(){const page=document.getElementById('detailPage'),order=getOrder();if(!order){page.innerHTML='<div class="error">未找到该商城订单</div>';return}const signed=order.deliveryStatus==='signed';const delivered=signed||order.deliveryStatus==='delivered';const isRefund=order.status==='refund'||order.state==='退款/售后';const isCanceled=order.status==='cancel'||order.state==='已退款'||order.state==='已取消';const receipt=signed?'<div class="receipt-box"><div class="receipt-label">签收状态</div><div class="receipt-help">收货码已验证，订单已完成签收。</div><div class="signed">✓ 已签收</div></div>':delivered?'<div class="receipt-box"><div class="receipt-label">确认收货</div><div class="receipt-help">配送员已送达，请向配送员获取收货码并输入确认。</div><div class="receipt-row"><input id="receiptInput" inputmode="numeric" maxlength="6" placeholder="请输入收货码"/><button onclick="confirmReceipt()">确认签收</button></div></div>':'';let refundSection='';if(isCanceled){refundSection='<section class="card"><div class="card-title">退款信息</div><div class="refund-info">✓ 退款已完成<br>退款金额：¥'+esc(order.refundAmount||order.amount)+'<br>退款时间：'+esc(order.refundAt||order.date)+(order.refundReviewNote?'<br>审核说明：'+esc(order.refundReviewNote):'')+'<br>'+esc(order.note||'原路退回')+'</div></section>';}else if(isRefund){refundSection='<section class="card"><div class="card-title">退款信息</div><div class="refund-info pending">退款申请审核中<br>申请时间：'+esc(order.refundAppliedAt||order.date)+'<br>退款原因：'+esc(order.refundReason||'—')+(order.refundRemark?'<br>补充说明：'+esc(order.refundRemark):'')+'<br><br>平台将在 1-3 个工作日内完成审核，请耐心等待。</div></section>';}else if(order.status==='shipping'||order.state==='待发货'){refundSection='<section class="card"><div class="card-title">订单操作</div><div class="refund-box"><div class="refund-label">申请退款</div><div class="refund-desc">该订单尚未发货，申请后将自动退款，金额原路退回，预计 1-3 个工作日到账。</div><div class="action-bar"><button class="action-btn refund" onclick="applyRefund(\'instant\')">申请退款</button></div></div></section>';}else if(order.status==='receiving'||order.state==='待收货'){refundSection='';}const paidState=['待发货','待收货','已完成'].indexOf(order.state)>-1;let shipRows='';if(order.logisticsNo||order.trackingNo)shipRows+='<div class="row"><span class="row-label">配送单号</span><span class="row-value">'+esc(order.logisticsNo||order.trackingNo)+'</span></div>';if(order.courier)shipRows+='<div class="row"><span class="row-label">配送人</span><span class="row-value">'+esc(order.courier)+'</span></div>';if(order.courierPhone)shipRows+='<div class="row"><span class="row-label">配送人手机号</span><span class="row-value">'+esc(order.courierPhone)+'</span></div>';const codeRow=(paidState&&order.receiptCode)?'<div class="row"><span class="row-label">收货码</span><span class="row-value" style="color:#224CD3;font-weight:800;letter-spacing:3px;font-size:17px">'+esc(order.receiptCode)+'</span></div>':'';const heroHint=order.state==='已取消'?'订单已取消，欢迎再次选购':isCanceled?'退款已完成，金额已原路退回，请注意查收':isRefund?'售后申请已提交，平台将在 1-3 个工作日内完成审核':signed?'订单已完成，感谢您的信任与支持':delivered?'配送员已送达，请出示收货码完成签收':order.status==='receiving'?'商品正在配送中，请留意查收':'请尽快完成支付，超时订单将自动关闭';page.innerHTML='<section class="hero"><div class="hero-kicker">商城订单</div><div class="hero-title">'+esc(order.product)+'</div><div class="hero-state">'+esc(order.state==='已取消'?'已取消':isCanceled?'已退款':isRefund?'退货审核中':signed?'已完成':delivered?'待收货':order.state)+'</div><div class="hero-hint">'+heroHint+'</div></section><section class="card"><div class="card-title">商品信息</div><div class="product"><img class="product-img" src="'+esc(order.image)+'" alt="'+esc(order.product)+'" onerror="this.style.visibility=\'hidden\'"/><div class="product-copy"><div class="product-name">'+esc(order.product)+'</div><div class="product-desc">'+esc(order.desc)+'</div><div class="product-desc">数量：'+order.quantity+' 件</div></div><div class="product-price">¥'+esc(order.price)+'</div></div></section><section class="card"><div class="card-title">配送信息</div><div class="rows"><div class="row"><span class="row-label">配送方式</span><span class="row-value"><span class="delivery-tag">'+esc(order.deliveryLabel||'立即送达')+'</span></span></div>'+codeRow+shipRows+'<div class="row"><span class="row-label">收货地址</span><span class="row-value">'+esc(order.address||'默认收货地址')+'</span></div></div></section><section class="card"><div class="card-title">订单进度</div>'+statusSteps(order)+receipt+'</section>'+refundSection+'<section class="card"><div class="card-title">费用信息</div><div class="rows"><div class="row"><span class="row-label">支付方式</span><span class="row-value">'+esc((order.status!=='payment'&&order.state!=='待付款')?'微信支付':'—')+'</span></div><div class="row"><span class="row-label">应付金额</span><span class="row-value">¥'+esc(order.amount)+'</span></div><div class="row"><span class="row-label">配送费</span><span class="row-value">已含在商品售价内</span></div><div class="row"><span class="row-label">积分抵扣</span><span class="row-value">'+esc((order.status!=='payment'&&order.state!=='待付款')?('¥'+((order.pay&&order.pay.points)||'0')):'—')+'</span></div><div class="row"><span class="row-label">实付金额</span><span class="row-value strong">'+((order.status!=='payment'&&order.state!=='待付款')?('¥'+esc(order.amount)):'—')+'</span></div><div class="row"><span class="row-label">订单号</span><span class="row-value">'+esc(order.id)+'</span></div></div></section>';updateOpBar(order)}
  function confirmReceipt(){const order=getOrder(),value=(document.getElementById('receiptInput')||{}).value||'';if(!order)return;if(value!==String(order.receiptCode)){showToast('收货码不正确，请重新输入');return}let saved=[];try{saved=JSON.parse(localStorage.getItem('ankebang_mall_orders')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){}const index=saved.findIndex(function(item){return item.id===order.id});if(index>=0){saved[index].deliveryStatus='signed';saved[index].status='done';saved[index].state='已完成'}else{const updated=Object.assign({},order,{deliveryStatus:'signed',status:'done',state:'已完成'});saved.unshift(updated)}localStorage.setItem('ankebang_mall_orders',JSON.stringify(saved));render();showToast('签收成功，订单已完成')}
  function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');setTimeout(function(){toast.classList.remove('show')},1800)}
  function updateReceiptPanel(){const order=getOrder();if(!order||order.deliveryStatus==='signed')return;const box=document.querySelector('.receipt-box');if(!box)return;box.innerHTML='<div class="receipt-label">确认收货</div><div class="receipt-help">点击后展示收货码，请将收货码提供给物流人员。</div><button class="receipt-code-button" onclick="showReceiptCode()">确认收货</button><div id="receiptCodeReveal" hidden></div>'}
  function showReceiptCode(){const order=getOrder(),target=document.getElementById('receiptCodeReveal');if(!order||!target)return;target.hidden=false;target.className='receipt-code-reveal';target.innerHTML='收货码<strong>'+esc(order.receiptCode)+'</strong><span>请将此收货码提供给物流人员完成签收</span>';const button=document.querySelector('.receipt-code-button');if(button)button.textContent='收货码已展示'}
  var refundPhotos=[];
  function openRefundModal(){var m=document.getElementById('refundModal');if(!m)return;var sel=document.getElementById('refundReason');if(sel)sel.selectedIndex=0;var ta=document.getElementById('refundRemark');if(ta)ta.value='';initRefundPhotos();m.hidden=false}
  function closeRefundModal(){var m=document.getElementById('refundModal');if(m)m.hidden=true}
  /* 底部操作栏：按订单状态展示 取消/支付/提醒发货/确认收货/再次购买 */
  function updateOpBar(order){var bar=document.getElementById('opBar');if(!bar)return;var html='';var st=order.status;
    if(st==='payment'||order.state==='待付款'){html='<button class="op-btn" onclick="cancelOrder()">取消订单</button><button class="op-btn primary" onclick="payNow()">立即支付</button>'}
    else if(st==='shipping'||order.state==='待发货'){html='<button class="op-btn" onclick="remindShip()">提醒发货</button>'}
    else if(st==='receiving'||order.state==='待收货'){html='<button class="op-btn primary" onclick="confirmReceiptBar()">确认收货</button>'}
    else if(st==='done'||order.state==='已完成'){html='<button class="op-btn primary" onclick="rebuy()">再次购买</button>'}
    bar.innerHTML=html;bar.hidden=!html}
  function saveOrder(order,patch){let saved=[];try{saved=JSON.parse(localStorage.getItem('ankebang_mall_orders')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){}const i=saved.findIndex(function(x){return x.id===order.id});if(i>=0){Object.assign(saved[i],patch)}else{saved.unshift(Object.assign({},order,patch))}localStorage.setItem('ankebang_mall_orders',JSON.stringify(saved))}
  function cancelOrder(){const o=getOrder();if(!o)return;saveOrder(o,{status:'cancel',state:'已取消',note:'用户取消订单'});render();showToast('订单已取消')}
  function payNow(){const o=getOrder();if(!o)return;const now=new Date().toISOString().slice(0,16).replace('T',' ');saveOrder(o,{status:'shipping',state:'待发货',deliveryStatus:'processing',receiptCode:o.receiptCode||String(Math.floor(1000+Math.random()*9000)),pay:{method:'微信支付',total:String(o.amount),points:'0',paid:String(o.amount),received:String(o.amount),paidAt:now}});render();showToast('支付成功，商家将尽快发货')}
  function remindShip(){showToast('已提醒商家尽快发货')}
  function confirmReceiptBar(){var b=document.querySelector('.receipt-code-button');var i=document.getElementById('receiptInput');if(b){b.scrollIntoView({behavior:'smooth',block:'center'});b.click()}else if(i){i.scrollIntoView({behavior:'smooth',block:'center'});i.focus()}else{showToast('请等待配送员送达后再确认收货')}}
  function rebuy(){showToast('商品已加入购物车，可前往商城结算')}
  function initRefundPhotos(){refundPhotos=[];renderRefundPhotos()}
  function renderRefundPhotos(){var box=document.getElementById('refundPhotos');if(!box)return;box.innerHTML=refundPhotos.map(function(src,i){return '<div class="refund-photo-item"><img src="'+esc(src)+'"><button class="del" onclick="removeRefundPhoto('+i+')">×</button></div>'}).join('')+'<button class="refund-photo-btn" onclick="addRefundPhoto()">+</button>'}
  function addRefundPhoto(){var input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){refundPhotos.push(e.target.result);renderRefundPhotos()};r.readAsDataURL(f)};input.click()}
  function removeRefundPhoto(i){refundPhotos.splice(i,1);renderRefundPhotos()}
  async function applyRefund(type){const order=getOrder();if(!order)return;if(type==='instant'){if(!await showConfirm('确认申请退款？该订单尚未发货，退款将原路退回。'))return;let saved=[];try{saved=JSON.parse(localStorage.getItem('ankebang_mall_orders')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){}const idx=saved.findIndex(function(item){return item.id===order.id});if(idx>=0){saved[idx].status='cancel';saved[idx].state='已退款';saved[idx].refundState='已退款';saved[idx].refundType='instant';saved[idx].refundAt=new Date().toISOString().slice(0,16).replace('T',' ');saved[idx].note='未发货，用户申请退款，系统自动退款完成'}else{const updated=Object.assign({},order,{status:'cancel',state:'已退款',refundState:'已退款',refundType:'instant',refundAt:new Date().toISOString().slice(0,16).replace('T',' '),note:'未发货，用户申请退款，系统自动退款完成'});saved.unshift(updated)}localStorage.setItem('ankebang_mall_orders',JSON.stringify(saved));render();showToast('退款成功，金额将原路退回')}else{const reason=(document.getElementById('refundReason')||{}).value||'其他';const remark=(document.getElementById('refundRemark')||{}).value||'';let saved=[];try{saved=JSON.parse(localStorage.getItem('ankebang_mall_orders')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){}const idx=saved.findIndex(function(item){return item.id===order.id});if(idx>=0){saved[idx].status='refund';saved[idx].state='退款/售后';saved[idx].refundState='待审核';saved[idx].refundType='manual';saved[idx].refundReason=reason;saved[idx].refundRemark=remark;saved[idx].refundPhotos=refundPhotos;saved[idx].refundAppliedAt=new Date().toISOString().slice(0,16).replace('T',' ');saved[idx].note='已发货，用户申请退货退款：'+reason+(remark?'（'+remark+'）':'')}else{const updated=Object.assign({},order,{status:'refund',state:'退款/售后',refundState:'待审核',refundType:'manual',refundReason:reason,refundRemark:remark,refundPhotos:refundPhotos,refundAppliedAt:new Date().toISOString().slice(0,16).replace('T',' '),note:'已发货，用户申请退货退款：'+reason+(remark?'（'+remark+'）':'')});saved.unshift(updated)}localStorage.setItem('ankebang_mall_orders',JSON.stringify(saved));closeRefundModal();render();showToast('退货申请已提交，等待客服审核')}}
  render();initRefundPhotos();updateReceiptPanel();
</script>
</body>
</html>

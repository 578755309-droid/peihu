<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>商城订单详情 · 佑小邦</title>
  <style>
    :root{--purple:#8655C5;--purple-dark:#6B3FAA;--purple-light:#EDE6F7;--purple-bg:#F5F3FA;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#16965A;--orange:#D87916}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:#E4DDF0;color:var(--text);-webkit-font-smoothing:antialiased}button,input{font:inherit}.frame{display:flex;justify-content:center;min-height:100vh}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg);position:relative}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:42px;overflow:hidden;box-shadow:0 24px 72px rgba(80,40,140,.22)}}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;background:linear-gradient(135deg,#8655C5,#6B3FAA)}.status-bar span{font-size:12px;font-weight:700;color:#fff}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:12px}.nav{height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}.nav h1{font-size:18px;font-weight:900}.back{width:34px;height:34px;border:0;border-radius:10px;background:var(--purple-light);color:var(--purple);font-size:24px;line-height:1;cursor:pointer}.scroll{flex:1;overflow:auto;padding:14px 14px 30px}.hero{padding:16px;border-radius:18px;background:linear-gradient(135deg,#8655C5,#6B3FAA);color:#fff;box-shadow:0 8px 22px rgba(107,63,170,.18)}.hero-kicker{font-size:11px;opacity:.76}.hero-title{margin-top:5px;font-size:19px;font-weight:900}.hero-state{display:inline-flex;margin-top:11px;padding:5px 9px;border-radius:12px;background:rgba(255,255,255,.16);font-size:12px;font-weight:800}.card{margin-top:12px;padding:15px;border-radius:17px;background:#fff;box-shadow:0 5px 18px rgba(63,45,102,.07)}.card-title{font-size:14px;font-weight:900}.product{display:flex;gap:11px;margin-top:12px;padding:10px;border-radius:13px;background:#F8F7FC}.product-img{width:66px;height:66px;border-radius:12px;object-fit:cover;background:var(--purple-light);flex:0 0 66px}.product-copy{min-width:0;flex:1}.product-name{font-size:14px;font-weight:900;line-height:1.35}.product-desc{margin-top:5px;color:var(--text2);font-size:11px;line-height:1.45}.product-price{align-self:center;color:var(--purple);font-size:16px;font-weight:900;white-space:nowrap}.rows{display:grid;gap:11px;margin-top:12px}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;font-size:12px;line-height:1.45}.row-label{color:var(--text3);flex:0 0 auto}.row-value{text-align:right;color:var(--text2)}.row-value.strong{color:var(--text);font-weight:800}.delivery-tag{display:inline-flex;padding:4px 8px;border-radius:10px;background:var(--purple-light);color:var(--purple);font-size:11px;font-weight:800}.note{margin-top:12px;padding:10px 11px;border-radius:11px;background:#F0FBF5;color:var(--green);font-size:11px;line-height:1.5}.timeline{display:grid;gap:0;margin-top:13px}.step{position:relative;display:grid;grid-template-columns:18px 1fr;gap:9px;min-height:47px}.step:not(:last-child):before{content:"";position:absolute;left:8px;top:17px;bottom:0;width:1px;background:#E6DDF2}.dot{position:relative;z-index:1;width:17px;height:17px;border-radius:50%;background:#E7E3EE;border:4px solid #F5F3FA}.step.done .dot{background:var(--purple);border-color:#E9DFFC}.step-copy strong{display:block;font-size:12px}.step-copy span{display:block;margin-top:3px;color:var(--text3);font-size:11px;line-height:1.4}.receipt-box{margin-top:12px;padding:12px;border-radius:13px;background:#FBF8FF;border:1px solid #E8DDF6}.receipt-label{font-size:12px;font-weight:900}.receipt-help{margin-top:5px;color:var(--text2);font-size:11px;line-height:1.5}.receipt-row{display:flex;gap:8px;margin-top:10px}.receipt-row input{min-width:0;flex:1;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 11px;outline:0;color:var(--text);background:#fff}.receipt-row input:focus{border-color:var(--purple)}.receipt-row button{height:40px;padding:0 13px;border:0;border-radius:10px;background:var(--purple);color:#fff;font-size:12px;font-weight:800;cursor:pointer}.signed{color:var(--green);font-size:12px;font-weight:800}.error{text-align:center;color:var(--text2);padding:80px 0}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);padding:10px 15px;border-radius:10px;background:rgba(31,24,48,.9);color:#fff;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .receipt-code-button{width:100%;height:40px;margin-top:10px;border:0;border-radius:10px;background:var(--purple);color:#fff;font-size:12px;font-weight:800;cursor:pointer}.receipt-code-reveal{margin-top:10px;padding:11px;border-radius:10px;background:#F0EAF9;text-align:center;color:var(--purple);font-size:11px;line-height:1.5}.receipt-code-reveal strong{display:block;margin-top:2px;font-size:25px;letter-spacing:5px}.receipt-code-reveal span{display:block;margin-top:4px;color:var(--text2);font-size:11px}
  </style>
</head>
<body>
<div class="frame"><div class="phone">
  <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#fff"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#fff"/><rect x="9" y=".5" width="3" height="11.5" rx="1" fill="#fff"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#fff" opacity=".35"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="#fff" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="#fff"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#fff"/></svg></div></div>
  <header class="nav"><button class="back" onclick="history.back()" aria-label="返回">‹</button><h1>商城订单详情</h1></header>
  <main class="scroll" id="detailPage"></main>
</div></div><div class="toast" id="toast"></div>
<script>
  const fallback={
    'AKB-M2026-041601':{id:'AKB-M2026-041601',status:'payment',state:'待付款',product:'电子体温计',desc:'快速测温 · 大屏易读',price:'39',quantity:1,amount:'39',date:'2026-04-16',address:'西安市雁塔区 · 王女士',image:'assets/mall/thermometer.png',deliveryLabel:'立即送达',deliveryStatus:'pending',receiptCode:'7264'},
    'AKB-M2026-041528':{id:'AKB-M2026-041528',status:'shipping',state:'待发货',product:'电子血压计',desc:'上臂式无创血压计',price:'239',quantity:1,amount:'239',date:'2026-04-15',address:'北京市朝阳区 · 张先生',image:'assets/mall/blood-pressure-monitor.png',deliveryLabel:'快递送达',deliveryStatus:'processing',receiptCode:'4182'},
    'AKB-M2026-041302':{id:'AKB-M2026-041302',status:'receiving',state:'待收货',product:'家用雾化器',desc:'细雾雾化 · 便携易收纳',price:'199',quantity:1,amount:'199',date:'2026-04-13',address:'北京市海淀区 · 李女士',image:'assets/mall/nebulizer.png',deliveryLabel:'跑腿送达',deliveryStatus:'delivered',receiptCode:'5826'},
    'AKB-M2026-040912':{id:'AKB-M2026-040912',status:'done',state:'已完成',product:'医用无菌口罩',desc:'医用外科 / 一次性使用',price:'29',quantity:2,amount:'58',date:'2026-04-09',address:'西安市高新区 · 刘先生',image:'assets/mall/medical-mask.png',deliveryLabel:'快递送达',deliveryStatus:'signed',receiptCode:'9031'}
  };
  const no=new URLSearchParams(location.search).get('no');
  function esc(v){return String(v??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function getOrder(){let saved=[];try{saved=JSON.parse(localStorage.getItem('ankebang_mall_orders')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){}return saved.find(function(item){return item.id===no})||fallback[no]}
  function statusSteps(order){const signed=order.deliveryStatus==='signed';const delivered=signed||order.deliveryStatus==='delivered';return '<div class="timeline"><div class="step done"><div class="dot"></div><div class="step-copy"><strong>订单已提交</strong><span>'+esc(order.date)+' · 已生成商城订单</span></div></div><div class="step '+(order.deliveryStatus!=='pending'?'done':'')+'"><div class="dot"></div><div class="step-copy"><strong>商家备货</strong><span>'+(order.deliveryStatus==='pending'?'等待付款后安排备货':'商品已进入配送流程')+'</span></div></div><div class="step '+(delivered?'done':'')+'"><div class="dot"></div><div class="step-copy"><strong>配送中</strong><span>'+(delivered?'配送员已送达，请提供收货码':'配送完成后会在这里提示')+'</span></div></div><div class="step '+(signed?'done':'')+'"><div class="dot"></div><div class="step-copy"><strong>已签收</strong><span>'+(signed?'用户已完成收货确认':'等待收货码确认签收')+'</span></div></div></div>'}
  function render(){const page=document.getElementById('detailPage'),order=getOrder();if(!order){page.innerHTML='<div class="error">未找到该商城订单</div>';return}const signed=order.deliveryStatus==='signed';const delivered=signed||order.deliveryStatus==='delivered';const receipt=signed?'<div class="receipt-box"><div class="receipt-label">签收状态</div><div class="receipt-help">收货码已验证，订单已完成签收。</div><div class="signed">✓ 已签收</div></div>':delivered?'<div class="receipt-box"><div class="receipt-label">确认收货</div><div class="receipt-help">配送员已送达，请向配送员获取收货码并输入确认。</div><div class="receipt-row"><input id="receiptInput" inputmode="numeric" maxlength="6" placeholder="请输入收货码"/><button onclick="confirmReceipt()">确认签收</button></div></div>':'';page.innerHTML='<section class="hero"><div class="hero-kicker">商城订单</div><div class="hero-title">'+esc(order.product)+'</div><div class="hero-state">'+esc(signed?'已完成':delivered?'待收货':order.state)+'</div></section><section class="card"><div class="card-title">商品信息</div><div class="product"><img class="product-img" src="'+esc(order.image)+'" alt="'+esc(order.product)+'" onerror="this.style.visibility=\'hidden\'"/><div class="product-copy"><div class="product-name">'+esc(order.product)+'</div><div class="product-desc">'+esc(order.desc)+'</div><div class="product-desc">数量：'+order.quantity+' 件</div></div><div class="product-price">¥'+esc(order.price)+'</div></div></section><section class="card"><div class="card-title">配送信息</div><div class="rows"><div class="row"><span class="row-label">配送方式</span><span class="row-value"><span class="delivery-tag">'+esc(order.deliveryLabel||'立即送达')+'</span></span></div><div class="row"><span class="row-label">收货地址</span><span class="row-value">'+esc(order.address||'默认收货地址')+'</span></div></div></section><section class="card"><div class="card-title">订单进度</div>'+statusSteps(order)+receipt+'</section><section class="card"><div class="card-title">费用信息</div><div class="rows"><div class="row"><span class="row-label">商品金额</span><span class="row-value">¥'+esc(order.amount)+'</span></div><div class="row"><span class="row-label">配送费</span><span class="row-value">已含在商品售价内</span></div><div class="row"><span class="row-label">实付金额</span><span class="row-value strong">¥'+esc(order.amount)+'</span></div><div class="row"><span class="row-label">订单号</span><span class="row-value">'+esc(order.id)+'</span></div></div></section>'}
  function confirmReceipt(){const order=getOrder(),value=(document.getElementById('receiptInput')||{}).value||'';if(!order)return;if(value!==String(order.receiptCode)){showToast('收货码不正确，请重新输入');return}let saved=[];try{saved=JSON.parse(localStorage.getItem('ankebang_mall_orders')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){}const index=saved.findIndex(function(item){return item.id===order.id});if(index>=0){saved[index].deliveryStatus='signed';saved[index].status='done';saved[index].state='已完成'}else{const updated=Object.assign({},order,{deliveryStatus:'signed',status:'done',state:'已完成'});saved.unshift(updated)}localStorage.setItem('ankebang_mall_orders',JSON.stringify(saved));render();showToast('签收成功，订单已完成')}
  function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');setTimeout(function(){toast.classList.remove('show')},1800)}
  function updateReceiptPanel(){const order=getOrder();if(!order||order.deliveryStatus==='signed')return;const box=document.querySelector('.receipt-box');if(!box)return;box.innerHTML='<div class="receipt-label">确认收货</div><div class="receipt-help">点击后展示收货码，请将收货码提供给物流人员。</div><button class="receipt-code-button" onclick="showReceiptCode()">确认收货</button><div id="receiptCodeReveal" hidden></div>'}
  function showReceiptCode(){const order=getOrder(),target=document.getElementById('receiptCodeReveal');if(!order||!target)return;target.hidden=false;target.className='receipt-code-reveal';target.innerHTML='收货码<strong>'+esc(order.receiptCode)+'</strong><span>请将此收货码提供给物流人员完成签收</span>';const button=document.querySelector('.receipt-code-button');if(button)button.textContent='收货码已展示'}
  render();updateReceiptPanel();
</script>
</body>
</html>

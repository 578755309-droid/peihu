<style>
:root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--green:#22C55E;--red:#EF4444;--sh:0 2px 16px rgba(0,0,0,0.1)}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text)}.frame{min-height:100vh;display:flex;justify-content:center;background: #F5F5F5}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg)}@media(min-width:520px){.frame{padding:20px 0 40px;align-items:flex-start}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}.status{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 8px;background:#fff;font-size:14px;font-weight:600}.nav{height:58px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;position:relative}.nav h1{font-size:18px;font-weight:700}.back{position:absolute;left:16px;width:36px;height:36px;border:0;border-radius:12px;background:var(--purple-light);color:var(--purple);display:grid;place-items:center;cursor:pointer}.back svg{width:20px;height:20px}.scroll{flex:1;overflow:auto;padding:16px 14px 28px}.point-hero{background:linear-gradient(135deg,#2BD8BC,#0FA98C);border-radius:12px;padding:20px;color:#fff;box-shadow:0 10px 26px rgba(0,0,0,0.1)}.point-label{font-size:13px;font-weight:600;color:rgba(255,255,255,.72)}.point-balance{font-size:40px;font-weight:700;line-height:1.1;margin:6px 0 18px}.point-balance span{font-size:15px;margin-left:5px}.point-rule{font-size:12px;color:rgba(255,255,255,.75)}.point-stats{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:12px;box-shadow:var(--sh);margin-top:12px}.stat{padding:15px 12px;text-align:center}.stat+.stat{border-left:1px solid var(--border)}.stat-label{font-size:12px;color:var(--text3);font-weight:600}.stat-value{font-size:21px;font-weight:700;margin-top:5px;color:var(--green)}.stat-value.expense{color:var(--text2)}.section-head{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px}.section-head h2{font-size:15px;font-weight:700}.invite-link{border:0;background:none;color:var(--purple);font:700 12px inherit;cursor:pointer}.record-card{background:#fff;border-radius:12px;box-shadow:var(--sh);overflow:hidden}.record{display:flex;align-items:center;gap:11px;padding:14px 14px}.record+.record{border-top:1px solid var(--border)}.record-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;font-weight:700}.record-icon.income{background:#DCFCE7;color:#16A34A}.record-icon.expense{background:var(--purple-light);color:var(--purple)}.record-info{flex:1;min-width:0}.record-title{font-size:14px;font-weight:600}.record-detail{font-size:12px;color:var(--text3);margin-top:3px}.record-amount{font-size:14px;font-weight:700}.record-amount.income{color:var(--green)}.record-amount.expense{color:var(--text2)}

  function saveCart(){localStorage.setItem('ankebang_mall_cart',JSON.stringify(cart));updateCartCount()}
  function esc(value){return String(value??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function icon(type){const common='<path d="';if(type==='thermometer')return '<rect x="9" y="3" width="8" height="14" rx="4" stroke="currentColor" stroke-width="1.5"/><path d="M11 15v5a3 3 0 006 0v-5M12 7h3M12 10h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';if(type==='infrared')return '<path d="M7 9h9a2 2 0 012 2v5H7a3 3 0 010-6zM18 12h3M10 9V6h4l2 3M7 16l-2 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>';if(type==='bp')return '<rect x="4" y="5" width="18" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M8 9h5M8 13h4M16 9h2M17 16v-4M14 19h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';if(type==='glucose')return '<path d="M5 4h10v16H5zM15 8h4v12h-4" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 8h4M8 12h4M8 16h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';if(type==='oxygen')return '<rect x="6" y="4" width="14" height="17" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M10 8h6M10 12h6M10 16h3M3 10h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="17" cy="16" r="1.5" fill="currentColor"/>';if(type==='nebulizer')return '<path d="M6 18h12M8 18V8h8v10M10 5h4M12 5v3M9 12h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 5c1-1 1-2 0-3M21 6c1-1 1-2 0-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>';if(type==='hearing')return '<path d="M14 18c0-3 3-3.5 3-7a5 5 0 00-10 0c0 2.5 2 3 2 5v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M9 21h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>';if(type==='mask')return '<path d="M5 7c2 2 12 2 14 0v6c0 4-3 6-7 6s-7-2-7-6z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5 9H2M21 9h-3M8 11h8M8 14h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>';return '<circle cx="12" cy="12" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M5 12h14M12 5c2 2 2 12 0 14M8 7c1 1 7 1 8 0M8 17c1-1 7-1 8 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>'}
  function iconSvg(product,cls){return '<svg class="'+(cls||'')+'" viewBox="0 0 28 28" fill="none" aria-hidden="true">'+icon(product.icon)+'</svg>'}
  function productVisual(product,cls){const image=product.image?'<img class="product-image" src="'+esc(product.image)+'" alt="'+esc(product.name)+'" onload="this.nextElementSibling.style.display=\'none\'" onerror="this.remove()">':'';return image+iconSvg(product,'fallback-icon '+(cls||''))}
  function setCategory(button,value){category=value;document.querySelectorAll('.category').forEach(function(item){item.classList.toggle('active',item===button)});renderProducts()}
  function renderProducts(){const keyword=(document.getElementById('searchInput').value||'').trim().toLowerCase(),list=PRODUCTS.filter(function(p){return (category==='all'||p.category===category)&&(!keyword||(p.name+p.sub).toLowerCase().includes(keyword))}),box=document.getElementById('productGrid');document.getElementById('productCount').textContent=list.length+' 件商品';box.innerHTML=list.length?list.map(function(p){return '<article class="product-card"><div class="product-art '+p.tone+'"><span class="product-badge">'+esc(p.badge)+'</span>'+productVisual(p)+'</div><div class="product-body"><div class="product-name">'+esc(p.name)+'</div><div class="product-sub">'+esc(p.sub)+'</div><div class="product-foot"><div class="price"><small>¥</small>'+p.price+'</div><button class="detail-btn" onclick="openDetail(\''+p.id+'\')">查看详情</button></div></div></article>'}).join(''):'<div class="empty" style="grid-column:1/-1">没有找到相关商品</div>'}
  function openDetail(id){const p=PRODUCTS.find(function(item){return item.id===id});if(!p)return;document.getElementById('detailBody').innerHTML='<div class="detail-art '+p.tone+'">'+productVisual(p)+'</div><div class="detail-name">'+esc(p.name)+'</div><div class="detail-sub">'+esc(p.sub)+'</div><div class="detail-price">¥'+p.price+'</div><div class="detail-section"><div class="detail-section-title">商品说明</div><div class="detail-sub">'+esc(p.desc)+'</div></div><div class="detail-section"><div class="detail-section-title">商品特点</div><div class="detail-points">'+p.points.map(function(point){return '<div>'+esc(point)+'</div>'}).join('')+'</div></div><div class="detail-actions"><button class="add-cart" onclick="addToCart(\''+p.id+'\');closeOverlay(\'detailOverlay\')">加入购物车</button><button class="buy-now" onclick="buyNow(\''+p.id+'\')">立即购买</button></div>';document.getElementById('detailOverlay').classList.add('show')}
  function addToCart(id,qty){const existing=cart.find(function(item){return item.id===id});if(existing)existing.qty+=qty||1;else cart.push({id,qty:qty||1});saveCart();renderCart();}
  function buyNow(id){addToCart(id,1);closeOverlay('detailOverlay');openCart()}
  function updateCartCount(){const count=cart.reduce(function(total,item){return total+item.qty},0);document.getElementById('cartCount').textContent=count}
  function renderCart(){const box=document.getElementById('cartBody');if(!cart.length){box.innerHTML='<div class="cart-empty">购物车还是空的<br>去挑选一些健康好物吧</div>';updateCartCount();return}let total=0;box.innerHTML='<div class="cart-list">'+cart.map(function(item){const p=PRODUCTS.find(function(product){return product.id===item.id});if(!p)return '';total+=p.price*item.qty;return '<div class="cart-item"><div class="cart-thumb '+p.tone+'">'+productVisual(p)+'</div><div class="cart-info"><div class="cart-name">'+esc(p.name)+'</div><div class="cart-price">¥'+p.price+'</div><div class="qty"><button onclick="changeQty(\''+p.id+'\',-1)">−</button><span>'+item.qty+'</span><button onclick="changeQty(\''+p.id+'\',1)">＋</button></div></div></div>'}).join('')+'</div><div class="cart-total"><span>合计</span><strong>¥'+total+'</strong></div><button class="checkout" onclick="submitPurchase()">提交购买</button>';updateCartCount()}
  function changeQty(id,delta){const item=cart.find(function(entry){return entry.id===id});if(!item)return;item.qty+=delta;if(item.qty<=0)cart=cart.filter(function(entry){return entry.id!==id});saveCart();renderCart()}
  function openCart(){renderCart();document.getElementById('cartOverlay').classList.add('show')}
  let pendingPurchase=null;
  function cartTotal(){return cart.reduce(function(sum,item){const p=PRODUCTS.find(function(product){return product.id===item.id});return sum+(p?p.price*item.qty:0)},0)}
  function submitPurchase(){if(!cart.length)return;const total=cartTotal();document.getElementById('checkoutBody').innerHTML='<div class="checkout-total"><span>商品合计</span><strong>¥'+total+'</strong></div><div style="font-size:12px;color:var(--text2)">共 '+cart.reduce(function(sum,item){return sum+item.qty},0)+' 件商品，配送至默认收货地址</div>';pendingPurchase={items:cart.map(function(item){return {id:item.id,qty:item.qty}}),total:total};closeOverlay('cartOverlay');document.getElementById('checkoutOverlay').classList.add('show')}
  function confirmPurchase(){if(!pendingPurchase)return;const number='AKB-M'+new Date().getFullYear()+String(Math.floor(Math.random()*999999)).padStart(6,'0');const code=String(Math.floor(1000+Math.random()*9000));const method=document.querySelector('input[name="deliveryMethod"]:checked');const labels={instant:'立即送达',runner:'跑腿送达',express:'快递送达'};const products=pendingPurchase.items.map(function(item){const p=PRODUCTS.find(function(product){return product.id===item.id});return p?{product:p.name,desc:p.sub,price:String(p.price),quantity:item.qty,image:p.image,tone:p.tone}:null}).filter(Boolean);const first=products[0]||{};const order={id:number,status:'shipping',state:'待发货',product:first.product||'健康商品',desc:first.desc||'',price:first.price||String(pendingPurchase.total),quantity:pendingPurchase.items.reduce(function(sum,item){return sum+item.qty},0),amount:String(pendingPurchase.total),date:new Date().toISOString().slice(0,10),address:'默认收货地址',image:first.image||'',tone:first.tone||'purple',deliveryMethod:method?method.value:'instant',deliveryLabel:labels[method?method.value:'instant'],receiptCode:code,deliveryStatus:'processing',items:products};let saved=[];try{saved=JSON.parse(localStorage.getItem('ankebang_mall_orders')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){saved=[]}saved.unshift(order);localStorage.setItem('ankebang_mall_orders',JSON.stringify(saved));cart=[];saveCart();pendingPurchase=null;closeOverlay('checkoutOverlay');document.getElementById('successNo').textContent='订单号：'+number;document.getElementById('successDelivery').textContent='配送方式：'+order.deliveryLabel+' · 收货码：'+code;document.getElementById('successOverlay').classList.add('show')}
  function closeOverlay(id){document.getElementById(id).classList.remove('show')}
  function closeBackdrop(event,id){if(event.target===document.getElementById(id))closeOverlay(id)}
  renderProducts();updateCartCount();
</script>
</body>

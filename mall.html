<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
<script src="common-ui.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>健康商城 · 佑小邦</title>
  <style>
    :root{--purple:#8655C5;--purple-dark:#6B3FAA;--purple-light:#EDE6F7;--purple-bg:#F5F3FA;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--red:#EF4444;--green:#16965A;--sh:0 2px 16px rgba(100,60,160,.08)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}
    .frame{display:flex;justify-content:center;min-height:100vh;background:#E4DDF0}
    .phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg);position:relative}
    @media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:42px;overflow:hidden;box-shadow:0 24px 72px rgba(80,40,140,.22)}}
    .scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
    .scroll-area::-webkit-scrollbar{display:none}

    /* ── 状态栏 ── */
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:13px 22px 6px;font-size:13px;font-weight:700;background:linear-gradient(135deg,#EDE6F7,#F5F3FA)}
    .status-right{display:flex;align-items:center;gap:5px}
    .status-right svg{width:17px;height:17px}

    /* ── 顶部搜索栏（与 home.html 一致） ── */
    .top-bar{display:flex;align-items:center;gap:10px;padding:8px 14px 12px;background:linear-gradient(135deg,#EDE6F7,#F5F3FA)}
    .city-pill{display:inline-flex;align-items:center;gap:3px;padding:4px 8px 4px 5px;border-radius:14px;background:#fff;font-size:12px;font-weight:800;color:var(--purple-dark);cursor:pointer;flex-shrink:0}
    .city-pill svg{width:13px;height:13px}
    .city-pill .chev{width:10px;height:10px;opacity:.5}
    .top-search{flex:1;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:#fff}
    .top-search svg{width:16px;height:16px;opacity:.5}
    .top-search input{flex:1;border:0;background:none;outline:none;font-size:12px;color:var(--text2);font-family:inherit}
    .top-search input::placeholder{color:var(--text3)}
    .top-actions{display:flex;align-items:center;gap:6px;flex-shrink:0;cursor:pointer}
    .top-actions svg{width:22px;height:22px;color:var(--purple-dark)}
    .top-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#9060D0,#6B3FAA);display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0}

    /* ── Tab 切换（与 home.html 一致） ── */
    .top-tabs{display:flex;padding:0 14px;background:#fff;gap:28px;border-bottom:1px solid var(--border)}
    .top-tab{position:relative;padding:14px 0 12px;font-size:15px;font-weight:700;color:var(--text3);cursor:pointer;text-decoration:none}
    .top-tab.on{color:var(--text);font-weight:900;font-size:16px}
    .top-tab.on::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:2px;background:var(--purple)}

    /* ── 分类标签 ── */
    .category-row{display:flex;gap:10px;overflow-x:auto;padding:12px 14px 0;background:#fff}
    .category-row::-webkit-scrollbar{display:none}
    .category{white-space:nowrap;border:0;background:transparent;color:var(--text2);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
    .category.active{background:var(--purple);color:#fff;font-weight:800;box-shadow:0 3px 10px rgba(134,85,197,.3)}

    /* ── 产品卡片（上图下文，2×2 网格） ── */
    .product-section{padding:14px 14px 0;background:#fff;margin-top:8px}
    .product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .product-card{position:relative;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(100,60,160,.06);cursor:pointer;-webkit-tap-highlight-color:transparent;border:1px solid rgba(237,233,245,.6)}
    .product-card:active{transform:scale(.98)}
    .product-inner{display:flex;flex-direction:column}
    .product-art{width:100%;height:130px;border-radius:0;display:grid;place-items:center;position:relative;overflow:hidden}
    .product-art.purple{background:#F0E9FA;color:#7F55B8}
    .product-art.blue{background:#EAF3FF;color:#397EBA}
    .product-art.green{background:#E7F7EF;color:#31956B}
    .product-art.orange{background:#FFF3E1;color:#C17A24}
    .product-art.red{background:#FDEDED;color:#C34F55}
    .product-art svg{width:64px;height:64px}
    .product-image{position:absolute;inset:0;width:100%;height:100%;padding:0;object-fit:cover;display:block;z-index:1}
    .fallback-icon{position:relative;z-index:0}
    .product-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;padding:10px 12px 12px}
    .product-name{font-size:14px;font-weight:900;color:var(--text);line-height:1.3}
    .product-sub{font-size:11px;color:var(--text3);line-height:1.4}
    .product-pts{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .pts-tag{display:inline-block;font-size:10px;font-weight:800;color:#E94E4E;background:#FFF0F0;padding:2px 6px;border-radius:4px;flex-shrink:0}
    .pts-link{font-size:10px;color:var(--purple);font-weight:700}
    .product-foot{display:flex;align-items:flex-end;gap:6px;margin-top:4px}
    .price{font-size:16px;font-weight:900;color:#E94E4E}
    .price small{font-size:10px;font-weight:700}
    .sales{font-size:10px;color:var(--text3);white-space:nowrap}
    .product-add{position:absolute;right:10px;bottom:10px;width:28px;height:28px;border:0;border-radius:50%;background:var(--purple);color:#fff;font-size:18px;font-weight:900;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(134,85,197,.4);z-index:2}
    .product-add:active{transform:scale(.9)}
    .product-badge{position:absolute;left:9px;top:8px;z-index:2;background:rgba(255,255,255,.95);border-radius:6px;padding:2px 6px;color:var(--purple);font-size:10px;font-weight:800}
    .empty{text-align:center;color:var(--text3);font-size:13px;padding:58px 0}

    /* ── 底部 Tab（与 home.html 一致） ── */
    .bottom-nav{flex-shrink:0;display:flex;background:#fff;border-top:1px solid var(--border);padding:8px 0 calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(83,47,130,.06)}
    .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-decoration:none;padding:2px 0}
    .nav-ico{width:24px;height:24px;stroke:#AEACC0;fill:none}
    .nav-lbl{font-size:11px;font-weight:700;color:var(--text3)}
    .nav-item.act .nav-ico{stroke:var(--purple)}
    .nav-item.act .nav-lbl{color:var(--purple)}

    /* ── 购物车角标 ── */
    .cart-badge{position:absolute;right:4px;top:-2px;min-width:17px;height:17px;padding:0 4px;border-radius:10px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center}
    .cart-icon-wrap{position:relative;cursor:pointer}

    /* ── 弹窗（详情/购物车/结账/成功） ── */
    .overlay{position:absolute;inset:0;z-index:30;background:rgba(25,15,45,.48);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
    .overlay.show{opacity:1;pointer-events:auto}
    .sheet{width:min(430px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));transform:translateY(18px);transition:transform .24s}
    .overlay.show .sheet{transform:none}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-shrink:0}
    .sheet-title{font-size:18px;font-weight:900}
    .close{width:32px;height:32px;border:0;border-radius:10px;background:var(--purple-light);color:var(--text2);font-size:20px;cursor:pointer}
    .detail-art{height:155px;border-radius:16px;display:grid;place-items:center;margin-bottom:14px;overflow:hidden;position:relative}
    .detail-art svg{width:120px;height:120px}
    .detail-art .product-image{padding:0}
    .detail-name{font-size:20px;font-weight:900}
    .detail-sub{font-size:12px;color:var(--text2);margin-top:5px;line-height:1.5}
    .detail-price{font-size:24px;color:#E94E4E;font-weight:900;margin-top:12px}
    .detail-section{margin-top:16px;padding-top:13px;border-top:1px solid var(--border)}
    .detail-section-title{font-size:13px;font-weight:900;margin-bottom:7px}
    .detail-points{display:grid;gap:6px;color:var(--text2);font-size:12px;line-height:1.5}
    .detail-points div:before{content:'✓';color:var(--green);font-weight:900;margin-right:6px}
    .detail-actions{display:flex;gap:9px;margin-top:18px}
    .detail-actions button{height:45px;border:0;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
    .add-cart{flex:1;background:var(--purple-light);color:var(--purple)}
    .buy-now{flex:1.3;background:linear-gradient(135deg,#9161D3,#7547B7);color:#fff}
    /* ── 商品详情整页 ── */
    .detail-page{width:min(430px,100%);height:100%;background:var(--purple-bg);display:flex;flex-direction:column}
    .detail-nav{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;flex-shrink:0}
    .detail-back{width:32px;height:32px;border:0;border-radius:10px;background:var(--purple-light);color:var(--text2);cursor:pointer;display:grid;place-items:center}
    .detail-back svg{width:15px;height:15px}
    .detail-nav-title{font-size:16px;font-weight:900}
    .detail-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
    .detail-scroll::-webkit-scrollbar{display:none}
    .detail-page .detail-art{height:250px;border-radius:0;margin-bottom:0}
    .detail-card{background:#fff;border-radius:16px;margin:12px 14px 0;padding:16px;box-shadow:var(--sh)}
    .detail-card .detail-section:first-of-type{margin-top:16px}
    .detail-bar{display:flex;gap:9px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--border);flex-shrink:0}
    .detail-bar button{height:45px;border:0;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
    /* ── 详情页 详情/评价 标签 ── */
    .dtabs{display:flex;border-bottom:1px solid var(--border)}
    .dtab{flex:1;padding:13px 0;border:0;background:none;font-size:14px;font-weight:700;color:var(--text3);cursor:pointer;position:relative;font-family:inherit}
    .dtab.on{color:var(--text);font-weight:900}
    .dtab.on::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:3px;border-radius:2px;background:var(--purple)}
    .dtab-panel{padding:4px 16px 16px}
    .review-head{display:flex;justify-content:space-between;align-items:center;padding:12px 0 4px}
    .review-count{font-size:14px;font-weight:900}
    .review-all{font-size:12px;color:var(--text3);cursor:pointer}
    .review-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
    .review-item:last-child{border-bottom:0}
    .review-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800}
    .review-main{flex:1;min-width:0}
    .review-top{display:flex;justify-content:space-between;align-items:center}
    .review-name{font-size:13px;font-weight:800}
    .review-time{font-size:11px;color:var(--text3)}
    .review-stars{display:flex;align-items:center;gap:2px;margin-top:4px}
    .review-stars svg{width:12px;height:12px;color:#F59E0B}
    .review-score{font-size:12px;color:#F59E0B;font-weight:800;margin-left:4px}
    .review-text{font-size:12px;color:var(--text2);line-height:1.6;margin-top:6px}
    .cart-list{display:grid;gap:10px}
    .cart-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
    .cart-thumb{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;overflow:hidden;position:relative}
    .cart-thumb svg{width:42px;height:42px}
    .cart-thumb .product-image{padding:0}
    .cart-info{flex:1;min-width:0}
    .cart-name{font-size:13px;font-weight:800;line-height:1.35}
    .cart-price{font-size:13px;color:#E94E4E;font-weight:900;margin-top:4px}
    .qty{display:flex;align-items:center;gap:8px;margin-top:6px}
    .qty button{width:24px;height:24px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text2);cursor:pointer;font-family:inherit}
    .qty span{font-size:12px;font-weight:800;min-width:14px;text-align:center}
    .cart-total{display:flex;align-items:center;justify-content:space-between;margin-top:15px;font-size:13px}
    .cart-total strong{font-size:20px;color:#E94E4E}
    .checkout{width:100%;height:45px;margin-top:15px;border:0;border-radius:12px;background:linear-gradient(135deg,#9161D3,#7547B7);color:#fff;font-weight:800;cursor:pointer;font-family:inherit}
    .cart-empty{text-align:center;color:var(--text3);padding:45px 0;font-size:13px}
    .success{text-align:center;padding:18px 0 5px}
    .success-icon{width:56px;height:56px;border-radius:50%;background:#DCFCE7;color:var(--green);display:grid;place-items:center;margin:0 auto 12px}
    .success-icon svg{width:28px;height:28px}
    .success-title{font-size:18px;font-weight:900}
    .success-desc{font-size:12px;color:var(--text2);line-height:1.6;margin-top:7px}
    .success-no{margin-top:13px;background:var(--purple-bg);border-radius:11px;padding:10px;color:var(--text2);font-size:12px}
    .success-close{width:100%;height:44px;margin-top:17px;border:0;border-radius:12px;background:var(--purple);color:#fff;font-weight:800;cursor:pointer;font-family:inherit}
    #detailBody,#cartBody{min-height:0;overflow-y:auto;overscroll-behavior:contain}
    .checkout-summary{display:grid;gap:10px}
    .checkout-total{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;border-radius:12px;background:var(--purple-bg);color:var(--text2);font-size:13px}
    .checkout-total strong{font-size:21px;color:#E94E4E}
    .delivery-title{font-size:13px;font-weight:900;margin-top:16px}
    .delivery-options{display:grid;gap:9px;margin-top:9px}
    .delivery-option{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:12px;background:#fff;color:var(--text2);cursor:pointer}
    .delivery-option input{accent-color:var(--purple)}
    /* ── 立即支付弹窗 ── */
    .pay-sheet{padding:0;display:flex;flex-direction:column;transform:none !important;transition:none}
    .pay-scroll{flex:1;overflow-y:auto;padding:0 16px;-webkit-overflow-scrolling:touch;min-height:0}
    .pay-scroll::-webkit-scrollbar{display:none}
    .pay-product{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)}
    .pay-thumb{position:relative;width:82px;height:82px;border-radius:12px;background:var(--purple-bg);display:grid;place-items:center;flex-shrink:0;overflow:hidden}
    .pay-thumb svg{width:48px;height:48px}
    .pay-thumb .product-image{width:100%;height:100%;object-fit:cover;padding:0}
    .pay-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
    .pay-price-row{display:flex;align-items:baseline;gap:5px}
    .pay-discount-tag{font-size:11px;color:var(--text2)}
    .pay-price{font-size:22px;font-weight:900;color:#E94E4E}
    .pay-price small{font-size:12px}
    .pay-pts-row{display:flex;align-items:center;justify-content:space-between}
    .pay-pts-tag{font-size:11px;color:#E94E4E;font-weight:700}
    .pay-mypts{font-size:11px;color:var(--text3)}
    .pay-qty{display:flex;align-items:center;gap:10px;margin-top:2px}
    .pay-qty button{width:26px;height:26px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text2);font-size:14px;cursor:pointer;font-family:inherit;display:grid;place-items:center}
    .pay-qty span{font-size:13px;font-weight:800;min-width:16px;text-align:center}
    .pay-sec{padding:13px 0;border-bottom:1px solid var(--border)}
    .pay-sec-label{font-size:12px;color:var(--text2);font-weight:700;margin-bottom:8px}
    .pay-addr{font-size:13px;color:var(--text);font-weight:700;line-height:1.5;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
    .pay-addr svg{width:14px;height:14px;color:var(--text3);flex-shrink:0}
    /* 收货地址选择抽屉（与服务订单地址选择一致） */
    .addr-list{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto}
    .addr-item{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--border);border-radius:12px;cursor:pointer}
    .addr-item.sel{border-color:var(--purple);background:var(--purple-light)}
    .addr-radio{width:16px;height:16px;border:2px solid #D5CFE0;border-radius:50%;flex-shrink:0;margin-top:2px}
    .addr-item.sel .addr-radio{border-color:var(--purple);background:radial-gradient(circle,var(--purple) 0 5px,transparent 6px)}
    .addr-detail{font-size:13px;font-weight:700;color:var(--text);line-height:1.5}
    .addr-sub{font-size:12px;color:var(--text3);margin-top:4px}
    .addr-add{width:100%;height:42px;margin-top:12px;border:1px dashed #C9B4E8;border-radius:12px;background:var(--purple-bg);color:var(--purple);font-size:13px;font-weight:800;cursor:pointer;flex-shrink:0}
    .pay-dlv-row{display:flex;gap:8px}
    .pay-dlv{flex:1;height:38px;border:1px solid var(--border);border-radius:9px;background:#fff;font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;font-family:inherit;position:relative;transition:all .15s}
    .pay-dlv.on{border-color:#F59E0B;color:#D97706;background:#FFFBEB}
    .pay-dlv.on:after{content:'✓';position:absolute;right:6px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;background:#F59E0B;color:#fff;font-size:9px;display:grid;place-items:center}
    .pay-points-row{display:flex;align-items:center;justify-content:space-between}
    .pay-points-txt{font-size:12px;color:#E94E4E;font-weight:700}
    .pay-toggle{width:40px;height:22px;border-radius:11px;background:#E5E0EF;border:0;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0}
    .pay-toggle:after{content:'';position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:left .2s}
    .pay-toggle.on{background:#F59E0B}
    .pay-toggle.on:after{left:20px}
    .pay-confirm{width:calc(100% - 32px);height:46px;margin:10px 16px calc(14px + env(safe-area-inset-bottom));flex-shrink:0;border:0;border-radius:12px;background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
    .pay-confirm:active{opacity:.88}
    .delivery-option strong{display:block;color:var(--text);font-size:13px}
    .delivery-option span{display:block;margin-top:3px;font-size:11px;color:var(--text3)}
    .delivery-option:has(input:checked){border-color:var(--purple);background:var(--purple-light)}
    .checkout-confirm{width:100%;height:45px;margin-top:17px;border:0;border-radius:12px;background:linear-gradient(135deg,#9161D3,#7547B7);color:#fff;font-weight:800;cursor:pointer;font-family:inherit}
    .success-delivery{margin-top:9px;color:var(--purple);font-size:12px;font-weight:800}
    /* ── 支付成功全页 ── */
    .pay-success-page{background:#F5F3FA;min-height:100%;width:min(430px,100%);display:flex;flex-direction:column}
    .pay-success-top{flex:1;display:flex;flex-direction:column;align-items:center;padding:42px 20px 20px;text-align:center}
    .pay-success-icon{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#34D399,#10B981);display:grid;place-items:center;margin-bottom:16px}
    .pay-success-icon svg{width:32px;height:32px;color:#fff}
    .pay-success-title{font-size:20px;font-weight:900;margin-bottom:8px}
    .pay-success-desc{font-size:13px;color:var(--text2);line-height:1.65;max-width:280px}
    .pay-success-card{background:#fff;border-radius:16px;padding:4px 18px;margin:20px 16px 0;box-shadow:var(--sh)}

  var DETAIL_REVIEWS=[

    {name:'零度可乐',time:'1小时前',score:'5.0',text:'家里老人用着很方便，屏幕数字大，读数清晰。'},
    {name:'向阳而生',time:'3小时前',score:'5.0',text:'包装严实，做工细致，和描述一致，值得推荐。'},
    {name:'平安喜乐',time:'昨天',score:'4.5',text:'整体不错，操作比较简单，说明书再详细点就更好了。'}
  ];
  function reviewAvatar(name,i){var colors=['#8655C5','#397EBA','#31956B','#C17A24','#C34F55'];return '<div class="review-avatar" style="background:'+colors[i%colors.length]+'">'+esc(name.charAt(0))+'</div>'}
  function starRow(score){var stars='';for(var i=0;i<5;i++)stars+='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 16.9 5.9 20.4l1.5-6.8L2.2 9l6.9-.7z"/></svg>';return '<div class="review-stars">'+stars+'<span class="review-score">'+score+'</span></div>'}
  function openDetail(id){const p=PRODUCTS.find(function(item){return item.id===id});if(!p)return;detailProduct=p;
    var reviewsHtml=DETAIL_REVIEWS.map(function(r,i){return '<div class="review-item">'+reviewAvatar(r.name,i)+'<div class="review-main"><div class="review-top"><span class="review-name">'+esc(r.name)+'</span><span class="review-time">'+esc(r.time)+'</span></div>'+starRow(r.score)+'<div class="review-text">'+esc(r.text)+'</div></div></div>'}).join('');
    document.getElementById('detailBody').innerHTML='<div class="detail-art '+p.tone+'">'+productVisual(p)+'</div><div class="detail-card"><div class="detail-name">'+esc(p.name)+'</div><div class="detail-sub">'+esc(p.sub)+'</div><div class="detail-price">¥'+p.price+'</div></div><div class="detail-card" style="padding:0"><div class="dtabs"><button class="dtab on" data-dtab="info" onclick="switchDetailTab(this)">详情</button><button class="dtab" data-dtab="review" onclick="switchDetailTab(this)">评价</button></div><div class="dtab-panel" id="dtabInfo"><div class="detail-section" style="margin-top:12px;padding-top:0;border-top:0"><div class="detail-section-title">商品说明</div><div class="detail-sub">'+esc(p.desc)+'</div></div><div class="detail-section"><div class="detail-section-title">商品特点</div><div class="detail-points">'+p.points.map(function(point){return '<div>'+esc(point)+'</div>'}).join('')+'</div></div></div><div class="dtab-panel" id="dtabReview" style="display:none"><div class="review-head"><span class="review-count">评价·36</span><span class="review-all">查看全部 ›</span></div>'+reviewsHtml+'</div></div><div style="height:16px"></div>';document.getElementById('detailBody').scrollTop=0;document.getElementById('detailOverlay').classList.add('show')}
  function switchDetailTab(btn){var tab=btn.getAttribute('data-dtab');document.querySelectorAll('#detailBody .dtab').forEach(function(b){b.classList.toggle('on',b===btn)});document.getElementById('dtabInfo').style.display=tab==='info'?'':'none';document.getElementById('dtabReview').style.display=tab==='review'?'':'none'}
  function detailAddCart(){if(!detailProduct)return;addToCart(detailProduct.id)}
  function detailBuyNow(){if(!detailProduct)return;buyNow(detailProduct.id)}
  function addToCart(id,qty){const existing=cart.find(function(item){return item.id===id});if(existing)existing.qty+=qty||1;else cart.push({id,qty:qty||1});saveCart();showToast('已加入购物车')}
  /* ── 收货地址（与服务订单同一数据源 ankebang_saved_addresses）── */
  var ADDR_KEY='ankebang_saved_addresses';
  var fallbackAddrs=[
    {id:1,detail:'北京市朝阳区望京街道 88 号 2 单元 1602',contact:'张女士',phone:'138****2468',addressType:'home'},
    {id:2,detail:'北京市朝阳区建国路 66 号 北京协和医院东院区',contact:'张女士',phone:'138****2468',addressType:'hospital'}
  ];
  var payAddrId='';
  function getMallAddresses(){try{const v=JSON.parse(localStorage.getItem(ADDR_KEY));if(!Array.isArray(v))return fallbackAddrs.slice();const list=v.map(function(a){return Object.assign({addressType:'home'},a)});if(!list.some(function(a){return a.addressType==='hospital'}))list.push(fallbackAddrs[1]);return list}catch(e){return fallbackAddrs.slice()}}
  function renderPayAddr(){var list=getMallAddresses();var sel=list.find(function(a){return String(a.id)===String(payAddrId)});if(!sel&&list.length){sel=list[0];payAddrId=sel.id}document.getElementById('payAddr').textContent=sel?sel.detail:'请选择收货地址';return sel}
  function openAddrDrawer(){renderAddrList();document.getElementById('addrOverlay').classList.add('show')}
  function renderAddrList(){var list=getMallAddresses();document.getElementById('addrList').innerHTML=list.length?list.map(function(a){return '<div class="addr-item'+(String(a.id)===String(payAddrId)?' sel':'')+'" onclick="selectPayAddr(\''+a.id+'\')"><div class="addr-radio"></div><div><div class="addr-detail">'+esc(a.detail)+'</div><div class="addr-sub">'+esc(a.contact||'')+(a.phone?' · '+esc(a.phone):'')+'</div></div></div>'}).join(''):'<div style="text-align:center;color:var(--text3);font-size:12px;padding:10px 0">暂无收货地址，请新增</div>'}
  function selectPayAddr(id){payAddrId=id;renderPayAddr();renderAddrList();closeOverlay('addrOverlay')}
  /* ── 立即支付弹窗 ── */
  var payProduct=null, payQtyNum=1, payDelivery='instant', payUsePoints=true;
  var POINTS_DEDUCT=30, MY_POINTS=30;
  function buyNow(id){
    var p=PRODUCTS.find(function(item){return item.id===id});
    if(!p)return;
    payProduct=p; payQtyNum=1; payDelivery='instant'; payUsePoints=true;
    closeOverlay('detailOverlay');
    document.getElementById('payThumb').innerHTML=productVisual(p);
    document.getElementById('payQty').textContent=payQtyNum;
    document.getElementById('payToggle').classList.add('on');
    document.querySelectorAll('.pay-dlv').forEach(function(b){b.classList.toggle('on',b.dataset.dlv==='instant')});
    renderPayAddr();
    payUpdatePrice();
    document.getElementById('payOverlay').classList.add('show');
  }
  function payChangeQty(d){payQtyNum=Math.max(1,payQtyNum+d);document.getElementById('payQty').textContent=payQtyNum;payUpdatePrice()}
  function paySetDelivery(v,btn){payDelivery=v;document.querySelectorAll('.pay-dlv').forEach(function(b){b.classList.toggle('on',b===btn)})}
  function payTogglePoints(){payUsePoints=!payUsePoints;document.getElementById('payToggle').classList.toggle('on',payUsePoints);payUpdatePrice()}
  function payCalcTotal(){var base=payProduct.price*payQtyNum;var deduct=payUsePoints?Math.min(POINTS_DEDUCT,base):0;return Math.max(0,base-deduct)}
  function payUpdatePrice(){var t=payCalcTotal();document.getElementById('payPriceVal').textContent=t.toFixed(2);document.getElementById('payConfirmBtn').textContent='立即支付 ¥'+t.toFixed(2)}
  function payConfirm(){
    if(!payProduct)return;
    var distInfo=(function(){try{const did=localStorage.getItem('ankebang_mall_dist');if(!did)return null;const ds=JSON.parse(localStorage.getItem('akb_admin_mall_distributors')||'[]');const d=ds.find(function(x){return x.id===did&&x.status==='on'});return d?{id:d.id,name:d.name,rate:Number(d.rate)||0.1}:null}catch(e){return null}})();
    var number='AKB-M'+new Date().getFullYear()+String(Math.floor(Math.random()*999999)).padStart(6,'0');
    var code=String(Math.floor(1000+Math.random()*9000));
    var labels={instant:'立即送达',runner:'跑腿送达',express:'快递送达'};
    var total=payCalcTotal();
    var selAddr=renderPayAddr();
    var addrText=selAddr?(selAddr.detail+(selAddr.contact?' · '+selAddr.contact:'')):'请选择收货地址';
    var order={id:number,status:'shipping',state:'待发货',product:payProduct.name,desc:payProduct.sub,price:String(payProduct.price),quantity:payQtyNum,amount:String(total),date:new Date().toISOString().slice(0,10),address:addrText,image:payProduct.image||'',tone:payProduct.tone||'purple',deliveryMethod:payDelivery,deliveryLabel:labels[payDelivery],receiptCode:code,deliveryStatus:'processing',items:[{product:payProduct.name,desc:payProduct.sub,price:String(payProduct.price),quantity:payQtyNum,image:payProduct.image,tone:payProduct.tone}],distId:distInfo?distInfo.id:'',distName:distInfo?distInfo.name:'',distRate:distInfo?distInfo.rate:0,pointsDeduct:payUsePoints?Math.min(POINTS_DEDUCT,payProduct.price*payQtyNum):0};
    var saved=[];try{saved=JSON.parse(localStorage.getItem('ankebang_mall_orders')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){saved=[]}
    saved.unshift(order);localStorage.setItem('ankebang_mall_orders',JSON.stringify(saved));
    closeOverlay('payOverlay');
    var baseAmount=payProduct.price*payQtyNum;
    var pointsUsed=payUsePoints?Math.min(POINTS_DEDUCT,baseAmount):0;
    document.getElementById('okProduct').textContent=payProduct.name+'+'+payProduct.sub.split('·')[0].trim();
    document.getElementById('okAddr').textContent=order.address;
    document.getElementById('okCode').textContent=code;
    document.getElementById('okTotal').textContent='¥'+baseAmount;
    document.getElementById('okDeduct').textContent='-¥'+pointsUsed;
    document.getElementById('okPaid').textContent='¥'+total;
    document.getElementById('successOverlay').classList.add('show');
  }
  function updateCartCount(){const count=cart.reduce(function(total,item){return total+item.qty},0);var el=document.getElementById('cartCount');if(el)el.textContent=count}
  function renderCart(){const box=document.getElementById('cartBody');if(!cart.length){box.innerHTML='<div class="cart-empty">购物车还是空的<br>去挑选一些健康好物吧</div>';updateCartCount();return}let total=0;box.innerHTML='<div class="cart-list">'+cart.map(function(item){const p=PRODUCTS.find(function(product){return product.id===item.id});if(!p)return '';total+=p.price*item.qty;return '<div class="cart-item"><div class="cart-thumb '+p.tone+'">'+productVisual(p)+'</div><div class="cart-info"><div class="cart-name">'+esc(p.name)+'</div><div class="cart-price">¥'+p.price+'</div><div class="qty"><button onclick="changeQty(\''+p.id+'\',-1)">−</button><span>'+item.qty+'</span><button onclick="changeQty(\''+p.id+'\',1)">＋</button></div></div></div>'}).join('')+'</div><div class="cart-total"><span>合计</span><strong>¥'+total+'</strong></div><button class="checkout" onclick="submitPurchase()">提交购买</button>';updateCartCount()}
  function changeQty(id,delta){const item=cart.find(function(entry){return entry.id===id});if(!item)return;item.qty+=delta;if(item.qty<=0)cart=cart.filter(function(entry){return entry.id!==id});saveCart();renderCart()}
  function openCart(){renderCart();document.getElementById('cartOverlay').classList.add('show')}
  let pendingPurchase=null;
  function cartTotal(){return cart.reduce(function(sum,item){const p=PRODUCTS.find(function(product){return product.id===item.id});return sum+(p?p.price*item.qty:0)},0)}
  function submitPurchase(){if(!cart.length)return;const total=cartTotal();document.getElementById('checkoutBody').innerHTML='<div class="checkout-total"><span>商品合计</span><strong>¥'+total+'</strong></div><div style="font-size:12px;color:var(--text2)">共 '+cart.reduce(function(sum,item){return sum+item.qty},0)+' 件商品，配送至默认收货地址</div>';pendingPurchase={items:cart.map(function(item){return {id:item.id,qty:item.qty}}),total:total};closeOverlay('cartOverlay');document.getElementById('checkoutOverlay').classList.add('show')}
  function confirmPurchase(){if(!pendingPurchase)return;const distInfo=(function(){try{const did=localStorage.getItem('ankebang_mall_dist');if(!did)return null;const ds=JSON.parse(localStorage.getItem('akb_admin_mall_distributors')||'[]');const d=ds.find(function(x){return x.id===did&&x.status==='on'});return d?{id:d.id,name:d.name,rate:Number(d.rate)||0.1}:null}catch(e){return null}})();const number='AKB-M'+new Date().getFullYear()+String(Math.floor(Math.random()*999999)).padStart(6,'0');const code=String(Math.floor(1000+Math.random()*9000));const method=document.querySelector('input[name="deliveryMethod"]:checked');const labels={instant:'立即送达',runner:'跑腿送达',express:'快递送达'};const products=pendingPurchase.items.map(function(item){const p=PRODUCTS.find(function(product){return product.id===item.id});return p?{product:p.name,desc:p.sub,price:String(p.price),quantity:item.qty,image:p.image,tone:p.tone}:null}).filter(Boolean);const first=products[0]||{};const order={id:number,status:'shipping',state:'待发货',product:first.product||'健康商品',desc:first.desc||'',price:first.price||String(pendingPurchase.total),quantity:pendingPurchase.items.reduce(function(sum,item){return sum+item.qty},0),amount:String(pendingPurchase.total),date:new Date().toISOString().slice(0,10),address:'默认收货地址',image:first.image||'',tone:first.tone||'purple',deliveryMethod:method?method.value:'instant',deliveryLabel:labels[method?method.value:'instant'],receiptCode:code,deliveryStatus:'processing',items:products,distId:distInfo?distInfo.id:'',distName:distInfo?distInfo.name:'',distRate:distInfo?distInfo.rate:0};let saved=[];try{saved=JSON.parse(localStorage.getItem('ankebang_mall_orders')||'[]');if(!Array.isArray(saved))saved=[]}catch(e){saved=[]}saved.unshift(order);localStorage.setItem('ankebang_mall_orders',JSON.stringify(saved));cart=[];saveCart();pendingPurchase=null;closeOverlay('checkoutOverlay');document.getElementById('successNo').textContent='订单号：'+number;document.getElementById('successDelivery').textContent='配送方式：'+order.deliveryLabel+' · 收货码：'+code;document.getElementById('successOverlay').classList.add('show')}
  function closeOverlay(id){document.getElementById(id).classList.remove('show')}
  function closeBackdrop(event,id){if(event.target===document.getElementById(id))closeOverlay(id)}
  renderProducts();

  /* 与运营后台「商城管理」模块联动：后台保存的商品/分类配置覆盖默认数据，下架商品隐藏 */
  (function(){
    try{
      var managed=JSON.parse(localStorage.getItem('akb_admin_mall_products')||'null');
      if(Array.isArray(managed)&&managed.length){
        PRODUCTS.splice(0,PRODUCTS.length);
        managed.forEach(function(p){ if(p.status!=='off')PRODUCTS.push(p); });
        renderProducts();
      }
    }catch(e){}
    try{
      var cats=JSON.parse(localStorage.getItem('akb_admin_mall_categories')||'null');
      if(Array.isArray(cats)&&cats.length){
        var activeHidden=false;
        document.querySelectorAll('.category[data-category]').forEach(function(btn){
          var id=btn.getAttribute('data-category');
          if(id==='all')return;
          var cat=cats.filter(function(c){return c.id===id;})[0];
          if(!cat||cat.status==='off'){ btn.style.display='none'; if(btn.classList.contains('active'))activeHidden=true; }
          else { btn.style.display=''; btn.textContent=cat.name; }
        });
        if(activeHidden){
          var allBtn=document.querySelector('.category[data-category="all"]');
          if(allBtn)setCategory(allBtn,'all');
        }
      }
    }catch(e){}
  })();

  /* 分销承接：微信「扫一扫」分销员二维码（mall.html?dist=D1001）进入商城，
     记住归属并展示提示条，之后下单自动归属该分销员 */
  (function(){
    try{
      var q=new URLSearchParams(location.search).get('dist');
      if(q)localStorage.setItem('ankebang_mall_dist',q);
      var did=localStorage.getItem('ankebang_mall_dist');
      if(!did)return;
      var ds=JSON.parse(localStorage.getItem('akb_admin_mall_distributors')||'[]');
      var d=ds.filter(function(x){return x.id===did&&x.status==='on'})[0];
      if(!d)return;
      var bar=document.createElement('div');
      bar.style.cssText='margin:10px 14px 0;padding:10px 13px;border-radius:13px;background:linear-gradient(120deg,#FFF7E8,#FFE9C7);color:#8A5A16;font-size:12px;font-weight:800;display:flex;align-items:center;gap:7px;line-height:1.5';
      bar.innerHTML='<svg width="16" height="16" viewBox="0 0 18 18" fill="none" style="flex-shrink:0"><circle cx="4.5" cy="9" r="2" stroke="#B97A1A" stroke-width="1.5"/><circle cx="13.5" cy="4.5" r="2" stroke="#B97A1A" stroke-width="1.5"/><circle cx="13.5" cy="13.5" r="2" stroke="#B97A1A" stroke-width="1.5"/><path d="M6.3 7.9l5.4-2.5M6.3 10.1l5.4 2.5" stroke="#B97A1A" stroke-width="1.5"/></svg><span>由「'+esc(d.name)+'」推荐进入 · 下单完成后 TA 可获得推广分成</span>';
      var section=document.querySelector('.product-section');
      if(section)section.parentNode.insertBefore(bar,section);
    }catch(e){}
  })();
</script>

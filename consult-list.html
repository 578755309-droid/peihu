<!doctype html>
<html lang="zh-CN">
<head>
  <script src="vendor/vue.global.prod.js"></script>
  <script src="ui/icons.js"></script>
  <script src="ui/vue-ui.js"></script>
  <script src="common-ui.js"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>公告资讯 · 佑小邦</title>
  <script src="consult-data.js"></script>
  <style>
    :root{--purple:#1CD8B7;--purple-dark:#0FA98C;--purple-light:#DDF7F1;--purple-bg: #F5F5F5;--card:#fff;--text:#1A1828;--text2:#6B6880;--text3:#AEACC0;--border:#EDE9F5;--sh:0 2px 16px rgba(0,0,0,0.1)}
    *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;background:var(--purple-bg);color:var(--text);-webkit-font-smoothing:antialiased}button{font:inherit}.frame{display:flex;justify-content:center;min-height:100vh;background: #F5F5F5}.phone{width:100%;max-width:430px;min-height:100vh;display:flex;flex-direction:column;background:var(--purple-bg);position:relative}@media(min-width:520px){.frame{align-items:flex-start;padding:20px 0 40px}.phone{height:900px;min-height:unset;border-radius:12px;overflow:hidden;box-shadow:0 24px 72px rgba(0,0,0,0.1)}}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 6px;background:#fff}.status-bar span{font-size:13px;font-weight:600}.status-right{display:flex;gap:5px;align-items:center}.status-right svg{width:17px;height:12px}
    .nav{height:58px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff;border-bottom:1px solid var(--border);flex-shrink:0}.nav h1{font-size:18px;font-weight:700}.back{position:absolute;left:16px;width:34px;height:34px;border:0;background:var(--purple-light);border-radius:12px;color:var(--purple);display:grid;place-items:center;cursor:pointer}.back svg{width:18px;height:18px}
    .scroll{flex:1;overflow:auto;padding:14px 14px 30px}.scroll::-webkit-scrollbar{display:none}
    .consult-item{display:flex;gap:12px;padding:14px;background:var(--card);border-radius:12px;box-shadow:var(--sh);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .13s}.consult-item:active{transform:scale(.98)}.consult-item+.consult-item{margin-top:10px}
    .consult-main{flex:1;min-width:0;display:flex;flex-direction:column}
    .consult-title{font-size:15px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .consult-sub{margin-top:6px;font-size:13px;color:var(--text3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .consult-foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;font-size:12px;color:var(--text3);font-weight:600}
    .consult-cover{flex:0 0 108px;width:108px;height:72px;border-radius:12px;object-fit:cover;background:var(--purple-light)}
    .consult-cover-ph{display:grid;place-items:center;color:var(--purple);font-size:12px;font-weight:600}
    .mode-tag{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:12px;background:var(--purple-light);color:var(--purple);font-size:11px;font-weight:600;vertical-align:1px}
    .empty{padding:80px 20px;text-align:center;color:var(--text3);font-size:14px;line-height:1.8}
  </style>
  <link rel="stylesheet" href="visual-theme.css" />
  <link rel="stylesheet" href="ui/vue-ui.css" />
</head>
<body data-surface="mobile" data-page="consult-list">
<div class="frame"><div class="phone">
  <div class="status-bar"><span>9:41</span><div class="status-right"><svg viewBox="0 0 17 12" fill="none"><rect x="0" y="3" width="3" height="9" rx="1" fill="#1A1828"/><rect x="4.5" y="2" width="3" height="10" rx="1" fill="#1A1828"/><rect x="9" y=".5" width="3" height="11.5" rx="1" fill="#1A1828"/><rect x="13.5" y="0" width="3" height="12" rx="1" fill="#1A1828" opacity=".35"/></svg><svg viewBox="0 0 24 12" fill="none"><rect x=".6" y=".6" width="20" height="10.8" rx="2.8" stroke="#1A1828" stroke-width="1.2"/><rect x="21.2" y="3.6" width="2.2" height="4.8" rx="1.1" fill="#1A1828"/><rect x="2" y="2" width="15" height="8" rx="1.8" fill="#1A1828"/></svg></div></div>
  <header class="nav"><button class="back" onclick="history.length>1?history.back():location.href='home.html'" aria-label="返回"><svg viewBox="0 0 20 20" fill="none"><path d="M12.5 4L6.5 10l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>公告资讯</h1></header>
  <main class="scroll" id="list"></main>
</div></div>
<script>
(function () {
  var box = document.getElementById('list');
  var list = window.AKBConsult.getEnabled();
  if (!list.length) { box.innerHTML = '<div class="empty">暂无资讯内容</div>'; return; }
  var esc = window.AKBConsult.esc;
  box.innerHTML = list.map(function (item) {
    var sub = item.sub || (item.mode === 'link' ? '点击查看公众号文章' : window.AKBConsult.strip(item.content).slice(0, 40));
    var cover = item.cover
      ? '<img class="consult-cover" src="' + item.cover + '" alt="">'
      : '<div class="consult-cover consult-cover-ph">240×160</div>';
    return '<article class="consult-item" onclick="openItem(\'' + item.id + '\')">'
      + '<div class="consult-main"><div class="consult-title">' + esc(item.title) + (item.mode === 'link' ? '<span class="mode-tag">公众号</span>' : '') + '</div>'
      + '<div class="consult-sub">' + esc(sub) + '</div>'
      + '<div class="consult-foot"><span>' + esc(item.name) + '</span><span>' + window.AKBConsult.relTime(item.updatedAt) + '</span></div></div>'
      + cover + '</article>';
  }).join('');
  window.openItem = function (id) {
    var item = window.AKBConsult.getById(id);
    if (!item) return;
    location.href = 'consult-detail.html?id=' + encodeURIComponent(id);
  };
})();
</script>
</body>
</html>

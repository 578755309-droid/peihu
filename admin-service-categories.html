<!doctype html>
<style>body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#EFF6FF;color:#172033;min-width:1100px}.main{margin-left:220px}.topbar{height:60px;background:#fff;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid #D7E8FA}.page{padding:24px 28px}.page-head{display:flex;justify-content:space-between;margin-bottom:22px}.page-title{font-size:22px;font-weight:900}.page-sub{color:#9AA7BA;margin-top:5px}.btn{padding:9px 15px;border:1px solid #D7E8FA;border-radius:8px;background:#fff;cursor:pointer}.btn-primary{background:#224CD3;color:#fff}.table-wrap,.panel{background:#fff;border:1px solid #D7E8FA;border-radius:14px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px 18px;border-bottom:1px solid #EEF5FC;text-align:left}.modal-mask{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center}.modal-mask.show{display:flex}.modal{background:#fff;padding:22px;border-radius:16px;width:420px}.field{display:grid;gap:6px;margin-bottom:12px}.field input,.field select,.field textarea{padding:9px;border:1px solid #D7E8FA;border-radius:8px}.modal-foot{display:flex;justify-content:flex-end;gap:9px}</style>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1280"><title>分类服务管理 · 多康运营后台</title><link rel="stylesheet" href="admin-shell.css"><link rel="stylesheet" href="admin-catalog.css"><style>
.catalog-layout{display:grid;grid-template-columns:280px 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.panel-title{font-size:15px;font-weight:900}.panel-note{font-size:11px;color:var(--text3);margin-top:4px}.category-list{padding:10px}.category-item{padding:14px 14px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:5px}.category-item:hover{background:#F5F8FF}.category-item.active{background:#EEF4FF;border-color:#BFD4FF;box-shadow:inset 3px 0 #224CD3}.cat-row{display:flex;align-items:center;justify-content:space-between}.cat-name{font-size:14px;font-weight:800}.cat-count{font-size:11px;color:var(--text3);margin-top:6px}.cat-status{font-size:11px;color:#16A34A}.cat-status.off{color:#DC2626}.service-table th:nth-child(1){width:19%}.service-table th:nth-child(2){width:32%}.service-table th:nth-child(3){width:12%}.service-table th:nth-child(4){width:10%}.service-table th:nth-child(5){width:27%}.service-title{font-weight:800;color:var(--text)}.service-desc{font-size:11px;color:var(--text3);margin-top:4px;line-height:1.4}.status-btn{border:0;border-radius:15px;padding:5px 10px;font:700 11px inherit;cursor:pointer}.status-btn.on{background:#DCFCE7;color:#16A34A}.status-btn.off{background:#FEE2E2;color:#DC2626}.sort-actions{display:flex;gap:5px}.sort-actions button{width:26px;height:26px;border:1px solid var(--border);background:#fff;border-radius:6px;color:var(--blue);cursor:pointer}.modal-wide{width:560px}.field textarea{border:1px solid var(--border);border-radius:8px;padding:10px;font:600 13px inherit;resize:vertical;min-height:90px;outline:0}.field textarea:focus{border-color:var(--blue)}.inline-fields{display:grid;grid-template-columns:1fr 120px;gap:12px}.empty-state{padding:58px;text-align:center;color:var(--text3);font-size:13px}
</style><script src="service-catalog.js"></script><script defer src="admin-sidebar.js"></script></head>
<body><div class="layout"><aside class="sidebar"><div class="brand"><div class="brand-title">多康</div><div class="brand-sub">运营管理后台</div></div></aside><main class="main"><header class="topbar"><div class="crumb"><span>业务管理</span><span>›</span><span class="current">分类服务管理</span></div><div class="top-actions"><span class="top-date">2026年4月12日 星期日</span><div class="top-av">管</div></div></header><section class="page"><div class="page-head"><div><h1 class="page-title">分类服务管理</h1><p class="page-sub">配置一级分类与二级服务项目，维护描述、排序及上下架状态</p></div><div class="actions"><button class="btn" onclick="openCategoryModal()">+ 新增分类</button><button class="btn btn-primary" onclick="openServiceModal()">+ 新增服务项目</button></div></div><div class="catalog-layout"><section class="panel"><div class="panel-head"><div><div class="panel-title">一级分类</div><div class="panel-note">前端核心服务入口</div></div></div><div class="category-list" id="categoryList"></div></section><section class="panel"><div class="panel-head"><div><div class="panel-title" id="servicePanelTitle">服务项目</div><div class="panel-note" id="servicePanelNote"></div></div><button class="btn" onclick="openServiceModal()">+ 新增项目</button></div><div class="table-wrap" style="border:0;box-shadow:none;border-radius:0"><table class="table service-table"><thead><tr><th>服务项目</th><th>服务描述</th><th>计价方式</th><th>状态</th><th>排序</th><th>操作</th></tr></thead><tbody id="serviceTable"></tbody></table><div class="empty-state" id="emptyState" style="display:none">暂无服务项目，请先新增</div></div></section></div></section></main></div>
<div class="modal-mask" id="serviceModal" onclick="if(event.target===this)closeServiceModal()"><div class="modal modal-wide"><div class="modal-head"><div class="modal-title" id="serviceModalTitle">新增服务项目</div><button class="modal-close" onclick="closeServiceModal()">×</button></div><div class="form-grid"><div class="inline-fields"><div class="field"><label>服务名称</label><input id="serviceName" placeholder="例如：贵宾陪诊"></div><div class="field"><label>排序</label><input id="serviceSort" type="number" min="1" value="1"></div></div><div class="field"><label>所属分类</label><select class="select" id="serviceCategory" style="width:100%"></select></div><div class="field"><label>简短描述</label><input id="serviceSummary" placeholder="在前端列表中展示的一句话描述"></div><div class="field"><label>服务详情</label><textarea id="serviceDescription" placeholder="填写服务内容、流程或注意事项"></textarea></div><div class="field"><label>状态</label><select class="select" id="serviceStatus" style="width:100%"><option value="on">上架</option><option value="off">下架</option></select></div></div><div class="modal-foot"><button class="btn" onclick="closeServiceModal()">取消</button><button class="btn btn-primary" onclick="saveServiceForm()">保存</button></div></div></div>
<div class="modal-mask" id="categoryModal" onclick="if(event.target===this)closeCategoryModal()"><div class="modal"><div class="modal-head"><div class="modal-title" id="categoryModalTitle">新增一级分类</div><button class="modal-close" onclick="closeCategoryModal()">×</button></div><div class="form-grid"><div class="field"><label>分类名称</label><input id="categoryName" placeholder="例如：居家陪护"></div><div class="field"><label>分类描述</label><textarea id="categoryDescription" placeholder="前端核心服务卡片下方展示的描述"></textarea></div></div><div class="modal-foot"><button class="btn" onclick="closeCategoryModal()">取消</button><button class="btn btn-primary" onclick="saveCategoryForm()">保存</button></div></div></div>
<script>
let catalog=window.AKBServiceCatalog.get(),selectedCategory=catalog.categories.slice().sort((a,b)=>a.sort-b.sort)[0]?.id||'',editingServiceId='',editingCategoryId='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){window.AKBServiceCatalog.save(catalog);}
function render(){catalog.categories.sort((a,b)=>a.sort-b.sort);const cats=document.getElementById('categoryList');cats.innerHTML=catalog.categories.map(c=>{const n=catalog.services.filter(s=>s.category===c.id).length;return `<div class="category-item ${c.id===selectedCategory?'active':''}" onclick="selectCategory('${esc(c.id)}')"><div class="cat-row"><span class="cat-name">${esc(c.name)}</span><span class="cat-status ${c.status==='on'?'':'off'}">${c.status==='on'?'已上架':'已下架'}</span></div><div class="cat-count">${n} 个服务项目 · ${esc(c.description||'')}</div><div class="op" style="margin-top:6px"><button onclick="event.stopPropagation();openCategoryModal('${esc(c.id)}')">编辑</button><button onclick="event.stopPropagation();toggleCategory('${esc(c.id)}')">${c.status==='on'?'下架':'上架'}</button></div></div>`}).join('');const cat=catalog.categories.find(c=>c.id===selectedCategory);document.getElementById('servicePanelTitle').textContent=cat?cat.name+' · 服务项目':'服务项目';document.getElementById('servicePanelNote').textContent=cat?cat.description||'维护二级服务项目':'请选择左侧分类';const list=catalog.services.filter(s=>s.category===selectedCategory).sort((a,b)=>(a.sort||0)-(b.sort||0));document.getElementById('emptyState').style.display=list.length?'none':'block';document.getElementById('serviceTable').innerHTML=list.map((s,i)=>`<tr><td><div class="service-title">${esc(s.name)}</div></td><td><div class="service-desc">${esc(s.summary||s.description||'—')}</div></td><td><button class="status-btn ${s.status==='on'?'on':'off'}" onclick="toggleService('${esc(s.id)}')">${s.status==='on'?'已上架':'已下架'}</button></td><td>${s.sort||i+1}</td><td><div class="op"><button onclick="openServiceModal('${esc(s.id)}')">编辑</button><button onclick="moveService('${esc(s.id)}',-1)">上移</button><button onclick="moveService('${esc(s.id)}',1)">下移</button></div></td></tr>`).join('');}
function selectCategory(id){selectedCategory=id;render();}
function toggleService(id){const s=catalog.services.find(x=>x.id===id);if(!s)return;s.status=s.status==='on'?'off':'on';persist();render();}
function moveService(id,dir){const list=catalog.services.filter(s=>s.category===selectedCategory).sort((a,b)=>(a.sort||0)-(b.sort||0)),i=list.findIndex(s=>s.id===id),j=i+dir;if(i<0||j<0||j>=list.length)return;const a=list[i].sort,b=list[j].sort;list[i].sort=b;list[j].sort=a;persist();render();}
function openServiceModal(id){editingServiceId=id||'';const s=id?catalog.services.find(x=>x.id===id):null;document.getElementById('serviceModalTitle').textContent=s?'编辑服务项目':'新增服务项目';const catSelect=document.getElementById('serviceCategory');catSelect.innerHTML=catalog.categories.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');document.getElementById('serviceCategory').value=s?s.category:selectedCategory;document.getElementById('serviceName').value=s?s.name:'';document.getElementById('serviceSummary').value=s?s.summary||'':'';document.getElementById('serviceDescription').value=s?s.description||'':'';document.getElementById('serviceSort').value=s?s.sort:(catalog.services.filter(x=>x.category===selectedCategory).length+1);document.getElementById('serviceStatus').value=s?s.status:'on';document.getElementById('serviceModal').classList.add('show');}
function closeServiceModal(){document.getElementById('serviceModal').classList.remove('show');}
function saveServiceForm(){const name=document.getElementById('serviceName').value.trim(),category=document.getElementById('serviceCategory').value;if(!name){alert('请填写服务名称');return}const data={id:editingServiceId||('svc-'+Date.now()),name,category,summary:document.getElementById('serviceSummary').value.trim(),description:document.getElementById('serviceDescription').value.trim(),sort:Math.max(1,Number(document.getElementById('serviceSort').value)||1),status:document.getElementById('serviceStatus').value};if(editingServiceId){const i=catalog.services.findIndex(x=>x.id===editingServiceId);if(i>-1)catalog.services[i]={...catalog.services[i],...data}}else catalog.services.push(data);selectedCategory=category;persist();closeServiceModal();render();}
function openCategoryModal(id){editingCategoryId=id||'';const c=id&&catalog.categories.find(x=>x.id===id);document.getElementById('categoryModalTitle').textContent=c?'编辑一级分类':'新增一级分类';document.getElementById('categoryName').value=c?c.name:'';document.getElementById('categoryDescription').value=c?c.description||'':'';document.getElementById('categoryModal').classList.add('show');}
function closeCategoryModal(){document.getElementById('categoryModal').classList.remove('show');}
function toggleCategory(id){const c=catalog.categories.find(x=>x.id===id);if(!c)return;c.status=c.status==='on'?'off':'on';persist();render();}
function saveCategoryForm(){const name=document.getElementById('categoryName').value.trim();if(!name){alert('请填写分类名称');return}const description=document.getElementById('categoryDescription').value.trim();if(editingCategoryId){const c=catalog.categories.find(x=>x.id===editingCategoryId);if(c){c.name=name;c.description=description;}}else{const id='cat-'+Date.now();catalog.categories.push({id,name,description,sort:catalog.categories.length+1,status:'on'});selectedCategory=id;}persist();closeCategoryModal();render();}
render();
</script><script>
(function(){
  var modal=document.getElementById('serviceModal'), fields=modal&&modal.querySelector('.form-grid'); if(!fields)return;
  var anchor=fields.children[1]; anchor.insertAdjacentHTML('afterend','<div class="field"><label>计价方式</label><select class="select" id="servicePricing" style="width:100%"><option value="per_order">按次收费</option><option value="per_day">按天收费</option><option value="per_hour">按小时收费</option></select></div><div class="field"><label id="servicePriceLabel">价格（元）</label><input id="servicePrice" type="number" min="0" step="0.01" placeholder="请输入价格"></div>');
  document.getElementById('servicePricing').onchange=updatePricingLabel;
  window.updatePricingLabel=function(){var type=document.getElementById('servicePricing').value, label=type==='per_hour'?'每小时价格（元）':type==='per_day'?'每天价格（元）':'价格（元）',hint=type==='per_hour'?'请输入每小时价格':type==='per_day'?'请输入每天价格':'请输入单次价格';document.getElementById('servicePriceLabel').textContent=label;document.getElementById('servicePrice').placeholder=hint;};
  var oldOpen=window.openServiceModal; window.openServiceModal=function(id){oldOpen(id);var s=id&&catalog.services.find(function(x){return x.id===id});document.getElementById('servicePricing').value=s&&s.pricing?s.pricing:'per_order';document.getElementById('servicePrice').value=s&&s.price!=null?s.price:'';updatePricingLabel();};
  var oldSave=window.saveServiceForm; window.saveServiceForm=function(){var pricing=document.getElementById('servicePricing').value,price=Math.max(0,Number(document.getElementById('servicePrice').value)||0);oldSave();var s=editingServiceId?catalog.services.find(function(x){return x.id===editingServiceId}):catalog.services[catalog.services.length-1];if(s){s.pricing=pricing;s.price=price;persist();render();}};
  var oldRender=window.render; window.render=function(){oldRender();var head=document.querySelector('.service-table thead tr');if(head&&head.children.length===6){var th=document.createElement('th');th.textContent='价格';head.insertBefore(th,head.children[3]);}var rows=[].slice.call(document.querySelectorAll('#serviceTable tr')),list=catalog.services.filter(function(s){return s.category===selectedCategory}).sort(function(a,b){return (a.sort||0)-(b.sort||0)});rows.forEach(function(row,i){var pricingCell=row.children[2],s=list[i],price=s&&s.price!=null?s.price:'未设置',unit=s&&s.pricing==='per_hour'?'小时':s&&s.pricing==='per_day'?'天':'次';if(pricingCell&&s){pricingCell.innerHTML='<span class="service-desc">按'+unit+'</span>';var priceCell=document.createElement('td');priceCell.innerHTML='<span class="service-title">¥'+price+'</span>';row.insertBefore(priceCell,row.children[3]);}});}; window.render();
})();
</script><script>
  (function(){
    var renderBeforePricingFix=window.render;
    function pricingLabel(type){return type==='per_hour'?'按小时收费':type==='per_day'?'按天收费':'按次收费';}
    function priceLabel(service){if(service.price==null||service.price==='')return '—';var unit=service.pricing==='per_hour'?'小时':service.pricing==='per_day'?'天':'次';return '¥'+service.price+'/'+unit;}
    window.render=function(){
      renderBeforePricingFix();
      var header=document.querySelector('.service-table thead tr');
      var body=document.getElementById('serviceTable');
      if(!header||!body)return;
      header.innerHTML='<th>服务项目</th><th>服务描述</th><th>计价方式</th><th>价格</th><th>状态</th><th>排序</th><th>操作</th>';
      var list=catalog.services.filter(function(service){return service.category===selectedCategory;}).sort(function(a,b){return (a.sort||0)-(b.sort||0);});
      body.innerHTML=list.map(function(service,index){
        return '<tr><td><div class="service-title">'+esc(service.name)+'</div></td><td><div class="service-desc">'+esc(service.summary||service.description||'—')+'</div></td><td><span class="service-desc">'+pricingLabel(service.pricing)+'</span></td><td><span class="service-title">'+priceLabel(service)+'</span></td><td><button class="status-btn '+(service.status==='on'?'on':'off')+'" onclick="toggleService(\''+esc(service.id)+'\')">'+(service.status==='on'?'已上架':'已下架')+'</button></td><td>'+(service.sort||index+1)+'</td><td><div class="op"><button onclick="openServiceModal(\''+esc(service.id)+'\')">编辑</button><button onclick="moveService(\''+esc(service.id)+'\',-1)">上移</button><button onclick="moveService(\''+esc(service.id)+'\',1)">下移</button></div></td></tr>';
      }).join('');
    };
    window.render();
  })();
</script></body></html>

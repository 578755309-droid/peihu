<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280">
  <title>资讯管理 · 佑小邦运营后台</title>
  <link rel="stylesheet" href="admin-shell.css">
  <script src="consult-data.js"></script>
  <script defer src="admin-sidebar.js"></script>
  <style>
    :root{--blue:#224CD3;--ink:#172033;--muted:#71809a;--line:#dce9f8;--bg:#eff6ff;--panel:#fff;--green:#16a34a;--amber:#d97706;--purple:#8655C5}
    *{box-sizing:border-box}body{margin:0;min-width:1100px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.layout{display:flex;min-height:100vh}.sidebar{width:220px;background:#002141}.main{margin-left:220px;flex:1;min-width:0}.topbar{height:60px;display:flex;align-items:center;padding:0 28px;background:#fff;border-bottom:1px solid var(--line)}.crumb{display:flex;gap:8px;font-size:13px;font-weight:700;color:#94a3b8}.crumb strong{color:var(--ink)}.top-date{margin-left:auto;color:#8fa0b5;font-size:12px;font-weight:700}.top-av{display:grid;place-items:center;width:34px;height:34px;margin-left:14px;border-radius:10px;color:#fff;background:var(--blue);font-size:14px;font-weight:900}.page{padding:24px 28px 44px;max-width:1740px}
    .head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}.title{font-size:24px;font-weight:900}.sub{margin-top:6px;color:#91a0b6;font-size:13px}.actions{display:flex;gap:9px;padding-top:4px}.btn{height:36px;border:1px solid var(--line);border-radius:9px;padding:0 13px;background:#fff;color:#41536d;font:700 12px inherit;cursor:pointer}.btn.primary{border-color:var(--blue);background:var(--blue);color:#fff}.btn.danger{color:#dc2626;border-color:#f3caca}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}.stat{border:1px solid var(--line);border-radius:15px;background:var(--panel);padding:16px 18px;box-shadow:0 3px 14px rgba(34,76,211,.07)}.stat-label{font-size:12px;color:#8b99ad;font-weight:700}.stat-value{margin-top:8px;font-size:26px;font-weight:900}.stat-value.blue{color:var(--blue)}.stat-value.green{color:var(--green)}.stat-value.purple{color:var(--purple)}.stat-sub{margin-top:5px;font-size:11px;color:#a3b0c2;font-weight:600}
    .card{border:1px solid var(--line);border-radius:15px;background:var(--panel);box-shadow:0 3px 14px rgba(34,76,211,.07)}.section{padding:20px 22px}.section-title{font-size:16px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;gap:8px}.section-title:before{content:"";width:4px;height:16px;border-radius:4px;background:var(--blue)}.section-title .hint{margin-left:auto;font-size:11px;color:#94a3b8;font-weight:700}
    .table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse;min-width:860px}.table th{text-align:left;font-size:11px;color:#8b99ad;font-weight:800;padding:10px 12px;border-bottom:1px solid #e7eef8;white-space:nowrap}.table td{font-size:12px;color:#41536d;font-weight:600;padding:13px 12px;border-bottom:1px solid #eef4fb;vertical-align:middle}.table tr:last-child td{border-bottom:0}.cell-main{color:var(--ink);font-weight:800}.cell-sub{display:block;margin-top:3px;color:#94a3b8;font-size:10px;font-weight:600;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .tag{display:inline-flex;align-items:center;padding:5px 10px;border-radius:14px;font-size:11px;font-weight:800}.tag.rich{color:var(--purple);background:#EDE6F7}.tag.link{color:var(--blue);background:#e7f1fd}.tag.on{color:var(--green);background:#dcfce7}.tag.off{color:#657087;background:#eef2f7}
    .link-btn{border:0;background:none;color:var(--blue);font:800 12px inherit;cursor:pointer;padding:0}.link-btn:hover{text-decoration:underline}.link-btn.danger{color:#dc2626}.ops{display:flex;gap:12px}
    .empty{padding:38px 0;text-align:center;color:#9aa8ba;font-size:13px}
    /* 编辑弹窗 */
    .modal-mask{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(15,30,60,.45)}.modal-mask.show{display:flex}.modal{width:760px;max-width:94vw;max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:24px 26px;box-shadow:0 24px 70px rgba(10,25,70,.3)}.modal::-webkit-scrollbar{width:6px}.modal::-webkit-scrollbar-thumb{background:#d5e2f3;border-radius:3px}.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.modal-title{font-size:17px;font-weight:900}.modal-close{width:32px;height:32px;border:0;border-radius:9px;background:#eef4fb;color:#5b6b83;font-size:18px;cursor:pointer}
    .field{margin-bottom:14px}.field label{display:block;font-size:12px;color:#5f6f88;font-weight:800;margin-bottom:6px}.field input[type=text],.field input[type=url]{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px;color:var(--ink);background:#fbfdff;outline:none}.field input:focus{border-color:var(--blue)}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-tip{font-size:11px;color:#94a3b8;margin-top:5px;line-height:1.5}
    .mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.mode-tab{border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;cursor:pointer;background:#fbfdff;transition:border-color .15s,background .15s}.mode-tab.on{border-color:var(--blue);background:#f2f7ff}.mode-tab-title{font-size:13px;font-weight:900;display:flex;align-items:center;gap:7px}.mode-tab-title svg{width:16px;height:16px;color:var(--blue)}.mode-tab-desc{margin-top:5px;font-size:11px;color:#8b99ad;line-height:1.5}
    /* 富文本编辑器 */
    .editor{border:1px solid var(--line);border-radius:11px;overflow:hidden}.editor:focus-within{border-color:var(--blue)}.toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-bottom:1px solid #e7eef8;background:#f6faff}.toolbar button{min-width:30px;height:30px;padding:0 8px;border:1px solid transparent;border-radius:7px;background:none;color:#41536d;font:800 12px inherit;cursor:pointer}.toolbar button:hover{background:#e7f1fd;border-color:#cfe1f6}.toolbar .sep{width:1px;background:#dce9f8;margin:4px 3px}.editor-area{min-height:220px;max-height:340px;overflow:auto;padding:14px 16px;font-size:13px;line-height:1.8;color:var(--ink);outline:none;background:#fff}.editor-area:empty:before{content:attr(data-ph);color:#a3b0c2}.editor-area img{max-width:100%;border-radius:8px;margin:6px 0}.editor-area h2{font-size:17px;margin:12px 0 6px}.editor-area h3{font-size:15px;margin:10px 0 5px}.editor-area ul,.editor-area ol{padding-left:22px;margin:6px 0}.editor-area blockquote{border-left:3px solid var(--blue);margin:8px 0;padding:4px 12px;background:#f6faff;color:#5b6b83}
    .link-preview{margin-top:10px;padding:12px 14px;border:1px dashed #cfe1f6;border-radius:10px;background:#f6faff;font-size:12px;color:#5b6b83;line-height:1.6}.link-preview b{color:var(--blue);word-break:break-all}
    /* 封面图（240×160） */
    .cover-row{display:flex;gap:14px;align-items:flex-start}.cover-box{width:240px;height:160px;border:1.5px dashed #cfe1f6;border-radius:12px;background:#f6faff;display:grid;place-items:center;overflow:hidden;flex-shrink:0}.cover-box img{width:100%;height:100%;object-fit:cover;display:block}.cover-ph{color:#a3b0c2;font-size:12px;font-weight:800}.cover-ops{display:grid;gap:8px;padding-top:6px;justify-items:start}
    /* 手机框预览 */
    .phone-frame{width:300px;margin:0 auto;border:9px solid #172033;border-radius:38px;overflow:hidden;background:#fff;box-shadow:0 20px 50px rgba(10,25,70,.25)}.phone-notch{width:110px;height:18px;margin:0 auto;background:#172033;border-radius:0 0 12px 12px}.phone-screen{height:520px;overflow-y:auto;background:#f7f8fc}.phone-screen::-webkit-scrollbar{width:0}.pv-cover{width:100%;aspect-ratio:3/2;background:#e9eef5;display:grid;place-items:center;color:#a3b0c2;font-size:11px;font-weight:800}.pv-cover img{width:100%;height:100%;object-fit:cover;display:block}.pv-body{padding:13px 14px}.pv-name{display:inline-block;padding:3px 8px;border-radius:10px;background:#EDE6F7;color:var(--purple);font-size:10px;font-weight:800}.pv-title{font-size:17px;font-weight:900;margin-top:9px;color:var(--ink);line-height:1.4}.pv-sub{font-size:12px;color:#8b99ad;margin-top:5px;line-height:1.5}.pv-meta{font-size:10px;color:#a3b0c2;margin-top:8px;padding-bottom:9px;border-bottom:1px solid #eef2f7}.pv-link{margin:2px 0 16px;padding:12px;border:1px dashed #cfe1f6;border-radius:10px;background:#f6faff;font-size:12px;color:#5b6b83;line-height:1.6;word-break:break-all}.pv-link b{color:var(--blue)}.phone-screen .preview-paper{border:0;border-radius:0;background:transparent;padding:0;font-size:12px}
    .modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid #eef4fb}
    .status-toggle{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:#5f6f88;cursor:pointer;user-select:none}.status-toggle .track{width:38px;height:21px;border-radius:12px;background:#d5deeb;position:relative;transition:background .15s}.status-toggle .track:after{content:"";position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 4px rgba(0,0,0,.2)}.status-toggle.on .track{background:var(--green)}.status-toggle.on .track:after{left:19px}
    .toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:80;background:rgba(23,32,51,.92);color:#fff;font-size:13px;font-weight:700;padding:11px 20px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
    /* 预览弹窗 */
    .preview-paper{border:1px solid #e3ecf7;border-radius:12px;padding:22px;background:linear-gradient(180deg,#fdfeff,#f8fbff);font-size:13px;line-height:1.8;color:#41536d}.preview-paper h2{font-size:17px;margin:12px 0 6px;color:var(--ink)}.preview-paper h3{font-size:15px;margin:10px 0 5px;color:var(--ink)}.preview-paper img{max-width:100%;border-radius:8px;margin:6px 0}.preview-paper ul,.preview-paper ol{padding-left:22px;margin:6px 0}.preview-paper blockquote{border-left:3px solid var(--blue);margin:8px 0;padding:4px 12px;background:#f6faff;color:#5b6b83}.preview-head{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed #dfe8f4}.preview-title{font-size:19px;font-weight:900;color:var(--ink)}.preview-sub{margin-top:6px;font-size:13px;color:#8b99ad}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar"></aside>
    <main class="main">
      <header class="topbar"><div class="crumb"><span>资讯管理</span><span>›</span><strong>资讯内容</strong></div><span class="top-date">2026年4月12日 星期日</span><div class="top-av">管</div></header>
      <section class="page">
        <div class="head"><div><h1 class="title">资讯管理</h1><div class="sub">维护平台资讯内容：支持富文本编辑（文字、图片、排版）或关联公众号文章链接</div></div><div class="actions"><button class="btn primary" onclick="openEditor('')">+ 新建资讯</button></div></div>
        <div class="stats" id="stats"></div>
        <section class="card section">
          <div class="section-title">资讯列表<div class="hint">停用的资讯不在用户端展示</div></div>
          <div class="table-wrap"><table class="table"><thead><tr><th>名称 / 标题</th><th>内容方式</th><th>内容摘要</th><th>状态</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
        </section>
      </section>
    </main>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal-mask" id="editorMask" onclick="if(event.target===this)closeEditor()">
    <div class="modal">
      <div class="modal-head"><div class="modal-title" id="editorTitle">新建资讯</div><button class="modal-close" onclick="closeEditor()">×</button></div>
      <div class="field-row">
        <div class="field"><label>资讯名称（内部标识）</label><input type="text" id="fName" maxlength="20" placeholder="如：平台公告 / 健康科普"></div>
        <div class="field"><label>标题（用户端展示）</label><input type="text" id="fTitle" maxlength="40" placeholder="请输入资讯标题"></div>
      </div>
      <div class="field"><label>副标题</label><input type="text" id="fSub" maxlength="60" placeholder="一句话说明，展示在标题下方"></div>
      <div class="field"><label>封面图（建议尺寸 240×160）</label>
        <div class="cover-row">
          <div class="cover-box" id="coverBox"><span class="cover-ph">240×160</span></div>
          <div class="cover-ops">
            <button type="button" class="btn" onclick="document.getElementById('coverFile').click()">上传封面</button>
            <button type="button" class="btn" id="coverClear" onclick="clearCover()" style="display:none">清除</button>
            <div class="field-tip">本地上传，展示在资讯卡片与详情顶部；预览按 240×160 比例显示</div>
          </div>
        </div>
        <input type="file" id="coverFile" accept="image/*" style="display:none" onchange="coverFileChange(this)">
      </div>
      <div class="field"><label>内容方式</label>
        <div class="mode-tabs">
          <div class="mode-tab on" id="tabRich" onclick="setMode('rich')"><div class="mode-tab-title"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3h12M3 7h12M3 11h7M3 15h9"/></svg>富文本内容</div><div class="mode-tab-desc">在编辑器中直接撰写图文内容</div></div>
          <div class="mode-tab" id="tabLink" onclick="setMode('link')"><div class="mode-tab-title"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 10.5a3.5 3.5 0 004.95 0l2.3-2.3a3.5 3.5 0 00-4.95-4.95L8.6 4.45"/><path d="M10.5 7.5a3.5 3.5 0 00-4.95 0l-2.3 2.3a3.5 3.5 0 004.95 4.95l1.2-1.2"/></svg>公众号链接</div><div class="mode-tab-desc">跳转已发布的微信公众号文章</div></div>
        </div>
      </div>
      <div class="field" id="richPane">
        <label>正文内容</label>
        <div class="editor">
          <div class="toolbar">
            <button type="button" onclick="cmd('bold')" title="加粗"><b>B</b></button>
            <button type="button" onclick="cmd('italic')" title="斜体"><i>I</i></button>
            <button type="button" onclick="cmd('underline')" title="下划线"><u>U</u></button>
            <span class="sep"></span>
            <button type="button" onclick="cmd('formatBlock','h2')" title="大标题">H2</button>
            <button type="button" onclick="cmd('formatBlock','h3')" title="小标题">H3</button>
            <button type="button" onclick="cmd('formatBlock','p')" title="正文">正文</button>
            <button type="button" onclick="cmd('formatBlock','blockquote')" title="引用">引用</button>
            <span class="sep"></span>
            <button type="button" onclick="cmd('insertUnorderedList')" title="无序列表">• 列表</button>
            <button type="button" onclick="cmd('insertOrderedList')" title="有序列表">1. 列表</button>
            <span class="sep"></span>
            <button type="button" onclick="insertImageUrl()" title="插入图片链接">图片URL</button>
            <button type="button" onclick="document.getElementById('imgFile').click()" title="上传本地图片">上传图片</button>
            <span class="sep"></span>
            <button type="button" onclick="cmd('removeFormat')" title="清除格式">清除</button>
          </div>
          <div class="editor-area" id="editorArea" contenteditable="true" data-ph="在此输入资讯正文，可插入图片、设置标题与列表…"></div>
          <input type="file" id="imgFile" accept="image/*" style="display:none" onchange="insertImageFile(this)">
        </div>
        <div class="field-tip">支持加粗、标题、列表、引用与图片（URL 或本地上传），内容以富文本保存。</div>
      </div>
      <div class="field" id="linkPane" style="display:none">
        <label>公众号文章链接</label>
        <input type="url" id="fLink" placeholder="https://mp.weixin.qq.com/s/…" oninput="renderLinkPreview()">
        <div class="link-preview" id="linkPreview" style="display:none"></div>
        <div class="field-tip">用户点击资讯卡片后，将在微信内打开该公众号文章。</div>
      </div>
      <div class="field" style="display:flex;align-items:center;justify-content:space-between">
        <label style="margin:0">展示状态</label>
        <span class="status-toggle on" id="fStatus" onclick="this.classList.toggle('on')"><span class="track"></span><span id="fStatusTxt">启用</span></span>
      </div>
      <div class="modal-foot"><button class="btn" onclick="closeEditor()">取消</button><button class="btn primary" onclick="saveItem()">保存资讯</button></div>
    </div>
  </div>

  <!-- 预览弹窗（手机框） -->
  <div class="modal-mask" id="previewMask" onclick="if(event.target===this)closePreview()">
    <div class="modal"><div class="modal-head"><div class="modal-title">内容预览 · 手机端效果</div><button class="modal-close" onclick="closePreview()">×</button></div><div class="phone-frame"><div class="phone-notch"></div><div class="phone-screen" id="previewBox"></div></div></div>
  </div>

  <div class="toast" id="toast"></div>
  <script>
  document.addEventListener('DOMContentLoaded',function(){
    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function pad(n){return n<10?'0'+n:''+n;}
    function now(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
    function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},1600);}

    /* 数据层：与用户移动端共享 consult-data.js（AKBConsult） */
    var getList=window.AKBConsult.get;
    var write=window.AKBConsult.save;
    function summarize(list){var rich=list.filter(function(i){return i.mode!=='link';}).length;return {total:list.length,rich:rich,link:list.length-rich,on:list.filter(function(i){return i.enabled;}).length};}

    var editingId='';
    var mode='rich';
    var coverData='';

    /* 封面图（240×160） */
    function setCover(data){
      coverData=data||'';
      document.getElementById('coverBox').innerHTML=coverData?'<img src="'+coverData+'" alt="">':'<span class="cover-ph">240×160</span>';
      document.getElementById('coverClear').style.display=coverData?'':'none';
    }
    window.coverFileChange=function(input){
      var file=input.files&&input.files[0];
      if(!file)return;
      var reader=new FileReader();
      reader.onload=function(){setCover(reader.result);toast('封面已上传');};
      reader.readAsDataURL(file);
      input.value='';
    };
    window.clearCover=function(){setCover('');};

    window.setMode=function(m){
      mode=m;
      document.getElementById('tabRich').classList.toggle('on',m==='rich');
      document.getElementById('tabLink').classList.toggle('on',m==='link');
      document.getElementById('richPane').style.display=m==='rich'?'':'none';
      document.getElementById('linkPane').style.display=m==='link'?'':'none';
    };

    /* 富文本工具 */
    window.cmd=function(command,arg){document.getElementById('editorArea').focus();document.execCommand(command,false,arg||null);};
    window.insertImageUrl=function(){
      var url=window.prompt('请输入图片链接（https://…）','https://');
      if(!url||url==='https://')return;
      cmd('insertImage',url);
    };
    window.insertImageFile=function(input){
      var file=input.files&&input.files[0];
      if(!file)return;
      var reader=new FileReader();
      reader.onload=function(){cmd('insertImage',reader.result);toast('图片已插入正文');};
      reader.readAsDataURL(file);
      input.value='';
    };
    window.renderLinkPreview=function(){
      var url=document.getElementById('fLink').value.trim();
      var box=document.getElementById('linkPreview');
      if(!url){box.style.display='none';return;}
      box.style.display='';
      box.innerHTML='用户端将打开公众号文章：<br><b>'+esc(url)+'</b>';
    };

    function renderStats(){
      var s=summarize(getList());
      document.getElementById('stats').innerHTML=
        '<div class="stat"><div class="stat-label">资讯总数</div><div class="stat-value blue">'+s.total+'</div><div class="stat-sub">含富文本与公众号链接两种形式</div></div>'+
        '<div class="stat"><div class="stat-label">富文本内容</div><div class="stat-value purple">'+s.rich+'</div><div class="stat-sub">平台编辑器撰写，图文混排</div></div>'+
        '<div class="stat"><div class="stat-label">公众号链接</div><div class="stat-value blue">'+s.link+'</div><div class="stat-sub">跳转微信公众号文章</div></div>'+
        '<div class="stat"><div class="stat-label">启用中</div><div class="stat-value green">'+s.on+'</div><div class="stat-sub">用户端当前可见的资讯</div></div>';
    }

    function stripHtml(html){var d=document.createElement('div');d.innerHTML=html||'';return (d.textContent||'').replace(/\s+/g,' ').trim();}

    function renderRows(){
      var list=getList().slice().sort(function(a,b){return (b.updatedAt||'').localeCompare(a.updatedAt||'');});
      var rows=document.getElementById('rows');
      if(!list.length){rows.innerHTML='<tr><td colspan="6"><div class="empty">暂无资讯内容，点击右上角「新建资讯」开始创建</div></td></tr>';return;}
      rows.innerHTML=list.map(function(item){
        var summary=item.mode==='link'?esc(item.link):esc(stripHtml(item.content).slice(0,42)||'（无正文）');
        return '<tr><td>'+(item.cover?'<img src="'+item.cover+'" style="width:48px;height:32px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:9px" alt="">':'')+'<span style="display:inline-block;vertical-align:middle"><span class="cell-main">'+esc(item.name)+'</span><span class="cell-sub">'+esc(item.title)+(item.sub?' · '+esc(item.sub):'')+'</span></span></td>'
          +'<td><span class="tag '+(item.mode==='link'?'link':'rich')+'">'+(item.mode==='link'?'公众号链接':'富文本')+'</span></td>'
          +'<td><span class="cell-sub" style="max-width:220px">'+summary+'</span></td>'
          +'<td><span class="tag '+(item.enabled?'on':'off')+'">'+(item.enabled?'启用':'停用')+'</span></td>'
          +'<td>'+esc(item.updatedAt)+'</td>'
          +'<td><div class="ops"><button class="link-btn" onclick="previewItem(\''+item.id+'\')">预览</button><button class="link-btn" onclick="openEditor(\''+item.id+'\')">编辑</button><button class="link-btn" onclick="toggleItem(\''+item.id+'\')">'+(item.enabled?'停用':'启用')+'</button><button class="link-btn danger" onclick="removeItem(\''+item.id+'\')">删除</button></div></td></tr>';
      }).join('');
    }

    window.openEditor=function(id){
      editingId=id||'';
      var item=id?getList().find(function(i){return i.id===id;}):null;
      document.getElementById('editorTitle').textContent=item?'编辑资讯':'新建资讯';
      document.getElementById('fName').value=item?item.name:'';
      document.getElementById('fTitle').value=item?item.title:'';
      document.getElementById('fSub').value=item?(item.sub||''):'';
      document.getElementById('editorArea').innerHTML=item?(item.content||''):'';
      document.getElementById('fLink').value=item?(item.link||''):'';
      setCover(item?(item.cover||''):'');
      var st=document.getElementById('fStatus');
      st.classList.toggle('on',item?!!item.enabled:true);
      document.getElementById('fStatusTxt').textContent=st.classList.contains('on')?'启用':'停用';
      setMode(item&&item.mode==='link'?'link':'rich');
      renderLinkPreview();
      document.getElementById('editorMask').classList.add('show');
    };
    window.closeEditor=function(){document.getElementById('editorMask').classList.remove('show');};

    document.getElementById('fStatus').addEventListener('click',function(){
      document.getElementById('fStatusTxt').textContent=this.classList.contains('on')?'启用':'停用';
    });

    window.saveItem=function(){
      var name=document.getElementById('fName').value.trim();
      var title=document.getElementById('fTitle').value.trim();
      if(!name){toast('请输入资讯名称');return;}
      if(!title){toast('请输入资讯标题');return;}
      var content=mode==='rich'?document.getElementById('editorArea').innerHTML.trim():'';
      var link=mode==='link'?document.getElementById('fLink').value.trim():'';
      if(mode==='rich'&&!stripHtml(content)&&content.indexOf('<img')===-1){toast('请输入正文内容');return;}
      if(mode==='link'&&!/^https?:\/\//.test(link)){toast('请输入有效的公众号链接（https:// 开头）');return;}
      var list=getList();
      var item=editingId?list.find(function(i){return i.id===editingId;}):null;
      if(!item){item={id:'CS'+String(Date.now()).slice(-6)};list.push(item);}
      item.name=name;item.title=title;item.sub=document.getElementById('fSub').value.trim();
      item.mode=mode;item.content=content;item.link=link;item.cover=coverData;
      item.enabled=document.getElementById('fStatus').classList.contains('on');
      item.updatedAt=now();
      write(list);
      closeEditor();renderStats();renderRows();
      toast('资讯已保存');
    };

    window.toggleItem=function(id){
      var list=getList();var item=list.find(function(i){return i.id===id;});
      if(!item)return;
      item.enabled=!item.enabled;item.updatedAt=now();
      write(list);renderStats();renderRows();
      toast(item.enabled?'资讯已启用':'资讯已停用');
    };

    window.removeItem=function(id){
      var item=getList().find(function(i){return i.id===id;});
      if(!item)return;
      if(!window.confirm('确认删除资讯「'+item.name+'」？删除后不可恢复。'))return;
      write(getList().filter(function(i){return i.id!==id;}));
      renderStats();renderRows();
      toast('资讯已删除');
    };

    window.previewItem=function(id){
      var item=getList().find(function(i){return i.id===id;});
      if(!item)return;
      var coverHtml='<div class="pv-cover">'+(item.cover?'<img src="'+item.cover+'" alt="">':'<span>封面 240×160</span>')+'</div>';
      var head='<div class="pv-body"><span class="pv-name">'+esc(item.name)+'</span><div class="pv-title">'+esc(item.title)+'</div>'+(item.sub?'<div class="pv-sub">'+esc(item.sub)+'</div>':'')+'<div class="pv-meta">更新于 '+esc(item.updatedAt)+'</div></div>';
      var bodyHtml=item.mode==='link'
        ?'<div class="pv-body" style="padding-top:0"><div class="pv-link">该资讯为公众号链接，用户端点击后跳转：<br><b>'+esc(item.link)+'</b></div></div>'
        :'<div class="pv-body" style="padding-top:0"><div class="preview-paper">'+(item.content||'<span style="color:#a3b0c2">（无正文）</span>')+'</div></div>';
      document.getElementById('previewBox').innerHTML=coverHtml+head+bodyHtml;
      document.getElementById('previewBox').scrollTop=0;
      document.getElementById('previewMask').classList.add('show');
    };
    window.closePreview=function(){document.getElementById('previewMask').classList.remove('show');};

    renderStats();renderRows();
  });
  </script>
</body>
</html>
